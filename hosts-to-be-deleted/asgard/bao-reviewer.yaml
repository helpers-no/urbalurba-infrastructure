apiVersion: v1
kind: ServiceAccount
metadata: { name: bao-auth-reviewer, namespace: external-secrets }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: bao-auth-reviewer }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator }
subjects:
  - kind: ServiceAccount
    name: bao-auth-reviewer
    namespace: external-secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: bao-auth-reviewer-token
  namespace: external-secrets
  annotations: { kubernetes.io/service-account.name: bao-auth-reviewer }
type: kubernetes.io/service-account-token
