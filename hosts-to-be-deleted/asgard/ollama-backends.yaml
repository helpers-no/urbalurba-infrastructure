# External Ollama backends for LiteLLM on asgard.
#
# Neither Mac is a Proxmox guest, so the Odin backplane (10.10.0.0/24) does not
# apply here. Each is a selector-less Service with hand-managed Endpoints, which
# gives a stable cluster DNS name and means an address change is a one-file edit
# with NO LiteLLM restart — it resolves the name per request.
#
#   M4  http://mac-ollama.ai.svc.cluster.local:11434
#   M1  http://m1-ollama.ai.svc.cluster.local:11434
#
# When an address moves:
#   getent hosts MBP-J4G0G066W2.local     # M4 is DHCP and does move
#   # edit the ip below, then: kubectl apply -f ollama-backends.yaml
#
# Both Macs sleep. A sleeping Mac still answers ICMP while every TCP port is
# closed, so `ping` is not a liveness check — probe /api/version instead. A
# request to a sleeping Mac hangs rather than failing fast (request_timeout is
# 600s). Wake them with ~/uis/mac-ollama/wake-macs.sh.
---
apiVersion: v1
kind: Service
metadata:
  name: mac-ollama
  namespace: ai
  labels: { app: mac-ollama }
  annotations:
    urbalurba.io/description: "External Ollama on the M4 (MacWork) — LAN .75 home / Tailscale away, managed"
    urbalurba.io/host: "MBP-J4G0G066W2.local"
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mac-ollama
  namespace: ai
  labels: { app: mac-ollama }
subsets:
  - addresses:
      # M4 (MacWork) — DHCP-reserved .75 at home, Tailscale 100.115.97.90 at work.
      # This is only a SEED: ollama-endpoint-manager owns this address live
      # (LAN-first probe-and-pick). Verify: curl -m5 http://192.168.68.75:11434/api/version
      - ip: 192.168.68.75
    ports:
      - name: http
        port: 11434
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: m1-ollama
  namespace: ai
  labels: { app: m1-ollama }
  annotations:
    urbalurba.io/description: "External Ollama on the M1 Mac (wired LAN, reserved)"
    urbalurba.io/host: "tecmacdev"
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: m1-ollama
  namespace: ai
  labels: { app: m1-ollama }
subsets:
  - addresses:
      # M1 tecMacDev — wired via a USB gigabit dongle, DHCP-reserved so stable.
      # Verify: curl -m5 http://192.168.68.89:11434/api/version
      # Was Tailscale 100.127.6.20 (used while it was Wi-Fi/DHCP); the wired
      # reserved LAN address is faster (no WireGuard) and home-only, which is
      # fine — it only serves the cluster while at home. Revert = swap this line.
      - ip: 192.168.68.89
    ports:
      - name: http
        port: 11434
        protocol: TCP
