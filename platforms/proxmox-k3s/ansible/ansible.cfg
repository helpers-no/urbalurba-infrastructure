[defaults]
# 🔵 roles/ sits beside playbooks/, not inside it. Without this, `include_role: k3s` fails with
# "role not found" and the search path it prints doesn't include the obvious directory — ansible
# looks in <playbook_dir>/roles by default.
roles_path         = roles
host_key_checking  = False
interpreter_python = auto_silent
forks              = 1
retry_files_enabled = False
