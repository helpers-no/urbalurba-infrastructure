---
# forgejo-runner — defaults. Ported from the maintainer's own private lab (urb-agents#1982, F5 of
# INVESTIGATE-host-provision-host-adoption.md). Judged, not blind-copied — see this role's own
# tasks/main.yml header for what changed: a deny-list firewall built from this platform's own
# generated guest/host addresses (ZONE_ENTRIES), not inventory-resolved hostnames, and folded
# into this same role rather than a second VM-level role, since this VM's only job here is
# forgejo-runner (unlike the reference lab's shared epinio-runner VM, which also serves a second
# consumer this platform has no equivalent of).

# ── the image ───────────────────────────────────────────────────────────────────────────────
# 🔵 VERSION/IMAGE PATH UNCHANGED FROM THE REFERENCE — a software version pin, not a site fact.
forgejo_runner_version: "13.2.0"
forgejo_runner_image: "code.forgejo.org/forgejo/runner:{{ forgejo_runner_version }}"

forgejo_runner_data_dir: /var/lib/forgejo-runner

# ── registration ────────────────────────────────────────────────────────────────────────────
# 🔴 `register` (deprecated but PROVEN), NOT `server.connections` — ported as-is on Terje's own
# explicit instruction (urb-agents#1926/#1982): "port ops's own proven approach as-is... the
# existing, already-debugged approach is what he wants built." The declarative `token_url:
# file:...` form was tried against a real Forgejo instance and produced "unauthenticated:
# unregistered runner" with no further diagnostic signal — not re-litigating a proven path.
#
# 🔴 NOT DEFAULTED, same rule as every credential here. Mint with (as the `git` user inside the
# forgejo CORE_SERVICES guest's container — the binary refuses to run as root):
#   docker exec --user git forgejo forgejo actions generate-runner-token
# Supplied via platforms/proxmox/lab-extras-site-data/forgejo-runner-site-data.yml-template,
# copied to .uis.secrets/platforms/proxmox/lab-extras/forgejo-runner-site-data.yml and passed in
# by 09-lab-extras-apply.sh.
forgejo_runner_token: ""

# 🔴 NO HARDCODED ADDRESS — resolved by generate-ansible-config.sh from the forgejo CORE_SERVICES
# guest's own config.sh IP (same "no default, resolved at apply time" rule roles/forgejo's own
# forgejo_domain already follows), supplied via the shared lab-extras _extra-vars.yml. Asserted
# non-empty below rather than guessed, since LAB_EXTRAS' own generation already refuses to build
# this guest at all unless forgejo is a selected CORE_SERVICES entry.
forgejo_runner_instance_url: ""
forgejo_runner_name: "forgejo-runner"

# 🔴 PLACEHOLDER LABELS, FLAGGED — unchanged from the reference: no real workflow file exists yet
# to test against. `docker` is the generic execution label; `ubuntu-latest` maps to a common
# default image so an out-of-the-box workflow has something to resolve. Revisit once real
# `.forgejo/workflows/*.yml` files exist and name what they actually expect `runs-on:` to match.
forgejo_runner_labels:
  - docker
  - "ubuntu-latest:docker://node:22-bookworm"

# ── execution ───────────────────────────────────────────────────────────────────────────────
# 🔵 HOST DOCKER SOCKET, NOT DOCKER-IN-DOCKER — ported as-is on Terje's own explicit instruction
# (urb-agents#1926/#1982): job containers run as siblings on this guest's own Docker daemon
# rather than inside a nested one. Less isolation than DinD, but no privileged container, no
# nested dual-hook nftables concern — acceptable for a single-tenant guest nothing else runs on.
forgejo_runner_docker_socket: /var/run/docker.sock

# ── firewall ────────────────────────────────────────────────────────────────────────────────
# 🔴 A DENY-LIST, NOT AN ALLOW-LIST — see tasks/main.yml's own header for the full reasoning
# (ported from the reference lab's own epinio-runner firewall, Terje: "same deny-list posture...
# not re-litigating it"). Empty here by design — generate-ansible-config.sh computes the real
# list from every other guest/host this platform currently knows about, the same "this role never
# defaults a real list, generation supplies it" shape every other firewall default here follows.
forgejo_runner_firewall_deny_addrs: []
