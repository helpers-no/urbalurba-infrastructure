---
- name: Restart forgejo-runner
  ansible.builtin.systemd:
    name: forgejo-runner
    state: restarted
    daemon_reload: true

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

# `reloaded`, not `restarted` — same reasoning as every other role's nftables handler in this
# platform (bao/garage/nas/dns-resolver): avoids the brief full-open window a flush-then-reapply
# would create. The template's own `destroy table inet filter` (not `flush ruleset`) is what
# actually protects Docker's own nat/filter tables on this guest — see
# templates/forgejo-runner-nftables.conf.j2's header.
- name: Reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded
