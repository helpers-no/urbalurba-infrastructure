---
- name: The site must say which networks may connect
  ansible.builtin.assert:
    that:
      - pg_allowed_networks | length > 0
    fail_msg: >-
      pg_allowed_networks is empty. The role ships only loopback by default and will not guess a
      LAN — a database reachable from a network nobody declared is exactly how stale ranges end
      up in a hand-written pg_hba with nobody deciding to put them there.
    quiet: true

# ── packages, from the official repository ──────────────────────────────────────────────────
# ⚠️ A fresh debian-13-standard container has no curl and no ca-certificates.
- name: Prerequisites the base image does not carry
  ansible.builtin.apt:
    # ⚠️ `sudo` is here because Ansible's `become_user: postgres` requires it, and a
    # debian-13-standard container does not ship it — the failure is `/bin/sh: 1: sudo: not
    # found` from the module, which reads like a module bug rather than a missing package.
    # 🔵 `python3-psycopg2` is the postgresql_* modules' driver; without it they fail with a
    # message about the library that does not say which package provides it.
    name: [curl, ca-certificates, gnupg, sudo, python3-psycopg2, acl]
    state: present
    update_cache: true
    cache_valid_time: 3600

# 🔴 `get_url` IS NOT USED. On Debian 13 (Python 3.13) both `get_url` and `uri` fail against
# HTTPS with "HTTPSConnection.__init__() got an unexpected keyword argument 'cert_file'" — found
# live, proven PoC reference. It is HTTPS-specific — a plain-HTTP `uri` check works fine
# elsewhere. Anything that must speak TLS goes through curl, and the checksum/verification
# becomes an explicit step rather than a module argument.
- name: PGDG signing key
  ansible.builtin.command:
    cmd: "curl -fsSL -o /usr/share/keyrings/pgdg.asc {{ pg_apt_key_url }}"
    creates: /usr/share/keyrings/pgdg.asc

- name: It must actually be a PGP key, not an error page
  ansible.builtin.command:
    cmd: "grep -q 'BEGIN PGP PUBLIC KEY BLOCK' /usr/share/keyrings/pgdg.asc"
  changed_when: false
  check_mode: false

- name: Readable by apt
  ansible.builtin.file:
    path: /usr/share/keyrings/pgdg.asc
    mode: "0644"
    owner: root
    group: root

- name: PGDG repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/pgdg.asc] {{ pg_apt_repo }} {{ ansible_distribution_release }}-pgdg main"
    filename: pgdg
    state: present
    update_cache: true

# 🔴 BEFORE the package, not after — see the note in defaults. Generating the locale afterwards
# changes nothing: the cluster has already been initialised.
- name: Locale support
  ansible.builtin.apt:
    name: locales
    state: present

- name: The locale the cluster will be initialised with
  community.general.locale_gen:
    name: "{{ pg_locale }}"
    state: present

# 🔴 GENERATING THE LOCALE IS NOT ENOUGH. `locale_gen` only adds it to the archive; the postinst
# script that auto-runs `pg_createcluster` when the package below installs reads the SYSTEM
# DEFAULT locale from /etc/default/locale, not an interactive shell's inherited LANG (which can
# show en_US.UTF-8 while the file underneath still says C). Measured live against the proven
# reference this role is translated from: two fresh guests in the same session both had
# `LANG="C"` in /etc/default/locale despite the locale already being generated, and initdb
# silently produced SQL_ASCII both times until this was also set.
- name: The system default locale, not just the generated one
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^LANG="
    line: "LANG={{ pg_locale }}"
    create: true

- name: PostgreSQL and its extensions
  ansible.builtin.apt:
    name: "{{ pg_packages }}"
    state: present

# 🔴 REFUSE TO BUILD ON A CLUSTER THAT CANNOT HOLD UTF-8. Encoding is fixed at initdb, so this
# cannot be repaired by configuration — only by dropping and recreating the cluster, which this
# role will NOT do silently because it destroys every database on it.
- name: What encoding was the cluster actually initialised with
  ansible.builtin.command:
    cmd: psql -At -c "select pg_encoding_to_char(encoding) from pg_database where datname='template1'"
  become: true
  become_user: postgres
  register: pg_encoding
  changed_when: false
  check_mode: false

- name: It must be able to hold UTF-8
  ansible.builtin.assert:
    that:
      - pg_encoding.stdout | trim == 'UTF8'
    fail_msg: >-
      The cluster is {{ pg_encoding.stdout | trim }}, not UTF8. 🔴 Encoding is fixed at initdb and
      cannot be changed by configuration. This happens when the locale was not GENERATED before
      the package initialised the cluster — LANG can be set and the locale still absent.
      On an EMPTY cluster, fix with:
        pg_dropcluster {{ pg_version }} main --stop
        pg_createcluster --locale {{ pg_locale }} {{ pg_version }} main --start
      ⚠️ That destroys every database on it. This role will not do it for you.
    quiet: true

# ── 🔴 MEASURE THE FILESYSTEM BEFORE TUNING FOR IT ──────────────────────────────────────────
- name: What filesystem is the data directory actually on
  ansible.builtin.command:
    cmd: "df --output=fstype /var/lib/postgresql"
  register: pg_fs
  changed_when: false
  check_mode: false

- name: Record it
  ansible.builtin.set_fact:
    pg_data_fstype: "{{ pg_fs.stdout_lines[-1] | trim }}"
    pg_zfs_optimisations: "{{ (pg_fs.stdout_lines[-1] | trim) == 'zfs' }}"

# 🔴 The guard that makes this role safe to hand to anyone. `full_page_writes = off` is correct on
# ZFS and risks silent, unrecoverable corruption on anything else — so it must never be settable
# by declaration, only derivable from measurement.
- name: Refuse a hand-set ZFS optimisation that the filesystem does not support
  ansible.builtin.assert:
    that:
      - (pg_zfs_optimisations | bool) == (pg_data_fstype == 'zfs')
    fail_msg: >-
      pg_zfs_optimisations is {{ pg_zfs_optimisations }} but the data directory is on
      '{{ pg_data_fstype }}'. 🔴 full_page_writes=off on a non-copy-on-write filesystem risks a
      TORN PAGE after a crash — half-old, half-new — which PostgreSQL cannot detect or repair.
      This value is derived from measurement and must not be set by hand.
    quiet: true

- name: Say which way it went, so it is in the run log and not just in a file
  ansible.builtin.debug:
    msg: >-
      data directory is on '{{ pg_data_fstype }}' →
      {{ 'ZFS optimisations ON (full_page_writes off, wal_init_zero off, wal_recycle off)'
         if pg_zfs_optimisations | bool
         else 'ZFS optimisations OFF — full_page_writes stays at its safe default' }}

# ── configuration ───────────────────────────────────────────────────────────────────────────
- name: Tuning and archiving
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/postgresql/{{ pg_version }}/main/conf.d/{{ item.dest }}"
    owner: postgres
    group: postgres
    mode: "0644"
  loop:
    - { src: tuning.conf.j2, dest: 50-tuning.conf }
    - { src: archive.conf.j2, dest: 60-archive.conf }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart postgresql

- name: Who may connect
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload postgresql

# ── firewall ─────────────────────────────────────────────────────────────────────────────────
- name: Resolve the allow-list to live addresses
  ansible.builtin.set_fact:
    pg_firewall_allow_addrs: "{{ pg_firewall_allow_hosts | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"

- name: Allow-list for the postgres port
  ansible.builtin.template:
    src: postgres-nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0640"
  notify: Reload nftables

- name: nftables enabled and running
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

# ── pgBackRest, only when pg_pitr_enabled ───────────────────────────────────────────────────
# 🔴 WITHOUT THIS THE ARCHIVE COMMAND FAILS SILENTLY. `archive_mode = on` with no pgBackRest
# config leaves the database running, every query working, and `pg_stat_archiver.failed_count`
# climbing — WAL accumulating in pg_wal until the disk fills. Found live against the proven
# reference this role is translated from, on its own first run: archive_mode on, 9 failures, last
# successful archive "never". A health check caught it; nothing else would have. This is exactly
# why `archive.conf.j2` sets `archive_mode = off` when `pg_pitr_enabled` is false, rather than
# leaving pgBackRest's absence to be discovered the same way again on a guest that doesn't want it.
- name: pgBackRest package, only if PITR is wanted
  ansible.builtin.apt:
    name: pgbackrest
    state: "{{ 'present' if pg_pitr_enabled | bool else 'absent' }}"

- name: pgBackRest directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  loop:
    - "{{ pg_backup_dir }}"
    - "{{ pg_backup_dir }}/pgbackrest"
    - /var/log/pgbackrest
    # ⚠️ The Debian pgbackrest package does not create /etc/pgbackrest — it ships an example
    # elsewhere and leaves the config directory to you, so the template lands nowhere otherwise.
    - /etc/pgbackrest
  when: pg_pitr_enabled | bool

- name: pgBackRest configuration
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: "0640"
  when: pg_pitr_enabled | bool

- name: Running
  ansible.builtin.systemd:
    name: "postgresql@{{ pg_version }}-main"
    enabled: true
    state: started

- name: Apply pending restarts BEFORE verifying anything
  ansible.builtin.meta: flush_handlers

- name: nftables is actually enforcing, not just running
  ansible.builtin.command: nft list ruleset
  register: pg_nft_ruleset
  changed_when: false
  check_mode: false

- name: The postgres port must not be open to anything off the allow-list
  ansible.builtin.assert:
    that:
      - "'policy drop' in pg_nft_ruleset.stdout"
      - pg_firewall_allow_addrs | length == 0 or pg_firewall_allow_addrs[0] in pg_nft_ruleset.stdout
      - pg_firewall_allow_ranges | length == 0 or pg_firewall_allow_ranges[0].split('-')[0] in pg_nft_ruleset.stdout
    fail_msg: >-
      nftables is active but the loaded ruleset does not match what was rendered — a running
      service with a config nobody applied is the same as no firewall.
    quiet: true

- name: Wait for it to accept connections
  ansible.builtin.command: "pg_isready -q"
  register: pg_ready
  retries: 12
  delay: 5
  until: pg_ready.rc == 0
  changed_when: false
  check_mode: false

- name: Create the stanza, if it does not exist
  ansible.builtin.command:
    cmd: "pgbackrest --stanza={{ pg_stanza }} stanza-create"
    creates: "{{ pg_backup_dir }}/pgbackrest/backup/{{ pg_stanza }}"
  become: true
  become_user: postgres
  when: pg_pitr_enabled | bool

# 🔵 ASKS pgBackRest WHETHER ARCHIVING WORKS, rather than trusting that the config is present.
# `check` pushes a WAL segment and reads it back — the only thing that distinguishes "configured"
# from "working".
- name: Prove archiving actually works
  ansible.builtin.command:
    cmd: "pgbackrest --stanza={{ pg_stanza }} check"
  become: true
  become_user: postgres
  changed_when: false
  when: pg_pitr_enabled | bool

# ── the postgres superuser's own password ───────────────────────────────────────────────────
# Out of band, like everything else credential-shaped this role touches — only runs when the
# operator actually supplies PG_ADMIN_PASSWORD; a normal re-run leaves today's password alone.
- name: The postgres superuser's password, when the operator supplies one
  community.postgresql.postgresql_user:
    name: postgres
    password: "{{ pg_admin_password }}"
    state: present
  become: true
  become_user: postgres
  when: pg_admin_password | length > 0
  no_log: true

# 🔴 UIS'S CONTRACT IS APPLIED TO template1, NOT PER DATABASE — and that is the right shape.
# From UIS's own 040-database-postgresql.yml: the extensions must be active in template1, so
# every database created from here on has them — because until a past UIS fix, the CREATE
# EXTENSION statements lived only in a chart's own initdb script, which runs once against the
# `postgres` database, so every OTHER database silently lacked them. Declaring them per database
# here would repeat the same class of mistake at smaller scale: a database created later would
# still inherit nothing. template1 is the template every CREATE DATABASE copies, so doing it here
# means the contract holds for databases that do not exist yet — the only way a contract can hold.
- name: Activate the UIS extension contract in template1
  community.postgresql.postgresql_ext:
    name: "{{ item }}"
    db: template1
    state: present
  become: true
  become_user: postgres
  loop: "{{ pg_required_extensions }}"
  loop_control:
    label: "template1 → {{ item }}"

# ── verify by asking the running server ─────────────────────────────────────────────────────
- name: What is actually running
  ansible.builtin.command:
    cmd: psql -At -c "select current_setting('server_version_num'), current_setting('full_page_writes'), current_setting('shared_buffers'), current_setting('archive_mode')"
  become: true
  become_user: postgres
  register: pg_final
  changed_when: false
  check_mode: false

- name: The server must match what was intended
  ansible.builtin.assert:
    that:
      - (pg_final.stdout.split('|')[0] | int) >= (pg_version | int) * 10000
      - pg_final.stdout.split('|')[1] == ('off' if pg_zfs_optimisations | bool else 'on')
      - pg_final.stdout.split('|')[3] == ('on' if pg_pitr_enabled | bool else 'off')
    fail_msg: >-
      version={{ pg_final.stdout.split('|')[0] }} full_page_writes={{ pg_final.stdout.split('|')[1] }}
      archive_mode={{ pg_final.stdout.split('|')[3] }} (wanted full_page_writes
      {{ 'off' if pg_zfs_optimisations | bool else 'on' }}, archive_mode
      {{ 'on' if pg_pitr_enabled | bool else 'off' }} — pg_pitr_enabled={{ pg_pitr_enabled }}).
      ⚠️ archive_mode must track pg_pitr_enabled exactly: 'on' with no pgBackRest configured
      accumulates WAL silently until the disk fills; 'off' while pgBackRest IS configured means
      archiving looks set up but isn't actually running.
    quiet: true

- name: How many databases actually exist right now
  ansible.builtin.command:
    cmd: psql -At -c "select count(*) from pg_database where not datistemplate"
  become: true
  become_user: postgres
  register: pg_db_count
  changed_when: false
  check_mode: false

- name: Result
  ansible.builtin.debug:
    msg: >-
      PostgreSQL {{ pg_final.stdout.split('|')[0] }} · {{ pg_data_fstype }} ·
      shared_buffers {{ pg_final.stdout.split('|')[2] }} ·
      full_page_writes {{ pg_final.stdout.split('|')[1] }} ·
      {{ "archiving to stanza '" ~ pg_stanza ~ "' (PITR on)" if pg_pitr_enabled | bool
         else 'no WAL archiving — a nightly host-level snapshot is the backup mechanism (PITR off)' }} ·
      {{ pg_db_count.stdout | trim }} databases live on the server
      {{ "⚠️ NOT PROVEN HERE: that a restore produces a working database. pgBackRest `check` proves archiving works; only a rehearsed restore proves recovery does." if pg_pitr_enabled | bool
         else "⚠️ NOT PROVEN HERE: that the nightly host-level backup actually restores a working database — only that the mount point is now included in it." }}
