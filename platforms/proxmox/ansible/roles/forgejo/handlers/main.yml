---
- name: Restart forgejo
  ansible.builtin.systemd:
    name: forgejo
    state: restarted
    daemon_reload: true

# `reloaded`, NEVER `restarted` — same reason as roles/garage/handlers/main.yml: nftables.service's
# own ExecStop runs `nft flush ruleset` unscoped, which would wipe Docker's own NAT tables too.
- name: Reload forgejo firewall
  ansible.builtin.systemd:
    name: nftables
    state: reloaded
