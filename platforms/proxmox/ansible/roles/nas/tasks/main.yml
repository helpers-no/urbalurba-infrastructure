---
- name: The site must say who the users are and what the shares are
  ansible.builtin.assert:
    that:
      - nas_shares | length > 0
      - nas_users | length > 0
    fail_msg: >-
      nas_shares and nas_users are empty. This role deliberately ships no accounts and no shares —
      they are site data, not role data (see roles/nas/defaults/main.yml). Define them in the
      inventory under nas_hosts.vars. ⚠️ A default here would produce a file server that runs
      happily and serves nothing.
    quiet: true

- name: Samba
  ansible.builtin.apt:
    name: [samba, smbclient, acl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
    state: present
  loop: "{{ nas_groups }}"
  loop_control:
    label: "{{ item.name }}"

- name: Accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.group | default(omit) }}"
    comment: "{{ item.comment | default('') }}"
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  loop: "{{ nas_users }}"
  loop_control:
    label: "{{ item.name }}"

# ── share directories ───────────────────────────────────────────────────────────────────────
# ⚠️ These are BIND MOUNTS of host datasets. The role creates the mount point and sets ownership;
# it never creates the data. A missing bind mount therefore presents as an EMPTY share served
# perfectly happily — which is why the verification below checks for a mountpoint, not a path.
- name: Share directories exist with the right ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ (item.valid_users | default('root')).split()[0] }}"
    group: "{{ item.force_group | default((item.valid_users | default('root')).split()[0]) }}"
    mode: "{{ item.directory_mask }}"
  loop: "{{ nas_shares }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.path }}"

- name: Configuration
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    # 🔵 Samba's own parser is the validator. A bad smb.conf makes smbd refuse to start, and a
    # file server that is down looks exactly like a network problem from every client.
    validate: "testparm -s %s"
  notify: Restart samba

- name: Running
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [smbd, nmbd]

- name: Apply pending restarts BEFORE verifying anything
  ansible.builtin.meta: flush_handlers

# ── verify ──────────────────────────────────────────────────────────────────────────────────
- name: What samba thinks it is serving
  ansible.builtin.command: smbclient -L localhost -N
  register: nas_shares_listed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Every declared share must be advertised
  ansible.builtin.assert:
    that:
      - item.name in (nas_shares_listed.stdout | default(''))
    fail_msg: >-
      Share '{{ item.name }}' is declared but samba is not advertising it.
      smbclient said: {{ nas_shares_listed.stdout | default('nothing') | trim }}
    quiet: true
  loop: "{{ nas_shares }}"
  loop_control:
    label: "{{ item.name }}"

# 🔴 THE CHECK THAT MATTERS, and the one a port probe cannot make. smbd answering on 445 proves
# the daemon is up. It does NOT prove a share has its data: a bind mount that failed leaves an
# empty directory, and samba serves that empty directory without complaint. So ask whether each
# share path is a MOUNTPOINT, not whether it exists.
- name: Is each share path actually a mountpoint, or an empty directory pretending to be one
  ansible.builtin.command: "mountpoint -q {{ item.path }}"
  register: nas_mounts
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ nas_shares }}"
  loop_control:
    label: "{{ item.path }}"

- name: Report which share paths carry no mounted dataset
  ansible.builtin.debug:
    msg: >-
      ⚠️ Not a mountpoint: {{ nas_mounts.results | selectattr('rc','ne',0) | map(attribute='item.path') | list | join(', ') }}
      — samba will serve these as EMPTY shares and report no error. Expected for a share nested
      inside another (agents lives inside tec); a problem for a top-level share.
  when: nas_mounts.results | selectattr('rc','ne',0) | list | length > 0

# ── accounts without a samba password cannot log in ─────────────────────────────────────────
- name: Which accounts samba actually knows about
  ansible.builtin.command: pdbedit -L
  register: nas_pdb
  changed_when: false
  failed_when: false
  check_mode: false

- name: Say plainly which users cannot log in yet
  ansible.builtin.debug:
    msg: >-
      🔴 NO SAMBA PASSWORD SET for: {{ nas_users | map(attribute='name') | reject('in', nas_pdb.stdout) | list | join(', ') }}.
      These accounts exist in Unix but not in samba, so every login as them will fail with a
      permission error that reads like a share problem. Set one with `smbpasswd -a <user>`.
      ⚠️ The role will not invent a password: it would have to live in a declaration, and a
      declaration lives in git.
  when: nas_users | map(attribute='name') | reject('in', nas_pdb.stdout) | list | length > 0

- name: Result
  ansible.builtin.debug:
    msg: >-
      samba {{ ansible_facts.packages['samba'][0].version | default('?') }} ·
      {{ nas_shares | length }} shares advertised ·
      {{ nas_mounts.results | selectattr('rc','eq',0) | list | length }}/{{ nas_shares | length }} paths are real mountpoints ·
      accounts known to samba: {{ nas_pdb.stdout_lines | length }}
