name: Test UIS Scripts

on:
  pull_request:
    paths:
      # ⚠️ ansible/** is here on purpose. The static suite scans the playbooks
      # (see tests/static/test-postgres-connection-shape.sh), and with only
      # provision-host/uis/** a playbook change ran NO tests at all — which is
      # how a hardcoded postgres pod name shipped and stayed green.
      - 'provision-host/uis/**'
      - 'ansible/**'
      - 'uis'
      # ⚠️ Its own file, or this workflow cannot notice its own change - the same
      # defect as the ansible/** one above, one level up. Found by audit on
      # 2026-08-30 while fixing the identical miss in generate-uis-docs.yml: the
      # Node 20 runtime bump edited this workflow and this workflow did not run,
      # so its bumped pins merged unexercised. See
      # INVESTIGATE-system-workflow-paths-filter-drift.
      - '.github/workflows/test-uis.yml'
      # ⚠️ The remaining shipping paths are here ONLY so the version-bump guard
      # below can run when they change. Without them, a PR touching just
      # manifests/ or hosts/ would ship code to every host and the guard that
      # exists to catch exactly that would never execute — a paths filter
      # narrower than what the job depends on, which is the third time this
      # repository has hit that shape (ansible/** above, version.txt in
      # docs.yml, and this). Keep in step with build-uis-container.yml.
      - 'manifests/**'
      - 'hosts/**'
      - 'cloud-init/**'
      - 'networking/**'
      - 'platforms/**'
      - 'scripts/**'
      - 'Dockerfile.uis-provision-host'
      - 'version.txt'
  push:
    branches: [main]
    paths:
      - 'provision-host/uis/**'
      - 'ansible/**'
      - 'uis'
      - '.github/workflows/test-uis.yml'
  workflow_dispatch:

jobs:
  # ⚠️ A merge that changes what hosts run must be detectable by `./uis pull`,
  # and `pull` compares exactly two strings: version.txt inside the image, and
  # version.txt on main. Nothing else - not the digest, not the commit. So a PR
  # that ships code without bumping the version republishes the image with a
  # moved digest, an unchanged version, and every host reporting "up to date".
  #
  # WORKFLOW.md has said "set the version yourself, do not ask" for weeks and it
  # was still missed on 2026-09-08, by the maintainer, on a PostgREST fix,
  # costing a release. A rule held by review alone fails at the moment everyone
  # is busy - the same argument that put the docs build on pull requests.
  #
  # The shipping paths are the trigger list in build-uis-container.yml. Keep the
  # two lists in step: that is two places that must agree, which is exactly how
  # the paths-filter defects happened, so this job names the file it mirrors.
  version-bump:
    name: Version Bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: A PR that ships code must bump version.txt
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE" "$HEAD")
          ships=$(printf '%s\n' "$changed" | grep -E \
            '^(ansible/|manifests/|hosts/|cloud-init/|networking/|provision-host/|platforms/|scripts/|Dockerfile\.uis-provision-host)' \
            || true)
          if [ -z "$ships" ]; then
            echo "No shipped paths changed - no version bump required."
            exit 0
          fi
          echo "This PR changes files the container ships:"
          printf '  %s\n' $ships
          if printf '%s\n' "$changed" | grep -qx 'version.txt'; then
            echo "version.txt is bumped to $(cat version.txt). OK."
            exit 0
          fi
          echo ""
          echo "::error::This PR changes files the container image ships but does not bump version.txt."
          echo "Without a bump, the image is republished with a moved digest and an unchanged"
          echo "version, so './uis pull' reports 'up to date' on every host and the change never"
          echo "reaches anyone. See WORKFLOW.md, 'When a bump is REQUIRED'."
          echo "Current version: $(cat version.txt) - bump the PATCH during the 1.6.x series."
          exit 1

  static-tests:
    name: Static Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install jinja2 and pyyaml (for the real template render)
        # 🔴 WITHOUT THIS, test-jinja-templates-render.sh SKIPS — and skipping is
        # exactly how two unparseable templates shipped with every test green.
        #
        # 1.6.121 shipped a template whose match line ended with a block tag;
        # trim_blocks merged it with the next line and YAML rejected it.
        # 1.6.123 fixed that and shipped one whose YAML comment quoted a
        # loop-open tag with no expression — Jinja parses `#` lines, so it failed
        # on line 5. Static assertions passed both times, including one written
        # to catch the first bug: it forbade that bug's shape, not the class.
        #
        # ⚠️ The test HARD FAILS rather than skipping when $CI is set, so a
        # missing dependency here breaks the build instead of quietly disarming
        # the only check that has ever caught either bug. Same reasoning as the
        # yq step below, which exists because three assertions skipped for months.
        run: python3 -m pip install --quiet jinja2 pyyaml

      - name: Install yq (mikefarah v4)
        # 🔴 WITHOUT THIS, EVERY yq-DEPENDENT ASSERTION SKIPS AND NOBODY NOTICES.
        # Three prometheus assertions have skipped on every run since they were
        # written, and `uis template install` is yq-driven end to end — a
        # grep-only test of a function that COMPOSES a value is not a test of it.
        #
        # ⚠️ NOT `apt-get install yq`: on Ubuntu that is the python jq-wrapper,
        # a different tool with different syntax. Pinned and checksummed.
        #
        # 🔴 RETRIED, BECAUSE THIS STEP MADE EVERY CI RUN DEPEND ON A CDN.
        #
        # A 504 from the release host failed this step with `exit 22`, and the
        # PR then reported "Unit Tests fail" — so a third-party blip read as a
        # test failure, with the actual reason buried in a step log. The tests
        # had not run at all.
        #
        # ⚠️ That is the same defect class as everything this playbook work has
        # been about: a failure reporting something other than what happened. I
        # introduced it in 1.6.84 by adding an unretried download to two jobs.
        #
        # `--retry-all-errors` is needed because a 504 is an HTTP response, not
        # a transport error, and plain `--retry` would not cover it.
        #
        # ⚠️ THE STATUS IS CAPTURED, NOT READ FROM `$?` INSIDE `if !`. Tested:
        # inside `if ! cmd; then`, `$?` is 0 — the negation's status, not the
        # command's. The first version of this would have reported "curl exit 0"
        # for a failure, which is a message about a failure carrying the wrong
        # value, in the step being fixed for reporting the wrong thing.
        run: |
          rc=0
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
               --max-time 120 -o /tmp/yq \
               https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not DOWNLOAD yq (curl exit $rc). The tests did not run."
            echo "This is a fetch failure, not a test failure — re-run the job."
            exit 1
          fi
          echo "6dc2d0cd4e0caca5aeffd0d784a48263591080e4a0895abe69f3a76eb50d1ba3  /tmp/yq" \
            | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Run static tests
        run: bash provision-host/uis/tests/run-tests.sh static

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install yq (mikefarah v4)
        # 🔴 WITHOUT THIS, EVERY yq-DEPENDENT ASSERTION SKIPS AND NOBODY NOTICES.
        # Three prometheus assertions have skipped on every run since they were
        # written, and `uis template install` is yq-driven end to end — a
        # grep-only test of a function that COMPOSES a value is not a test of it.
        #
        # ⚠️ NOT `apt-get install yq`: on Ubuntu that is the python jq-wrapper,
        # a different tool with different syntax. Pinned and checksummed.
        #
        # 🔴 RETRIED, BECAUSE THIS STEP MADE EVERY CI RUN DEPEND ON A CDN.
        #
        # A 504 from the release host failed this step with `exit 22`, and the
        # PR then reported "Unit Tests fail" — so a third-party blip read as a
        # test failure, with the actual reason buried in a step log. The tests
        # had not run at all.
        #
        # ⚠️ That is the same defect class as everything this playbook work has
        # been about: a failure reporting something other than what happened. I
        # introduced it in 1.6.84 by adding an unretried download to two jobs.
        #
        # `--retry-all-errors` is needed because a 504 is an HTTP response, not
        # a transport error, and plain `--retry` would not cover it.
        #
        # ⚠️ THE STATUS IS CAPTURED, NOT READ FROM `$?` INSIDE `if !`. Tested:
        # inside `if ! cmd; then`, `$?` is 0 — the negation's status, not the
        # command's. The first version of this would have reported "curl exit 0"
        # for a failure, which is a message about a failure carrying the wrong
        # value, in the step being fixed for reporting the wrong thing.
        run: |
          rc=0
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
               --max-time 120 -o /tmp/yq \
               https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not DOWNLOAD yq (curl exit $rc). The tests did not run."
            echo "This is a fetch failure, not a test failure — re-run the job."
            exit 1
          fi
          echo "6dc2d0cd4e0caca5aeffd0d784a48263591080e4a0895abe69f3a76eb50d1ba3  /tmp/yq" \
            | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Run unit tests
        run: bash provision-host/uis/tests/run-tests.sh unit

  json-generation:
    name: JSON Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Generate JSON files
        run: bash provision-host/uis/manage/uis-docs.sh

      - name: Validate generated JSON
        run: |
          echo "Validating services.json..."
          jq . website/src/data/services.json > /dev/null
          echo "Validating categories.json..."
          jq . website/src/data/categories.json > /dev/null
          echo "Validating tools.json..."
          jq . website/src/data/tools.json > /dev/null
          echo "All JSON files valid"

  # Deploy tests are only run manually via workflow_dispatch
  # They require a Kubernetes cluster and modify cluster state
  deploy-tests:
    name: Deploy Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: uis-test

      - name: Verify cluster
        run: kubectl cluster-info

      - name: Run deploy tests
        run: |
          export TEST_SERVICE=nginx
          bash provision-host/uis/tests/run-tests.sh deploy
