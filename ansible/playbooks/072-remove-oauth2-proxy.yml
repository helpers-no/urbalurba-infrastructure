---
# file: ansible/playbooks/072-remove-oauth2-proxy.yml
# Description: Remove the oauth2-proxy gate and every route it fronts.
#
# 🔴 REMOVING THE GATE REOPENS THE HOSTS. IT DOES NOT CLOSE THEM.
#
# This header used to claim the opposite: that removing the gate made the
# protected hosts unreachable rather than anonymous, and that this was the safe
# direction. It was false. The tester measured it on 2026-09-18: after
# `./uis undeploy oauth2-proxy`, dagster.localhost answered 200.
#
# ⚠️ The old wording is deliberately NOT quoted here. test-oauth2-proxy-gate.sh
# asserts that phrasing is absent from this file, and an assertion cannot tell a
# quotation from a claim — the same trap as Jinja syntax inside a YAML comment,
# which broke a release on the same day.
#
# The reason is that the generated route is not the service's only route. A UIS
# service ships its own IngressRoute; the gate adds a second, higher-priority one
# in front of it. Delete the generated route and the service's own route is
# simply uncovered — anonymous again, exactly as it was before the gate existed.
# The gate can only take away what it added.
#
# So undeploy is the wrong verb for "keep it serving, drop the login" only
# because it also deletes the gate pod, not because it closes anything. To
# un-gate and keep the gate running, set `protected: []` in
# protected-services.yaml and re-run the SETUP playbook.
#
# ⚠️ And do not restore the old claim on the grounds that it sounds safer. A
# comment asserting a safety property the code does not have is worse than no
# comment: it is the reason nobody checked.

- name: Remove oauth2-proxy login gate
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    gate_namespace: "oauth2-proxy"
    declaration_file: "/mnt/urbalurbadisk/.uis.extend/protected-services.yaml"

  tasks:
    # 🔴 DELETE BY LABEL, NOT FROM THE DECLARATION.
    #
    # This used to read `protected:` from the declaration and delete the objects
    # it named, then delete the gate namespace. Two things went wrong together on
    # 2026-09-18:
    #
    # The documented way to un-gate was to empty `protected:`. An operator who
    # did that and then ran undeploy left a declaration naming nothing — so the
    # per-service loops iterated over an empty list, deleted nothing, and the
    # namespace deletion then took only the pod and the callback route. The
    # forward-auth Middleware and the protected IngressRoute live in the
    # PROTECTED SERVICE's namespace, by design, to avoid needing
    # allowCrossNamespace — so they survived, still winning on priority, still
    # pointing ForwardAuth at a Service that no longer existed.
    #
    # Result: undeploy exited 0, printed "✓ oauth2-proxy removed", and left the
    # host serving 500. Not failed-closed — broken. The tester had to delete two
    # objects by hand because no product verb would.
    #
    # 🔴 The cleanup deleted by namespace while the design deliberately spreads
    # across namespaces. It did not follow its own layout.
    #
    # Every generated object now carries urbalurba.io/generated-by=oauth2-proxy,
    # so cleanup finds them wherever they are and does not depend on a
    # declaration that may have been emptied, edited or lost.
    - name: "01 Find every object the gate generated, wherever it is"
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig={{ kubeconfig_file }}
          - get
          - ingressroute,middleware
          - --all-namespaces
          - -l
          - urbalurba.io/generated-by=oauth2-proxy
          - -o
          - name
      register: generated
      changed_when: false
      failed_when: false

    - name: "02 Report what will be removed"
      ansible.builtin.debug:
        msg: "{{ (generated.stdout_lines | default([])) | length }} generated object(s): {{ generated.stdout_lines | default([]) | join(', ') }}"

    # ⚠️ BEFORE the namespace, so a protected route never outlives the gate it
    # points at. The reverse order is what produced the 500.
    - name: "03 Remove them"
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig={{ kubeconfig_file }}
          - delete
          - ingressroute,middleware
          - --all-namespaces
          - -l
          - urbalurba.io/generated-by=oauth2-proxy
      register: deleted
      when: (generated.stdout | default('') | trim) != ''

    - name: "04 Verify nothing generated is left behind"
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig={{ kubeconfig_file }}
          - get
          - ingressroute,middleware
          - --all-namespaces
          - -l
          - urbalurba.io/generated-by=oauth2-proxy
          - -o
          - name
      register: leftover
      changed_when: false
      failed_when: false

    # 🔴 DO NOT REPORT A CLEAN REMOVAL WHILE A ROUTE STILL POINTS AT A DELETED
    # GATE. That is the exact shape of the defect this task exists to prevent.
    - name: "04b Fail if anything survived"
      ansible.builtin.fail:
        msg: |
          These generated objects could not be removed:

          {{ leftover.stdout_lines | join('\n') }}

          A protected route that outlives the gate forces ForwardAuth at a
          Service that no longer exists, so the host returns 500 — a broken
          service, not a refused one. Remove them before the gate namespace goes:

            kubectl delete ingressroute,middleware --all-namespaces \
              -l urbalurba.io/generated-by=oauth2-proxy
      when: (leftover.stdout | default('') | trim) != ''

    # ⚠️ ASKED BEFORE THE DELETE, so the summary can say what was actually
    # removed. The tester ran undeploy twice in a row: the second run had no
    # namespace left to delete and the summary still said "and the gate
    # namespace". Harmless in itself, and the same class of defect as the "✓
    # removed" that shipped a 500 — a summary claiming work it did not do.
    - name: "04c Was the gate namespace still there?"
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig={{ kubeconfig_file }}
          - get
          - namespace
          - "{{ gate_namespace }}"
          - -o
          - name
      register: gate_ns
      changed_when: false
      failed_when: false

    - name: "05 Remove the gate namespace and everything in it"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ gate_namespace }}"
        kubeconfig: "{{ kubeconfig_file }}"
        state: absent

    # ⚠️ The previous wording said "their .localhost routes are untouched",
    # which assumed a protected host is never .localhost. Gating dagster.localhost
    # is exactly what the tester was asked to do, so the claim was false in the
    # case being tested. Say what was removed instead of asserting what was not.
    # 🔴 TWO TASKS, NOT A TERNARY.
    #
    # `x == y | ternary(a, b)` is the precedence bug that broke the setup
    # playbook on 2026-09-18, and no Jinja renderer exists on the maintainer's
    # host to prove a replacement expression before it ships. A `when` is
    # plain Ansible semantics that reads the same to everyone.
    - name: "05b The namespace was there and has been removed"
      ansible.builtin.set_fact:
        gate_ns_phrase: " and the gate namespace"
      when: (gate_ns.rc | default(1)) == 0

    - name: "05c The namespace was already gone before this run"
      ansible.builtin.set_fact:
        gate_ns_phrase: ", and the gate namespace was already gone"
      when: (gate_ns.rc | default(1)) != 0

    - name: "06 Summary"
      ansible.builtin.debug:
        msg:
          - "✓ oauth2-proxy removed: {{ (generated.stdout_lines | default([])) | length }} route(s)/middleware(s){{ gate_ns_phrase }}."
          - ""
          - "The namespace reads Terminating for a minute or two afterwards. That is"
          - "ordinary Kubernetes finalisation, not a failed removal — it is empty"
          - "throughout and disappears on its own."
          - ""
          - "Every host that was behind the gate is now reachable WITHOUT a login."
          - "That is deliberate. The gate added a route in front of each service's own"
          - "route; deleting it uncovers the original, so the host is anonymous again"
          - "exactly as it was before the gate existed. Leaving the route in place"
          - "instead would point ForwardAuth at a deleted gate and return 500, which"
          - "is a broken service rather than a closed one."
          - ""
          - "Hosts not listed above were never gated and are unaffected."
