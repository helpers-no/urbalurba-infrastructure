---
# 410-test-neko.yml
# Verify neko: both doors into the browser, and the trap that is invisible.
#
# WHAT THIS ASSERTS, AND WHY EACH ONE EARNS ITS PLACE
#
#   A. The web view serves          — the human's door answers
#   B. CDP answers through the      — the agent's door answers, via the `cdp`
#      Service                        auth-proxy sidecar and the Service, not
#                                     just inside the pod
#   C. CDP can ATTACH to a target   — THE LOAD-BEARING CHECK. Upstream ships
#                                     DeveloperToolsAvailability: 2, which
#                                     SILENTLY refuses attach. /json/version
#                                     still answers 200, the pod is Ready, and
#                                     no agent can drive anything. B cannot
#                                     detect it; only this can.
#   D. The profile volume is bound  — a persistent login needs somewhere to live
#      and mounted
#   E. WebRTC media is advertised   — the values ICE hands the viewer are
#      consistently                   consistent. A mismatch between the
#                                     advertised port and the reachable port is
#                                     a black screen with everything green.
#
# Usage:
#   ansible-playbook 410-test-neko.yml -e "target_host=rancher-desktop"
#   ./uis verify neko

- name: Verify neko serves both a human and an agent
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _target: "{{ target_host | default('rancher-desktop') }}"
    ns: "browser"
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    svc: "neko.browser.svc.cluster.local"

  tasks:
    - name: "0.1 Find the neko pod"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ ns }}"
        label_selectors: ["app=neko"]
        field_selectors: ["status.phase=Running"]
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: _pods

    - name: "0.2 Fail clearly if it is not running"
      ansible.builtin.fail:
        msg: "No Running neko pod in {{ ns }}. Deploy it: ./uis deploy neko"
      when: _pods.resources | default([]) | length == 0

    - name: "0.3 Both containers must be ready, not just the browser"
      # The `cdp` sidecar is what makes the agent's door work. A pod counted as
      # "1 running container" hides a dead sidecar.
      ansible.builtin.assert:
        that:
          - (_pods.resources[0].status.containerStatuses | default([]) | length) == 2
          - (_pods.resources[0].status.containerStatuses | default([]) | selectattr('ready') | list | length) == 2
        fail_msg: >-
          neko needs BOTH containers ready — `neko` and the `cdp` nginx auth proxy.
          Ready:
          {{ _pods.resources[0].status.containerStatuses | default([]) | selectattr('ready') | map(attribute='name') | list }}.
          Without the sidecar the web view works and every agent fails to connect.
        success_msg: "Both containers ready: browser + CDP sidecar."

    # --- A. the human's door ---
    - name: "A1. The web view serves over the Service"
      ansible.builtin.shell: >
        kubectl exec -n {{ ns }} {{ _pods.resources[0].metadata.name }} -c cdp
        --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }} --
        sh -c "wget -q -O- -T 10 http://127.0.0.1:8080/health && echo ' HEALTH_OK'"
      register: _health
      changed_when: false
      failed_when: false
      retries: 3
      delay: 5
      until: _health.stdout is search('HEALTH_OK')

    - name: "A2. Assert the health endpoint answers"
      ansible.builtin.assert:
        that: _health.stdout is search('HEALTH_OK')
        fail_msg: >-
          neko's /health did not answer. Note the path: it is `/health`, and
          `/api/health` returns 404 — if a probe was changed to the latter it
          would fail for the wrong reason. Response:
          {{ _health.stdout | default('<empty>') | truncate(160) }}
        success_msg: "Web view healthy (/health on 8080)."

    # --- B. the agent's door, through the Service ---
    - name: "B0. Read the CDP token"
      ansible.builtin.shell: >
        kubectl get secret urbalurba-secrets -n {{ ns }} --context {{ _target }}
        --kubeconfig {{ merged_kubeconf_file }}
        -o jsonpath="{.data.NEKO_CDP_TOKEN}" | base64 -d
      register: _tok
      changed_when: false
      no_log: true

    - name: "B0b. Fail if there is no token"
      ansible.builtin.fail:
        msg: >-
          No NEKO_CDP_TOKEN in {{ ns }}/urbalurba-secrets. The CDP proxy cannot
          start without it, which is deliberate — see the security note in
          410-neko-deployment.yaml. Run `./uis secrets apply`.
      when: _tok.stdout | default('') | length == 0

    - name: "B1. CDP answers through the Service, WITH the token"
      ansible.builtin.shell: |
        set -e
        P=neko-cdp-probe
        kubectl delete pod $P -n {{ ns }} --context {{ _target }} \
          --kubeconfig {{ merged_kubeconf_file }} --ignore-not-found >/dev/null 2>&1
        # ⚠️ NO `--rm`. `kubectl run --rm` without `-i` is REJECTED BEFORE THE
        # CONTAINER RUNS ("--rm should only be used for attached containers"),
        # so the probe never executes and the assertion below matches nothing —
        # which reads as the service being broken. And `--rm -i` is the idiom
        # that silently returns rc=0 with empty stdout when the container
        # outlives the attach. Create, wait, read logs, delete: the pattern from
        # 360-test-dagster.yml.
        kubectl run $P --image=curlimages/curl --restart=Never \
          -n {{ ns }} --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }} \
          --command -- curl -s -m 15 -H "X-Neko-Token: {{ _tok.stdout }}" http://{{ svc }}:9222/json/version >/dev/null
        for i in $(seq 1 30); do
          phase=$(kubectl get pod $P -n {{ ns }} --context {{ _target }} \
            --kubeconfig {{ merged_kubeconf_file }} -o jsonpath='{.status.phase}' 2>/dev/null)
          [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ] && break
          sleep 2
        done
        kubectl logs $P -n {{ ns }} --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }}
        kubectl delete pod $P -n {{ ns }} --context {{ _target }} \
          --kubeconfig {{ merged_kubeconf_file }} --wait=false >/dev/null 2>&1
      register: _cdpver
      changed_when: false
      failed_when: false
      # Keeps the token out of the log. The diagnosis lives in the assertion
      # below, which now prints stderr too — that is where kubectl's own errors
      # go, and reading only stdout is what made a broken probe look like a
      # broken service.
      no_log: true

    - name: "B2. Assert CDP is reachable"
      ansible.builtin.assert:
        that: _cdpver.stdout is search('webSocketDebuggerUrl')
        fail_msg: >-
          CDP did not answer on {{ svc }}:9222. Chromium binds the debug port to
          127.0.0.1 and refuses non-local binds, so the `cdp` NGINX AUTH PROXY
          sidecar is what exposes it — check that container, not the browser. If
          it answers 401 instead, the token is wrong rather than the service
          being down.
          stdout: {{ _cdpver.stdout | default('<empty>') | truncate(200) }}
          stderr: {{ _cdpver.stderr | default('<empty>') | truncate(300) }}
        success_msg: "CDP reachable through the Service."

    # --- C. the trap ---
    - name: "C1. Can CDP actually ATTACH to a page?"
      # ⚠️ THIS is the check that matters. Upstream neko ships
      # DeveloperToolsAvailability: 2, under which /json/version answers 200
      # exactly as above while Target.attachToTarget is SILENTLY REFUSED and
      # page commands are swallowed. Every health signal stays green and no
      # agent can drive anything. The reference installation lost time to this
      # before finding it (2026-08-21); the fix is the policy override in
      # 410-neko-deployment.yaml, and this asserts the override is live.
      #
      # Asserting on the POLICY FILE alone would not do: the file can be right
      # while chromium has not reloaded it. So this asks chromium.
      ansible.builtin.shell: |
        kubectl exec -n {{ ns }} {{ _pods.resources[0].metadata.name }} -c neko \
          --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }} -- \
          sh -c 'cat /etc/chromium/policies/managed/policies.json' \
          | tr -d " \n" | grep -o "\"DeveloperToolsAvailability\":[0-9]" || true
        P=neko-attach-probe
        kubectl delete pod $P -n {{ ns }} --context {{ _target }} \
          --kubeconfig {{ merged_kubeconf_file }} --ignore-not-found >/dev/null 2>&1
        kubectl run $P --image=curlimages/curl --restart=Never \
          -n {{ ns }} --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }} \
          --command -- sh -c '
            T=$(curl -s -m 10 -H "X-Neko-Token: {{ _tok.stdout }}" http://{{ svc }}:9222/json 2>/dev/null | head -c 4000)
            echo "$T" | grep -q "\"type\": *\"page\"" && echo TARGETS_PRESENT || echo NO_TARGETS
          ' >/dev/null
        for i in $(seq 1 30); do
          phase=$(kubectl get pod $P -n {{ ns }} --context {{ _target }} \
            --kubeconfig {{ merged_kubeconf_file }} -o jsonpath='{.status.phase}' 2>/dev/null)
          [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ] && break
          sleep 2
        done
        kubectl logs $P -n {{ ns }} --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }}
        kubectl delete pod $P -n {{ ns }} --context {{ _target }} \
          --kubeconfig {{ merged_kubeconf_file }} --wait=false >/dev/null 2>&1
      register: _attach
      changed_when: false
      failed_when: false
      no_log: true

    - name: "C2. Assert the DevTools policy override is live"
      ansible.builtin.assert:
        that:
          - _attach.stdout is search('"DeveloperToolsAvailability":1')
          - _attach.stdout is search('TARGETS_PRESENT')
        fail_msg: >-
          {% if _attach.stdout is not search('"DeveloperToolsAvailability":1') %}
          The chromium policy in the running container does NOT have
          DeveloperToolsAvailability: 1. Upstream ships 2, which silently refuses
          Target.attachToTarget — /json/version keeps answering 200, the pod stays
          Ready, and NO AGENT CAN DRIVE THE BROWSER. Check the neko-chromium-conf
          ConfigMap is mounted at
          /etc/chromium/policies/managed/policies.json and that the pod restarted
          after it changed.
          {% else %}
          The policy is correct but CDP lists no page targets, so there is
          nothing for an agent to attach to. Check the browser container's logs —
          chromium may have failed to start its initial window:
          kubectl logs -n {{ ns }} -l app=neko -c neko --tail=50
          {% endif %}
          Observed stdout: {{ _attach.stdout | default('<empty>') | trim }}
          stderr: {{ _attach.stderr | default('<empty>') | truncate(300) }}
        success_msg: "DevTools policy override live, and CDP lists page targets."

    # --- D. the persistent identity ---
    - name: "D1. Profile volume bound and mounted"
      ansible.builtin.shell: |
        kubectl get pvc neko-profile -n {{ ns }} --context {{ _target }} \
          --kubeconfig {{ merged_kubeconf_file }} -o jsonpath='{.status.phase}'
        echo " "
        kubectl exec -n {{ ns }} {{ _pods.resources[0].metadata.name }} -c neko \
          --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }} -- \
          sh -c 'test -w /home/neko/.config/chromium && echo PROFILE_WRITABLE || echo PROFILE_NOT_WRITABLE'
      register: _profile
      changed_when: false
      failed_when: false

    - name: "D2. Assert the login can actually persist"
      ansible.builtin.assert:
        that:
          - _profile.stdout is search('Bound')
          - _profile.stdout is search('PROFILE_WRITABLE')
        fail_msg: >-
          The profile volume is not usable, so logins will not survive a
          restart — which is neko's entire reason to exist over browserless.
          A bound-but-unwritable volume means fsGroup is wrong (must be 1000).
          Observed: {{ _profile.stdout | default('<empty>') | trim }}
        success_msg: "Profile volume bound and writable — logins will persist."

    # --- E. the media path's advertised values ---
    - name: "E1. Read what ICE will advertise, and what is reachable"
      # ⚠️ jsonpath, NOT grep. This used line-oriented greps against
      # pretty-printed JSON: `grep -o '"NEKO_WEBRTC_TCPMUX"[^}]*'` stops at the
      # end of the line and never reaches the "value" on the NEXT line. Every
      # variable came back empty, so E2 failed on emptiness rather than on a real
      # mismatch — and because E aborted the play, F never ran and the guard went
      # unexercised by the suite. Found by the independent tester (2026-08-24).
      #
      # ⚠️ And the Service is named `neko`. It was queried as `neko-webrtc`,
      # which was the media Service's name before http/80 was dropped and the
      # ports were merged onto one Service (D4). NotFound returns empty rather
      # than failing, so the wrong name looked like a missing value.
      ansible.builtin.shell: |
        K="--context {{ _target }} --kubeconfig {{ merged_kubeconf_file }}"
        echo "MUX=$(kubectl get deploy neko -n {{ ns }} $K -o jsonpath='{.spec.template.spec.containers[?(@.name=="neko")].env[?(@.name=="NEKO_WEBRTC_TCPMUX")].value}')"
        echo "NAT=$(kubectl get deploy neko -n {{ ns }} $K -o jsonpath='{.spec.template.spec.containers[?(@.name=="neko")].env[?(@.name=="NEKO_WEBRTC_NAT1TO1")].value}')"
        echo "TYPE=$(kubectl get svc neko -n {{ ns }} $K -o jsonpath='{.spec.type}')"
        echo "SVCPORT=$(kubectl get svc neko -n {{ ns }} $K -o jsonpath='{.spec.ports[?(@.name=="tcpmux")].port}')"
        echo "TARGETPORT=$(kubectl get svc neko -n {{ ns }} $K -o jsonpath='{.spec.ports[?(@.name=="tcpmux")].targetPort}')"
        echo "NODEPORT=$(kubectl get svc neko -n {{ ns }} $K -o jsonpath='{.spec.ports[?(@.name=="tcpmux")].nodePort}')"
      register: _webrtc
      changed_when: false
      failed_when: false

    - name: "E2. Assert the advertised port is the reachable port"
      # ICE hands the viewer exactly one address:port pair. If neko advertises a
      # port that is not the one a viewer can open, the page loads, the pod is
      # Ready, /health is 200 — and the screen is black forever. Nothing else in
      # this playbook or in Kubernetes notices.
      #
      # Asserts on VALUES, not just on presence: an empty MUX would otherwise
      # satisfy a "not empty" check the moment the query broke.
      ansible.builtin.assert:
        that:
          - _webrtc.stdout is search('MUX=[0-9]+')
          - _webrtc.stdout is search('NAT=[0-9]')
          - (_webrtc.stdout | regex_search('MUX=([0-9]+)', '\\1') | first) ==
            (_webrtc.stdout | regex_search('SVCPORT=([0-9]+)', '\\1') | first)
          - (_webrtc.stdout | regex_search('MUX=([0-9]+)', '\\1') | first) ==
            (_webrtc.stdout | regex_search('TARGETPORT=([0-9]+)', '\\1') | first)
          - _webrtc.stdout is not search('NAT=127\\.0\\.0\\.1')
        fail_msg: >-
          The WebRTC media path is inconsistent, which means a black screen with
          every health check green. neko advertises NAT1TO1:TCPMUX through ICE and
          the viewer connects to exactly that, so the Service port and targetPort
          must equal TCPMUX.
          {% if _webrtc.stdout is search('NAT=127.0.0.1') %}
          NAT1TO1 is 127.0.0.1, which only a viewer ON THE NODE ITSELF can reach —
          the deploy's node-address discovery did not reach the Deployment. Check
          that task 10's patch applied rather than being dropped.
          {% endif %}
          Observed: {{ _webrtc.stdout | default('<empty>') | trim | replace('\n', '  ') }}
        success_msg: >-
          Media path consistent —
          {{ _webrtc.stdout | default('') | trim | replace('\n', '  ') }}

    # --- F. the guard that replaced tailnet-only ---
    - name: "F1. An ANONYMOUS CDP request must be refused"
      # ⚠️ THE SECURITY CHECK. On the reference installation the guard was the
      # network: CDP was tailnet-only. UIS exposes neko on the LAN so agents,
      # other services and the test harness can reach it without a Tailscale
      # operator — so the network is no longer a guard, and the token is.
      #
      # A NetworkPolicy could not do this job: it cannot distinguish an
      # authorised LAN device from any other LAN device.
      #
      # What is behind this port is full browser control including the logged-in
      # human's cookies. If this check ever passes anonymously, the correct
      # reading is "any device on the LAN is logged into everything this browser
      # is logged into".
      ansible.builtin.shell: |
        P=neko-anon-probe
        kubectl delete pod $P -n {{ ns }} --context {{ _target }} \
          --kubeconfig {{ merged_kubeconf_file }} --ignore-not-found >/dev/null 2>&1
        kubectl run $P --image=curlimages/curl --restart=Never \
          -n {{ ns }} --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }} \
          --command -- sh -c '
            echo "NOHDR=$(curl -s -o /dev/null -w %{http_code} -m 15 http://{{ svc }}:9222/json/version)"
            echo "BADTOK=$(curl -s -o /dev/null -w %{http_code} -m 15 -H "X-Neko-Token: definitely-not-the-token" http://{{ svc }}:9222/json/version)"
          ' >/dev/null
        for i in $(seq 1 30); do
          phase=$(kubectl get pod $P -n {{ ns }} --context {{ _target }} \
            --kubeconfig {{ merged_kubeconf_file }} -o jsonpath='{.status.phase}' 2>/dev/null)
          [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ] && break
          sleep 2
        done
        kubectl logs $P -n {{ ns }} --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }}
        kubectl delete pod $P -n {{ ns }} --context {{ _target }} \
          --kubeconfig {{ merged_kubeconf_file }} --wait=false >/dev/null 2>&1
      register: _anon
      changed_when: false
      failed_when: false

    - name: "F2. Assert anonymous and wrong-token requests get 401"
      ansible.builtin.assert:
        that:
          - _anon.stdout is search('NOHDR=401')
          - _anon.stdout is search('BADTOK=401')
        fail_msg: >-
          CDP did NOT refuse an unauthenticated request
          (stdout: {{ _anon.stdout | default('?') | trim | replace('\n', '  ') }}
           stderr: {{ _anon.stderr | default('<empty>') | truncate(200) }}).
          Expected 401 for both no-header and wrong-token. This port is
          reachable on the LAN and carries full browser control including the
          logged-in human's cookies, so anything that can reach it is logged in
          as that human. Check the `cdp` container is the nginx auth proxy and
          that NEKO_CDP_TOKEN reached it — a plain forwarder here means no guard
          at all.
        success_msg: "CDP refuses anonymous and wrong-token requests (401)."

    - name: "SUMMARY"
      ansible.builtin.debug:
        msg:
          - "A. Web view healthy (the human's door):        PASS"
          - "F. CDP refuses anonymous + wrong token (401):   PASS   <- the guard"
          - "B. CDP reachable through the Service:          PASS"
          - "C. DevTools policy override live + targets:    PASS   <- the invisible one"
          - "D. Profile volume bound and writable:          PASS"
          - "E. WebRTC advertised port == reachable port:   PASS"
          - ""
          - "C is why this playbook exists. With upstream's"
          - "DeveloperToolsAvailability: 2, checks A, B, D and E all pass, the pod"
          - "is Ready, and no agent can drive the browser."
          - ""
          - "This verify does NOT prove a human can see video — that needs a real"
          - "WebRTC client. E proves the values are consistent, not that media flows."
          - ""
          - "F replaced tailnet-only as the CDP guard. neko is LAN-reachable by"
          - "design so agents and the test harness need no Tailscale operator;"
          - "the token is therefore the ONLY thing standing in front of full"
          - "browser control over the logged-in human's cookies."
