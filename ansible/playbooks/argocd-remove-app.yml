---
# file: playbooks/argocd-remove-app.yml (simplified version)
# Remove an application from ArgoCD and the cluster
# This playbook will:
#   - Remove the ArgoCD Application
#   - Remove the GitHub credentials secret
#   - Remove the application namespace and all its resources
#   - Verify that all resources have been properly removed
#
# Required Variables:
#   app_name: Application name (namespace and ArgoCD app name) to remove
#
# Usage:
# ansible-playbook playbooks/argocd-remove-app.yml -e "app_name=my-app"

- name: Remove application from ArgoCD and cluster
  hosts: localhost
  gather_facts: false
  vars:
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    argocd_namespace: "argocd"
    github_secret_name: "github-{{ app_name }}"
    retry_delay: 8
    max_retries: 15
    wait_timeout: 120

  tasks:
    - name: 1. Check if app_name is provided
      ansible.builtin.fail:
        msg: "The variable 'app_name' is mandatory. Use -e app_name=my-app to specify it."
      when: app_name is not defined

    - name: 2. Print playbook description
      ansible.builtin.debug:
        msg: >
          Removing application from ArgoCD and cluster:
          - Repository: {{ app_name }}
          - Namespace: {{ app_name }}
          - ArgoCD Namespace: {{ argocd_namespace }}
          - GitHub Secret: {{ github_secret_name }}
          - Wait timeout: {{ wait_timeout }} seconds

    - name: 3. Check if namespace exists
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ app_name }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: namespace_info
      changed_when: false

    - name: 4. Get current ArgoCD Application status
      kubernetes.core.k8s_info:
        kind: Application
        name: "{{ app_name }}"
        namespace: "{{ argocd_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
        api_version: argoproj.io/v1alpha1
      register: argocd_app
      changed_when: false
      ignore_errors: true

    - name: 5. Display current status
      ansible.builtin.debug:
        msg: 
          - "Current Status:"
          - "Namespace {{ app_name }} exists: {{ namespace_info.resources | length > 0 }}"
          - "ArgoCD Application {{ app_name }} exists: {{ argocd_app.resources | length > 0 }}"
          - "Beginning cleanup process..."

    # 🔴 Task 4 already knows whether an Application exists. Until 1.6.175 it
    # was only printed, and task 13 deleted the namespace regardless of the
    # answer — so `uis argocd remove <any-namespace>` deleted that namespace
    # and everything in it, whether or not ArgoCD had ever managed it.
    #
    # Found by imac (urb-agents#1732) by running the exact command that
    # `argocd register` printed when it refused to take over an occupied
    # namespace. The remedy destroyed what the refusal had just protected.
    - name: "5a. Refuse to delete a namespace this never managed"
      ansible.builtin.fail:
        msg: |
          No ArgoCD application named '{{ app_name }}' exists.

          Namespace '{{ app_name }}' does exist, and removing it would delete
          it and everything inside it. This command undoes 'uis argocd
          register', so with nothing registered there is nothing to undo, and
          it will not guess that the namespace was meant.

          If the application really was removed by hand and you want the
          leftover namespace gone:
            uis argocd remove {{ app_name }} --force

          --force only removes a namespace ArgoCD left behind. If anything in
          there was not created by this application, it refuses and names it.

          To see what would be lost first:
            kubectl get all -n {{ app_name }}
      when:
        - argocd_app.resources | length == 0
        - namespace_info.resources | length > 0
        - not (force | default(false) | bool)

    # 🔴 --force used to delete any namespace by name, and say only how many
    # PODS were in it. imac destroyed a Secret, a ConfigMap and a PVC with it
    # on the evidence of "Found 0 pods" (urb-agents#1736, case A3), and the
    # warning was printed and acted on in the same run — a log line, not a
    # warning.
    #
    # ArgoCD on this install tracks with `argocd.argoproj.io/instance=<app>`
    # (measured on the live fleet Deployment; resourceTrackingMethod unset,
    # ArgoCD v2.14.10). So a namespace ArgoCD really did own carries that
    # label on its resources, and a foreign one does not.
    #
    # `key!=value` also matches resources that do not carry the key at all,
    # which is exactly the set we must not delete.
    - name: "5c. What in this namespace does NOT belong to this application"
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - all,secret,configmap,persistentvolumeclaim
          - -n
          - "{{ app_name }}"
          - -o
          - name
          - -l
          - "argocd.argoproj.io/instance!={{ app_name }}"
          - --kubeconfig
          - "{{ merged_kubeconf_file }}"
      register: untracked_raw
      changed_when: false
      failed_when: false
      when:
        - argocd_app.resources | length == 0
        - namespace_info.resources | length > 0

    - name: "5d. Set the untracked list, minus what Kubernetes puts in every namespace"
      ansible.builtin.set_fact:
        untracked: "{{ (untracked_raw.stdout_lines | default([]))
                       | reject('search', '^configmap/kube-root-ca.crt$')
                       | reject('equalto', '')
                       | list }}"
      when:
        - argocd_app.resources | length == 0
        - namespace_info.resources | length > 0

    - name: "5e. Refuse to force-delete resources this application does not own"
      ansible.builtin.fail:
        msg: |
          Refusing to delete namespace '{{ app_name }}'.

          No ArgoCD application named '{{ app_name }}' exists, and the namespace
          holds {{ untracked | length }} resource(s) that ArgoCD never managed:

          {{ untracked | join('\n          ') }}

          --force removes a namespace ArgoCD left behind. It is not a way to
          delete someone else's namespace, and these resources would go with it.

          Delete them yourself if that is what you want:
            kubectl delete namespace {{ app_name }}
      when:
        - argocd_app.resources | length == 0
        - namespace_info.resources | length > 0
        - force | default(false) | bool
        - untracked | default([]) | length > 0

    - name: "5f. Forcing the removal of a namespace ArgoCD left behind"
      ansible.builtin.debug:
        msg: |
          ⚠️  No ArgoCD application named '{{ app_name }}' exists.
          Every resource in namespace '{{ app_name }}' is labelled
          argocd.argoproj.io/instance={{ app_name }}, so this is an orphan.
          Deleting it because --force was given.
      when:
        - argocd_app.resources | length == 0
        - namespace_info.resources | length > 0
        - force | default(false) | bool
        - untracked | default([]) | length == 0

    # ⚠️ --force on a name with no namespace used to exit 0 and claim
    # "Namespace '<name>' and all its resources removed" (imac, case A1).
    - name: "5g. Nothing to remove"
      ansible.builtin.debug:
        msg: |
          Nothing to remove: there is no ArgoCD application named '{{ app_name }}'
          and no namespace of that name. Nothing was deleted.
      when:
        - argocd_app.resources | length == 0
        - namespace_info.resources | length == 0

    - name: 6. Remove ArgoCD Application
      kubernetes.core.k8s:
        name: "{{ app_name }}"
        namespace: "{{ argocd_namespace }}"
        api_version: argoproj.io/v1alpha1
        kind: Application
        state: absent
        kubeconfig: "{{ merged_kubeconf_file }}"
        wait: true
        wait_timeout: "{{ wait_timeout }}"
      when: argocd_app.resources | length > 0
      register: app_remove_result

    - name: 7. Wait for ArgoCD Application to be removed
      kubernetes.core.k8s_info:
        kind: Application
        name: "{{ app_name }}"
        namespace: "{{ argocd_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
        api_version: argoproj.io/v1alpha1
      register: argocd_app_check
      until: argocd_app_check.resources | length == 0
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"
      changed_when: false
      when: argocd_app.resources | length > 0

    - name: 8. Display ArgoCD Application removal status
      ansible.builtin.debug:
        msg: 
          - "✅ ArgoCD Application '{{ app_name }}' removed successfully"
          - "Resource finalizers processed: {{ app_remove_result.result.metadata.finalizers | default([]) }}"
      when: argocd_app.resources | length > 0 and argocd_app_check.resources | length == 0

    - name: 9. Remove GitHub credentials secret
      kubernetes.core.k8s:
        name: "{{ github_secret_name }}"
        namespace: "{{ argocd_namespace }}"
        api_version: v1
        kind: Secret
        state: absent
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: secret_remove_result

    - name: 10. Wait for GitHub secret to be removed
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ github_secret_name }}"
        namespace: "{{ argocd_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: secret_check
      until: secret_check.resources | length == 0
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"
      changed_when: false

    - name: 11. Display GitHub secret removal status
      ansible.builtin.debug:
        msg: "✅ GitHub secret '{{ github_secret_name }}' removed successfully"
      when: secret_check.resources | length == 0

    - name: 12. Check namespace resources before removal (for reporting)
      block:
        - name: Get all resource types in namespace
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: "{{ app_name }}"
            kubeconfig: "{{ merged_kubeconf_file }}"
          register: namespace_resources
          changed_when: false
          when: namespace_info.resources | length > 0

        # 🔴 This said "Found N pods", and N was 0 for a namespace holding a
        # Secret, a ConfigMap and a PVC — all of which were then deleted
        # (imac, urb-agents#1736 case A3). Count what is actually at stake.
        - name: Everything in the namespace, not just the pods
          ansible.builtin.command:
            argv:
              - kubectl
              - get
              - all,secret,configmap,persistentvolumeclaim
              - -n
              - "{{ app_name }}"
              - -o
              - name
              - --kubeconfig
              - "{{ merged_kubeconf_file }}"
          register: doomed_raw
          changed_when: false
          failed_when: false
          when: namespace_info.resources | length > 0

        - name: Display what is about to be deleted
          ansible.builtin.debug:
            msg: |
              Deleting namespace '{{ app_name }}' and these
              {{ (doomed_raw.stdout_lines | default([])) | length }} resource(s):
              {{ (doomed_raw.stdout_lines | default([])) | join('\n              ') }}
          when: namespace_info.resources | length > 0
      when: namespace_info.resources | length > 0

    - name: 13. Remove namespace and all its resources
      kubernetes.core.k8s:
        name: "{{ app_name }}"
        api_version: v1
        kind: Namespace
        state: absent
        kubeconfig: "{{ merged_kubeconf_file }}"
        wait: true
        wait_timeout: "{{ wait_timeout }}"
      when: namespace_info.resources | length > 0
      register: namespace_remove_result

    - name: 14. Wait for namespace to be removed
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ app_name }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: namespace_check
      until: namespace_check.resources | length == 0
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"
      changed_when: false
      when: namespace_info.resources | length > 0

    - name: 15. Display namespace removal status
      ansible.builtin.debug:
        msg: "✅ Namespace {{ app_name }} and all its resources removed successfully"
      when: namespace_info.resources | length > 0 and namespace_check.resources | length == 0

    - name: 16. Final verification of removal
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ app_name }}"
        namespace: "{{ argocd_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: final_app_check
      changed_when: false
      ignore_errors: true

    - name: 17. Final status display
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "{{ 'APPLICATION REMOVAL SUCCESSFUL' if (argocd_app.resources | length > 0 or namespace_info.resources | length > 0) else 'NOTHING TO REMOVE' }}"
          - "=================================================="
          - "{{ '✅ ArgoCD Application removed from argocd namespace' if argocd_app.resources | length > 0 else '·  No ArgoCD Application of that name existed' }}"
          - "{{ '✅ Namespace and all its resources removed' if namespace_info.resources | length > 0 else '·  No namespace of that name existed' }}"
          - ""
