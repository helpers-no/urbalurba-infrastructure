---
# File: playbooks/040-database-postgresql.yml
# Description: Set up PostgreSQL database using Helm
#
# This playbook performs the following tasks:
# 1. Verifies PostgreSQL secret values
# 2. Deploys PostgreSQL using Helm
# 3. Waits for PostgreSQL pod to be running
# 4. Verifies PostgreSQL service is running
#
# Prerequisites:
# - Kubernetes cluster is set up and accessible
# - Helm is installed on the provision-host
# - urbalurba-secrets contains PGPASSWORD and PGHOST
#
# Usage: ansible-playbook playbooks/040-database-postgresql.yml -e target_host="multipass-microk8s"

- name: Set up PostgreSQL Database
  hosts: localhost
  gather_facts: false
  vars:
    manifests_folder: "/mnt/urbalurbadisk/manifests"
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    postgres_config_file: "{{ manifests_folder }}/042-database-postgresql-config.yaml"
    # Use _target internally to provide default value
    _target: "{{ target_host | default('rancher-desktop') }}"

  tasks:
    - name: 1. Print playbook description
      ansible.builtin.debug:
        msg: "Setting up PostgreSQL on Kubernetes cluster: {{ _target }} with manifests from: {{ manifests_folder }}."

    - name: 3. Verify PostgreSQL secret values
      kubernetes.core.k8s_info:
        kind: Secret
        name: urbalurba-secrets
        namespace: default
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: secret_info

    - name: 4. Fail if PostgreSQL secrets are not set correctly
      ansible.builtin.fail:
        msg: "PostgreSQL secrets are not set correctly in urbalurba-secrets"
      when: >
        secret_info.resources[0].data.PGPASSWORD is not defined or
        secret_info.resources[0].data.PGHOST is not defined

    - name: 5. Set PostgreSQL password
      ansible.builtin.set_fact:
        postgres_password: "{{ secret_info.resources[0].data.PGPASSWORD | b64decode }}"

    - name: 6. Check if PostgreSQL is already installed
      ansible.builtin.command: >
        helm list -n default -f postgresql
      register: helm_list
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      changed_when: false

    - name: 7. Deploy PostgreSQL using Helm if not already installed
      ansible.builtin.command: >
        helm install postgresql bitnami/postgresql
        --version 18.2.3
        --namespace default
        -f {{ postgres_config_file }}
        --set auth.postgresPassword="{{ postgres_password }}"
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: "'postgresql' not in helm_list.stdout"

    # 🔴 READY, NOT Running. `status.phase == "Running"` is true the instant the
    # container starts — and Bitnami's PostgreSQL then bounces its server twice
    # while it initialises. Measured by imac on a cluster that had never run UIS
    # (urb-agents#506):
    #
    #   07:46:36.5  container starts, phase Running   <- this task was satisfied
    #   07:46:44.7  setup server stops — server DOWN
    #   07:46:45.2  CREATE DATABASE fails, psql exit 2   ("connection went bad")
    #   07:46:45.4  "database system is ready to accept connections"
    #   07:46:47    pod Ready=True
    #
    # It missed a working server by 223 ms. Two later runs passed with ~6.5 s
    # margin on the same host and the same code — the outcome is decided by
    # where this 15 s poll lands against a ~9 s startup. **A coin flip skewed to
    # pass is worse than a deterministic failure**: roughly one user in three
    # hits an unretryable dead end and the rest conclude it works, which is how
    # this survived four gradings on clusters where PostgreSQL already existed.
    #
    # The Ready condition is gated on Bitnami's own readiness probe — `pg_isready`
    # against the real server — so it cannot be true while the server is down.
    # That closes the whole 11-second window rather than narrowing it.
    #
    # ⚠️ Do NOT verify this by re-running until it passes. It passed two times in
    # three before the fix. The check is that the wait now returns on the Ready
    # condition; the timing margin is a consequence, not the assertion.
    # 🔴 `until:` IS NOT OPTIONAL HERE, AND ITS ABSENCE BROKE FIRST INSTALLS.
    #
    # 1.6.37 replaced a phase poll with this wait and dropped the retry with
    # it. `kubectl wait` does NOT wait for a resource to be created: with
    # nothing matching the selector it errors immediately, and `--timeout`
    # bounds how long to wait for a CONDITION ON EXISTING PODS, not for pods to
    # exist. Helm creates the StatefulSet and the pod object appears moments
    # later, so on a clean cluster this failed in 176 ms (imac,
    # urb-agents#525):
    #
    #   pod postgresql-0 created  10:34:28Z
    #   kubectl wait started      10:34:28.396
    #   kubectl wait failed       10:34:28.572   "no matching resources found"
    #
    # ⚠️ So the readiness fix closed one race and opened another of the same
    # class — asserting against a resource at the wrong moment — and moved the
    # window from "Running but not Ready" to "not yet created". The old code
    # could not do this: its `until:` made "not created yet" just a failed
    # poll. Intermittent, and silent to anyone not watching, exactly like the
    # bug it replaced.
    #
    # ⚠️ And the behaviour that causes it was measured on #516 and read as
    # good news: `exit 1 on no matching resources` answers "does it pass
    # vacuously?" with no — and also says "it fails hard before the resource
    # exists", which in a deploy sequence is the normal first fraction of a
    # second. Both halves were in the same output.
    #
    # Timeouts: the retry covers CREATION (seconds), the per-attempt timeout
    # covers READINESS (~9 s for Bitnami). Bounded at 10 x (90 + 5) ≈ 16 min if
    # PostgreSQL never becomes ready, rather than the 105 min that 20 retries
    # of a 300 s wait would give.
    - name: 8. Wait for PostgreSQL pod to be READY (not merely Running)
      command: >-
        kubectl wait --for=condition=Ready pod
        -l app.kubernetes.io/name=postgresql
        -n default --timeout=90s
      register: pod_ready
      until: pod_ready.rc == 0
      retries: 10
      delay: 5
      changed_when: false
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"

    - name: 9. Verify PostgreSQL service is running
      kubernetes.core.k8s_info:
        kubeconfig: "{{ merged_kubeconf_file }}"
        kind: Service
        namespace: default
        name: postgresql
      register: postgres_svc

    - name: 10. Display PostgreSQL service details
      ansible.builtin.debug:
        var: postgres_svc.resources[0].spec