---
# file: ansible/playbooks/argocd-list-apps.yml
# List all ArgoCD-managed applications with their health and sync status.
#
# Usage:
#   ansible-playbook ansible/playbooks/argocd-list-apps.yml

- name: List ArgoCD applications
  hosts: localhost
  gather_facts: false
  vars:
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    argocd_namespace: "argocd"

  tasks:
    # 🔴 ASK WHETHER ARGOCD IS RUNNING, NOT WHETHER ITS NAMESPACE EXISTS.
    #
    # This checked for the namespace. imac measured an argocd namespace that
    # existed and was COMPLETELY EMPTY — no pods, no deployments — so the check
    # passed, the Application query returned nothing, and `uis argocd list`
    # printed "(0 registered) — No applications registered." and exited 0
    # (urb-agents#1575).
    #
    # ⚠️ That output is indistinguishable from a healthy ArgoCD with nothing
    # registered yet, and `list` is the command someone runs FIRST to see where
    # they stand. A namespace outlives everything that was ever in it, so its
    # presence answers a different question than the reader is asking.
    #
    # 🔵 This is the same condition `argocd-register-app.yml` already uses, and
    # register behaved correctly throughout. The two verbs disagreed about
    # whether they were allowed to speak; now they cannot. A test asserts both
    # playbooks select on the same label.
    - name: "1. Is ArgoCD actually running?"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ argocd_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=argocd-server"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: argocd_pods
      failed_when: false

    - name: "2. Refuse to report an inventory that was never taken"
      ansible.builtin.fail:
        msg: |
          ❌ ArgoCD is not deployed or not running.

          No ArgoCD server pods found in namespace '{{ argocd_namespace }}'.

          This is "could not look", NOT "nothing is registered" — the two read
          the same and mean opposite things.

          Deploy ArgoCD first: uis deploy argocd
      when: (argocd_pods.resources | default([]) | length) == 0

    - name: "3. Get all ArgoCD Application resources"
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: "{{ argocd_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: argocd_apps

    - name: "4. Display applications"
      ansible.builtin.debug:
        msg: |
          ===============================================
          ArgoCD Applications ({{ argocd_apps.resources | length }} registered)
          ===============================================
          {% if argocd_apps.resources | length == 0 %}
          No applications registered.

          Register one with: uis argocd register <name> <repo-url>
          {% else %}
          {% for app in argocd_apps.resources %}
          Name:   {{ app.metadata.name }}
          Repo:   {{ app.spec.source.repoURL | default('N/A') }}
          Path:   {{ app.spec.source.path | default('/') }}
          Health: {{ app.status.health.status | default('Unknown') }}
          Sync:   {{ app.status.sync.status | default('Unknown') }}
          {% if not loop.last %}
          ---
          {% endif %}
          {% endfor %}
          {% endif %}
          ===============================================
