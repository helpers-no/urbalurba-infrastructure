---
# file: ansible/playbooks/820-deploy-network-cloudflare-tunnel.yml
# Description: Deploy Cloudflare tunnel to Kubernetes cluster (token-based)
#
# This playbook:
# 1. Validates prerequisites (kubeconfig, secrets)
# 2. Verifies CLOUDFLARE_TUNNEL_TOKEN is set and not a placeholder
# 3. Applies the static manifest (1 replica of cloudflared)
# 4. Waits for pods to be running
# 5. Tests end-to-end connectivity through the tunnel
#
# Usage:
#   ansible-playbook playbooks/820-deploy-network-cloudflare-tunnel.yml

- name: Deploy Cloudflare tunnel to Kubernetes cluster
  hosts: localhost
  gather_facts: false
  vars:
    manifests_folder: "/mnt/urbalurbadisk/manifests"
    kubeconfig_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    manifest_file: "820-cloudflare-tunnel-base.yaml"
    tunnel_namespace: "default"

  tasks:
    - name: "01 Verify kubeconfig file exists"
      ansible.builtin.stat:
        path: "{{ kubeconfig_file }}"
      register: kubeconfig_stat

    - name: "02 Fail if kubeconfig file does not exist"
      ansible.builtin.fail:
        msg: "Kubeconfig file not found at {{ kubeconfig_file }}"
      when: not kubeconfig_stat.stat.exists

    - name: "03 Retrieve secrets from urbalurba-secrets"
      kubernetes.core.k8s_info:
        kind: Secret
        name: urbalurba-secrets
        namespace: default
        kubeconfig: "{{ kubeconfig_file }}"
      register: urbalurba_secrets

    - name: "04 Fail if urbalurba-secrets not found"
      ansible.builtin.fail:
        msg: "urbalurba-secrets not found in default namespace. Run 'uis secrets apply' first."
      when: urbalurba_secrets.resources | length == 0

    - name: "05 Extract Cloudflare tunnel token and domain"
      ansible.builtin.set_fact:
        cf_tunnel_token: "{{ urbalurba_secrets.resources[0].data.CLOUDFLARE_TUNNEL_TOKEN | b64decode }}"
        cf_domain: "{{ urbalurba_secrets.resources[0].data.BASE_DOMAIN_CLOUDFLARE | default('') | b64decode | default('', true) }}"
      when: urbalurba_secrets.resources | length > 0

    - name: "06 Validate tunnel token is not a placeholder"
      ansible.builtin.fail:
        msg: |
          CLOUDFLARE_TUNNEL_TOKEN is still set to a placeholder value.

          To fix:
          1. Create a tunnel in the Cloudflare dashboard (Zero Trust > Networks > Tunnels)
          2. Run: uis network init cloudflare   (paste the tunnel token when prompted)
          3. Then: uis network up cloudflare
      when: >-
        cf_tunnel_token is not defined or
        cf_tunnel_token == "" or
        "your-cloudflare-tunnel-token" in cf_tunnel_token

    - name: "07 Verify manifest file exists"
      ansible.builtin.stat:
        path: "{{ manifests_folder }}/{{ manifest_file }}"
      register: manifest_stat

    - name: "08 Fail if manifest not found"
      ansible.builtin.fail:
        msg: "Manifest not found at {{ manifests_folder }}/{{ manifest_file }}"
      when: not manifest_stat.stat.exists

    - name: "09 Apply Cloudflare tunnel manifest"
      kubernetes.core.k8s:
        src: "{{ manifests_folder }}/{{ manifest_file }}"
        kubeconfig: "{{ kubeconfig_file }}"
        state: present

    - name: "10 Wait for cloudflared pods to appear"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ tunnel_namespace }}"
        label_selectors:
          - "app=cloudflared"
        kubeconfig: "{{ kubeconfig_file }}"
      register: cf_pods
      until:
        - cf_pods.resources | length > 0
      retries: 12
      delay: 5

    - name: "11 Wait for cloudflared pods to be running"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ tunnel_namespace }}"
        label_selectors:
          - "app=cloudflared"
        kubeconfig: "{{ kubeconfig_file }}"
      register: cf_pods_status
      until:
        - cf_pods_status.resources | length > 0
        - cf_pods_status.resources | map(attribute='status.phase') | list | select('equalto', 'Running') | list | length == cf_pods_status.resources | length
      retries: 24
      delay: 10

    - name: "12 Check for pods in error state"
      ansible.builtin.fail:
        msg: |
          Cloudflare tunnel pods failed to start.
          Pod statuses: {{ cf_pods_status.resources | map(attribute='status.phase') | list | join(', ') }}

          Common issues:
          - Invalid tunnel token (check Cloudflare dashboard)
          - Port 7844 blocked by corporate firewall
          - DNS resolution issues

          Check logs: kubectl logs -n default -l app=cloudflared --tail=50
      when:
        - cf_pods_status.resources | length > 0
        - cf_pods_status.resources | map(attribute='status.phase') | list | select('in', ['Failed', 'Error']) | list | length > 0

    - name: "13 Wait for tunnel to register with Cloudflare edge"
      ansible.builtin.pause:
        seconds: 15
        prompt: "Waiting for Cloudflare tunnel to register and DNS to stabilize..."

    - name: "14 Test Cloudflare tunnel end-to-end connectivity"
      ansible.builtin.uri:
        url: "https://{{ cf_domain }}"
        method: GET
        status_code: [200, 301, 302, 404]
        validate_certs: true
        timeout: 30
      register: tunnel_test
      retries: 12
      delay: 10
      until: tunnel_test.status is defined and tunnel_test.status in [200, 301, 302, 404]
      failed_when: false
      when: cf_domain != "" and "your-domain" not in cf_domain

    # THE PROBE KNEW THE STATUS CODE AND THE SUMMARY THREW IT AWAY.
    #
    # Task 14 sets `failed_when: false`, so a failing probe leaves the play green
    # and the old summary collapsed three different outcomes into one string:
    # "SKIP - domain not configured or test failed". In testing (2026-09-18) that
    # printed after twelve consecutive 502s, on a run where the domain WAS
    # configured — so the only true word in the line was "failed", and it sat
    # behind an "or" next to a false claim. `up.sh` then printed
    # "✓ Cloudflare tunnel is up" on top of it.
    #
    # The three states are distinct and worth separate words: nothing to probe,
    # probe passed, probe failed. `tunnel_test.status` holds the code in the
    # failing case too, so there is no reason not to print it.
    - name: "15 Classify the end-to-end probe outcome"
      ansible.builtin.set_fact:
        probe_skipped: "{{ cf_domain == '' or 'your-domain' in cf_domain }}"
        probe_status: "{{ tunnel_test.status | default(0) | int }}"
        probe_passed: "{{ tunnel_test.status is defined and tunnel_test.status in [200, 301, 302, 404] }}"

    # A 502 on this path means the connector reached Cloudflare's edge but could
    # not reach the origin named in the dashboard route. cloudflared logs that
    # origin verbatim as `originService=`, so read it back rather than making the
    # operator go find it. PLAN-012 root-caused this exact failure once already
    # (routes pointing at traefik.default instead of traefik.kube-system) and it
    # recurred anyway, because the value lives in Cloudflare's dashboard where no
    # manifest or test can reach it. Naming it at the moment of failure is the
    # only guard available.
    - name: "16 Read the origin the connector is actually using"
      kubernetes.core.k8s_log:
        name: "{{ cf_pods_status.resources[0].metadata.name }}"
        namespace: "{{ tunnel_namespace }}"
        kubeconfig: "{{ kubeconfig_file }}"
        tail_lines: 200
      register: cf_origin_log
      when: not probe_skipped | bool and not probe_passed | bool
      ignore_errors: true

    - name: "17 Extract the reported origin"
      ansible.builtin.set_fact:
        reported_origin: >-
          {{ (cf_origin_log.log | default('') | regex_findall('originService=(\S+)')) | unique | join(', ') }}
      when: not probe_skipped | bool and not probe_passed | bool

    - name: "18 Final deployment summary"
      ansible.builtin.debug:
        msg:
          - "==================================================="
          - "Cloudflare Tunnel Deployment"
          - "==================================================="
          - ""
          - "Status: {{ 'DEPLOYED' if probe_skipped | bool or probe_passed | bool else 'DEPLOYED BUT NOT SERVING TRAFFIC' }}"
          - "Pods: {{ cf_pods_status.resources | length }} running"
          - "Namespace: {{ tunnel_namespace }}"
          - "Domain: {{ cf_domain if not probe_skipped | bool else 'not configured' }}"
          - >-
            Connectivity: {{
              'SKIP - no BASE_DOMAIN_CLOUDFLARE set, nothing to probe' if probe_skipped | bool
              else 'PASS - HTTP ' ~ probe_status if probe_passed | bool
              else 'FAIL - HTTP ' ~ probe_status if probe_status | int > 0
              else 'FAIL - no response from the tunnel'
            }}
          - ""
          - "Cloudflare dashboard: Zero Trust > Networks > Tunnels"
          - ""
          - "To verify: uis network verify cloudflare"
          - "To remove: uis network down cloudflare"
          - "==================================================="

    - name: "19 Diagnose a failed end-to-end probe"
      ansible.builtin.debug:
        msg:
          - "==================================================="
          - "The tunnel is connected but not serving"
          - "==================================================="
          - ""
          - "The cloudflared pod is Running and registered with Cloudflare, so the"
          - "token and the network path are fine. The request reached the tunnel and"
          - "failed on the way to the origin."
          - ""
          - "Origin the connector reports: {{ reported_origin if reported_origin | default('', true) | length > 0 else '(not named in the last 200 log lines)' }}"
          - "Origin this cluster expects:  http://traefik.kube-system.svc.cluster.local:80"
          - ""
          - "Traefik runs in kube-system on Rancher Desktop, not in default. If the"
          - "two lines above differ, fix the Service URL on BOTH published"
          - "application routes (the wildcard and the apex) in the Cloudflare"
          - "dashboard. The connector pulls its config from the edge, so the change"
          - "takes effect in seconds and nothing needs redeploying."
          - ""
          - "Confirm this cluster's Traefik Service with:"
          - "  kubectl get svc -A | grep -i traefik"
          - ""
          - "Note: saving a route whose origin is a .cluster.local address triggers a"
          - "Cloudflare One device-profile popup. Clicking Cancel aborts the save and"
          - "silently keeps the old value, so read the URL back after saving."
          - "==================================================="
      when: not probe_skipped | bool and not probe_passed | bool

    # Deploying a connector that cannot serve traffic is not a success. Exit
    # non-zero so `up.sh` reports it as a failure instead of printing a tick.
    - name: "20 Fail because the tunnel is deployed but not serving"
      ansible.builtin.fail:
        msg: >-
          Cloudflare tunnel deployed, but the end-to-end probe to
          https://{{ cf_domain }} failed with HTTP {{ probe_status }}
          after 12 attempts. See the diagnosis above.
      when: not probe_skipped | bool and not probe_passed | bool
