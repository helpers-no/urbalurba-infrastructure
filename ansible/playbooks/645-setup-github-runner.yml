---
# file: ansible/playbooks/645-setup-github-runner.yml
# Description:
# Install (or update) a GitHub Actions self-hosted runner INSTANCE via GitHub's own
# **Actions Runner Controller (ARC)**, the `gha-runner-scale-set` Helm chart —
# `urb-agents#2073`/`#2075` (Terje's direction, after live bifrost OOM/eviction debugging on
# `#2067`/`#2071`/`#2072`): runners must scale to zero when idle, and the scheduler needs a
# real way to prefer a capacity-heavy node. A static, always-on Deployment (what this
# playbook did before — see git history, or `PLAN-service-github-runner-arc-migration.md`
# for the full before/after) architecturally cannot do either. Full design rationale lives
# there; this header covers only what an operator needs to run it.
#
# 🔴 THE OPERATOR CONTRACT DID NOT CHANGE. Same variables, same validation order, same
# `uis github-runner register/remove/list` CLI on top of this. What changed is entirely
# internal: Helm releases instead of a bare Deployment, ephemeral runner pods instead of one
# persistent pod, and the registration token is no longer minted by this playbook at all —
# ARC's own listener mints its own JIT tokens, continuously, for as long as the release
# exists.
#
# 🔴 THE PAT NOW PERSISTS IN THE CLUSTER, UNLIKE BEFORE — stated plainly, not hidden. The
# old design deliberately discarded the PAT after minting one short-lived token
# (`urb-agents#2030`'s own "no PAT needs to live in the cluster long-term" finding). ARC
# cannot work that way: its listener needs to keep minting tokens with no human in the
# loop, for as long as the scale set exists, so the PAT becomes a persistent Secret
# (`{{ github_runner_resource_name }}-token`, key `github_token`). Same narrow
# 'Administration' repository permission as before — only its lifetime changed, and that
# change is the cost of scale-to-zero working unattended.
#
# 🔵 THE ARC CONTROLLER IS CLUSTER-WIDE, SHARED, AND NEVER REMOVED BY THE REMOVE PLAYBOOK.
# One `gha-runner-scale-set-controller` release (namespace `arc-systems`) serves every
# instance on this cluster; installing it is idempotent (`helm upgrade --install`, a no-op
# once already current) so it is safe to run on every `register` call, first instance or
# fifth. Deliberately never uninstalled when the last instance goes away — CRD
# install/removal churn is a worse tradeoff than one small permanent controller pod.
#
# 🔴 MULTIPLE INSTANCES STILL COEXIST ON ONE CLUSTER, ONE PER TARGET REPO
# (`urb-agents#2053`) — unchanged. Each instance is its own Helm release of the
# `gha-runner-scale-set` chart, named `{{ github_runner_resource_name }}`, sharing the
# `github-runner` namespace. The collision check below (task 5) still refuses to silently
# repoint an existing instance at a different repo.
#
# 🔴 MIGRATING AN INSTANCE THAT STILL HAS THE OLD STATIC DEPLOYMENT: task 6 below detects a
# same-named Deployment left over from before this migration and WARNS loudly — it never
# deletes it. Both would otherwise register two separate runners against the same repo
# (harmless, just redundant) until an operator removes the old one by hand once the new
# ARC-backed instance is confirmed listening. See `PLAN-service-github-runner-arc-
# migration.md`'s own Rollout section for the exact command.
#
# Usage (unchanged):
# ansible-playbook playbooks/645-setup-github-runner.yml -e target_host="rancher-desktop" \
#   -e github_runner_repo="owner/repo" -e github_runner_pat="..."
#
# A second instance, same cluster (unchanged):
# ansible-playbook playbooks/645-setup-github-runner.yml -e target_host="rancher-desktop" \
#   -e github_runner_repo="owner/other-repo" -e github_runner_pat="..." \
#   -e github_runner_instance="other-repo"
#
# Activating the capacity-aware node preference, once nodes actually carry the
# `urbalurba.no/hypervisor` label (set declaratively at k3s provisioning time in the platform
# repo's own IaC, not a hand-run kubectl label — see this service's own docs — inert otherwise,
# by default). A RANKED list, not a single avoid rule — e.g. prefer frigg (most free memory
# today) over tor (strongest CPU, less headroom), and both over odin (weakest, tightest):
# ansible-playbook playbooks/645-setup-github-runner.yml -e target_host="rancher-desktop" \
#   -e github_runner_repo="owner/repo" -e github_runner_pat="..." \
#   -e '{"github_runner_node_preference": [{"hypervisor": "frigg", "weight": 100}, {"hypervisor": "tor", "weight": 50}]}'

- name: Install a GitHub Actions self-hosted runner via Actions Runner Controller
  hosts: localhost
  gather_facts: false
  vars:
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    manifests_dir: "/mnt/urbalurbadisk/manifests"
    github_runner_namespace: "github-runner"

    # 🔵 PINNED — both ARC charts (controller + gha-runner-scale-set) release together
    # under matching version numbers. Re-verify against the actions-runner-controller
    # repository's own releases before bumping, same discipline every other pinned chart
    # in this repository follows.
    arc_chart_version: "0.15.1"
    arc_controller_namespace: "arc-systems"
    arc_controller_release: "arc"
    arc_controller_chart: "oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller"
    arc_scale_set_chart: "oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set"

    # Empty by default — same reasoning as before (urb-agents#2053): every resource name
    # renders exactly as the default/unnamed instance always has.
    github_runner_instance: ""
    github_runner_force: false

    # 🔵 SAME IMAGE THIS SERVICE ALREADY PROVED LIVE (urb-agents#2030) — not the chart's
    # own floating `:latest` default. Re-verify against ghcr.io before bumping.
    github_runner_image: "ghcr.io/actions/actions-runner:2.337.0"

    github_runner_name: "{{ target_host }}-github-runner"
    github_runner_labels: "self-hosted,linux,x64,docker"

    # 🔴 768Mi OOM-KILLED A REAL RELEASE BUILD, urb-agents#2032 — carried forward
    # unchanged. 2Gi limit / 1Gi request is what's actually proven, not a guess.
    github_runner_memory_request: "1Gi"
    github_runner_memory_limit: "2Gi"

    # How many ephemeral runners this instance may run at once. minRunners is NOT
    # configurable here — it is always 0 (the entire point of this migration). A heavier
    # workload than cli-release.yml wants more concurrency, not a warm pool.
    github_runner_max_runners: 3

    # 🔴 INERT BY DEFAULT — Decision 2 of PLAN-service-github-runner-arc-migration.md. Empty
    # list until nodes actually carry the `urbalurba.no/hypervisor` label (declared in the
    # platform repo's own k3s provisioning IaC, not a hand-run kubectl label), so this ships
    # with ZERO behavior change anywhere that hasn't opted in yet. A RANKED preference, not a
    # single avoid rule: each {hypervisor, weight} entry becomes its own soft nodeAffinity
    # term, so e.g. frigg (most headroom today) can outrank tor (strongest CPU, less
    # headroom), which can outrank odin (weakest) — a straight "avoid the tight node" can't
    # express that ordering (urb-agents#2080).
    github_runner_node_preference: []

  tasks:
    - name: 1. Check if required variables are provided
      ansible.builtin.fail:
        msg: "The variable 'target_host' is mandatory. Use -e target_host=your_host_name to specify it."
      when: target_host is not defined

    - name: 1b. The target repository must be supplied, never defaulted
      ansible.builtin.assert:
        that:
          - github_runner_repo is defined
          - github_runner_repo | length > 0
          - github_runner_repo is search('^[^/\s]+/[^/\s]+$')
        fail_msg: >-
          github_runner_repo is required, in 'owner/repo' form (e.g. 'terchris/urb-agents')
          — pass it: -e github_runner_repo="owner/repo".
        quiet: true

    - name: 1c. The Personal Access Token must be supplied
      ansible.builtin.assert:
        that:
          - github_runner_pat is defined
          - github_runner_pat | length > 0
        fail_msg: >-
          github_runner_pat is required. Needs the 'Administration' repository permission
          (fine-grained PAT) or the classic 'repo' scope. Pass it: -e github_runner_pat=...
          🔴 Unlike this playbook's old design, this PAT is now STORED in the cluster as a
          Secret — ARC's listener needs to keep minting its own short-lived runner tokens
          for as long as this instance exists, with no human in the loop. See this
          playbook's own header for why.
        quiet: true
      no_log: true

    - name: 1d. If an instance name is given, it must be a safe Kubernetes name fragment
      ansible.builtin.assert:
        that:
          - github_runner_instance is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')
        fail_msg: >-
          github_runner_instance='{{ github_runner_instance }}' is not a valid Kubernetes
          name fragment (lowercase alphanumeric and hyphens only, no leading/trailing
          hyphen). It is folded directly into a Helm release name below.
        quiet: true
      when: github_runner_instance | length > 0

    # 🔴 ONE COMPUTATION, REUSED EVERYWHERE — the Helm release name (= this instance's
    # Secret name, with a suffix), the collision check, and the legacy-Deployment warning
    # all read this SAME fact, same discipline the old design already established.
    - name: 1e. Compute this instance's resource name
      ansible.builtin.set_fact:
        github_runner_resource_name: "github-runner{{ ('-' + github_runner_instance) if github_runner_instance | length > 0 else '' }}"

    - name: 2. Print playbook description
      ansible.builtin.debug:
        msg: >-
          Installing a GitHub Actions runner (ARC) on Kubernetes context: {{ target_host }},
          repo: {{ github_runner_repo }}, instance:
          {{ github_runner_instance if github_runner_instance | length > 0 else '(default)' }},
          resource name: {{ github_runner_resource_name }}

    - name: 3. Create github-runner namespace if it doesn't exist
      ansible.builtin.shell: kubectl create namespace {{ github_runner_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: namespace_result
      changed_when: namespace_result.rc == 0
      failed_when: namespace_result.rc != 0

    # Idempotent and instance-independent — safe to run on every register call. Installs
    # the CRDs + controller-manager once; a no-op upgrade every call after that.
    - name: 4. Ensure the ARC controller is installed (shared, cluster-wide, one per cluster)
      ansible.builtin.command: >
        helm upgrade --install {{ arc_controller_release }} {{ arc_controller_chart }}
        --version {{ arc_chart_version }}
        --namespace {{ arc_controller_namespace }}
        --create-namespace
        --timeout 300s
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: arc_controller_result
      changed_when: true

    # 🔴 REFUSE RATHER THAN SILENTLY REPOINT SOMEONE ELSE'S LIVE RUNNER — unchanged
    # rationale from the old design (urb-agents#2053), re-expressed against a Helm release
    # instead of a bare Deployment.
    - name: 5. Does a Helm release with this resource name already exist
      ansible.builtin.command: >
        helm get values {{ github_runner_resource_name }}
        --namespace {{ github_runner_namespace }}
        -o json
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: github_runner_existing_release
      changed_when: false
      failed_when: false

    - name: 5b. If it does, it must already be serving the SAME repo, or -e github_runner_force=true
      ansible.builtin.assert:
        that:
          - >-
            existing_repo == ('https://github.com/' + github_runner_repo)
            or (github_runner_force | bool)
        fail_msg: >-
          A Helm release named '{{ github_runner_resource_name }}' already exists in
          namespace '{{ github_runner_namespace }}', currently serving
          '{{ existing_repo }}' — not '{{ github_runner_repo }}'. Refusing to silently
          repoint a live runner at a different repository. Pick a different
          -e github_runner_instance=..., or pass -e github_runner_force=true if retargeting
          this exact instance is actually intended.
        quiet: true
      vars:
        existing_repo: "{{ (github_runner_existing_release.stdout | from_json).githubConfigUrl | default('(unknown — could not read its repo)') }}"
      when: github_runner_existing_release.rc == 0

    # 🔴 NEVER AUTO-DELETED — PLAN-service-github-runner-arc-migration.md's own Rollout
    # section. During migration, an old-style static Deployment under this same resource
    # name would otherwise keep running ALONGSIDE the new ARC-backed instance, both
    # registered against the same repo (redundant, not broken) until an operator removes
    # the old one by hand.
    - name: 6. Warn if an old-style static Deployment with this resource name still exists
      kubernetes.core.k8s_info:
        kind: Deployment
        name: "{{ github_runner_resource_name }}"
        namespace: "{{ github_runner_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: github_runner_legacy_deployment

    - name: 6b. Display the migration warning, if found
      ansible.builtin.debug:
        msg:
          - "⚠️  A pre-ARC Deployment named '{{ github_runner_resource_name }}' is still running"
          - "  in namespace '{{ github_runner_namespace }}'. It will keep registering runners"
          - "  against '{{ github_runner_repo }}' ALONGSIDE the ARC-backed instance this run"
          - "  installs — redundant, not broken, but worth cleaning up once the new instance"
          - "  is confirmed listening:"
          - "    kubectl delete deployment {{ github_runner_resource_name }} -n {{ github_runner_namespace }}"
          - "    kubectl delete secret {{ github_runner_resource_name }}-token -n {{ github_runner_namespace }}"
      when: github_runner_legacy_deployment.resources | default([]) | length > 0

    # 🔴 KEY NAME IS THIS CHART'S OWN CONVENTION, NOT CHOSEN HERE — confirmed against
    # templates/githubsecret.yaml at the pinned chart version. githubConfigSecret below is
    # passed as a STRING (the "pre-defined secret" form), so the chart expects this exact
    # Secret to already exist with this exact key.
    - name: 7. Apply (or update) this instance's PAT Secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ merged_kubeconf_file }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ github_runner_resource_name }}-token"
            namespace: "{{ github_runner_namespace }}"
          type: Opaque
          stringData:
            github_token: "{{ github_runner_pat }}"
      no_log: true

    - name: 8. Render this instance's Helm values
      ansible.builtin.template:
        src: "{{ manifests_dir }}/645-github-runner-values.yaml.j2"
        dest: /tmp/645-github-runner-values.yaml
        mode: "0600"
      no_log: true

    - name: 9. Install (or upgrade) this instance's runner scale set
      ansible.builtin.command: >
        helm upgrade --install {{ github_runner_resource_name }} {{ arc_scale_set_chart }}
        --version {{ arc_chart_version }}
        --namespace {{ github_runner_namespace }}
        -f /tmp/645-github-runner-values.yaml
        --timeout 300s
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: github_runner_helm_result
      changed_when: true
      no_log: true

    - name: 9b. Clean up the rendered values file
      ansible.builtin.file:
        path: /tmp/645-github-runner-values.yaml
        state: absent
      changed_when: false

    # 🔵 THE LISTENER, NOT A RUNNER POD — ephemeral runners don't exist until a job is
    # actually queued (the whole point of scale-to-zero), so there is nothing instance-
    # specific to wait for except the listener itself coming up and connecting.
    #
    # 🔴 NAME-MATCHED, NOT LABEL-SELECTED — GitHub's own troubleshooting docs disagree with
    # themselves on the listener pod's label keys (the documented labels section says
    # `actions.github.com/scale-set-name`; the docs' own example `kubectl logs` command
    # uses `auto-scaling-runner-set-name` instead, with no explanation of the mismatch —
    # confirmed by reading that page directly, not assumed). Unverifiable here (no live
    # cluster), so this matches on the pod NAME containing this instance's resource name
    # and `-listener`, which every independent source agrees is how ARC names it,
    # regardless of which label convention this chart version actually ships.
    # ignore_errors, same resilience the old design's own "confirm startup" step used: a
    # Helm install that succeeded but couldn't be confirmed here is reported honestly
    # below, not assumed to have failed.
    - name: 10. Wait for the AutoscalingRunnerSet's listener to be ready
      ansible.builtin.shell: >
        kubectl get pods -n {{ github_runner_namespace }} -o name
        | grep -F "{{ github_runner_resource_name }}" | grep -F "listener"
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: github_runner_listener_pod
      retries: 30
      delay: 10
      until: github_runner_listener_pod.rc == 0
      changed_when: false
      ignore_errors: true

    - name: 11. Display final deployment status
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "🚀 GitHub Runner (ARC) Deployment Status"
          - "==============================================="
          - ""
          - "{{ '✅ SUCCESS - the listener is up' if (github_runner_listener_pod is defined and github_runner_listener_pod.rc is defined and github_runner_listener_pod.rc == 0) else '⚠️ Helm install reported success, but the listener pod could not be confirmed here — check by hand (see Troubleshooting below)' }}"
          - ""
          - "📦 Repository: {{ github_runner_repo }}"
          - "🧩 Instance: {{ github_runner_instance if github_runner_instance | length > 0 else '(default)' }}"
          - "📛 Resource name / Helm release: {{ github_runner_resource_name }}"
          - "⚡ Scale: 0 idle, up to {{ github_runner_max_runners }} ephemeral runner(s) per queued job"
          - ""
          - "🐳 Execution: a private docker:dind sidecar per ephemeral runner, same choice"
          - "  the retired static Deployment already made — still 'privileged: true'."
          - ""
          - "🔑 This instance's PAT is now stored as a Secret ({{ github_runner_resource_name }}-token,"
          - "  key github_token) — ARC's listener mints its own short-lived runner tokens from"
          - "  it continuously. Unlike the old design, there is nothing to re-supply on a"
          - "  pod restart."
          - ""
          - "🔧 Troubleshooting:"
          - "• List instances: kubectl get autoscalingrunnersets -n {{ github_runner_namespace }}"
          - "• Find the listener pod: kubectl get pods -n {{ github_runner_namespace }} | grep {{ github_runner_resource_name }} | grep listener"
          - "• Ephemeral runner pods (only while a job is running): kubectl get pods -n {{ github_runner_namespace }}"
          - "==============================================="
