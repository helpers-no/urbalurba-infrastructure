---
# 088-test-postgrest.yml
# E2E verification for a PostgREST app instance.
#
# ⚠️ THIS ASKS THE API FOR DATA. IT DOES NOT CHECK THAT A POD IS RUNNING.
#
# 088-setup-postgrest.yml ends at "the Deployment is ready", which proves the
# container started and says nothing about whether PostgREST can reach the
# database or serve the schema it was configured for. A PostgREST pod with a bad
# DB URI runs happily and answers every request with an error.
#
# Two properties are checked, and the second matters as much as the first:
#
#   1. Data written by the app is readable through the HTTP API.
#   2. Writes through the HTTP API are REFUSED.
#
# (2) is a security property, not a nicety. `uis configure postgrest` grants
# SELECT only - see the GRANT block in configure-postgrest.sh. If that ever
# became GRANT ALL, every deploy would still pass and an unauthenticated write
# endpoint would be live. Same reason ArgoCD and Enonic verify that a wrong
# password is rejected: a service that accepts what it should refuse still looks
# healthy.
#
# Multi-instance: PostgREST ships one Deployment per consuming app, so this
# needs to know WHICH app. It reads the database and schema out of that app's
# own secret rather than being told, so the test always runs against what the
# instance is actually configured for.
#
# Usage:
#   ansible-playbook 088-test-postgrest.yml -e "target_host=rancher-desktop _app_name=myapp"
#   ./uis verify postgrest --app myapp
#
# ── KNOWN LIMITATION: the cleanup-failure branch is UNRENDERED ────────────────
#
# The SUMMARY's last line branches on whether Z1's DROP succeeded. The SUCCESS
# branch is exercised on every green run. The FAILURE branch has never been
# rendered against a real run, so its wording and its variables are unproven.
#
# That is not an oversight — it is hard to reach on purpose:
#   - `postgres` is a superuser here, so REVOKE cannot stop it dropping
#     (verified by the independent tester, 2026-08-25);
#   - the branch only fires on a genuine drop failure.
#
# A mechanism that WOULD render it, proven in a throwaway schema by the tester
# rather than guessed: Z1 runs `DROP TABLE IF EXISTS` WITHOUT CASCADE, and a
# dependent view defeats that even for a superuser —
#
#     create view <schema>.dependent_v as select * from <schema>.uis_verify_probe;
#     -- Z1 then fails: "cannot drop table ... because other objects depend on it"
#
# ⚠️ NOT DONE, AND NOT TO BE DONE CASUALLY. Rendering it requires pre-creating
# `uis_verify_probe` plus a dependent view inside a REAL application schema, and
# leaving that litter in place through an otherwise-green run. On atlas that
# schema is `api_v1`, which is publicly exposed. Deliberately dirtying a
# soon-public schema to exercise a log line is an owner's decision, not a
# tester's or a builder's — it is with Terje as of 2026-08-25.
#
# Recorded here so the finding survives the handoff file it came from. A branch
# that has never been rendered is not verified, and this one should not be
# assumed correct because the round it belongs to passed.

# ── HOW TO PROVE CHECK C ACTUALLY WORKS ───────────────────────────────────────
#
# C is the security property, so it is worth being able to prove it can fail.
# Recorded here because the obvious way to try it DOES NOT WORK, and quietly
# produces a PASS that looks like the check is broken:
#
#   ✗ GRANT INSERT ON ALL TABLES IN SCHEMA <schema> TO web_anon;
#
#     Two reasons it fails to falsify anything:
#       1. The role is PER-APP. `configure` creates <app>_web_anon and
#          <app>_authenticator — there is no bare `web_anon`.
#       2. ON ALL TABLES applies only to tables that exist AT GRANT TIME. The
#          probe table is created by A1 *during* the run, so it is not covered —
#          and C POSTs to exactly that table.
#
#   ✓ ALTER DEFAULT PRIVILEGES IN SCHEMA <schema>
#       GRANT INSERT ON TABLES TO <app>_web_anon;
#
#     Then C fails loudly, as it should. Revert with the matching REVOKE.
#
# The independent tester followed the wrong version, saw C pass on a
# deliberately-loosened database, and nearly filed "C cannot detect the
# misconfiguration it exists for" (2026-08-25). A falsification recipe that
# silently does nothing is worse than none: it manufactures false confidence in
# both directions.

- name: Verify a PostgREST instance serves its schema and refuses writes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _target: "{{ target_host | default('rancher-desktop') }}"
    _ns: "{{ postgrest_namespace | default('postgrest') }}"
    _pg_ns: "{{ pg_namespace | default('default') }}"
    _probe: "pgrst-verify-{{ 99999 | random }}"
    _tbl: "uis_verify_probe"

  tasks:
    - name: "0.1 Validate required extra-vars"
      ansible.builtin.assert:
        that:
          - _app_name is defined and _app_name | length > 0
        fail_msg: |
          PostgREST is multi-instance; there is no single thing to verify.
          Run via: ./uis verify postgrest --app <name>
          List instances: kubectl get deploy -n {{ _ns }}

    - name: "0.2 Read the instance's own configuration from its secret"
      ansible.builtin.shell: >
        kubectl get secret {{ _app_name }}-postgrest -n {{ _ns }} --context {{ _target }}
        -o jsonpath="{.data.{{ item.key }}}" | base64 -d
      register: _cfg
      changed_when: false
      failed_when: false
      no_log: true
      loop:
        - { key: "PGRST_DB_URI" }
        - { key: "PGRST_DB_SCHEMAS" }

    - name: "0.3 Fail clearly if the instance is not configured"
      ansible.builtin.fail:
        msg: >-
          Secret '{{ _app_name }}-postgrest' in namespace {{ _ns }} has no
          PGRST_DB_URI/PGRST_DB_SCHEMAS. Run
          './uis configure postgrest --app {{ _app_name }} ...' first.
      when: >-
        (_cfg.results[0].stdout | default('') | length == 0) or
        (_cfg.results[1].stdout | default('') | length == 0)

    - name: "0.4 Derive database and schema from the URI the instance uses"
      ansible.builtin.set_fact:
        _db: "{{ _cfg.results[0].stdout | regex_replace('^.*/([^/?]+)(\\?.*)?$', '\\1') }}"
        _schema: "{{ _cfg.results[1].stdout.split(',')[0] | trim }}"
      no_log: true

    - name: "0.4b Find the PostgreSQL pod, whatever provides it"
      # ⚠️ TWO separate topology assumptions live here. This one is the pod NAME;
      # the other is the psql HOST. Finding the right pod is not enough — without
      # `-h` psql uses the local unix socket, which does not exist in the proxy
      # (its first container is client tooling with no server). I fixed the pod
      # name on 2026-08-25 and left the socket assumption in place, so this
      # playbook still could not run on a proxied installation. Both halves are
      # needed; neither is sufficient.
      #
      # ⚠️ NOT `postgresql-0` — see 360-test-dagster.yml B0 for the full note.
      # In short: that name is a StatefulSet artefact of the in-cluster
      # database. An installation that declares postgresql in
      # .uis.extend/external-services.yaml gets a transparent PROXY instead — a
      # Deployment, so the pod is postgresql-<hash>-<hash>. The proxy is
      # otherwise indistinguishable (same Service, same labels, first container
      # carries psql); the hardcoded pod NAME was the one thing that broke it.
      #
      # This matters here specifically: postgrest is deployed on the production
      # installation, which proxies to an external database. This verify passed
      # on the test cluster because that one runs postgres in-cluster.
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ _pg_ns }}"
        label_selectors:
          - "app.kubernetes.io/name=postgresql"
        field_selectors:
          - status.phase=Running
        kubeconfig: "{{ merged_kubeconf_file | default(omit) }}"
        context: "{{ _target }}"
      register: _pgpods

    - name: "0.4c Fail clearly if PostgreSQL is not reachable as a pod"
      ansible.builtin.fail:
        msg: >-
          No Running PostgreSQL pod in {{ _pg_ns }} (label
          app.kubernetes.io/name=postgresql). This verify seeds a probe row
          through the database directly, so it needs one. If this installation
          proxies to an external database, the proxy is not running.
      when: _pgpods.resources | default([]) | length == 0

    - name: "0.5 Read the admin password"
      ansible.builtin.shell: >
        kubectl get secret urbalurba-secrets -n {{ _pg_ns }} --context {{ _target }}
        -o jsonpath="{.data.PGPASSWORD}" | base64 -d
      register: _pgpw
      changed_when: false
      no_log: true
      # ⚠️ failed_when + a checked assert, for the same reason as A1: no_log is
      # required here (this reads PGPASSWORD) and without failed_when a kubectl
      # failure aborts with only a censored block. The assert below reports the
      # cause from stderr, which carries kubectl's message and not the secret.
      failed_when: false

    - name: "0.5b Fail clearly if the admin password could not be read"
      ansible.builtin.assert:
        that: _pgpw.rc == 0 and (_pgpw.stdout | default('') | length) > 0
        fail_msg: >-
          Could not read PGPASSWORD from urbalurba-secrets in namespace {{ _pg_ns }}.
          kubectl said: {{ _pgpw.stderr | default('<no stderr>') | trim | truncate(200) }}
          Run `./uis secrets apply` if the secret is missing.
        success_msg: "Admin password read."

    # --- Test A: the API is up and talking to the database ---
    # kubectl exec against the long-lived postgresql pod, NOT `kubectl run --rm -i`:
    # that idiom can return rc=0 with empty stdout when the container outlives the
    # attach, which reads a healthy service as failing. See
    # INVESTIGATE-system-verification-playbooks-usage.
    # ⚠️ block/always, NOT a plain task list. The probe table is created in the
    # APP'S OWN SCHEMA, so if an assertion below fails the play would abort
    # before Z1 and leave `uis_verify_probe` sitting in a real application
    # schema — the one Atlas exposes publicly. The SUMMARY also claims "the
    # database is as it was found", which would then be false.
    #
    # A verify that dirties the thing it verifies, precisely when it fails, is
    # worse than no verify: it turns a failed test into a data-cleanup task.
    - name: "Probe the instance, always cleaning up afterwards"
      block:
      # ⚠️ `SET ROLE` is what makes this "as the app would" true rather than a
      # claim. This task connects as `postgres` because that is the only
      # credential UIS holds — the app role's password is generated and
      # deliberately not stored. Creating the probe table AS ADMIN made the
      # verify structurally unable to see the defect it should have caught:
      #
      #   `configure postgrest` recorded ALTER DEFAULT PRIVILEGES keyed to the
      #   CONNECTING role (postgres), so it only ever covered admin-created
      #   objects. A tenant's views are created by the tenant's own role and got
      #   no grant — an API answering an empty schema, forever, silently. The
      #   probe was created by the same admin role that owned the default ACL,
      #   so the grant fired, the read succeeded, and the verify went green.
      #
      # A probe that takes the one path a real tenant never takes proves the
      # path nobody uses. Found by atlas on urb-agents#323, after the fix in
      # configure-postgrest.sh emitted `FOR ROLE`.
      #
      # ⚠️ WHICH ROLE THE PROBE IMPERSONATES IS NOT A FIXED CHOICE.
      #
      # It must be the role that actually creates objects in this schema,
      # because the thing being proved is that the anon role can read what a
      # tenant writes:
      #
      #   database provisioned by `uis configure postgresql --app <x>`
      #       -> objects are created by role <x>          -> SET ROLE <x>
      #
      #   database provisioned any other way (hand-built, restored, migrated
      #   in as postgres) -> <x>_web_anon and <x>_authenticator exist but <x>
      #   does NOT, and every object is owned by postgres
      #                                                   -> probe as postgres
      #
      # The second population is real: it is the tester's own long-lived atlas
      # instance, which is HEALTHY - all 13 api_v1 views readable by
      # atlas_web_anon, because they are postgres-owned and the unqualified
      # default-ACL entry covers exactly that.
      #
      # 🔴 `SET ROLE` was unconditional, so every such instance was
      # UNVERIFIABLE - and `configure` said the same instance was correctly
      # configured, which it is. Two halves of the same tool contradicting each
      # other on one install. I guarded configure for this population on #330
      # and did not carry the guard here. Found by imac on urb-agents#344.
      - name: "A0. Does the app role exist? It decides who the probe impersonates"
        ansible.builtin.command: >
          kubectl exec -n {{ _pg_ns }} {{ _pgpods.resources[0].metadata.name }} --context {{ _target }} --
          env PGPASSWORD={{ _pgpw.stdout }}
          psql -h 127.0.0.1 -U postgres -d {{ _db }} -tAc
          "SELECT 1 FROM pg_roles WHERE rolname='{{ _app_name | replace('-', '_') }}'"
        register: _approle
        changed_when: false
        failed_when: false
        no_log: true

      - name: "A0b. Record which role the probe will use"
        ansible.builtin.set_fact:
          _probe_role: "{{ (_approle.stdout | default('') | trim == '1') | ternary(_app_name | replace('-', '_'), 'postgres') }}"

      - name: "A0c. Say so, because it changes what a PASS means"
        ansible.builtin.debug:
          msg: >-
            {% if _probe_role == 'postgres' %}Role '{{ _app_name | replace('-', '_') }}'
            does not exist, so the probe runs as postgres — which is correct for this
            install: its objects are postgres-owned too, so this proves the path a
            tenant here actually uses. A FOR ROLE default privilege is not involved
            and not asserted.{% else %}Probing as role '{{ _probe_role }}', the role a
            tenant's own tooling connects as. This asserts the FOR ROLE default
            privilege as well as the pipe.{% endif %}

      # `SET ROLE` needs no password: a superuser session can assume the role for
      # the rest of the transaction. When the probe role IS postgres the SET ROLE
      # is a harmless no-op rather than a special case.
      - name: "A1. Create the probe table as role {{ _probe_role }}, in {{ _schema }}"
        ansible.builtin.command: >
          kubectl exec -n {{ _pg_ns }} {{ _pgpods.resources[0].metadata.name }} --context {{ _target }} --
          env PGPASSWORD={{ _pgpw.stdout }}
          psql -h 127.0.0.1 -U postgres -d {{ _db }} -v ON_ERROR_STOP=1 -c
          "SET ROLE {{ _probe_role }};
           CREATE TABLE IF NOT EXISTS {{ _schema }}.{{ _tbl }}(id int primary key, msg text);
           INSERT INTO {{ _schema }}.{{ _tbl }} VALUES (1,'uis-verify')
           ON CONFLICT (id) DO UPDATE SET msg=EXCLUDED.msg;
           RESET ROLE;"
        register: _seed
        changed_when: true
        # ⚠️ failed_when: false, with no_log KEPT. no_log is here because the task
        # line carries PGPASSWORD, and that must not reach a log. But without
        # failed_when the task ABORTS and Ansible prints only
        # {"censored": "the output has been hidden ..."} — so a one-line
        # "role does not exist" became a play with no cause in it, and imac had
        # to reproduce it by hand to find out what happened.
        #
        # The diagnosis now happens in A2, which has no no_log and reads
        # _seed.stderr — psql's error text, which does not contain the password.
        # Keep the secret, return the reason.
        failed_when: false
        no_log: true

      - name: "A1b. Tell PostgREST to reload its schema cache"
        # PostgREST caches the schema at startup, so a table created after the pod
        # started is invisible to it (PGRST205 "not found in the schema cache").
        # NOTIFY on the pgrst channel is the supported reload signal and avoids
        # restarting the pod. Harmless if db-channel-enabled is off - the retry on
        # B1 then covers the window instead.
        ansible.builtin.command: >
          kubectl exec -n {{ _pg_ns }} {{ _pgpods.resources[0].metadata.name }} --context {{ _target }} --
          env PGPASSWORD={{ _pgpw.stdout }}
          psql -h 127.0.0.1 -U postgres -d {{ _db }} -c "NOTIFY pgrst, 'reload schema';"
        changed_when: false
        failed_when: false
        no_log: true

      - name: "A2. Assert the seed landed"
        # No no_log here, deliberately: this is where the reason is reported, and
        # it reads _seed.stderr — psql's own error text — rather than _seed.cmd,
        # which is the field that carries PGPASSWORD.
        ansible.builtin.assert:
          that: _seed.rc == 0
          fail_msg: >-
            Could not write the probe row into {{ _db }}.{{ _schema }} as role
            '{{ _probe_role }}'. PostgreSQL said:
            {{ _seed.stderr | default('<no stderr>') | trim | truncate(300) }}
            —— Most likely that role cannot CREATE in this schema, which a real
            tenant's own tooling would hit too, so this is a finding and not a
            test artefact.
          success_msg: >-
            Probe row written by role {{ _probe_role }}{{ (_probe_role == 'postgres')
            | ternary(' - the owner of this installation objects', ' - as a tenant would') }}.

      # --- Test B: read it back through the HTTP API ---
      - name: "B1. GET the row through {{ _app_name }}-postgrest"
        ansible.builtin.shell: |
          set -e
          kubectl run {{ _probe }} --image=curlimages/curl --restart=Never \
            -n {{ _ns }} --context {{ _target }} --command -- \
            curl -s -m 15 "http://{{ _app_name }}-postgrest:3000/{{ _tbl }}?id=eq.1" >/dev/null
          kubectl wait --for=condition=Ready=false --timeout=60s \
            -n {{ _ns }} --context {{ _target }} pod/{{ _probe }} >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            phase=$(kubectl get pod {{ _probe }} -n {{ _ns }} --context {{ _target }} -o jsonpath='{.status.phase}' 2>/dev/null)
            [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ] && break
            sleep 2
          done
          kubectl logs {{ _probe }} -n {{ _ns }} --context {{ _target }}
          kubectl delete pod {{ _probe }} -n {{ _ns }} --context {{ _target }} --wait=false >/dev/null 2>&1
        register: _read
        changed_when: false
        failed_when: false
        retries: 6
        delay: 5
        until: _read.stdout is search('uis-verify')

      - name: "B2. Assert the API returned the row the app wrote"
        ansible.builtin.assert:
          that:
            - _read.stdout is search('uis-verify')
          fail_msg: >-
            {{ _app_name }}-postgrest did not return the probe row.
            {% if '42501' in (_read.stdout | default('')) %}PostgreSQL returned
            42501 (permission denied), so the pod and the schema are fine and the
            anon role cannot READ what role {{ _probe_role }} created. That is a
            missing default privilege: `configure postgrest` records ALTER DEFAULT
            PRIVILEGES for the role it connects as, plus a FOR ROLE entry for the
            app role, so an object is covered only if its CREATOR has an entry.
            {% if _probe_role == 'postgres' %}Here the creator is postgres, which
            the unqualified entry should already cover — so this failing points at
            the grant block itself rather than at a missing FOR ROLE.{% endif %}
            Fix: re-run `./uis configure postgrest --app {{ _app_name }}`, which
            reapplies the grants.
            {% else %}The pod may be running while unable to reach {{ _db }}, or
            the schema '{{ _schema }}' is not the one it serves.
            {% endif %}Response was:
            {{ _read.stdout | default('<empty>') | truncate(200) }}
          # ⚠️ Parameterised by _probe_role, and the default-privileges clause
          # appears ONLY on the app-role branch. A0b exists so a PASS cannot be
          # misread across the two populations, and this string was hardcoded to
          # the app-role case — so on a postgres-owned install the same run said
          # "a FOR ROLE default privilege is not involved and not asserted"
          # (A0b) and "default privileges cover tenant-created objects" (here).
          # Found by imac on urb-agents#347, verifying the #344 fix.
          #
          # The disclosure and the success message have to say the same thing,
          # or the weaker one is the one people quote.
          success_msg: >-
            {% if _probe_role == 'postgres' %}The API served data written by role
            postgres, which owns this installation's objects — so the read path
            works for the way this install actually creates them. No FOR ROLE
            default privilege was involved, and none was asserted.
            {% else %}The API served data written by role {{ _probe_role }}, so the
            FOR ROLE default privilege covers tenant-created objects.{% endif %}

      # --- Test C: writes through the API must be refused (read-only by design) ---
      - name: "C1. POST through the API"
        ansible.builtin.shell: |
          kubectl run {{ _probe }}-w --image=curlimages/curl --restart=Never \
            -n {{ _ns }} --context {{ _target }} --command -- \
            curl -s -m 15 -o /dev/null -w "%{http_code}" \
            -X POST "http://{{ _app_name }}-postgrest:3000/{{ _tbl }}" \
            -H "Content-Type: application/json" -d '{"id":999,"msg":"should-not-persist"}' >/dev/null
          for i in $(seq 1 30); do
            phase=$(kubectl get pod {{ _probe }}-w -n {{ _ns }} --context {{ _target }} -o jsonpath='{.status.phase}' 2>/dev/null)
            [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ] && break
            sleep 2
          done
          kubectl logs {{ _probe }}-w -n {{ _ns }} --context {{ _target }}
          kubectl delete pod {{ _probe }}-w -n {{ _ns }} --context {{ _target }} --wait=false >/dev/null 2>&1
        register: _write
        changed_when: false
        failed_when: false

      - name: "C2. Assert the write was refused"
        ansible.builtin.assert:
          that:
            - _write.stdout is not search('^20[0-9]$')
          fail_msg: >-
            A write through the PostgREST API was ACCEPTED (HTTP
            {{ _write.stdout | default('?') }}). UIS grants SELECT only - see the
            GRANT block in configure-postgrest.sh. An accepted write means this
            instance exposes an unauthenticated write endpoint.
          success_msg: "Writes are refused (HTTP {{ _write.stdout | default('?') }})."

      # --- Cleanup: leave the database as it was found ---
      always:
      - name: "Z1. Drop the probe table"
        ansible.builtin.command: >
          kubectl exec -n {{ _pg_ns }} {{ _pgpods.resources[0].metadata.name }} --context {{ _target }} --
          env PGPASSWORD={{ _pgpw.stdout }}
          psql -h 127.0.0.1 -U postgres -d {{ _db }} -c "DROP TABLE IF EXISTS {{ _schema }}.{{ _tbl }};"
        changed_when: true
        failed_when: false
        no_log: true
        # ⚠️ REQUIRED. The SUMMARY below branches on _drop.rc. Without this the
        # fact is undefined, `default(1)` applies, and the success branch is
        # UNREACHABLE — every green run ends by claiming the probe table could
        # not be dropped. Found by the independent tester (2026-08-25).
        #
        # Same class as the neko round-2 defect: a consumer added without its
        # producer. The previous version of this summary lied one way (always
        # "clean"); the fix lied the other (always "dirty"). A line nobody can
        # trust gets ignored on the day it is right.
        register: _drop

    - name: "SUMMARY"
      ansible.builtin.debug:
        msg:
          - "App instance:                        {{ _app_name }}"
          - "Database / schema served:            {{ _db }} / {{ _schema }}"
          - ""
          - "A. App can write to the schema:      PASS"
          - "B. API serves that data over HTTP:   PASS"
          - "C. API refuses writes (SELECT only): PASS"
          - ""
          - "{{ ((_drop.rc | default(1)) == 0)
                 | ternary('The probe table has been dropped; the database is as it was found.',
                           '⚠️ THE PROBE TABLE COULD NOT BE DROPPED. ' ~ _schema ~ '.' ~ _tbl ~
                           ' may still exist in ' ~ _db ~ ' — remove it by hand.') }}"
