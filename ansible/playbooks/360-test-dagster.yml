---
# 360-test-dagster.yml
# E2E verification for Dagster.
#
# ⚠️ THIS ASKS THE ORCHESTRATOR WHETHER IT CAN ORCHESTRATE.
#
# 360-setup-dagster.yml ends when both pods report Ready, which proves two
# containers started. It does not prove Dagster can reach its metadata database,
# and it does not prove the DAEMON is doing its job.
#
# The daemon is the load-bearing part: it runs schedules and the run queue. A
# daemon pod can be Running with a stalled heartbeat — in which case every
# schedule silently stops firing while `uis status` stays green and the UI keeps
# serving. That failure is invisible from the outside and is exactly why this
# playbook exists.
#
# Usage:
#   ansible-playbook 360-test-dagster.yml -e "target_host=rancher-desktop"
#   ./uis verify dagster

- name: Verify Dagster can orchestrate
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _target: "{{ target_host | default('rancher-desktop') }}"
    dagster_ns: "dagster"
    postgres_ns: "default"
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    probe: "dagster-verify-{{ 99999 | random }}"

  tasks:
    # --- Test A: the webserver answers, not merely runs ---
    - name: "A1. Query the webserver's GraphQL API"
      # Runs a pod, waits for a terminal phase, then reads logs — deliberately
      # NOT `kubectl run --rm -i`, which can return rc=0 with empty stdout when
      # the container outlives the attach and would read a healthy service as
      # failing. See INVESTIGATE-system-verification-playbooks-usage.
      ansible.builtin.shell: |
        set -e
        kubectl run {{ probe }} --image=curlimages/curl --restart=Never \
          -n {{ dagster_ns }} --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }} \
          --command -- curl -s -m 20 -X POST \
          -H 'Content-Type: application/json' \
          -d '{"query":"{ version }"}' \
          http://dagster-dagster-webserver:80/graphql >/dev/null
        for i in $(seq 1 30); do
          phase=$(kubectl get pod {{ probe }} -n {{ dagster_ns }} --context {{ _target }} \
            --kubeconfig {{ merged_kubeconf_file }} -o jsonpath='{.status.phase}' 2>/dev/null)
          [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ] && break
          sleep 2
        done
        kubectl logs {{ probe }} -n {{ dagster_ns }} --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }}
        kubectl delete pod {{ probe }} -n {{ dagster_ns }} --context {{ _target }} \
          --kubeconfig {{ merged_kubeconf_file }} --wait=false >/dev/null 2>&1
      register: _gql
      changed_when: false
      failed_when: false
      retries: 5
      delay: 6
      until: _gql.stdout is search('version')

    - name: "A2. Assert the webserver served its GraphQL API"
      ansible.builtin.assert:
        that: _gql.stdout is search('version')
        fail_msg: >-
          The Dagster webserver did not answer a GraphQL query.
          ⚠️ Read the probe's stderr below BEFORE assuming the service is at
          fault: an empty response means "the question could not be asked" and
          "the answer was wrong" identically. A kubectl failure — wrong context,
          unreadable kubeconfig, missing namespace — produces exactly this.
          `./uis verify` pre-flights the context and kubeconfig, so those two are
          already excluded if you got here through it.
          If the probe genuinely reached the pod, then the webserver is up but
          not serving: check it can reach its metadata database.
          stderr: {{ _gql.stderr | default('<none>') | truncate(300) }}
          Response:
          {{ _gql.stdout | default('<empty>') | truncate(200) }}
        success_msg: "Webserver answered GraphQL."

    # --- Test B: the metadata store is real ---
    - name: "B0. Find the PostgreSQL pod, whatever provides it"
      # ⚠️ NOT `postgresql-0`. That name is a StatefulSet artefact of the
      # IN-CLUSTER database. When an installation declares postgresql in
      # .uis.extend/external-services.yaml, `uis deploy postgresql` renders a
      # transparent PROXY instead — a Deployment, so its pod is
      # postgresql-<hash>-<hash> and `postgresql-0` does not exist.
      #
      # The proxy is deliberately indistinguishable in every other way: same
      # Service name, same labels, and a first container carrying bash+psql
      # precisely so playbooks that exec into "the postgres pod" keep working.
      # Hardcoding the pod NAME was the one thing that defeated that.
      #
      # The setup playbook already discovers it by label; this did not, so the
      # verify would fail on exactly the installations that proxy — which is the
      # production one. Found while preparing dagster for asgard (2026-08-25).
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ postgres_ns }}"
        label_selectors:
          - "app.kubernetes.io/name=postgresql"
        field_selectors:
          - status.phase=Running
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: _pgpods

    - name: "B0b. Fail clearly if PostgreSQL is not there at all"
      ansible.builtin.fail:
        msg: >-
          No Running PostgreSQL pod in {{ postgres_ns }} (label
          app.kubernetes.io/name=postgresql). Dagster stores its metadata there.
          If this installation proxies to an external database, the proxy itself
          is not running — check `uis deploy postgresql`.
      when: _pgpods.resources | default([]) | length == 0

    - name: "B1. Read the admin password"
      ansible.builtin.shell: >
        kubectl get secret urbalurba-secrets -n {{ postgres_ns }} --context {{ _target }}
        --kubeconfig {{ merged_kubeconf_file }} -o jsonpath="{.data.PGPASSWORD}" | base64 -d
      register: _pgpw
      changed_when: false
      no_log: true

    - name: "B2. Count the tables Dagster migrated into its own database"
      ansible.builtin.shell: >-
        kubectl exec -n {{ postgres_ns }} {{ _pgpods.resources[0].metadata.name }} --
        bash -c "PGPASSWORD='{{ _pgpw.stdout }}'
        psql -h postgresql.{{ postgres_ns }} -U postgres -d dagster -tAc
        \"SELECT count(*) FROM pg_tables WHERE schemaname='public';\""
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: _tables
      changed_when: false
      failed_when: false

    - name: "B3. Assert the schema is present"
      ansible.builtin.assert:
        that: (_tables.stdout | default('0') | trim | int) > 10
        fail_msg: >-
          The `dagster` database has {{ _tables.stdout | default('?') | trim }}
          tables. Dagster migrates ~20 on first start; too few means it never
          reached the database, and run history is going nowhere.
        success_msg: "Metadata schema present ({{ _tables.stdout | default('?') | trim }} tables)."

    # --- Test C: the daemon is ALIVE, not merely scheduled ---
    - name: "C0. Read the daemon Deployment's replica state"
      # ⚠️ Ask Kubernetes, do not parse kubectl's stderr.
      #
      # Round 2 selected the failure message by matching stderr against
      # 'not found|no such|NotFound|scaled' — substrings I guessed instead of
      # observing. `--replicas=0` actually emits "error: timed out waiting for
      # the condition", which matches none of them, so a daemon with ZERO
      # replicas was reported as "running but unhealthy". The tester called that
      # worse than the opaque message it replaced: confidently wrong, and it
      # sends the operator to look at heartbeats rather than the replica count.
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ dagster_ns }}"
        name: dagster-daemon
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: _daemon_deploy
      failed_when: false

    - name: "C0b. Classify what state the daemon is actually in"
      ansible.builtin.set_fact:
        _daemon_state: >-
          {{ 'absent'   if (_daemon_deploy.resources | default([]) | length) == 0
             else 'scaled-to-zero' if ((_daemon_deploy.resources[0].spec.replicas | default(0)) | int) == 0
             else 'no-available'   if ((_daemon_deploy.resources[0].status.availableReplicas | default(0)) | int) == 0
             else 'running' }}

    - name: "C1. Ask the daemon for its own health"
      # `dagster-daemon liveness-check` reports whether the daemon's heartbeat is
      # fresh — which is a different question from whether its pod is Running.
      ansible.builtin.shell: >-
        kubectl exec -n {{ dagster_ns }} deploy/dagster-daemon --
        dagster-daemon liveness-check
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: _daemon
      changed_when: false
      failed_when: false
      retries: 5
      delay: 6
      until: _daemon.rc == 0

    - name: "C2. Assert the daemon is healthy"
      ansible.builtin.assert:
        that: _daemon.rc == 0
        fail_msg: >-
          {{ {'absent':         'THE DAGSTER DAEMON DEPLOYMENT DOES NOT EXIST. No schedule can fire.',
              'scaled-to-zero': 'THE DAGSTER DAEMON IS SCALED TO ZERO REPLICAS (spec.replicas=0). It is not running at all, so NO SCHEDULE IS FIRING. This is a replica-count problem, not a heartbeat problem — do not go looking at heartbeats.',
              'no-available':   'THE DAGSTER DAEMON HAS NO AVAILABLE REPLICAS — the pod exists but is not Ready. NO SCHEDULE IS FIRING.',
              'running':        'The Dagster daemon pod is running and Ready, but its heartbeat is stale: ' ~ (_daemon.stdout | default('') | trim) ~ ' ' ~ (_daemon.stderr | default('') | trim) ~ ' — so NO SCHEDULE IS FIRING despite the pod looking healthy.'
             }[_daemon_state] }}
          Nothing else in the platform detects this: `uis status` stays green and
          the UI keeps serving pages.
          Observed state: {{ _daemon_state }}
          (spec.replicas={{ _daemon_deploy.resources[0].spec.replicas | default('n/a') }},
          availableReplicas={{ _daemon_deploy.resources[0].status.availableReplicas | default(0) }}).
          Check: kubectl get deploy -n dagster dagster-daemon
        success_msg: "Daemon heartbeat is fresh — schedules and the run queue are live."

    # --- Test D: code locations, if any tenant has registered ---
    - name: "D1. Ask Dagster which code locations actually LOADED"
      # ⚠️ Deliberately asks the orchestrator, not Kubernetes.
      #
      # This used to run `kubectl get deploy -l component=user-deployments` and
      # count objects. That counts pods, not working code locations — a tenant
      # stuck in ImagePullBackOff has a Deployment and loads nothing, and this
      # test reported "registered: 1" and exited 0 while Dagster's own workspace
      # said DagsterUserCodeUnreachableError. Found by the independent tester
      # (D3, 2026-08-23); it is the exact "counted instead of asked" failure this
      # playbook exists to catch, committed inside the playbook itself.
      ansible.builtin.shell: |
        set -e
        kubectl run {{ probe }}-w --image=curlimages/curl --restart=Never \
          -n {{ dagster_ns }} --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }} \
          --command -- curl -s -m 20 -X POST -H 'Content-Type: application/json' \
          -d '{"query":"{ workspaceOrError { ... on Workspace { locationEntries { name loadStatus locationOrLoadError { __typename } } } } }"}' \
          http://dagster-dagster-webserver:80/graphql >/dev/null
        for i in $(seq 1 30); do
          phase=$(kubectl get pod {{ probe }}-w -n {{ dagster_ns }} --context {{ _target }} \
            --kubeconfig {{ merged_kubeconf_file }} -o jsonpath='{.status.phase}' 2>/dev/null)
          [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ] && break
          sleep 2
        done
        kubectl logs {{ probe }}-w -n {{ dagster_ns }} --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }}
        kubectl delete pod {{ probe }}-w -n {{ dagster_ns }} --context {{ _target }} \
          --kubeconfig {{ merged_kubeconf_file }} --wait=false >/dev/null 2>&1
      register: _ws
      changed_when: false
      failed_when: false
      # A location that is still importing is not a defect — give it time to
      # settle rather than reporting a transient state as a failure. Matched on
      # the raw text deliberately: parsing JSON inside `until:` throws on the
      # very responses (empty, truncated) the retry exists to ride out.
      retries: 10
      delay: 6
      until:
        - _ws.stdout is search('locationEntries')
        - _ws.stdout is not search('"loadStatus"\\s*:\\s*"LOADING"')

    - name: "D2. Separate the healthy locations from the broken ones"
      ansible.builtin.set_fact:
        _entries: "{{ (_ws.stdout | from_json).data.workspaceOrError.locationEntries | default([]) }}"
      failed_when: false

    - name: "D3. Compute the split"
      # ⚠️ `locationOrLoadError` is a GraphQL UNION, populated in BOTH outcomes:
      #   RepositoryLocation -> loaded and reachable
      #   PythonError        -> failed to load
      #   null               -> neither; still LOADING
      #
      # This previously split on nullness, which is wrong in the worst possible
      # direction: a HEALTHY location is non-null, so it landed in `_bad` and D4
      # failed. `./uis verify dagster` could not pass while any tenant was
      # working. Found by the independent tester (2026-08-23) against the first
      # real tenant, atlas-data — LOADED, 0 restarts, 112 assets queryable, and
      # reported as "cannot be reached".
      #
      # It survived two prior rounds because it was only ever exercised with
      # ZERO locations and with a BROKEN one. Both pass a null-based split. The
      # positive case — the one users actually hit — was never run. A check that
      # can fail correctly but cannot pass is not verified; see D5's lesson.
      ansible.builtin.set_fact:
        _ok: "{{ _entries | default([])
                 | selectattr('locationOrLoadError.__typename', 'defined')
                 | selectattr('locationOrLoadError.__typename', 'equalto', 'RepositoryLocation')
                 | map(attribute='name') | list }}"
        _bad: "{{ _entries | default([])
                 | selectattr('locationOrLoadError', 'defined')
                 | rejectattr('locationOrLoadError', 'none')
                 | rejectattr('locationOrLoadError.__typename', 'equalto', 'RepositoryLocation')
                 | map(attribute='name') | list }}"
        _loading: "{{ _entries | default([])
                 | selectattr('loadStatus', 'defined')
                 | selectattr('loadStatus', 'equalto', 'LOADING')
                 | map(attribute='name') | list }}"
      failed_when: false

    - name: "D4. A declared code location that cannot be reached is a FAILURE"
      # A Deployment that exists but serves nothing is worse than no tenant at
      # all: the platform reports it as registered while none of its assets,
      # jobs or schedules exist.
      ansible.builtin.assert:
        that:
          - (_bad | default([]) | length) == 0
          - (_loading | default([]) | length) == 0
        fail_msg: >-
          {% if (_bad | default([]) | length) > 0 %}Code location(s)
          {{ _bad | default([]) | join(', ') }} are declared but Dagster cannot
          reach them — their gRPC server is not answering. Usual cause: the image
          tag does not exist or cannot be pulled. Check
          `kubectl get pods -n {{ dagster_ns }}` and the tag in
          .uis.extend/dagster-code-locations.yaml. None of their assets,
          schedules or jobs exist while this is true.
          {% else %}Code location(s) {{ _loading | default([]) | join(', ') }} are
          still LOADING after the retry budget. That is neither loaded nor failed:
          Dagster has not finished importing their definitions. A slow module
          import at startup is the usual cause. Re-run the verify; if it persists,
          check the location pod's logs.{% endif %}
        success_msg: >-
          {{ (_ok | default([]) | length) }} code location(s) loaded and reachable.


    - name: "D5. Can each loaded tenant hydrate the platform's run storage?"
      # A code location can load perfectly and still be unable to execute a
      # single step.
      #
      # Run pods are launched from the TENANT's image, and the platform's
      # instance uses Postgres storage — so the tenant's Python environment must
      # be able to import `dagster_postgres.run_storage` before any step runs.
      # Without it a run reaches LaunchRunSuccess, the pod starts, and dies in
      # ~5s with stepsSucceeded=0 and a CheckError. The location stays LOADED and
      # green throughout, and D1-D4 all pass.
      #
      # Found against the first real tenant (atlas-data, 2026-08-23). The tenant
      # met every documented requirement — the requirement was undocumented and
      # nothing pre-flighted it. Both halves are now fixed: the contract states
      # it (see the service docs and the code-locations template) and this check
      # catches it before a user discovers it as a mystery run failure.
      ansible.builtin.shell: |
        missing=""
        for t in {{ _ok | default([]) | join(' ') }}; do
          pod=$(kubectl get pods -n {{ dagster_ns }} --context {{ _target }} \
            --kubeconfig {{ merged_kubeconf_file }} \
            -l deployment=$t -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          [ -z "$pod" ] && continue
          if ! kubectl exec -n {{ dagster_ns }} "$pod" --context {{ _target }} \
               --kubeconfig {{ merged_kubeconf_file }} -- \
               python -c "import dagster_postgres.run_storage" >/dev/null 2>&1; then
            missing="$missing $t"
          fi
        done
        echo "MISSING:$missing"
      register: _pgcheck
      changed_when: false
      failed_when: false
      when: (_ok | default([]) | length) > 0

    - name: "D5b. Record which tenants cannot run"
      ansible.builtin.set_fact:
        _tenant_missing_pg: "{{ (_pgcheck.stdout | default('MISSING:') | regex_replace('^.*MISSING:', '') | trim).split() }}"
      failed_when: false

    - name: "D5c. A tenant that cannot hydrate run storage is a FAILURE"
      ansible.builtin.assert:
        that: (_tenant_missing_pg | default([]) | length) == 0
        fail_msg: >-
          Code location(s) {{ _tenant_missing_pg | join(', ') }} loaded fine but
          CANNOT EXECUTE ANY RUN: their image cannot import
          `dagster_postgres.run_storage`, which every run pod must hydrate before
          its first step. A run will reach LaunchRunSuccess, start a pod, and die
          in about 5 seconds with stepsSucceeded=0 — while the location keeps
          reporting LOADED and this platform keeps reporting healthy.
          Fix in the TENANT image: add `dagster-postgres` matching the platform's
          Dagster line ({{ dagster_chart_version | default('1.13.19') }} ->
          dagster-postgres 0.29.x). See the code-location contract in
          /docs/services/analytics/dagster.
        success_msg: >-
          {{ (_ok | default([]) | length) }} tenant(s) can hydrate run storage.
      when: (_ok | default([]) | length) > 0

    - name: "SUMMARY"
      ansible.builtin.debug:
        msg:
          - "A. Webserver serves its GraphQL API:      PASS"
          - "B. Metadata schema present in `dagster`:  PASS ({{ _tables.stdout | default('?') | trim }} tables)"
          - "C. Daemon heartbeat fresh (schedules live): PASS"
          - ""
          - "D. Code locations LOADED (asked Dagster, not kubectl): {{ (_ok | default([]) | length) }}"
          - "{{ ((_ok | default([]) | length) == 0) | ternary('   None — expected on a fresh platform. UIS ships the orchestrator; tenants register themselves. See /docs/services/analytics/dagster.', '   ' ~ (_ok | default([]) | join(', '))) }}"
          - ""
          - "{{ ((_ok | default([]) | length) > 0) | ternary('   All can hydrate run storage (D5) — runs will execute.', '') }}"
          - ""
          - "A Dagster that passes A and B but fails C looks healthy and runs nothing."
          - "A tenant that passes D4 but fails D5 loads perfectly and executes nothing."
          - "D asks the orchestrator whether locations LOADED — a Deployment that exists"
          - "and serves nothing is a failure, not a registration."
