---
# file: ansible/playbooks/821-remove-network-cloudflare-tunnel.yml
# Description: Remove Cloudflare tunnel from Kubernetes cluster
#
# This playbook:
# 1. Validates kubeconfig
# 2. Deletes the cloudflare-tunnel Deployment
# 3. Waits for pod termination
# 4. Displays removal summary
#
# Usage:
#   ansible-playbook playbooks/821-remove-network-cloudflare-tunnel.yml

- name: Remove Cloudflare tunnel from Kubernetes
  hosts: localhost
  gather_facts: false
  vars:
    manifests_folder: "/mnt/urbalurbadisk/manifests"
    kubeconfig_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    tunnel_namespace: "default"
    # Optional: see 820-deploy-network-cloudflare-tunnel.yml's matching comment.
    cf_env: "{{ cf_env | default('') }}"

  tasks:
    - name: "01 Verify kubeconfig file exists"
      ansible.builtin.stat:
        path: "{{ kubeconfig_file }}"
      register: kubeconfig_stat

    - name: "01a Fail if kubeconfig file does not exist"
      ansible.builtin.fail:
        msg: "Kubeconfig file not found at {{ kubeconfig_file }}"
      when: not kubeconfig_stat.stat.exists

    - name: "01b Validate cf_env, when given"
      ansible.builtin.fail:
        msg: "Unknown cf_env '{{ cf_env }}'. Supported: DEV TEST PROD"
      when: cf_env != '' and cf_env not in ['DEV', 'TEST', 'PROD']

    - name: "01c Compute the env-suffixed Deployment/pod names"
      ansible.builtin.set_fact:
        cf_name_suffix: "{{ '-' + (cf_env | lower) if cf_env != '' else '' }}"

    - name: "01d Compute the dependent names"
      ansible.builtin.set_fact:
        cf_deployment_name: "cloudflare-tunnel{{ cf_name_suffix }}"
        cf_pod_label: "cloudflared{{ cf_name_suffix }}"

    - name: "02 Check for cloudflared deployment"
      kubernetes.core.k8s_info:
        kind: Deployment
        name: "{{ cf_deployment_name }}"
        namespace: "{{ tunnel_namespace }}"
        kubeconfig: "{{ kubeconfig_file }}"
      register: cf_deployment
      ignore_errors: true

    - name: "03 Delete the Deployment"
      kubernetes.core.k8s:
        kind: Deployment
        name: "{{ cf_deployment_name }}"
        namespace: "{{ tunnel_namespace }}"
        kubeconfig: "{{ kubeconfig_file }}"
        state: absent
      when: cf_deployment.resources | default([]) | length > 0
      ignore_errors: true

    - name: "04 Wait for cloudflared pods to terminate"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ tunnel_namespace }}"
        label_selectors:
          - "app={{ cf_pod_label }}"
        kubeconfig: "{{ kubeconfig_file }}"
      register: cf_pods_remaining
      until: cf_pods_remaining.resources | length == 0
      retries: 20
      delay: 5
      ignore_errors: true

    - name: "05 Display removal summary"
      ansible.builtin.debug:
        msg:
          - "==================================================="
          - "Cloudflare Tunnel Removal"
          - "==================================================="
          - ""
          - "Environment: {{ cf_env if cf_env != '' else '(bare, no --env)' }}"
          - "Deployment: {{ cf_deployment_name }} — {{ 'Removed' if cf_deployment.resources | default([]) | length > 0 else 'Not found (already removed)' }}"
          - "Pods remaining: {{ cf_pods_remaining.resources | default([]) | length }}"
          - ""
          - "NOTE: The tunnel still exists in Cloudflare dashboard."
          - "To fully clean up, delete the tunnel in:"
          - "  Cloudflare dashboard > Zero Trust > Networks > Tunnels"
          - ""
          - "To redeploy: uis network up cloudflare{{ ' --env ' + (cf_env | lower) if cf_env != '' else '' }}"
          - "==================================================="
