---
# 040-test-postgresql.yml
# E2E verification for PostgreSQL.
#
# ⚠️ THIS ASKS THE DATABASE A QUESTION. IT DOES NOT CHECK THAT A POD IS RUNNING.
#
# That distinction is the whole point once a service can be provided externally.
# `uis list` sees a Running pod either way - in-cluster PostgreSQL, or the proxy
# standing in for a database on another host. A Running proxy whose far side is
# unreachable looks exactly like a healthy database until something tries to use
# it.
#
# It is also the same test in both topologies, deliberately: it connects through
# `postgresql.<namespace>` like every consumer does, so a pass means consumers
# will work, and it proves the interface is genuinely identical.
#
# Usage:
#   ansible-playbook 040-test-postgresql.yml -e "target_host=rancher-desktop"

- name: Verify PostgreSQL answers
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _target: "{{ target_host | default('rancher-desktop') }}"
    _ns: "{{ pg_namespace | default('default') }}"

  tasks:
    - name: "0.1 Read the password consumers use"
      ansible.builtin.shell: >
        kubectl get secret urbalurba-secrets -n {{ _ns }} --context {{ _target }}
        -o jsonpath="{.data.PGPASSWORD}" | base64 -d
      register: _pgpw
      changed_when: false
      failed_when: false
      no_log: true

    - name: "0.2 Fail clearly if the platform secret is missing"
      ansible.builtin.fail:
        msg: >-
          No PGPASSWORD in urbalurba-secrets ({{ _ns }}). PostgreSQL cannot be
          verified without the credential its consumers use.
      when: _pgpw.stdout | default('') | length == 0

    # --- Test A: the database answers a real query, through the Service ---
    # ⚠️ TWO things are asked, and the second one is the point.
    #
    # `select version()` proves a database answered. It does NOT prove WHICH
    # database answered, and on 2026-08-30 the independent tester showed that
    # mattered: with PostgreSQL declared external, this verify exited 0 and
    # reported "Topology: EXTERNAL" while the in-cluster StatefulSet was serving
    # every query. The proxy was running, Ready, and selected by nothing.
    #
    # ⚠️ NOT AN ADDRESS. The first version asked `inet_server_addr()`, and the
    # tester showed that is the wrong instrument: it returns the server end as the
    # SERVER sees itself, so behind any bridge, NAT or port-forward it is an
    # internal address and never the one the client dialled. A genuinely working
    # proxy was rejected because the external container answered from 172.17.0.2.
    #
    # `system_identifier` is the cluster's permanent identity, assigned at initdb.
    # It travels through socat unchanged and does not care what the host is
    # called. B compares it against the same value read from a DIRECT connection
    # to the declared host, proving "the database that answered is the one
    # declared" without naming an address at all.
    #
    # ⚠️ Output is prefixed UIS| and regex-extracted, because `kubectl run --rm`
    # prints `pod "X" deleted` ON STDOUT. The previous version took the last
    # |-field and captured that notice, so one check could never fire and its
    # opposite always did.
    #
    # ⚠️ PGCONNECT_TIMEOUT and `timeout` are not tidiness. Traffic to a ClusterIP
    # with no ready backend is DROPPED, not refused, so psql waits forever: the
    # tester measured over ten minutes with the pod still Running and no verdict.
    # With `retries: 6` that is an hour of hanging. In CI a job with no verdict
    # is worse than a wrong one.
    - name: "A1. SELECT through postgresql.{{ _ns }}, and record which server answered"
      ansible.builtin.command: >
        kubectl run pg-verify-{{ 9999 | random }} --image=postgres:18 --rm -i
        --restart=Never -n {{ _ns }} --context {{ _target }} --timeout=60s
        --env PGPASSWORD={{ _pgpw.stdout }} --env PGCONNECT_TIMEOUT=10 --
        /bin/sh -c 'sleep 2; timeout 30 psql -h postgresql.{{ _ns }}.svc.cluster.local -U postgres -tAc "select chr(85)||chr(73)||chr(83)||chr(124)||version()||chr(124)||(select system_identifier from pg_control_system())"'
      register: _q
      changed_when: false
      failed_when: false
      retries: 6
      delay: 5
      until: _q.stdout is search('PostgreSQL')
      no_log: true

    - name: "A2. Assert the database answered"
      ansible.builtin.assert:
        that: _q.stdout is search('PostgreSQL')
        fail_msg: >-
          postgresql.{{ _ns }} did not answer a query. If this installation
          declares PostgreSQL in .uis.extend/external-services.yaml, the proxy is
          running but the real database is unreachable - check the address, the
          route, and that it is up. Otherwise the in-cluster database is unhealthy.
        success_msg: "The database answered."

    - name: "A3. Which server answered"
      ansible.builtin.set_fact:
        _pg_version: "{{ _q.stdout | default('') | regex_search('PostgreSQL [0-9.]+') }}"
        _pg_sysid: "{{ (_q.stdout | default('') | regex_search('UIS[|][^\n]*') | default('', true)).split('|') | last | trim }}"

    - name: "A3. Report it"
      ansible.builtin.debug:
        msg: "{{ _pg_version }}, system_identifier {{ _pg_sysid }}"

    - name: "A4. The identifier must have been read, or nothing below means anything"
      ansible.builtin.assert:
        that: _pg_sysid is match('^[0-9]+$')
        fail_msg: >-
          Could not read system_identifier from the server (got
          '{{ _pg_sysid | default("") }}'). Every topology check below compares it,
          so none of them can be trusted. This is the gate being broken, not the
          topology being wrong - do not read it as a topology failure.
        success_msg: "system_identifier read."

    # --- Test B: say which topology served that answer ---
    - name: "B1. Is this installation proxying to an external database?"
      ansible.builtin.stat:
        path: "/mnt/urbalurbadisk/.uis.extend/external-services.yaml"
      register: _extfile

    - name: "B2. Read the declaration"
      ansible.builtin.shell: >
        yq -r '.postgresql.host // ""' /mnt/urbalurbadisk/.uis.extend/external-services.yaml
      register: _exthost
      changed_when: false
      failed_when: false
      when: _extfile.stat.exists

    # ⚠️ B USED TO READ THE DECLARATION AND PRINT IT BACK.
    #
    # It said "Topology: EXTERNAL - proxied to <host>" whenever the declaration
    # file named a host, without ever checking which server answered. So B could
    # not contradict the config no matter what the cluster did - a falsification
    # that cannot fail, sitting in the verify for the one topology it exists to
    # test. That is how a broken proxy path passed as green on 2026-08-30.
    #
    # B now compares the DECLARED topology against the OBSERVED one and fails on
    # disagreement. Two independent checks, because either alone has a blind spot:
    #
    #   B4  the answering address is a pod IP in this namespace -> the answer came
    #       from inside the cluster. Works even when the declared host is a DNS
    #       name, and catches the exact defect the tester found.
    #   B5  the declared host is a literal address and does not match the answering
    #       address. Catches "external, but not the external you declared".
    #
    # When the declared host is a NAME, B4 still applies but B5 cannot: that is
    # reported as not-proven rather than passed. An assertion that could not be
    # made must never read as one that succeeded.
    # B asks two independent questions, neither of which involves an address.
    #
    #   B4  WHICH POD is behind the Service, and does it carry the proxy marker?
    #       Pure Kubernetes, no parsing, no NAT. This is the check that catches
    #       the original defect exactly: a Service still selecting the in-cluster
    #       StatefulSet while a declaration says external.
    #
    #   B5  IS IT THE DECLARED DATABASE? The identifier seen through the Service
    #       must equal the identifier read from a DIRECT connection to the
    #       declared host:port. Survives NAT, bridges and DNS names, because it
    #       compares the database's own identity rather than its address.
    #
    # If B5 cannot connect directly, that is a FAILURE, not a pass. The previous
    # version printed "NOT PROVEN" and exited 0, which restored the very false
    # green this playbook exists to prevent.
    - name: "B2b. And the port it declares, since B5 dials it directly"
      ansible.builtin.shell: >
        yq -r '.postgresql.port // "5432"' /mnt/urbalurbadisk/.uis.extend/external-services.yaml
      register: _extportq
      changed_when: false
      failed_when: false
      when: _extfile.stat.exists

    - name: "B2c. Default it"
      ansible.builtin.set_fact:
        _extport: "{{ (_extportq.stdout | default('') | trim) or '5432' }}"

    - name: "B3. Which pod is actually behind the Service"
      ansible.builtin.shell: >
        set -o pipefail;
        kubectl get endpointslice -n {{ _ns }} --context {{ _target }}
        -l kubernetes.io/service-name=postgresql
        -o jsonpath='{.items[*].endpoints[*].targetRef.name}'
      args: { executable: /bin/bash }
      register: _eppods
      changed_when: false
      failed_when: false

    - name: "B3b. Does that pod carry the external-proxy marker?"
      ansible.builtin.shell: >
        set -o pipefail;
        kubectl get pods -n {{ _ns }} --context {{ _target }}
        -l uis.io/external-proxy=true -o jsonpath='{.items[*].metadata.name}'
      args: { executable: /bin/bash }
      register: _proxypods
      changed_when: false
      failed_when: false

    - name: "B3c. Reduce that to one word"
      ansible.builtin.set_fact:
        _backing_pods: "{{ (_eppods.stdout | default('')).split() }}"
        _proxy_pod_names: "{{ (_proxypods.stdout | default('')).split() }}"

    # ⚠️ ORDER MATTERS: identity is the authority, the marker only corroborates.
    #
    # B4 originally asserted that the pod behind the Service carries the proxy
    # marker, and FAILED if it did not. On 2026-08-30 that redded asgard - the
    # only production installation running this topology - while it was working
    # perfectly: its proxy was created 16 days earlier, before markers existed,
    # so it carries no marker and never will until it is redeployed.
    #
    # That is the false green inverted, and it is the worse error of the two: an
    # operator who trusts a verify that calls a healthy production database
    # misconfigured will act on it. A check that cannot pass a correct
    # installation is as useless as one that cannot fail a broken one.
    #
    # So the identity comparison runs FIRST and decides. If the database that
    # answered IS the declared external one, the topology is external - whatever
    # labels happen to be on the pod. The marker then reports on something real
    # but different: whether `uis deploy` will RECOGNISE this proxy on the way
    # back out. An unmarked proxy works and cannot be torn down automatically,
    # and those are two separate facts that deserve two separate messages.
    - name: "B5. Read the declared database directly, bypassing the Service entirely"
      ansible.builtin.command: >
        kubectl run pg-direct-{{ 9999 | random }} --image=postgres:18 --rm -i
        --restart=Never -n {{ _ns }} --context {{ _target }} --timeout=60s
        --env PGPASSWORD={{ _pgpw.stdout }} --env PGCONNECT_TIMEOUT=10 --
        /bin/sh -c 'timeout 30 psql -h {{ _exthost.stdout | trim }} -p {{ _extport }} -U postgres -tAc "select chr(85)||chr(73)||chr(83)||chr(124)||(select system_identifier from pg_control_system())"'
      register: _direct
      changed_when: false
      failed_when: false
      no_log: true
      when: _exthost.stdout | default('') | length > 0

    - name: "B5b. Extract its identifier and decide whether the topology is proven"
      ansible.builtin.set_fact:
        _direct_sysid: "{{ (_direct.stdout | default('') | regex_search('UIS[|][^\n]*') | default('', true)).split('|') | last | trim }}"
      when: _exthost.stdout | default('') | length > 0

    - name: "B5c. Is the answering database the declared one?"
      ansible.builtin.set_fact:
        _identity_proven: "{{ (_direct_sysid | default('') is match('^[0-9]+$')) and (_direct_sysid | default('') == _pg_sysid) }}"
        _backing_is_marked: "{{ (_backing_pods | length > 0) and (_backing_pods | difference(_proxy_pod_names) | length == 0) }}"
      when: _exthost.stdout | default('') | length > 0

    - name: "B4. A declared-external database must not be served from inside the cluster"
      ansible.builtin.assert:
        that:
          - _backing_pods | length > 0
          - _backing_is_marked or _identity_proven
        fail_msg: >-
          FALSE GREEN. PostgreSQL is declared external ({{ _exthost.stdout | trim }}), but
          service/postgresql is backed by {{ _backing_pods | join(', ') | default('nothing') }},
          which carries no external-proxy marker AND is not serving the declared database -
          through the Service the identifier is {{ _pg_sysid }}, and {{ _exthost.stdout | trim }}
          {{ (_direct_sysid | default('') is match('^[0-9]+$')) | ternary('reports ' ~ (_direct_sysid | default('')), 'could not be read at all') }}.
          The query is not reaching the external database. `kubectl apply` MERGES a Service
          selector rather than replacing it, so a proxy applied over a chart-owned Service
          never takes over. Compare: kubectl get svc postgresql -o jsonpath='{.spec.selector}'
        success_msg: "service/postgresql is serving the external database."
      when: _exthost.stdout | default('') | length > 0

    - name: "B4b. WORKING BUT UNMANAGED - an unmarked proxy is serving correctly"
      ansible.builtin.debug:
        msg:
          - "⚠️ The topology is correct: {{ _exthost.stdout | trim }} answered, identifier {{ _pg_sysid }}."
          - "   But {{ _backing_pods | join(', ') }} carries no uis.io/external-proxy marker, so it"
          - "   predates the marker (any proxy deployed before 2026-08-30) or was created by hand."
          - ""
          - "   This is NOT a fault in the topology and nothing is broken today. It matters on the"
          - "   way OUT: `uis deploy` finds the proxy to remove by that marker, so removing the"
          - "   declaration would deploy the in-cluster service while this proxy keeps running -"
          - "   and both could then match the Service."
          - ""
          - "   Adopt it by redeploying, or label it in place:"
          - "     kubectl label deployment postgresql -n {{ _ns }} uis.io/external-proxy=true"
          - "     kubectl patch deployment postgresql -n {{ _ns }} --type=merge \\"
          - "       -p '{\"spec\":{\"template\":{\"metadata\":{\"labels\":{\"uis.io/external-proxy\":\"true\"}}}}}'"
          - "   The second rolls the pod - brief connection reset for anything holding a session."
      when:
        - _exthost.stdout | default('') | length > 0
        - _identity_proven | default(false)
        - not (_backing_is_marked | default(false))

    - name: "B5d. The database that answered must BE the database that was declared"
      ansible.builtin.assert:
        that: _identity_proven
        fail_msg: >-
          {{ (_direct_sysid is match('^[0-9]+$'))
             | ternary('PostgreSQL is declared external at ' ~ (_exthost.stdout | trim) ~ ', and that host answers - but with a DIFFERENT database. Through the Service: system_identifier ' ~ _pg_sysid ~ '. Directly: ' ~ _direct_sysid ~ '. Consumers are not talking to the database this installation declared.',
                        'PostgreSQL is declared external at ' ~ (_exthost.stdout | trim) ~ ', but a direct connection to it could not be read, so the topology could NOT be proven. This is a failure, not a pass: an unproven assertion must never read as a successful one. Check the address, the port, the route and the credential.') }}
        success_msg: "Same system_identifier through the Service and directly: this IS the declared database."
      when: _exthost.stdout | default('') | length > 0

    # ⚠️ B6 DECIDES BY IDENTITY TOO. It used to decide by marker, and the tester
    # proved that wrong on the fixture built for B4.
    #
    # The old test was `backing pods must not intersect the MARKED pods`. An
    # unmarked proxy is not in that list, so the intersection was empty and B6
    # passed - while the cluster was served by an external database, the
    # StatefulSet sat at zero replicas, and the declaration had been removed.
    # It reported "the in-cluster database is serving, as declared." It was not.
    #
    # That is this defect class inverted once more and one layer down: B4 called
    # a working install broken; B6 called a broken install working. The second is
    # the worse direction, by the same argument about operators who are not
    # looking for trouble - so the principle this round established for B4 is
    # applied here rather than left one task short.
    #
    # No declaration exists in this branch, so there is no declared host to
    # compare against. The reference is the in-cluster workload itself.
    - name: "B6a. Is the in-cluster workload even running?"
      ansible.builtin.shell: >
        set -o pipefail;
        kubectl get statefulset postgresql -n {{ _ns }} --context {{ _target }}
        -o jsonpath='{.spec.replicas}'
      args: { executable: /bin/bash }
      register: _sts_replicas
      changed_when: false
      failed_when: false
      when: _exthost.stdout | default('') | length == 0

    - name: "B6b. A scaled-down workload cannot be what answered"
      ansible.builtin.assert:
        that: (_sts_replicas.stdout | default('') | trim) != '0'
        fail_msg: >-
          This installation declares no external PostgreSQL, but the in-cluster
          StatefulSet is scaled to 0 replicas - so it cannot be what answered, and
          something else is serving on {{ _pg_sysid }}. This is the state a revert
          leaves behind when the proxy it removed carried no external-proxy marker:
          the proxy is orphaned and still relaying, and the in-cluster database was
          never brought back. Check:
          kubectl get deployment,statefulset,endpoints postgresql -n {{ _ns }}
        success_msg: "The in-cluster workload is running."
      when:
        - _exthost.stdout | default('') | length == 0
        - (_sts_replicas.stdout | default('') | trim) | length > 0

    - name: "B6c. Read the in-cluster workload directly, bypassing the Service"
      ansible.builtin.shell: >
        set -o pipefail;
        kubectl get pods -n {{ _ns }} --context {{ _target }}
        -l app.kubernetes.io/name=postgresql
        -o jsonpath='{range .items[*]}{.metadata.ownerReferences[0].kind}{"="}{.status.podIP}{"\n"}{end}'
        | awk -F= '$1=="StatefulSet"{print $2; exit}'
      args: { executable: /bin/bash }
      register: _incluster_ip
      changed_when: false
      failed_when: false
      when: _exthost.stdout | default('') | length == 0

    - name: "B6d. Compare it with what the Service answered"
      ansible.builtin.command: >
        kubectl run pg-incluster-{{ 9999 | random }} --image=postgres:18 --rm -i
        --restart=Never -n {{ _ns }} --context {{ _target }} --timeout=60s
        --env PGPASSWORD={{ _pgpw.stdout }} --env PGCONNECT_TIMEOUT=10 --
        /bin/sh -c 'timeout 30 psql -h {{ _incluster_ip.stdout | trim }} -U postgres -tAc "select chr(85)||chr(73)||chr(83)||chr(124)||(select system_identifier from pg_control_system())"'
      register: _incluster_q
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - _exthost.stdout | default('') | length == 0
        - (_incluster_ip.stdout | default('') | trim) | length > 0

    - name: "B6. An in-cluster installation must be served by the in-cluster database"
      ansible.builtin.assert:
        that: >-
          (_incluster_q.stdout | default('') | regex_search('UIS[|][^\n]*') | default('', true)).split('|')
          | last | trim == _pg_sysid
        fail_msg: >-
          This installation declares no external PostgreSQL, but the database answering
          through service/postgresql is NOT the in-cluster one. Through the Service:
          system_identifier {{ _pg_sysid }}. The in-cluster workload at
          {{ _incluster_ip.stdout | default('?') | trim }} reports
          {{ (_incluster_q.stdout | default('') | regex_search('UIS[|][^\n]*') | default('', true)).split('|') | last | trim }}.
          Something outside the cluster is serving queries that should be served
          in-cluster - most likely a proxy Deployment left behind by a revert. Check:
          kubectl get deployment,endpoints postgresql -n {{ _ns }}
        success_msg: "The in-cluster database is serving, and it is the one answering."
      when:
        - _exthost.stdout | default('') | length == 0
        - (_incluster_ip.stdout | default('') | trim) | length > 0
        - (_incluster_q.stdout | default('') | length) > 0

    - name: "SUMMARY"
      ansible.builtin.debug:
        msg:
          - "A. Database answers a real query:  PASS"
          - "B. Topology: {{ (_exthost.stdout | default('') | length > 0) | ternary('EXTERNAL - proxied to ' ~ (_exthost.stdout | default('') | trim), 'in-cluster') }} - VERIFIED"
          - "   backed by {{ _backing_pods | join(', ') }}, system_identifier {{ _pg_sysid }}"
          - ""
          - "The same test passes in both topologies. That is the point: consumers"
          - "connect to postgresql.{{ _ns }} and cannot tell the difference."
