---
# file: ansible/playbooks/635-setup-forgejo.yml
# Description:
# Install Forgejo (self-hosted git host + its own built-in OCI registry) as an in-cluster
# `uis deploy forgejo` service — the Rancher Desktop (dev/test) counterpart to the
# Proxmox LXC guest in platforms/proxmox/ansible/roles/forgejo/. Translated from that
# proven, live-verified role — same pinned image, same app.ini settings (SQLite, no admin
# bootstrap), same "three secrets generated once, never regenerated" rule — not
# independently re-designed. See
# website/docs/ai-developer/plans/completed/PLAN-system-forgejo-rancher-desktop.md for the
# full translation record, sourced from urb-agents#1910/#1926's proven PoC reference
# (`terchris/home` @ 539c030).
#
# SCOPE: git host + registry only. No admin account (same deliberate "not baked in" rule
# as the Proxmox role — an explicit operator step, `forgejo admin user create` via
# `kubectl exec`). No git-ssh (HTTP clone + the registry are this phase's job; see the
# PLAN doc's "What this plan does NOT do" for why SSH ingress is out of scope here, not
# silently dropped). The Actions runner is `uis deploy forgejo-runner`, a separate service
# (640-setup-forgejo-runner.yml) — SCRIPT_REQUIRES="forgejo" on that service, not built
# into this playbook.
#
# 🔴 SECRET_KEY/INTERNAL_TOKEN/JWT_SECRET do NOT go through the
# 00-master-secrets.yml.template/envsubst pipeline, deliberately. That pipeline's own
# apply step (ensure_secrets_applied / `uis secrets apply`) re-renders and re-applies its
# WHOLE file on every deploy — fine for operator-set values sourced from
# 00-common-values.env.template, wrong for a value that must stay stable forever once
# generated (an unset env var would envsubst to an empty string and wipe these back out
# on the very next `uis deploy` of anything). This playbook owns forgejo-app-secrets
# directly: read what exists, generate only what's missing, apply the union — the same
# "never defaulted, never overwritten" rule the Proxmox role's own tasks/main.yml assert
# enforces, implemented with Kubernetes idioms instead of a shell guard.
#
# Usage:
# ansible-playbook playbooks/635-setup-forgejo.yml -e target_host="rancher-desktop"
#
# Optional, for a lab that wants Forgejo Actions to resolve `uses:` actions against ONLY
# this instance's own mirrors (fully offline-capable, real ongoing maintenance cost — see
# forgejo_actions_default_url's own comment below, urb-agents#2025):
# ansible-playbook playbooks/635-setup-forgejo.yml -e target_host="rancher-desktop" \
#   -e forgejo_actions_default_url="self"

- name: Install Forgejo (git host + built-in OCI registry)
  hosts: localhost
  gather_facts: false
  vars:
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    manifests_dir: "/mnt/urbalurbadisk/manifests"
    forgejo_namespace: "forgejo"
    forgejo_http_port: 3000
    forgejo_domain: "forgejo.localhost"
    # 🔵 SAME DIGEST AS platforms/proxmox/ansible/roles/forgejo/defaults/main.yml — one
    # image, independently verified once (2026-10-20, against codeberg.org's own v2 API),
    # running identically on both UIS deployment targets. Re-verify the same way before
    # bumping either copy.
    forgejo_image: "codeberg.org/forgejo/forgejo@sha256:a3e33d03e771d3e58b27de5573c3a25dc4f670583a6724c1878a6d0bbecf3556"

    # 🔵 DECIDED, urb-agents#2025: default to Forgejo's OWN built-in curated action mirror
    # (data.forgejo.org) — i.e. leave this empty, do NOT set `[actions] DEFAULT_ACTIONS_URL`
    # at all. That default already covers the common actions (checkout, setup-node, etc.)
    # with zero maintenance, which is the right default for the common UIS case: someone
    # deploying `forgejo` + `forgejo-runner` to try self-hosted CI, not specifically
    # chasing air-gapped operation.
    #
    # Setting this to "self" (point resolution at THIS instance's own mirrored actions
    # instead) is a real, available option for a lab that wants full offline-capable CI —
    # proven to work (urb-agents#2022, against a real LAN address) — but it has a real,
    # ongoing maintenance cost found out the hard way: `self` REPLACES the built-in
    # curated set entirely rather than layering on top of it, so EVERY action any
    # workflow references needs its own local mirror repo, forever, including ones that
    # already worked fine against the built-in default. Not the right default for
    # everyone, so it's exposed here as an opt-in instead of forced — same shape as
    # `forgejo_external_url` in 640-setup-forgejo-runner.yml (an opt-in override, empty
    # by default).
    #
    # 🔴 KNOWN BROKEN ON A `.localhost` DOMAIN (Rancher Desktop), urb-agents#2028 — refused
    # below, not silently attempted. Confirmed live by imac: the forgejo-runner Pod's
    # `hostAliases` entry for `forgejo.localhost` patches only the POD's own /etc/hosts;
    # the git-clone-for-actions step runs inside a container spawned through the dind
    # sidecar's own INNER Docker engine, a separate network namespace with a fresh
    # /etc/hosts and no hostAlias entries at all, so `forgejo.localhost` falls through to
    # the RFC 6761 loopback default there and every clone fails to connect — not specific
    # to unmirrored actions, ALL of them, mirrored or not. A real fix is a genuine design
    # call (extend hostAliases into dind's inner network somehow, or give actions
    # resolution its own internal-facing URL distinct from the human-facing ROOT_URL) —
    # not attempted here blind, since it needs live iteration against that nested-network
    # namespace this environment cannot do. Does not reproduce on Proxmox, which uses a
    # real routable LAN address, not a `.localhost` hostname needing this hostAlias trick
    # at all.
    forgejo_actions_default_url: ""

  tasks:
    - name: 1. Check if required variables are provided
      ansible.builtin.fail:
        msg: "The variable 'target_host' is mandatory. Use -e target_host=your_host_name to specify it."
      when: target_host is not defined

    - name: 1b. Refuse the actions-self-mirror opt-in on a .localhost domain (urb-agents#2028)
      ansible.builtin.fail:
        msg: >-
          forgejo_actions_default_url=self does not work against forgejo_domain
          '{{ forgejo_domain }}' — confirmed live (urb-agents#2028): the forgejo-runner
          Pod's hostAliases entry for a .localhost hostname only patches the Pod's own
          /etc/hosts, not the fresh /etc/hosts of a container spawned through the dind
          sidecar's own inner Docker engine, where the actual git-clone-for-actions step
          runs — so every clone fails to connect, mirrored action or not. Not yet fixed;
          a real fix is a design call, not a quick one (see this task's own comment in
          the playbook). Leave forgejo_actions_default_url unset (Forgejo's own built-in
          curated mirror) on a .localhost domain, or set a real, routable LAN address for
          forgejo_domain instead (the Proxmox target does this already and does not hit
          this failure).
      when:
        - forgejo_actions_default_url | default('') | length > 0
        - forgejo_domain is search('\.localhost$')

    - name: 2. Print playbook description
      ansible.builtin.debug:
        msg: "Installing Forgejo on Kubernetes context: {{ target_host }}, domain: {{ forgejo_domain }}"

    - name: 3. Create forgejo namespace if it doesn't exist
      ansible.builtin.shell: kubectl create namespace {{ forgejo_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: namespace_result
      changed_when: namespace_result.rc == 0
      failed_when: namespace_result.rc != 0

    - name: 4. Check for an existing forgejo-app-secrets Secret
      kubernetes.core.k8s_info:
        kind: Secret
        name: forgejo-app-secrets
        namespace: "{{ forgejo_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: forgejo_secret_check

    - name: 5. Preserve any values already set — these must never regenerate once present
      ansible.builtin.set_fact:
        _forgejo_secret_key: "{{ (forgejo_secret_check.resources[0].data.SECRET_KEY | b64decode) if (forgejo_secret_check.resources | length > 0 and 'SECRET_KEY' in forgejo_secret_check.resources[0].data) else '' }}"
        _forgejo_internal_token: "{{ (forgejo_secret_check.resources[0].data.INTERNAL_TOKEN | b64decode) if (forgejo_secret_check.resources | length > 0 and 'INTERNAL_TOKEN' in forgejo_secret_check.resources[0].data) else '' }}"
        _forgejo_jwt_secret: "{{ (forgejo_secret_check.resources[0].data.JWT_SECRET | b64decode) if (forgejo_secret_check.resources | length > 0 and 'JWT_SECRET' in forgejo_secret_check.resources[0].data) else '' }}"
      no_log: true

    # 🔴 THE REAL GENERATOR, NOT A HAND-ROLLED EQUIVALENT — same tool the Proxmox role's
    # own tasks/main.yml requires an operator run by hand (`forgejo generate secret X`).
    # JWT_SECRET specifically has a documented format requirement (a unique base64-encoded
    # 32-byte value, per Forgejo's own config cheat sheet) that a plain `openssl rand -hex`
    # would not satisfy — using the image's own generator avoids guessing any of the
    # three secrets' exact expected shape.
    #
    # 🔴 FOUND LIVE BY imac (urb-agents#1928), 100% REPRODUCIBLE: an EARLIER version of
    # this playbook used `kubectl run --rm -i ... -- forgejo generate secret X` and
    # captured its stdout directly. `--rm -i` appends its OWN pod-deletion notice onto
    # the SAME stdout stream with no delimiter — e.g.
    # `<realvalue>pod "forgejo-secretgen" deleted from default namespace` — and an
    # empty-string check does not catch a non-empty but CORRUPTED capture. It also hit
    # an intermittent attach-race that double-printed the value. Since these three
    # secrets are "generated once, never regenerated," that corruption would have been
    # permanent on every fresh install from the very first deploy forward.
    #
    # Fixed by never combining run + attach + cleanup in one captured command: launch
    # (no --rm, no -i), wait for the pod to actually finish, read ITS OWN LOGS
    # separately (not the launch command's stdout), then delete it as an independent,
    # best-effort step. `kubectl logs` on a Succeeded pod is a clean, reliable read —
    # no attach, no race, no trailing notice to strip.
    - name: 6. Launch a pod to generate SECRET_KEY, if not already set
      ansible.builtin.command:
        cmd: >-
          kubectl run forgejo-secretgen -n {{ forgejo_namespace }}
          --image={{ forgejo_image }} --restart=Never --command --
          forgejo generate secret SECRET_KEY
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: _forgejo_secret_key | length == 0
      changed_when: true

    - name: 6b. Wait for the generator pod to finish
      kubernetes.core.k8s_info:
        kind: Pod
        name: forgejo-secretgen
        namespace: "{{ forgejo_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: _forgejo_secretgen_pod
      retries: 20
      delay: 2
      until: >
        _forgejo_secretgen_pod.resources | length > 0 and
        _forgejo_secretgen_pod.resources[0].status.phase in ['Succeeded', 'Failed']
      when: _forgejo_secret_key | length == 0

    - name: 6c. Read the generated value from the pod's own logs
      ansible.builtin.command:
        cmd: "kubectl logs forgejo-secretgen -n {{ forgejo_namespace }}"
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: _forgejo_gen_secret_key
      when: _forgejo_secret_key | length == 0
      changed_when: false
      no_log: true

    - name: 6d. Delete the generator pod (independent, best-effort — never inline with the run or the log read)
      ansible.builtin.command:
        cmd: "kubectl delete pod forgejo-secretgen -n {{ forgejo_namespace }} --wait=false --ignore-not-found"
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: _forgejo_secret_key | length == 0
      changed_when: true
      failed_when: false

    - name: 6e. Refuse to proceed on an empty or corrupted capture
      ansible.builtin.assert:
        that:
          - (_forgejo_gen_secret_key.stdout | default('') | trim | length) > 0
          - not (_forgejo_gen_secret_key.stdout | default('') is search('pod ".*" deleted'))
        fail_msg: "SECRET_KEY generation produced no output, or a corrupted capture — re-run; do not proceed with a broken secret."
        quiet: true
      when: _forgejo_secret_key | length == 0

    - name: 6f. Use the freshly generated SECRET_KEY
      ansible.builtin.set_fact:
        _forgejo_secret_key: "{{ _forgejo_gen_secret_key.stdout | trim }}"
      when: _forgejo_secret_key | length == 0
      no_log: true

    - name: 7. Launch a pod to generate INTERNAL_TOKEN, if not already set
      ansible.builtin.command:
        cmd: >-
          kubectl run forgejo-secretgen -n {{ forgejo_namespace }}
          --image={{ forgejo_image }} --restart=Never --command --
          forgejo generate secret INTERNAL_TOKEN
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: _forgejo_internal_token | length == 0
      changed_when: true

    - name: 7b. Wait for the generator pod to finish
      kubernetes.core.k8s_info:
        kind: Pod
        name: forgejo-secretgen
        namespace: "{{ forgejo_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: _forgejo_secretgen_pod
      retries: 20
      delay: 2
      until: >
        _forgejo_secretgen_pod.resources | length > 0 and
        _forgejo_secretgen_pod.resources[0].status.phase in ['Succeeded', 'Failed']
      when: _forgejo_internal_token | length == 0

    - name: 7c. Read the generated value from the pod's own logs
      ansible.builtin.command:
        cmd: "kubectl logs forgejo-secretgen -n {{ forgejo_namespace }}"
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: _forgejo_gen_internal_token
      when: _forgejo_internal_token | length == 0
      changed_when: false
      no_log: true

    - name: 7d. Delete the generator pod (independent, best-effort)
      ansible.builtin.command:
        cmd: "kubectl delete pod forgejo-secretgen -n {{ forgejo_namespace }} --wait=false --ignore-not-found"
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: _forgejo_internal_token | length == 0
      changed_when: true
      failed_when: false

    - name: 7e. Refuse to proceed on an empty or corrupted capture
      ansible.builtin.assert:
        that:
          - (_forgejo_gen_internal_token.stdout | default('') | trim | length) > 0
          - not (_forgejo_gen_internal_token.stdout | default('') is search('pod ".*" deleted'))
        fail_msg: "INTERNAL_TOKEN generation produced no output, or a corrupted capture — re-run; do not proceed with a broken secret."
        quiet: true
      when: _forgejo_internal_token | length == 0

    - name: 7f. Use the freshly generated INTERNAL_TOKEN
      ansible.builtin.set_fact:
        _forgejo_internal_token: "{{ _forgejo_gen_internal_token.stdout | trim }}"
      when: _forgejo_internal_token | length == 0
      no_log: true

    - name: 8. Launch a pod to generate JWT_SECRET, if not already set
      ansible.builtin.command:
        cmd: >-
          kubectl run forgejo-secretgen -n {{ forgejo_namespace }}
          --image={{ forgejo_image }} --restart=Never --command --
          forgejo generate secret JWT_SECRET
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: _forgejo_jwt_secret | length == 0
      changed_when: true

    - name: 8b. Wait for the generator pod to finish
      kubernetes.core.k8s_info:
        kind: Pod
        name: forgejo-secretgen
        namespace: "{{ forgejo_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: _forgejo_secretgen_pod
      retries: 20
      delay: 2
      until: >
        _forgejo_secretgen_pod.resources | length > 0 and
        _forgejo_secretgen_pod.resources[0].status.phase in ['Succeeded', 'Failed']
      when: _forgejo_jwt_secret | length == 0

    - name: 8c. Read the generated value from the pod's own logs
      ansible.builtin.command:
        cmd: "kubectl logs forgejo-secretgen -n {{ forgejo_namespace }}"
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: _forgejo_gen_jwt_secret
      when: _forgejo_jwt_secret | length == 0
      changed_when: false
      no_log: true

    - name: 8d. Delete the generator pod (independent, best-effort)
      ansible.builtin.command:
        cmd: "kubectl delete pod forgejo-secretgen -n {{ forgejo_namespace }} --wait=false --ignore-not-found"
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: _forgejo_jwt_secret | length == 0
      changed_when: true
      failed_when: false

    - name: 8e. Refuse to proceed on an empty or corrupted capture
      ansible.builtin.assert:
        that:
          - (_forgejo_gen_jwt_secret.stdout | default('') | trim | length) > 0
          - not (_forgejo_gen_jwt_secret.stdout | default('') is search('pod ".*" deleted'))
        fail_msg: "JWT_SECRET generation produced no output, or a corrupted capture — re-run; do not proceed with a broken secret."
        quiet: true
      when: _forgejo_jwt_secret | length == 0

    - name: 8f. Use the freshly generated JWT_SECRET
      ansible.builtin.set_fact:
        _forgejo_jwt_secret: "{{ _forgejo_gen_jwt_secret.stdout | trim }}"
      when: _forgejo_jwt_secret | length == 0
      no_log: true

    - name: 9. Apply forgejo-app-secrets (the union of preserved + freshly generated)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ merged_kubeconf_file }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: forgejo-app-secrets
            namespace: "{{ forgejo_namespace }}"
          type: Opaque
          stringData:
            SECRET_KEY: "{{ _forgejo_secret_key }}"
            INTERNAL_TOKEN: "{{ _forgejo_internal_token }}"
            JWT_SECRET: "{{ _forgejo_jwt_secret }}"
      no_log: true

    - name: 10. Render the PVC / ConfigMap / Service / Deployment manifest
      ansible.builtin.template:
        src: "{{ manifests_dir }}/635-forgejo.yaml.j2"
        dest: /tmp/635-forgejo.yaml
        mode: "0600"

    - name: 11. Apply the PVC / ConfigMap / Service / Deployment
      kubernetes.core.k8s:
        state: present
        src: /tmp/635-forgejo.yaml
        kubeconfig: "{{ merged_kubeconf_file }}"

    - name: 11b. Clean up the rendered manifest
      ansible.builtin.file:
        path: /tmp/635-forgejo.yaml
        state: absent
      changed_when: false

    - name: 12. Wait for the Forgejo pod to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ forgejo_namespace }}"
        label_selectors:
          - "app=forgejo"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: forgejo_pods
      retries: 30
      delay: 10
      until: >
        forgejo_pods.resources | length > 0 and
        forgejo_pods.resources[0].status.phase == "Running" and
        (forgejo_pods.resources[0].status.containerStatuses | default([]) | length > 0) and
        forgejo_pods.resources[0].status.containerStatuses[0].ready == true

    - name: 13. Render and apply the IngressRoute
      ansible.builtin.template:
        src: "{{ manifests_dir }}/635-forgejo-ingressroute.yaml.j2"
        dest: /tmp/635-forgejo-ingressroute.yaml
        mode: "0600"

    - name: 13b. Apply the IngressRoute
      kubernetes.core.k8s:
        state: present
        src: /tmp/635-forgejo-ingressroute.yaml
        kubeconfig: "{{ merged_kubeconf_file }}"

    - name: 13c. Clean up the rendered manifest
      ansible.builtin.file:
        path: /tmp/635-forgejo-ingressroute.yaml
        state: absent
      changed_when: false

    # 🔵 /api/healthz, SAME ENDPOINT the Proxmox role's own tasks/main.yml verifies against
    # — not independently chosen.
    - name: 14. Verify Forgejo answers through the ingress
      ansible.builtin.uri:
        url: "http://{{ forgejo_domain }}/api/healthz"
        status_code: [200]
      register: forgejo_health_check
      retries: 15
      delay: 10
      until: forgejo_health_check.status is defined and forgejo_health_check.status == 200
      ignore_errors: true

    - name: 15. Display final deployment status
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "🚀 Forgejo Deployment Status"
          - "==============================================="
          - ""
          - "{{ '✅ SUCCESS - Forgejo answered /api/healthz' if (forgejo_health_check.status is defined and forgejo_health_check.status == 200) else '⚠️ Pod is Ready, but the ingress health check did not confirm — check Traefik routing by hand' }}"
          - ""
          - "🌐 Access: http://{{ forgejo_domain }}/"
          - ""
          - "🔐 No admin account yet — same deliberate 'not baked in' rule as the Proxmox"
          - "  guest. Create the first one by hand:"
          - "  kubectl exec -n {{ forgejo_namespace }} deploy/forgejo -- su-exec git forgejo admin user create --admin --username <name> --password <pw> --email <email>"
          - "  (su-exec git confirmed required live by imac, urb-agents#1928 — 'kubectl exec' alone runs as this container's own default user, not git)"
          - ""
          - "📦 Registry: Forgejo's own built-in OCI registry ([packages] ENABLED = true)."
          - "  'uis deploy forgejo-runner' pushes built images here."
          - ""
          - "🔧 Troubleshooting:"
          - "• Check pods: kubectl get pods -n {{ forgejo_namespace }}"
          - "• View logs: kubectl logs -n {{ forgejo_namespace }} -l app=forgejo"
          - "==============================================="
