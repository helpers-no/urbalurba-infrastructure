---
# file: ansible/playbooks/047-test-garage.yml
# Description:
# End-to-end tests for the Garage object storage deployment.
# Validates reachability, rejection of unsigned requests, bucket round-trip,
# that the application key cannot create new buckets, and Traefik routing. No
# console test - Garage ships none (see 045-test-minio.yml's test C, which
# this intentionally has no equivalent of).
#
# Tests (all CRITICAL):
#   A. Reachability - S3 API :3900 answers something, not connection-refused
#   B. Auth          - an unsigned request must get exactly 403
#   C. Round-trip    - awscli writes to and reads from the bootstrap bucket
#                      (it already exists; the deploy playbook's own key is
#                      denied create-bucket permission after setup - see
#                      garage.md's escalation writeup - so this test does not
#                      attempt to create one)
#   D. No escalation - the regression test for that denial: the SAME key must
#                      be refused when it tries to create a new bucket over
#                      the S3 API (urb-agents#1802)
#   E. Routing       - s3.<domain> and garage.<domain> must resolve through Traefik
#
# imac measured test B's real status (urb-agents#1802): curl got 403, body
# {"Code":"AccessDenied","Message":"Forbidden: Garage does not support
# anonymous access yet"}. Asserted explicitly now, matching MinIO's
# documented behaviour (045-test-minio.yml test B). Before that measurement
# this playbook deliberately left it soft rather than guess a code - the same
# discipline this whole investigation started from
# (INVESTIGATE-service-minio-to-garage.md).
#
# Usage:
# ansible-playbook ansible/playbooks/047-test-garage.yml

- name: End-to-End Garage Tests
  hosts: localhost
  gather_facts: false
  vars:
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    garage_namespace: "default"
    garage_service: "garage.default.svc.cluster.local"
    test_bucket: "default-bucket"

  tasks:
    - name: "0. Display test suite initiation"
      ansible.builtin.debug:
        msg: |
          End-to-End Garage Tests
          ===============================================
          Running 4 test groups (all CRITICAL)

    - name: "0.1. Get Traefik ClusterIP for in-cluster hostname routing"
      ansible.builtin.command: kubectl get svc traefik -n kube-system -o jsonpath={.spec.clusterIP}
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: traefik_ip_result
      changed_when: false

    - name: "0.2. Store Traefik IP"
      ansible.builtin.set_fact:
        traefik_ip: "{{ traefik_ip_result.stdout }}"

    - name: "0.3. Get Garage access key from urbalurba-secrets"
      ansible.builtin.shell: |
        kubectl get secret urbalurba-secrets -n {{ garage_namespace }} \
        -o jsonpath='{.data.GARAGE_ACCESS_KEY}' | base64 -d
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: access_key_result
      changed_when: false

    - name: "0.4. Get Garage secret key from urbalurba-secrets"
      ansible.builtin.shell: |
        kubectl get secret urbalurba-secrets -n {{ garage_namespace }} \
        -o jsonpath='{.data.GARAGE_SECRET_KEY}' | base64 -d
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: secret_key_result
      changed_when: false
      no_log: true

    - name: "0.5. Store credentials"
      ansible.builtin.set_fact:
        garage_access_key: "{{ access_key_result.stdout }}"
        garage_secret_key: "{{ secret_key_result.stdout }}"
      no_log: true

    # ===== Test A: Reachability (CRITICAL) =====
    - name: "A1. Request the S3 API (unsigned - just checking it answers at all)"
      ansible.builtin.shell: |
        kubectl run garage-test-reach-{{ 99999 | random }} --image=curlimages/curl --rm -i --restart=Never -n {{ garage_namespace }} -- \
          curl -s -o /dev/null -w "HTTP_CODE:%{http_code}" http://{{ garage_service }}:3900/
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: reach_test
      retries: 5
      delay: 10
      until: "'HTTP_CODE:000' not in reach_test.stdout"
      failed_when: false
      changed_when: false

    - name: "A2. Verify the S3 API answers (not connection-refused)"
      ansible.builtin.assert:
        that:
          - "'HTTP_CODE:000' not in reach_test.stdout"
          - "reach_test.stdout | length > 0"
        fail_msg: |
          CRITICAL: Garage's S3 API did not answer at all!
          Got: {{ reach_test.stdout[:500] | default('No output') }}

          Troubleshooting:
          - Check pod status: kubectl get pods -n {{ garage_namespace }} -l app=garage
          - Check pod logs:   kubectl logs -n {{ garage_namespace }} -l app=garage --tail=50
          - Check the layout:  kubectl exec -n {{ garage_namespace }} <pod> -- /garage status
        # ⚠️ imac found this prints garbled: "...reachable (HTTP_CODE:403pod
        # "garage-test-reach-..." deleted from default namespace)". `kubectl
        # run --rm`'s own pod-deletion confirmation lands in the SAME captured
        # stdout as curl's -w output, with no separating newline - not a
        # display bug, the captured value itself contains both. Extract just
        # the code rather than printing the capture verbatim.
        success_msg: "Test A PASSED: Garage S3 API is reachable ({{ reach_test.stdout | regex_search('HTTP_CODE:[0-9]+') | default(reach_test.stdout) }})"

    - name: "A3. Display reachability test success"
      ansible.builtin.debug:
        msg: "Test A: Reachability - PASSED (CRITICAL)"

    # ===== Test B: Unauthenticated access does not succeed (CRITICAL) =====
    - name: "B1. Request the bootstrap bucket without credentials"
      ansible.builtin.shell: |
        kubectl run garage-test-auth-{{ 99999 | random }} --image=curlimages/curl --rm -i --restart=Never -n {{ garage_namespace }} -- \
          curl -s -o /dev/null -w "HTTP_CODE:%{http_code}" http://{{ garage_service }}:3900/{{ test_bucket }}
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: auth_test
      retries: 3
      delay: 5
      until: auth_test.rc == 0
      failed_when: false
      changed_when: false

    # 🔴 Confirmed by imac, urb-agents#1802: Garage returns a specific, stable
    # 403 to an unsigned request - `curl` showed 403, body
    # {"Code":"AccessDenied","Message":"Forbidden: Garage does not support
    # anonymous access yet"}, and the test harness's own capture agreed. Now
    # asserted explicitly rather than left soft, matching MinIO's documented
    # behaviour (045-test-minio.yml test B) - no surprise for anything that
    # assumed that convention.
    - name: "B2. Verify unsigned requests get exactly 403"
      ansible.builtin.assert:
        that:
          - "'HTTP_CODE:403' in auth_test.stdout"
        fail_msg: |
          CRITICAL: Garage did not return 403 to an UNSIGNED request on {{ test_bucket }}!
          Got: {{ auth_test.stdout | regex_search('HTTP_CODE:[0-9]+') | default(auth_test.stdout[:500]) }}

          A 200 means an anonymous client can read the bucket's contents.
          Anything other than 403 is a change in Garage's own behaviour from
          what was measured on 2026-10-01 and should be understood, not waved
          through.
        success_msg: "Test B PASSED: unauthenticated request rejected with 403"

    - name: "B3. Display auth test success"
      ansible.builtin.debug:
        msg: "Test B: Unauthenticated access does not succeed - PASSED (CRITICAL)"

    # ===== Test C: Bucket round-trip with awscli (CRITICAL) =====
    #
    # Unlike MinIO's test D (045-test-minio.yml), this does NOT create and
    # delete a bucket. 🔴 Not because the key structurally cannot - imac
    # proved the opposite (urb-agents#1802): --default-bucket's key can create
    # arbitrary new buckets until the setup playbook's task 15b explicitly
    # denies that permission. So this test round-trips an object inside the
    # bucket that already exists, deliberately NOT exercising create-bucket -
    # doing so here would be testing against a credential this deployment
    # intends to have already locked down, which is backwards.
    - name: "C1. Write an object, read it back, clean up"
      ansible.builtin.shell: |
        kubectl run garage-test-s3-{{ 99999 | random }} --image=amazon/aws-cli --rm -i --restart=Never -n {{ garage_namespace }} \
          --env=AWS_ACCESS_KEY_ID={{ garage_access_key | quote }} \
          --env=AWS_SECRET_ACCESS_KEY={{ garage_secret_key | quote }} \
          --env=AWS_DEFAULT_REGION=garage \
          --command -- sh -c '
            set -e
            echo "urbalurba-garage-roundtrip" > /tmp/probe.txt
            aws --endpoint-url http://{{ garage_service }}:3900 s3 cp /tmp/probe.txt s3://{{ test_bucket }}/probe.txt
            aws --endpoint-url http://{{ garage_service }}:3900 s3 cp s3://{{ test_bucket }}/probe.txt /tmp/probe-back.txt
            cat /tmp/probe-back.txt
            aws --endpoint-url http://{{ garage_service }}:3900 s3 rm s3://{{ test_bucket }}/probe.txt
          '
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: roundtrip_test
      retries: 3
      delay: 10
      until: "'urbalurba-garage-roundtrip' in roundtrip_test.stdout"
      failed_when: false
      changed_when: false
      no_log: true

    - name: "C2. Verify the object round-tripped"
      ansible.builtin.assert:
        that:
          - "'urbalurba-garage-roundtrip' in roundtrip_test.stdout"
        fail_msg: |
          CRITICAL: Garage bucket round-trip failed!
          Expected to write an object to {{ test_bucket }} and read it back.
          Output (truncated, credentials excluded by no_log above): see the
          task's own register if re-run with -vvv.

          Troubleshooting:
          - Credentials come from urbalurba-secrets (GARAGE_ACCESS_KEY / GARAGE_SECRET_KEY)
          - Check storage:  kubectl get pvc -n {{ garage_namespace }} -l app=garage
          - Check logs:     kubectl logs -n {{ garage_namespace }} -l app=garage --tail=50
          - Check the bucket exists: kubectl exec -n {{ garage_namespace }} <pod> -- /garage bucket list
        success_msg: "Test C PASSED: bucket write/read/delete round-trip OK"

    - name: "C3. Display round-trip test success"
      ansible.builtin.debug:
        msg: "Test C: S3 bucket round-trip - PASSED (CRITICAL)"

    # ===== Test D: the application key must NOT be able to create a bucket (CRITICAL) =====
    #
    # The regression test for imac's finding (urb-agents#1802): attempt
    # EXACTLY what imac proved worked before the fix - a single
    # `aws s3api create-bucket` call with the application-facing credential -
    # and assert it is refused. The setup playbook's own task 15b/15d/15e
    # check this once, at deploy time; this re-checks it on every
    # `./uis verify garage`, so a regression (a Garage upgrade that changes
    # how `key deny` behaves, a redeploy that skips the narrowing step, a
    # future edit to this file that drops it) is caught running, not only
    # once at install.
    - name: "D1. Attempt to create a bucket with the application key"
      ansible.builtin.shell: |
        kubectl run garage-test-escalate-{{ 99999 | random }} --image=amazon/aws-cli --rm -i --restart=Never -n {{ garage_namespace }} \
          --env=AWS_ACCESS_KEY_ID={{ garage_access_key | quote }} \
          --env=AWS_SECRET_ACCESS_KEY={{ garage_secret_key | quote }} \
          --env=AWS_DEFAULT_REGION=garage \
          --command -- aws --endpoint-url http://{{ garage_service }}:3900 \
          s3api create-bucket --bucket uis-verify-escalation-test
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: escalation_test
      retries: 1
      delay: 1
      failed_when: false
      changed_when: false
      no_log: true

    - name: "D2. Verify bucket creation was refused"
      ansible.builtin.assert:
        that:
          - escalation_test.rc != 0
        fail_msg: >-
          CRITICAL SECURITY REGRESSION: the application-facing Garage key was
          able to create a new bucket (uis-verify-escalation-test). This is
          exactly what urb-agents#1802 found and 1.6.181 fixed by denying
          create-bucket permission after bootstrap - that denial is no longer
          holding. Do not use this deployment for anything until this is
          understood; the key can mint buckets it then fully owns.
        success_msg: "Test D PASSED: the application key cannot create a bucket (create-bucket permission correctly denied)"

    - name: "D3. Clean up if the escalation somehow succeeded"
      # Defensive only - D2 already failed the play above if this matters.
      # If a human re-runs with --skip-tags or similar, this still cleans up
      # rather than leaving a stray bucket from a security test.
      ansible.builtin.shell: |
        kubectl run garage-test-cleanup-{{ 99999 | random }} --image=amazon/aws-cli --rm -i --restart=Never -n {{ garage_namespace }} \
          --env=AWS_ACCESS_KEY_ID={{ garage_access_key | quote }} \
          --env=AWS_SECRET_ACCESS_KEY={{ garage_secret_key | quote }} \
          --env=AWS_DEFAULT_REGION=garage \
          --command -- aws --endpoint-url http://{{ garage_service }}:3900 \
          s3 rb s3://uis-verify-escalation-test --force
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: escalation_test.rc == 0
      failed_when: false
      changed_when: false
      no_log: true

    - name: "D4. Display escalation test success"
      ansible.builtin.debug:
        msg: "Test D: Application key cannot create a bucket - PASSED (CRITICAL)"

    # ===== Test E: routing =====
    #
    # Same topology-awareness as 045-test-minio.yml test E - see that file's
    # comment for why this does not assert *.localhost unconditionally.
    - name: "E0. Which exposure does this installation use?"
      ansible.builtin.shell: |
        kubectl get ingressroute -n {{ garage_namespace }} -l app=garage -o name 2>/dev/null | wc -l
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: _traefik_routes
      changed_when: false
      failed_when: false

    - name: "E1. Reach the S3 API through Traefik (Host: garage.localhost)"
      ansible.builtin.shell: |
        kubectl run garage-test-route-{{ 99999 | random }} --image=curlimages/curl --rm -i --restart=Never -n {{ garage_namespace }} -- \
          /bin/sh -c 'sleep 2; curl -s -o /dev/null -w "HTTP_CODE:%{http_code}" -H "Host: garage.localhost" http://{{ traefik_ip }}/'
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: route_test
      retries: 5
      delay: 10
      until: "'HTTP_CODE:000' not in route_test.stdout"
      failed_when: false
      changed_when: false
      when: (_traefik_routes.stdout | default('0') | int) > 0

    - name: "E1b. Otherwise, report the exposure this installation does have"
      ansible.builtin.shell: |
        kubectl get ingress -n {{ garage_namespace }} -o jsonpath='{range .items[*]}{.metadata.name}={.status.loadBalancer.ingress[0].hostname} {end}' 2>/dev/null
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: _ts_ingress
      changed_when: false
      failed_when: false
      when: (_traefik_routes.stdout | default('0') | int) == 0

    - name: "E2. Verify routing"
      ansible.builtin.assert:
        that:
          - "'HTTP_CODE:000' not in route_test.stdout"
        fail_msg: |
          CRITICAL: Garage Traefik routing failed!
          garage.localhost -> {{ route_test.stdout | default('No output') }}

          Troubleshooting:
          - Check routes: kubectl get ingressroute -n {{ garage_namespace }} -l app=garage
          - Re-apply:     kubectl apply -f /mnt/urbalurbadisk/manifests/048-garage-ingressroute.yaml
        success_msg: "Test D PASSED: Garage IngressRoute resolves through Traefik"
      when: (_traefik_routes.stdout | default('0') | int) > 0

    - name: "E3. Display routing result"
      ansible.builtin.debug:
        msg: >-
          {{ ((_traefik_routes.stdout | default('0') | int) > 0)
             | ternary('Test E: Traefik routing - PASSED (CRITICAL)',
                       'Test E: no Traefik routes here - this installation exposes Garage another way: ' ~ (_ts_ingress.stdout | default('none found'))) }}

    # ===== Summary =====
    - name: "SUMMARY - Display all test results"
      ansible.builtin.debug:
        msg: |
          ===============================================
          Garage E2E Test Results
          ===============================================
          A. Reachability (:3900):                   PASS
          B. Unsigned request rejected with 403:      PASS
          C. Bucket write/read/delete round-trip:     PASS
          D. Application key cannot create a bucket:  PASS (the urb-agents#1802 regression test)
          E. Routing: {{ ((_traefik_routes.stdout | default('0') | int) > 0)
                  | ternary('Traefik (garage.* / s3.*)  PASS',
                            'not via Traefik here - ' ~ (_ts_ingress.stdout | default('no ingress found'))) }}

          No console test - Garage ships none.

          ALL TESTS PASSED - Garage is healthy
          ===============================================
