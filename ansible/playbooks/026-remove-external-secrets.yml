---
# file: ansible/playbooks/026-remove-external-secrets.yml
# Description: Remove External Secrets Operator from Kubernetes
# Usage:
# ansible-playbook playbooks/026-remove-external-secrets.yml -e target_host="rancher-desktop"

- name: Remove External Secrets Operator from Kubernetes
  hosts: localhost
  gather_facts: false
  vars:
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    eso_namespace: "external-secrets"
    eso_helm_release: "external-secrets"
    deletion_timeout: 180

  tasks:
    - name: 1. Check for any ClusterSecretStore that still depends on ESO's CRDs
      kubernetes.core.k8s_info:
        api_version: external-secrets.io/v1
        kind: ClusterSecretStore
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: all_stores
      ignore_errors: true

    # ⚠️ Same shape as cert-manager's own remove-playbook precedent (025-remove-cert-manager.yml):
    # refuse rather than silently break every service that owns a store backed by this operator.
    - name: 2. Refuse if a ClusterSecretStore still exists
      ansible.builtin.fail:
        msg: >-
          Refusing to remove External Secrets Operator: ClusterSecretStore(s)
          {{ all_stores.resources | map(attribute='metadata.name') | join(', ') }} still exist.
          Removing ESO would leave those services unable to resolve their ExternalSecrets.
          Remove those services first (e.g. ./uis undeploy bao), or pass -e force=true to
          remove ESO anyway.
      when:
        - (all_stores.resources | default([]) | length) > 0
        - force is not defined or not (force | bool)

    - name: 3. Check for the external-secrets Helm release
      ansible.builtin.shell: helm list -n {{ eso_namespace }} | grep {{ eso_helm_release }}
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: helm_check
      changed_when: false
      ignore_errors: true

    - name: 4. Uninstall the External Secrets Operator Helm release
      ansible.builtin.shell: |
        helm uninstall {{ eso_helm_release }} -n {{ eso_namespace }} --timeout {{ deletion_timeout }}s
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: helm_check.rc == 0

    - name: 5. Display final removal status
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "🗑️  External Secrets Operator Removal Status"
          - "==============================================="
          - "{{ '✅ SUCCESS - External Secrets Operator removed' if helm_check.rc == 0 else '⚪ Not found (already removed)' }}"
          - "⚠️  Any ExternalSecret that depended on it will stop syncing."
          - "==============================================="
