---
# file: ansible/playbooks/210-setup-litellm.yml
# Description:
# Set up LiteLLM proxy in the AI namespace on Kubernetes
# - Deploys LiteLLM using the provided Helm chart and values file
# - Applies ingress for external access
# - Verifies pod and service status
#
# Prerequisites:
# - The 'ai' namespace must exist
# - The 'urbalurba-secrets' secret must exist in the 'ai' namespace
#
# Usage:
# ansible-playbook playbooks/210-setup-litellm.yml -e kube_context="rancher-desktop"

- name: Set up LiteLLM proxy on Kubernetes
  hosts: localhost
  gather_facts: false
  vars:
    manifests_folder: "/mnt/urbalurbadisk/manifests"
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    ai_namespace: "ai"
    installation_timeout: 600  # 10 minutes
    pod_readiness_timeout: 300 # 5 minutes
    litellm_config_file: "{{ manifests_folder }}/220-litellm-config.yaml"
    litellm_ingress_file: "{{ manifests_folder }}/221-litellm-ingress.yaml"
    litellm_helm_chart: "oci://ghcr.io/berriai/litellm-helm"

  tasks:
    - name: 1. Verify Helm can access OCI registry
      ansible.builtin.command: helm show chart {{ litellm_helm_chart }}
      register: helm_chart_check
      changed_when: false
      failed_when: helm_chart_check.rc != 0

    - name: 2. Set up LiteLLM database on shared PostgreSQL
      ansible.builtin.shell: |
        ansible-playbook utility/u10-litellm-create-postgres.yml -e operation=create
      args:
        chdir: /mnt/urbalurbadisk/ansible/playbooks
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: litellm_db_result
      changed_when: litellm_db_result.rc == 0
      failed_when: litellm_db_result.rc != 0

    - name: 2.1. Display utility playbook output on failure
      ansible.builtin.debug:
        msg:
          - "❌ LiteLLM database setup failed!"
          - "Full output from utility playbook:"
          - "{{ litellm_db_result.stdout_lines }}"
      when: litellm_db_result.rc != 0

    - name: 3. Check if LiteLLM ConfigMap exists (ai-models-litellm)
      ansible.builtin.command: kubectl get configmap ai-models-litellm -n {{ ai_namespace }}
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: configmap_check
      changed_when: false
      failed_when: false

    - name: 3.1. Create default LiteLLM ConfigMap if missing
      kubernetes.core.k8s:
        kubeconfig: "{{ merged_kubeconf_file }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ai-models-litellm
            namespace: "{{ ai_namespace }}"
            labels:
              managed-by: litellm-playbook
          data:
            config.yaml: |
              # LiteLLM Default Configuration
              # Created by 210-setup-litellm.yml playbook
              #
              # To add more models, edit this ConfigMap:
              #   kubectl edit configmap ai-models-litellm -n ai
              #
              # Or apply your own ConfigMap from secrets.

              general_settings:
                master_key: os.environ/LITELLM_PROXY_MASTER_KEY
                forward_client_headers_to_llm_api: true

              litellm_settings:
                request_timeout: 300
                json_logs: true

              model_list:
                # Mac Ollama - accessible from cluster via host.docker.internal
                - model_name: llama3.2
                  litellm_params:
                    model: ollama_chat/llama3.2
                    api_base: "http://host.docker.internal:11434"

                # Add your API models below (requires API keys in urbalurba-secrets)
                # Example:
                # - model_name: gpt-4o
                #   litellm_params:
                #     model: gpt-4o
                #     api_key: "os.environ/OPENAI_API_KEY"
      when: configmap_check.rc != 0
      register: configmap_created

    - name: 3.2. Display ConfigMap status
      ansible.builtin.debug:
        msg: "{{ 'Created default ai-models-litellm ConfigMap' if configmap_created.changed | default(false) else 'Using existing ai-models-litellm ConfigMap' }}"

    - name: 4. Deploy LiteLLM via Helm
      ansible.builtin.command: >
        helm upgrade --install litellm {{ litellm_helm_chart }}
        -f {{ litellm_config_file }}
        --namespace {{ ai_namespace }}
        --create-namespace
        --timeout {{ installation_timeout }}s
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: litellm_helm_result
      changed_when: true

    - name: 5. Apply LiteLLM ingress manifest
      ansible.builtin.command: kubectl apply -f {{ litellm_ingress_file }} -n {{ ai_namespace }}
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: litellm_ingress_result
      changed_when: litellm_ingress_result.rc == 0
      failed_when: litellm_ingress_result.rc != 0

    - name: 6. Verify LiteLLM IngressRoute is created
      kubernetes.core.k8s_info:
        kubeconfig: "{{ merged_kubeconf_file }}"
        api_version: traefik.io/v1alpha1
        kind: IngressRoute
        namespace: "{{ ai_namespace }}"
        name: litellm
      register: litellm_ingress_check
      retries: 5
      delay: 2
      until: litellm_ingress_check.resources | length > 0

    - name: 7. Wait for LiteLLM pod to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ merged_kubeconf_file }}"
        kind: Pod
        namespace: "{{ ai_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=litellm
      register: litellm_pods
      retries: 20
      delay: 15
      # 🔴 READY, NOT phase. `status.phase == "Running"` is true the moment
      # the container starts; a pod is only serving when its readiness probe
      # passes. On PostgreSQL that gap was 11 seconds and cost a 223 ms race
      # that failed one install in three (imac, urb-agents#506); fixed there in
      # 1.6.37, and these are its siblings (#516).
      #
      # ⚠️ Deliberately still `k8s_info` and not `kubectl wait`: the registered
      # result is used by later tasks, and swapping the module would mean
      # duplicating the selector in a second place. Only the PREDICATE changes.
      # The existing `length > 0` guard already rules out the vacuous pass.
      # Also widened from resources[0] to every pod, so a second replica
      # cannot be un-ready while the task reports success.
      until: >-
        litellm_pods.resources | length > 0 and
        (litellm_pods.resources | selectattr('status.conditions', 'defined')
         | map(attribute='status.conditions') | flatten
         | selectattr('type', 'eq', 'Ready') | selectattr('status', 'eq', 'True')
         | list | length) == (litellm_pods.resources | length)

    - name: 8. Display LiteLLM pod readiness status
      ansible.builtin.debug:
        msg: "LiteLLM readiness status: Ready"

    - name: 9. Test LiteLLM service connectivity from within cluster
      ansible.builtin.shell: |
        kubectl run curl-test --image=curlimages/curl --rm -i --restart=Never -n {{ ai_namespace }} -- \
        curl -s -w "HTTP_CODE:%{http_code}" http://litellm:4000/health
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: litellm_service_test
      retries: 5
      delay: 5
      until: litellm_service_test.rc == 0 and (litellm_service_test.stdout.find('HTTP_CODE:200') != -1 or litellm_service_test.stdout.find('HTTP_CODE:401') != -1)
      changed_when: false
      ignore_errors: true

    - name: 10. Display service connectivity test result
      ansible.builtin.debug:
        msg: "LiteLLM service test: {{ litellm_service_test.stdout | default('Test failed') }}"

    - name: 11. Get master key for API testing
      ansible.builtin.shell: |
        kubectl get secret urbalurba-secrets -n {{ ai_namespace }} -o jsonpath="{.data.LITELLM_PROXY_MASTER_KEY}" | base64 --decode
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: master_key
      changed_when: false

    - name: 12. Test LiteLLM API and verify models from within cluster
      ansible.builtin.shell: |
        kubectl run curl-test --image=curlimages/curl --rm -i --restart=Never -n {{ ai_namespace }} -- \
        curl -s -H "Authorization: Bearer {{ master_key.stdout }}" \
        http://litellm:4000/v1/models
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: api_response
      retries: 5
      delay: 10
      until: api_response.rc == 0
      changed_when: false

    - name: 13. Get expected models from ConfigMap
      kubernetes.core.k8s_info:
        kubeconfig: "{{ merged_kubeconf_file }}"
        api_version: v1
        kind: ConfigMap
        namespace: "{{ ai_namespace }}"
        name: litellm-config
      register: litellm_configmap
      when: api_response is not failed

    - name: 14. Parse expected model count from ConfigMap
      ansible.builtin.set_fact:
        expected_model_names: "{{ litellm_configmap.resources[0].data['config.yaml'] | regex_findall('- model_name: ([^\\n]+)') | unique }}"
      when:
        - api_response is not failed
        - litellm_configmap.resources | length > 0

    - name: 15. Display model verification results
      ansible.builtin.debug:
        msg:
          - "Expected models from ConfigMap: {{ expected_model_names | default([]) | length }}"
          - "Expected model names: {{ expected_model_names | default([]) | join(', ') }}"
          - "API Response: {{ api_response.stdout | default('No response') }}"
      when: api_response.rc == 0

    - name: 16. Verify API response contains model data
      ansible.builtin.debug:
        msg: "✅ LiteLLM API is responding and returning model data"
      when: api_response.rc == 0 and 'data' in api_response.stdout

    - name: 17. Get LiteLLM pods
      ansible.builtin.shell: |
        kubectl get pods -n {{ ai_namespace }} | grep litellm || true
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: litellm_pods
      changed_when: false
      ignore_errors: true

    - name: 18. Display LiteLLM pods
      ansible.builtin.debug:
        var: litellm_pods.stdout_lines

    - name: 19. Get LiteLLM service
      ansible.builtin.shell: |
        kubectl get svc -n {{ ai_namespace }} | grep litellm || true
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: litellm_service
      changed_when: false
      ignore_errors: true

    - name: 20. Display LiteLLM service
      ansible.builtin.debug:
        var: litellm_service.stdout_lines

    # ---- schema verification & repair -------------------------------------
    # The chart's migration Job reports Completed even when prisma fails with
    # P1000, so a fresh install can end with an empty database while every
    # other check passes. Verify the schema really exists; repair it if not;
    # fail loudly rather than printing SUCCESS over a broken install.
    - name: 20a. Read LiteLLM DB password from the ai secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ merged_kubeconf_file }}"
        api_version: v1
        kind: Secret
        namespace: "{{ ai_namespace }}"
        name: urbalurba-secrets
      register: litellm_ai_secret
      no_log: true

    - name: 20b. Count tables in the litellm schema
      ansible.builtin.shell: |
        kubectl exec -n default deploy/postgresql -c postgresql -- \
          env PGPASSWORD="$PGPW" psql -h postgresql.default.svc.cluster.local \
          -U litellm -d litellm -tAc \
          "select count(*) from information_schema.tables where table_schema='public'"
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
        PGPW: "{{ litellm_ai_secret.resources[0].data.LITELLM_POSTGRESQL__PASSWORD | b64decode }}"
      register: litellm_table_count
      changed_when: false
      # 🔴 RETRY A FAILED QUERY. `failed_when: false` kept this task green when
      # psql failed, and the empty stdout then read downstream as "0 tables" —
      # indistinguishable from a real empty schema. imac saw exactly that: the
      # migration job was mid-`P1000: Authentication failed` when the count
      # ran, and the same credential worked seconds later (urb-agents#571).
      #
      # `failed_when: false` stays so a persistent failure reaches 20g with a
      # message rather than an abort — but a TRANSIENT one now retries instead
      # of being silently converted into a number.
      until: litellm_table_count.rc == 0
      retries: 10
      delay: 6
      failed_when: false

    - name: 20c. Display schema state
      ansible.builtin.debug:
        msg: "LiteLLM schema tables found: {{ litellm_table_count.stdout | default('0', true) | trim }}"

    - name: 20d. Repair schema when migrations did not apply
      ansible.builtin.shell: |
        POD=$(kubectl get pod -n {{ ai_namespace }} -l app.kubernetes.io/name=litellm -o name | head -1)
        SCHEMA=$(kubectl exec -n {{ ai_namespace }} "$POD" -- sh -c \
          'find / -name schema.prisma -path "*litellm_proxy_extras*" 2>/dev/null | head -1' | tr -d '\r')
        echo "repairing with schema: $SCHEMA"
        kubectl exec -n {{ ai_namespace }} "$POD" -- prisma migrate deploy --schema "$SCHEMA"
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: litellm_schema_repair
      when: (litellm_table_count.stdout | default('0', true) | trim | int) < 50

    - name: 20e. Re-count tables after repair
      ansible.builtin.shell: |
        kubectl exec -n default deploy/postgresql -c postgresql -- \
          env PGPASSWORD="$PGPW" psql -h postgresql.default.svc.cluster.local \
          -U litellm -d litellm -tAc \
          "select count(*) from information_schema.tables where table_schema='public'"
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
        PGPW: "{{ litellm_ai_secret.resources[0].data.LITELLM_POSTGRESQL__PASSWORD | b64decode }}"
      register: litellm_table_count_after
      changed_when: false
      # 🔴 RETRY A FAILED QUERY. `failed_when: false` kept this task green when
      # psql failed, and the empty stdout then read downstream as "0 tables" —
      # indistinguishable from a real empty schema. imac saw exactly that: the
      # migration job was mid-`P1000: Authentication failed` when the count
      # ran, and the same credential worked seconds later (urb-agents#571).
      #
      # `failed_when: false` stays so a persistent failure reaches 20g with a
      # message rather than an abort — but a TRANSIENT one now retries instead
      # of being silently converted into a number.
      until: litellm_table_count_after.rc == 0
      retries: 10
      delay: 6
      failed_when: false
      when: litellm_schema_repair.changed | default(false)

    - name: 20f. Restart LiteLLM so it picks up the repaired schema
      ansible.builtin.command: >
        kubectl rollout restart deployment/litellm -n {{ ai_namespace }}
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: litellm_schema_repair.changed | default(false)

    # Without this the playbook returns while the new pod is still starting,
    # so anything that immediately queries /v1/models gets an empty list.
    - name: 20f2. Wait for the restarted deployment to become ready
      ansible.builtin.command: >
        kubectl rollout status deployment/litellm -n {{ ai_namespace }} --timeout=240s
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: litellm_rollout_wait
      changed_when: false
      when: litellm_schema_repair.changed | default(false)

    # 🔴 `$RANDOM` IS A BASH BUILTIN AND THIS RUNS UNDER dash.
    #
    # `ansible.builtin.shell` defaults to /bin/sh, which in uis-provision-host
    # is /usr/bin/dash. There `$RANDOM` expands to NOTHING, so the pod name
    # became `apiready-` and kubectl refused it as an invalid RFC 1123
    # subdomain — every attempt, twenty times, then the play failed:
    #
    #   The Pod "apiready-" is invalid: metadata.name: Invalid value
    #
    # ⚠️ So `uis deploy litellm` exited 3 while the service was healthy and
    # serving (`litellm-6f4cf9774-r7qb8  1/1  Running`). This task exists to
    # stop a deploy reporting success while the API is dead; what it actually
    # did was make a working deploy report failure. 100% reproducible, not a
    # race (imac, urb-agents#548).
    #
    # ⚠️ Fixed with Ansible's own `random` filter rather than by setting
    # `executable: /bin/bash`. Both work; this one removes the SHELL
    # DEPENDENCY instead of satisfying it, so the task cannot regress if the
    # base image's /bin/sh changes again — which is the likeliest way this
    # became broken in the first place.
    - name: 20f3. Wait for the API to actually answer
      ansible.builtin.shell: |
        kubectl run apiready-{{ 999999 | random }} -n {{ ai_namespace }} --rm -i --restart=Never \
          --image=curlimages/curl:latest --quiet -- \
          curl -s -o /dev/null -w '%{http_code}' -m 10 \
          http://litellm.{{ ai_namespace }}.svc.cluster.local:4000/v1/models </dev/null
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: litellm_api_ready
      until: litellm_api_ready.stdout is search('200|401')
      retries: 20
      delay: 6
      changed_when: false
      when: litellm_schema_repair.changed | default(false)

    # 🔴 `default()` REPLACES UNDEFINED, NOT EMPTY.
    #
    # This rendered as `Tables found: .` — nothing between the colon and the
    # period — on an install with 86 tables, a running pod and a credential
    # that authenticates. The count query had returned an empty string; the
    # first `default()` passed it through untouched, the second never fired,
    # `| int` made it 0, and `0 < 50` failed a working install
    # (imac, urb-agents#571, measured in the shipped 1.6.46 image):
    #
    #   ""  | default('0')        -> ""   int=0
    #   ""  | default('0', true)  -> "0"  int=0
    #
    # ⚠️ Same shape as `_code_locations | default([])` fixed this morning in
    # 360-setup-dagster.yml, where a bare `code_locations:` parsed as null and
    # flowed through. I fixed that instance and did not sweep for the class —
    # `default()` without the boolean is wrong on anything that can be empty,
    # and `.stdout` always can be.
    #
    # And the deeper half: the check could not distinguish "the query returned
    # nothing" from "there are zero tables". Those need different responses,
    # so the message now says which.
    - name: 20g. FAIL if the database schema is still missing
      ansible.builtin.fail:
        msg: >-
          {% set _after = litellm_table_count_after.stdout | default('', true) | trim %}
          {% set _first = litellm_table_count.stdout | default('', true) | trim %}
          {% set _count = _after if _after else _first %}
          {% if not _count %}
          Could NOT COUNT the LiteLLM schema — the count query returned nothing
          after {{ 10 }} attempts, so this is not "zero tables", it is "no
          answer". Check whether postgresql is reachable and whether the
          litellm role can authenticate:
          kubectl exec -n default deploy/postgresql -c postgresql --
          psql -h postgresql.default.svc.cluster.local -U litellm -d litellm -c '\dt'
          {% else %}
          LiteLLM database schema was not created. Tables found: {{ _count }}.
          The proxy will appear to work (models come from the ConfigMap) but
          virtual keys and spend tracking will fail silently.
          Check: kubectl logs -n {{ ai_namespace }} -l app.kubernetes.io/name=litellm | grep P1000
          {% endif %}
      when: >-
        ((litellm_table_count_after.stdout | default(litellm_table_count.stdout, true) | default('0', true))
         | trim | int) < 50

    - name: 21. Display final status
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "🚀 LiteLLM Installation Status"
          - "==============================================="
          - ""
          - "✅ SUCCESS - LiteLLM is running and verified"
          - ""
          - "🗄️ Database Configuration:"
          - "• Using shared PostgreSQL in default namespace"
          - "• Database: litellm"
          - "• Host: postgresql.default.svc.cluster.local:5432"
          - ""
          - "🔄 Status:"
          - "• Pods:"
          - "{{ litellm_pods.stdout_lines | default(['No pods found']) }}"
          - "• Service:"
          - "{{ litellm_service.stdout_lines | default(['No service found']) }}"
          - ""
          - "🚀 API Verification:"
          - "• Service connectivity: ✅ Internal cluster communication verified"
          - "• API responding: ✅ Models loaded and verified"
          - "• IngressRoute: ✅ Traefik routing configured"
          - ""
          - "🌐 Access Instructions:"
          - "• Port-forward: kubectl port-forward svc/litellm 4000:4000 -n {{ ai_namespace }}"
          - "• Ingress: http://litellm.localhost"
          - ""
          - "🔧 Troubleshooting:"
          - "• Check pod status: kubectl get pods -n {{ ai_namespace }}"
          - "• View logs: kubectl logs -f <pod-name> -n {{ ai_namespace }}"
          - "• Check database: kubectl logs -f -n {{ ai_namespace }} -l app=litellm | grep -i database"
          - "• Restart deployment: kubectl rollout restart deployment/litellm -n {{ ai_namespace }}"
          - "===============================================" 