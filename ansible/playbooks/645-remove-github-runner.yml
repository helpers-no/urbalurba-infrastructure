---
# file: ansible/playbooks/645-remove-github-runner.yml
# Description: Remove one GitHub Actions runner INSTANCE (an ARC Helm release) from
# Kubernetes — `urb-agents#2073`/`#2075`'s ARC migration counterpart to
# 645-setup-github-runner.yml. See that playbook's own header, and
# `PLAN-service-github-runner-arc-migration.md`, for the full before/after.
#
# 🔴 INSTANCE-SCOPED, NOT NAMESPACE-WIDE — unchanged rationale from the old design
# (urb-agents#2053): the namespace can hold more than one instance, so this removes only
# the named instance's own Helm release, then removes the namespace itself ONLY if no
# other `AutoscalingRunnerSet` is left in it.
#
# 🔵 THE SHARED ARC CONTROLLER (namespace `arc-systems`) IS NEVER TOUCHED HERE — see
# 645-setup-github-runner.yml's own header for why (CRD install/removal churn is a worse
# tradeoff than one small permanent controller pod; it stays installed even if every
# instance is removed).
#
# Does NOT remove the runner's own registration from GitHub itself — same "this playbook
# owns the Kubernetes side only" boundary every other UIS removal playbook follows.
#
# Usage (the default/unnamed instance, same as always):
# ansible-playbook playbooks/645-remove-github-runner.yml -e target_host="rancher-desktop"
#
# A named instance only (leaves every other instance in the namespace untouched):
# ansible-playbook playbooks/645-remove-github-runner.yml -e target_host="rancher-desktop" \
#   -e github_runner_instance="bifrost"

- name: Remove one GitHub Actions runner instance (ARC Helm release) from Kubernetes
  hosts: localhost
  gather_facts: false
  vars:
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    github_runner_namespace: "github-runner"
    github_runner_instance: ""

  tasks:
    # Same computation as 645-setup-github-runner.yml's own task 1e — must stay in step
    # with it, or remove would target a different instance than setup would have created.
    - name: 1. Compute this instance's resource name
      ansible.builtin.set_fact:
        github_runner_resource_name: "github-runner{{ ('-' + github_runner_instance) if github_runner_instance | length > 0 else '' }}"

    - name: 2. Does this instance's Helm release exist
      ansible.builtin.command: >
        helm status {{ github_runner_resource_name }} --namespace {{ github_runner_namespace }}
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: github_runner_release_check
      changed_when: false
      failed_when: false

    - name: 3. Uninstall this instance's Helm release
      ansible.builtin.command: >
        helm uninstall {{ github_runner_resource_name }} --namespace {{ github_runner_namespace }}
        --wait --timeout 120s
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: github_runner_uninstall_result
      changed_when: true
      when: github_runner_release_check.rc == 0

    - name: 4. Delete this instance's PAT Secret (helm uninstall doesn't own it — this playbook applied it directly)
      kubernetes.core.k8s:
        state: absent
        kind: Secret
        name: "{{ github_runner_resource_name }}-token"
        namespace: "{{ github_runner_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"

    # 🔴 ONLY REMOVE THE NAMESPACE IF NO OTHER INSTANCE IS LEFT IN IT — unchanged rationale,
    # re-expressed against AutoscalingRunnerSet CRs instead of Deployments.
    - name: 5. Are any OTHER github-runner instances still in this namespace
      kubernetes.core.k8s_info:
        api_version: actions.github.com/v1alpha1
        kind: AutoscalingRunnerSet
        namespace: "{{ github_runner_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: github_runner_remaining
      failed_when: false

    - name: 6. Delete the github-runner namespace, only if it is now empty of instances
      kubernetes.core.k8s:
        state: absent
        kind: Namespace
        name: "{{ github_runner_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
        wait: true
        wait_timeout: 120
      when: github_runner_remaining.resources | default([]) | length == 0

    - name: 7. Display final removal status
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "🗑️  GitHub Runner Removal Status"
          - "==============================================="
          - "Instance: {{ github_runner_instance if github_runner_instance | length > 0 else '(default)' }} ({{ github_runner_resource_name }})"
          - "{{ '✅ SUCCESS - this instance removed' if github_runner_release_check.rc == 0 else '⚪ Not found (already removed)' }}"
          - "{{ ('🗑️  Namespace \"' + github_runner_namespace + '\" removed too — no other instance was left in it.') if (github_runner_remaining.resources | default([]) | length == 0) else ('📦 Namespace \"' + github_runner_namespace + '\" left in place — ' + (github_runner_remaining.resources | default([]) | length | string) + ' other instance(s) still running there.') }}"
          - "⚠️  The shared ARC controller (namespace arc-systems) is never touched by this"
          - "  playbook — see its own setup playbook header for why."
          - "⚠️  GitHub itself still lists this runner as offline until an admin removes"
          - "  it by hand (repository Settings → Actions → Runners)."
          - "==============================================="
