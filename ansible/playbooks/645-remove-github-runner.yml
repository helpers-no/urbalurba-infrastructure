---
# file: ansible/playbooks/645-remove-github-runner.yml
# Description: Remove the GitHub Actions runner from Kubernetes.
#
# Does NOT remove the runner's own registration from GitHub itself — GitHub still lists
# it (as offline) until an admin removes it by hand via the repository's Settings →
# Actions → Runners page, or the API. Same "this playbook owns the Kubernetes side only"
# boundary as every other uis deploy removal playbook in this repository, including
# forgejo-runner's own 640-remove-forgejo-runner.yml.
#
# Usage:
# ansible-playbook playbooks/645-remove-github-runner.yml -e target_host="rancher-desktop"

- name: Remove the GitHub Actions runner from Kubernetes
  hosts: localhost
  gather_facts: false
  vars:
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    github_runner_namespace: "github-runner"

  tasks:
    - name: 1. Check if the github-runner namespace exists
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ github_runner_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: github_runner_ns_check

    - name: 2. Delete the github-runner namespace
      kubernetes.core.k8s:
        state: absent
        kind: Namespace
        name: "{{ github_runner_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
        wait: true
        wait_timeout: 120
      when: github_runner_ns_check.resources | default([]) | length > 0

    - name: 3. Display final removal status
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "🗑️  GitHub Runner Removal Status"
          - "==============================================="
          - "{{ '✅ SUCCESS - runner removed' if (github_runner_ns_check.resources | default([]) | length > 0) else '⚪ Not found (already removed)' }}"
          - "⚠️  GitHub itself still lists this runner as offline until an admin removes"
          - "  it by hand (repository Settings → Actions → Runners)."
          - "==============================================="
