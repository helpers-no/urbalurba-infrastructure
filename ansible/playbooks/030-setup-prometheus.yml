---
# File: ansible/playbooks/030-setup-prometheus.yml
# Description: Deploy Prometheus for Urbalurba Infrastructure
# Usage: ansible-playbook 030-setup-prometheus.yml -e "target_host=rancher-desktop"

- name: Deploy Prometheus for Urbalurba Infrastructure
  hosts: localhost
  gather_facts: false

  vars:
    # target_host passed via -e, use _target for internal reference to avoid recursion
    _target: "{{ target_host | default('rancher-desktop') }}"
    namespace: "monitoring"
    component_name: "prometheus"
    uis_extend_dir: "/mnt/urbalurbadisk/.uis.extend"
    manifests_folder: "/mnt/urbalurbadisk/manifests"
    prometheus_config_file: "{{ manifests_folder }}/030-prometheus-config.yaml"

    helm_repos:
      - name: prometheus-community
        url: https://prometheus-community.github.io/helm-charts

  tasks:
    - name: 1. Display deployment information
      ansible.builtin.debug:
        msg:
          - "====================================="
          - "Prometheus Deployment"
          - "====================================="
          - "Target Host: {{ _target }}"
          - "Namespace: {{ namespace }}"
          - "Component: {{ component_name }}"
          - "Config File: {{ prometheus_config_file }}"

    - name: 2. Create monitoring namespace
      kubernetes.core.k8s:
        name: "{{ namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        context: "{{ _target }}"

    - name: 3. Add/update Helm repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
      loop: "{{ helm_repos }}"

    - name: 4. Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: false

    # ---- alerting credentials ------------------------------------------------
    # Rules deploy regardless. Only DELIVERY depends on these, and if they are
    # absent the deploy says so loudly rather than installing a monitoring stack
    # that quietly notifies nobody.
    - name: "4.1 Read alerting credentials from urbalurba-secrets"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: urbalurba-secrets
        kubeconfig: "{{ merged_kubeconf_file | default(omit) }}"
      register: obs_secret
      failed_when: false
      no_log: true

    - name: "4.2 Extract the Telegram bot token and chat id"
      ansible.builtin.set_fact:
        _tg_token: "{{ (obs_secret.resources[0].data['alertmanager-telegram-bot-token'] | default('') | b64decode) | trim }}"
        _tg_chat: "{{ (obs_secret.resources[0].data['alertmanager-telegram-chat-id'] | default('') | b64decode) | trim }}"
      when: obs_secret.resources | default([]) | length > 0
      no_log: true

    # ⚠️ WAS GATED ON THE TOKEN ALONE, so the one broken combination was silent:
    # a token present and the chat id absent produced no warning at all, and
    # 4.6 below then rendered a config Alertmanager refuses to load. That is
    # exactly the state ops was in — a 30-day-old token and no chat id
    # (urb-agents#660).
    - name: "4.3 Warn when alerting has no receiver, naming which half is missing"
      ansible.builtin.debug:
        msg:
          - "⚠️  Telegram alerting is not fully configured - alert rules will"
          - "    deploy but NOTHING WILL BE DELIVERED."
          - "    bot token: {{ 'set' if (_tg_token | default('')) | length > 0 else 'MISSING (ALERTMANAGER_TELEGRAM_BOT_TOKEN)' }}"
          - "    chat id:   {{ 'set' if (_tg_chat  | default('')) | length > 0 else 'MISSING (ALERTMANAGER_TELEGRAM_CHAT_ID)' }}"
          - "    then: uis secrets generate && uis secrets apply && uis deploy prometheus"
      when: >
        (_tg_token | default('')) | length == 0 or
        (_tg_chat  | default('')) | length == 0

    - name: "4.4 Create the Alertmanager token Secret"
      # A Secret, not the values file: `alertmanager.config` is rendered into a
      # ConfigMap, and a token that can control the bot does not belong there.
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: alertmanager-telegram
            namespace: "{{ namespace }}"
          type: Opaque
          stringData:
            token: "{{ _tg_token }}"
        kubeconfig: "{{ merged_kubeconf_file | default(omit) }}"
      when: (_tg_token | default('')) | length > 0
      no_log: true

    - name: "4.5 Render the chat id into the values file"
      # chat_id cannot be read from a file by Alertmanager (only bot_token can),
      # so it has to be substituted. Installation-specific, hence not committed.
      ansible.builtin.command: >
        sed -i 's/TELEGRAM_CHAT_ID_PLACEHOLDER/{{ _tg_chat }}/'
        {{ prometheus_config_file }}
      when: (_tg_chat | default('')) | length > 0
      changed_when: true

    # 🔴 THE OLD FALLBACK DID THE THING IT WAS WRITTEN TO PREVENT.
    #
    # It substituted `chat_id: 0` and the comment said the alternative "would
    # make Alertmanager fail to load its config, which takes ALL alerting down
    # rather than just delivery." Alertmanager treats 0 as absent and refuses
    # the config identically:
    #
    #     error loading configuration file: missing chat_id or chat_id_file
    #     on telegram_config
    #
    # So the mitigation took all alerting down, on every installation without a
    # chat id, for as long as that rule has shipped. Measured on production by
    # ops (urb-agents#660): CrashLoopBackOff, 4 restarts, eight minutes of no
    # alerting — from a routine redeploy that reported success.
    #
    # A receiver with a NAME and NO CONFIGS is valid Alertmanager config and
    # discards notifications, which is what "disable the receiver" was supposed
    # to mean. yq rather than sed, because deleting a block is not a line edit.
    - name: "4.6a Refuse when a bot token is configured and the chat id is not"
      # Not the same as "telegram was never set up". Somebody created a bot and
      # the delivery target is missing, so silently discarding every alert is
      # the wrong default — that is how an outage goes unnoticed for four days.
      ansible.builtin.fail:
        msg: >-
          ALERTMANAGER_TELEGRAM_CHAT_ID is empty but a bot token IS configured.
          Refusing to deploy an Alertmanager that would deliver nothing.
          Set it, then: uis secrets generate && uis secrets apply
          To deploy anyway with delivery disabled, pass:
          -e alertmanager_allow_no_receiver=true
      when:
        - (_tg_chat  | default('')) | length == 0
        - (_tg_token | default('')) | length > 0
        - not (alertmanager_allow_no_receiver | default(false) | bool)

    - name: "4.6b Disable the receiver so the config LOADS when unconfigured"
      ansible.builtin.command: >
        yq -i
        'del(.alertmanager.config.receivers[] | select(.name == "telegram") | .telegram_configs)'
        {{ prometheus_config_file }}
      when: (_tg_chat | default('')) | length == 0
      changed_when: true

    - name: "4.6c Prove the placeholder is gone — a leftover is a crashloop"
      ansible.builtin.command: >
        grep -c TELEGRAM_CHAT_ID_PLACEHOLDER {{ prometheus_config_file }}
      register: _placeholder_left
      changed_when: false
      failed_when: false

    - name: "4.6d Refuse to install a values file that still carries the placeholder"
      # ⚠️ grep exits 1 with a count of 0 when it matches nothing, so rc is NOT
      # the signal here — the count is. Reading rc would treat "no placeholder"
      # as a failure and "grep could not run" as success.
      ansible.builtin.fail:
        msg: >-
          {{ prometheus_config_file }} still contains
          TELEGRAM_CHAT_ID_PLACEHOLDER. Alertmanager will refuse this config
          and all alerting will be down. Neither 4.5 nor 4.6b replaced it,
          which means the values file's shape changed.
      when: (_placeholder_left.stdout | default('0') | trim | int) > 0

    # ---- scrape targets ------------------------------------------------------
    # Generated rather than written into the values file, so installation
    # addresses never end up in the product repo. Always Alertmanager; plus
    # anything the installation declares.
    - name: "4.7 Read declared external scrape targets"
      ansible.builtin.slurp:
        src: "{{ uis_extend_dir }}/prometheus-targets.yaml"
      register: ext_targets_raw
      failed_when: false

    - name: "4.8 Parse them"
      ansible.builtin.set_fact:
        _ext_targets: "{{ (ext_targets_raw.content | b64decode | from_yaml).targets | default([]) }}"
      when: ext_targets_raw.content is defined

    - name: "4.9 Require a `why:` on every declared target"
      # Same rule as the watchdog's monitors: a target nobody can justify is one
      # nobody maintains, and scraping costs storage forever.
      ansible.builtin.assert:
        that:
          - item.why is defined and (item.why | trim | length) > 0
        fail_msg: >-
          Target '{{ item.name | default(item.address) }}' in
          .uis.extend/prometheus-targets.yaml has no `why:`. State what you lose
          if this host stops being scraped.
      loop: "{{ _ext_targets | default([]) }}"
      loop_control: { label: "{{ item.name | default(item.address) }}" }

    - name: "4.10 Generate the scrape config"
      ansible.builtin.copy:
        dest: /tmp/prometheus-scrape-generated.yaml
        mode: "0644"
        content: |
          extraScrapeConfigs: |
            - job_name: alertmanager
              static_configs:
                - targets:
                    - prometheus-alertmanager.{{ namespace }}.svc.cluster.local:9093
          {% for t in _ext_targets | default([]) %}
            # {{ t.why }}
            - job_name: {{ t.name }}
              {% if t.metrics_path | default('') %}metrics_path: {{ t.metrics_path }}
              {% endif %}static_configs:
                - targets:
                    - {{ t.address }}
                  labels:
                    role: {{ t.role | default('external') }}
          {% endfor %}
      changed_when: true

    - name: "4.11 Report what will be scraped"
      ansible.builtin.debug:
        msg: >-
          Scraping Alertmanager plus {{ (_ext_targets | default([])) | length }}
          declared external target(s).
          {{ (_ext_targets | default([])) | map(attribute='name') | list | join(', ') }}

    - name: 5. Install/upgrade Prometheus via Helm
      ansible.builtin.command: >
        helm upgrade --install prometheus prometheus-community/prometheus
        -f {{ prometheus_config_file }}
        -f /tmp/prometheus-scrape-generated.yaml
        --namespace {{ namespace }}
        --create-namespace
        --timeout 600s
        --kube-context {{ _target }}
      register: prometheus_helm_result
      changed_when: true

    - name: 6. Wait for Prometheus server to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - app.kubernetes.io/name=prometheus
          - app.kubernetes.io/component=server
        context: "{{ _target }}"
      register: prometheus_pods
      retries: 20
      delay: 15
      until: >
        prometheus_pods.resources | length > 0 and
        prometheus_pods.resources[0].status.phase == "Running" and
        prometheus_pods.resources[0].status.containerStatuses[0].ready == true

    # ⚠️ TASK 6 WAITS FOR ONE POD AND THE PLAY DECLARED THE STACK DEPLOYED.
    #
    # 🔴 `ok=21 changed=8 failed=0` and "✓ Prometheus deployed successfully"
    # while `prometheus-alertmanager-0` sat in CrashLoopBackOff with 4 restarts,
    # because task 6 selects `component=server` and nothing else was looked at
    # (ops, urb-agents#660, on production). Alerting was down eight minutes and
    # the only reason anyone noticed is that ops went looking for something else.
    #
    # 🔴 And Alertmanager is the worst possible pod for this to miss: it is the
    # component whose failure suppresses every other signal. The one workload in
    # the stack whose death is silent by construction is the one the deploy did
    # not check.
    #
    # ops's standard, from my own words back to me: "count by pod name, not by
    # total." The deploy counted tasks.
    - name: "6b. Wait for EVERY pod the release owns to be Ready, not only the server"
      ansible.builtin.shell: |
        set -o pipefail
        kubectl get pods -n {{ namespace }} --context {{ _target }} \
          -l app.kubernetes.io/instance=prometheus -o json \
        | jq -r '
            [ .items[] ] as $all
            | [ $all[]
                | select( ([.status.containerStatuses[]? | select(.ready == true)] | length)
                          != (.spec.containers | length) )
                | .metadata.name ] as $unready
            | "\($all | length) \($unready | join(","))"'
      args: { executable: /bin/bash }
      register: _stack_ready
      retries: 20
      delay: 15
      # 🔴 THREE CONDITIONS, AND ALL THREE ARE LOAD-BEARING.
      #
      #   rc == 0        — a failed kubectl prints nothing, and "nothing" would
      #                    otherwise read as "no unready pods". That is exactly
      #                    the defect fixed in 1.6.47: a query that could not run
      #                    reported as a count of zero.
      #   total > 0      — if the label selector is wrong this finds NO pods, and
      #                    an empty unready list would pass vacuously. A check
      #                    that cannot see the workload must fail, not succeed.
      #   unready empty  — the actual question.
      until: >
        _stack_ready.rc == 0 and
        (_stack_ready.stdout | trim | split(' ') | first | int) > 0 and
        ((_stack_ready.stdout | trim | split(' ') | length) < 2 or
         (_stack_ready.stdout | trim | split(' '))[1] | length == 0)
      changed_when: false
      failed_when: false

    - name: "6c. Report what did not settle, distinguishing 'not ready' from 'could not look'"
      when: >
        _stack_ready.rc != 0 or
        (_stack_ready.stdout | trim | split(' ') | first | int) == 0 or
        ((_stack_ready.stdout | trim | split(' ') | length) >= 2 and
         ((_stack_ready.stdout | trim | split(' '))[1] | length) > 0)
      block:
        - name: "6c1. Collect the evidence before failing"
          ansible.builtin.shell: |
            set +e
            names="$(printf '%s' '{{ (_stack_ready.stdout | default("") | trim | split(" "))[1] | default("") }}' | tr ',' ' ')"
            for p in $names; do
              echo "--- $p ---"
              kubectl get pod "$p" -n {{ namespace }} --context {{ _target }} \
                -o jsonpath='{range .status.containerStatuses[*]}{.name}: ready={.ready} restarts={.restartCount} {.state}{"\n"}{end}' 2>&1
              kubectl logs "$p" -n {{ namespace }} --context {{ _target }} --tail=5 --all-containers 2>&1 | tail -5
            done
          args: { executable: /bin/bash }
          register: _stack_evidence
          changed_when: false
          failed_when: false

        - name: "6c2. Fail — a deploy that reports success is what people act on"
          ansible.builtin.fail:
            msg: >-
              {% if _stack_ready.rc != 0 %}
              COULD NOT CHECK pod readiness (kubectl exit {{ _stack_ready.rc }}).
              This is not "the pods are fine" — it is no answer at all.
              {{ _stack_ready.stderr | default('') | trim }}
              {% elif (_stack_ready.stdout | trim | split(' ') | first | int) == 0 %}
              COULD NOT CHECK pod readiness: the selector
              app.kubernetes.io/instance=prometheus matched NO pods in
              {{ namespace }}. Either the release is not installed under that
              name or the chart's labels changed. Refusing to report success
              on a check that saw nothing.
              {% else %}
              These pods never became Ready:
              {{ (_stack_ready.stdout | trim | split(' '))[1] }}
              {{ _stack_evidence.stdout | default('(no evidence collected)') }}
              ⚠️ Alertmanager failing here means NO alert reaches anyone, and
              nothing else in the platform will tell you.
              {% endif %}

    - name: 7. Test Prometheus server endpoint from within cluster
      ansible.builtin.command: >
        kubectl run curl-test-prometheus-server --image=curlimages/curl --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=10s --
        curl -s -o /dev/null -w "%{http_code}"
        http://prometheus-server.{{ namespace }}.svc.cluster.local:80/api/v1/status/runtimeinfo
      register: prometheus_test
      retries: 15
      delay: 15
      until: prometheus_test.rc == 0 and (prometheus_test.stdout.find('200') != -1 or prometheus_test.stdout.find('404') != -1)
      failed_when: false

    - name: 8. Test Prometheus metrics endpoint from within cluster
      ansible.builtin.command: >
        kubectl run curl-test-prometheus-metrics --image=curlimages/curl --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=10s --
        curl -s -o /dev/null -w "%{http_code}"
        http://prometheus-server.{{ namespace }}.svc.cluster.local:80/metrics
      register: prometheus_metrics_test
      retries: 15
      delay: 15
      until: prometheus_metrics_test.rc == 0 and (prometheus_metrics_test.stdout.find('200') != -1)
      failed_when: false

    - name: 9. Test Prometheus data ingestion via pushgateway
      ansible.builtin.command: >
        kubectl run prometheus-data-test --image=curlimages/curl --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=30s --
        /bin/sh -c 'echo "prometheus_validation_test 42" | curl -X POST --data-binary @- http://prometheus-prometheus-pushgateway.{{ namespace }}.svc.cluster.local:9091/metrics/job/validation-test/instance/test'
      register: prometheus_push_test
      retries: 3
      delay: 10
      until: prometheus_push_test.rc == 0
      failed_when: false

    - name: 10. Wait for Prometheus to scrape the test metric
      ansible.builtin.pause:
        seconds: 15

    - name: 11. Query Prometheus for the test metric
      ansible.builtin.command: >
        kubectl run prometheus-query-test --image=curlimages/curl --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=15s --
        curl -s --data-urlencode 'query=prometheus_validation_test'
        "http://prometheus-server.{{ namespace }}.svc.cluster.local:80/api/v1/query"
      register: prometheus_query_test
      retries: 5
      delay: 10
      until: prometheus_query_test.rc == 0 and (prometheus_query_test.stdout.find('"status":"success"') != -1) and (prometheus_query_test.stdout.find('prometheus_validation_test') != -1) and (prometheus_query_test.stdout.find('"value"') != -1)
      failed_when: false

    - name: 12. Display deployment status
      ansible.builtin.debug:
        msg:
          - "✅ Prometheus deployment completed successfully!"
          - ""
          - "Service endpoints:"
          - "  📊 Prometheus server: prometheus-server.monitoring.svc.cluster.local:80"
          - "  🚨 Alertmanager: prometheus-alertmanager.monitoring.svc.cluster.local:9093"
          - "  📤 Pushgateway: prometheus-prometheus-pushgateway.monitoring.svc.cluster.local:9091"
          - "  📈 Node exporter: prometheus-prometheus-node-exporter.monitoring.svc.cluster.local:9100"
          - ""
          - "Health tests (ping tests):"
          - "  📊 Server API: {{ 'PASS' if prometheus_test.stdout.find('200') != -1 or prometheus_test.stdout.find('404') != -1 else 'FAIL' }}"
          - "  📈 Metrics endpoint: {{ 'PASS' if prometheus_metrics_test.stdout.find('200') != -1 else 'FAIL' }}"
          - ""
          - "Data ingestion tests (real data flow):"
          - "  📤 Push to Pushgateway: {{ 'PASS' if prometheus_push_test.rc == 0 else 'FAIL' }}"
          - "  📊 Query test metric: {{ 'PASS' if prometheus_query_test.stdout.find('\"status\":\"success\"') != -1 and prometheus_query_test.stdout.find('prometheus_validation_test') != -1 and prometheus_query_test.stdout.find('\"value\"') != -1 else 'FAIL' }}"
          - ""
          - "Manual verification:"
          - "  kubectl get pods -n {{ namespace }} -l app.kubernetes.io/name=prometheus --context={{ _target }}"
          - "  kubectl logs -n {{ namespace }} -l app.kubernetes.io/name=prometheus --context={{ _target }}"
