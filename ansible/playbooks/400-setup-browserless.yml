---
# 400-setup-browserless.yml
# Deploy browserless — a pool of headless Chromium instances.
#
# The first service in the AUTOMATION category. No Helm chart upstream, so this
# applies a plain Deployment + Service, the Helm-less pattern.
#
# WHY THE PLATFORM CARRIES THIS: Uptime Kuma's `real-browser` monitor type calls
# `chromium.connect(remoteBrowser.url)` and needs a remote browser. The Uptime
# Kuma image UIS ships has no Chrome, so that monitor type is unusable in every
# installation until this exists.
#
# Usage:
#   ansible-playbook 400-setup-browserless.yml -e "target_host=rancher-desktop"

- name: Set up browserless headless Chromium pool
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _target: "{{ target_host | default('rancher-desktop') }}"
    manifests_folder: "/mnt/urbalurbadisk/manifests"
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    browser_namespace: "browser"
    component_name: "browserless"
    pod_readiness_timeout: 300

    browserless_deployment_file: "{{ manifests_folder }}/400-browserless-deployment.yaml"
    browserless_ingressroute_file: "{{ manifests_folder }}/400-browserless-ingressroute.yaml"

  tasks:
    - name: "1. Display deployment information"
      ansible.builtin.debug:
        msg: |
          Deploying browserless
            cluster:    {{ _target }}
            namespace:  {{ browser_namespace }}
            image:      ghcr.io/browserless/chromium (pinned in the manifest)
            endpoints:  Playwright ws://browserless.{{ browser_namespace }}:3000/chromium/playwright
                        CDP        http://browserless.{{ browser_namespace }}:3000

    - name: "2. Ensure the browser namespace exists"
      kubernetes.core.k8s:
        name: "{{ browser_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"

    # ============= PHASE 1: THE TOKEN =============

    - name: "3. Verify the browserless token exists in urbalurba-secrets"
      ansible.builtin.shell: >
        kubectl get secret urbalurba-secrets -n {{ browser_namespace }}
        --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }}
        -o jsonpath="{.data.BROWSERLESS_TOKEN}" | base64 -d
      register: browserless_token
      changed_when: false
      failed_when: false
      no_log: true

    - name: "4. Fail clearly if the token is missing"
      # Named explicitly rather than letting the pod CrashLoop: without TOKEN the
      # container starts and refuses every request, which reads as a browserless
      # bug rather than a missing secret.
      ansible.builtin.fail:
        msg: >-
          No BROWSERLESS_TOKEN in {{ browser_namespace }}/urbalurba-secrets. Run
          './uis secrets generate && ./uis secrets apply' before deploying.
          browserless refuses every request without it.
      when: browserless_token.stdout | default('') | length == 0

    # ============= PHASE 2: DEPLOY =============

    - name: "5. Apply the browserless Deployment and Service"
      kubernetes.core.k8s:
        state: present
        src: "{{ browserless_deployment_file }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"

    - name: "6. Apply the IngressRoute (internal only)"
      kubernetes.core.k8s:
        state: present
        src: "{{ browserless_ingressroute_file }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"

    # ============= PHASE 3: READINESS =============
    # Two stages, per rules/provisioning.md: scheduled, then actually Ready.

    - name: "7. Wait for the browserless pod to be Running"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ browser_namespace }}"
        label_selectors:
          - "app=browserless"
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: bl_pods
      until: >
        bl_pods.resources | length > 0 and
        bl_pods.resources[0].status.phase == "Running"
      retries: 30
      delay: 10

    - name: "8. Wait for it to report Ready"
      # Readiness is /pressure answering — which means the pool can accept work,
      # not merely that the process started.
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ browser_namespace }}"
        label_selectors:
          - "app=browserless"
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: bl_ready
      until: >
        bl_ready.resources | length > 0 and
        bl_ready.resources[0].status.containerStatuses is defined and
        bl_ready.resources[0].status.containerStatuses | length > 0 and
        bl_ready.resources[0].status.containerStatuses[0].ready == true
      retries: 30
      delay: 10

    - name: "9. Verify the IngressRoute was created"
      kubernetes.core.k8s_info:
        api_version: traefik.io/v1alpha1
        kind: IngressRoute
        namespace: "{{ browser_namespace }}"
        name: browserless
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: ingress_check
      retries: 5
      delay: 2
      until: ingress_check.resources | length > 0

    - name: "10. Success summary"
      ansible.builtin.debug:
        msg: |
          ===============================================
          BROWSERLESS READY — headless Chromium pool
          ===============================================

          Namespace:  {{ browser_namespace }}
          Concurrency: 3 sessions, 10 queued (platform policy, in the manifest)

          TWO ENDPOINTS, TWO PROTOCOLS — pick by what your client calls:

            Playwright  chromium.connect(...)
              ws://browserless.{{ browser_namespace }}.svc.cluster.local:3000/chromium/playwright?token=<TOKEN>
              ← Uptime Kuma's real-browser monitor uses THIS one

            CDP         chromium.connectOverCDP(...)
              http://browserless.{{ browser_namespace }}.svc.cluster.local:3000?token=<TOKEN>
              ← @playwright/mcp and agent tooling use this one

          Token:  kubectl get secret urbalurba-secrets -n {{ browser_namespace }} \
                    -o jsonpath='{.data.BROWSERLESS_TOKEN}' | base64 -d

          ⚠️ Internal only. browserless will fetch any URL it is given; the token
          is the only control. Do not expose it outside the cluster.

          Verify:  ./uis verify browserless
          ===============================================
