---
# file: ansible/playbooks/028-setup-reflector.yml
# Description:
# Install kubernetes-reflector - mirrors an annotated Secret/ConfigMap across namespaces,
# re-synced automatically on every change. Kubernetes volumes cannot cross namespaces on
# their own; this is what lets a workload in one namespace trust a certificate issued by
# cert-manager in a different one.
#
# First consumer: Epinio's Dex connector (namespace: epinio) trusting Authentik's own TLS
# certificate (namespace: authentik) - see 627-setup-epinio-identity.yml. Installed as a
# separate, reusable service rather than bundled into that one playbook, since any future
# cross-namespace trust need can depend on this the same way.
#
# Usage:
# ansible-playbook playbooks/028-setup-reflector.yml -e target_host="rancher-desktop"

- name: Install kubernetes-reflector
  hosts: localhost
  gather_facts: false
  vars:
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    reflector_namespace: "reflector"
    reflector_chart: "emberstack/reflector"
    reflector_repo_url: "https://emberstack.github.io/helm-charts"
    installation_timeout: 300
    # Latest stable (non-"-develop") chart version confirmed live against the repo's own
    # index.yaml 2026-10-27 - chart version and appVersion match 1:1 for this chart.
    reflector_chart_version: "9.1.9"

  tasks:
    - name: 1. Check if required variables are provided
      ansible.builtin.fail:
        msg: "The variable 'target_host' is mandatory. Use -e target_host=your_host_name to specify it."
      when: target_host is not defined

    - name: 2. Print playbook description
      ansible.builtin.debug:
        msg: "Installing kubernetes-reflector on Kubernetes context: {{ target_host }}"

    - name: 3. Check existing Helm repositories
      ansible.builtin.command: helm repo list
      register: helm_repo_list
      changed_when: false

    - name: 4. Add the emberstack Helm repository if needed
      kubernetes.core.helm_repository:
        name: "emberstack"
        repo_url: "{{ reflector_repo_url }}"
      when: "'emberstack' not in helm_repo_list.stdout"

    # Plain `helm repo update` — no `--force-update` (that flag exists on `helm repo add`
    # only; 026-setup-external-secrets.yml's own comment records the live-confirmed
    # failure mode of assuming otherwise).
    - name: 5. Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: false

    # 🔴 FOUND LIVE BY imac (urb-agents#2044): Epinio's own upstream Helm chart already
    # bundles emberstack/reflector as a subchart dependency (confirmed live: release
    # "epinio", chart reflector-10.0.58), including a CLUSTER-SCOPED ClusterRole literally
    # named "reflector". A standalone install of the SAME chart under a different release
    # name tries to create a ClusterRole with that same name and Helm correctly refuses it
    # ("invalid ownership metadata... must equal 'epinio'"). This is not a corner case - it
    # is the exact combination this service exists for (Epinio + Dex/Authentik needing
    # cross-namespace cert trust). reflector has no CRDs and no release-scoped RBAC of its
    # own design - any running controller watches annotated Secrets CLUSTER-WIDE regardless
    # of which release deployed it, so Epinio's own bundled instance already satisfies this
    # service's whole purpose once Epinio is installed. Detecting it and skipping avoids the
    # collision entirely rather than fighting over the resource name.
    - name: 6. Check for a reflector controller already running anywhere in the cluster
      ansible.builtin.command: >
        kubectl get pods -A -l app.kubernetes.io/name=reflector
        -o jsonpath={range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: existing_reflector_pods
      changed_when: false

    - name: 7. Record whether reflector is already provided
      ansible.builtin.set_fact:
        reflector_already_present: "{{ (existing_reflector_pods.stdout_lines | default([])) | length > 0 }}"
        reflector_existing_pod: "{{ (existing_reflector_pods.stdout_lines | default(['']))[0] }}"

    - name: 8. Create reflector namespace if it doesn't exist (only if not already provided)
      ansible.builtin.shell: kubectl create namespace {{ reflector_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: namespace_result
      changed_when: namespace_result.rc == 0
      failed_when: namespace_result.rc != 0
      when: not reflector_already_present

    - name: 9. Deploy kubernetes-reflector via Helm (only if not already provided)
      ansible.builtin.command: >
        helm upgrade --install reflector {{ reflector_chart }}
        --namespace {{ reflector_namespace }}
        --version {{ reflector_chart_version }}
        --timeout {{ installation_timeout }}s
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: reflector_result
      changed_when: true
      when: not reflector_already_present

    - name: 10. Wait for a reflector controller to be ready — the one just installed, or the one already there
      kubernetes.core.k8s_info:
        kind: Pod
        label_selectors:
          - "app.kubernetes.io/name=reflector"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: reflector_pods
      retries: 30
      delay: 10
      until: >
        reflector_pods.resources | length > 0 and
        reflector_pods.resources[0].status.phase == "Running" and
        reflector_pods.resources[0].status.containerStatuses[0].ready == true

    - name: 11. Display final deployment status
      ansible.builtin.debug:
        msg: >-
          {% if reflector_already_present %}
          ✅ Already provided — a reflector controller is already running at
          {{ reflector_existing_pod }} (not this service's own release; most likely
          Epinio's own bundled copy). Skipped installing a second one under the
          "{{ reflector_namespace }}" release to avoid the ClusterRole collision found
          live (urb-agents#2044) — reflector has no release-scoped RBAC, so the existing
          controller already covers this service's whole purpose.
          {% else %}
          ✅ SUCCESS - kubernetes-reflector installed and ready. Mirrors a Secret/
          ConfigMap once it carries reflector.v1.k8s.emberstack.com/reflection-allowed:
          "true" (plus reflection-auto-enabled/reflection-auto-namespaces). Troubleshoot
          with: kubectl get pods -n {{ reflector_namespace }} / kubectl logs -n
          {{ reflector_namespace }} -l app.kubernetes.io/name=reflector
          {% endif %}
