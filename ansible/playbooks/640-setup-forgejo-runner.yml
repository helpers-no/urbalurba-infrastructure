---
# file: ansible/playbooks/640-setup-forgejo-runner.yml
# Description:
# Install the Forgejo Actions runner as an in-cluster `uis deploy forgejo-runner` service —
# the SAME Deployment (DinD sidecar, shared docker.sock emptyDir, register flow) on every
# k3s cluster this applies to, Rancher Desktop or one of this lab's own Proxmox k3s
# clusters (urb-agents#1982, F5 of INVESTIGATE-host-provision-host-adoption.md: "k3s is
# k3s... one implementation, both platform targets," the same reasoning bao+ESO already
# use). A platforms/proxmox VM-based runner (proven, live-tested) was this pod-based
# version's predecessor, retired outright (urb-agents#1997) once this was live-verified;
# see platforms/proxmox/STRUCTURE.md's "nas's history in this platform" note for the full
# timeline.
#
# 🔴 THE ONE REAL PLATFORM DIFFERENCE: whether Forgejo itself is IN-CLUSTER or EXTERNAL.
# On Rancher Desktop, `uis deploy forgejo` runs forgejo as a Deployment in THIS same
# cluster, reachable by Service DNS. On a Proxmox k3s cluster, `forgejo` is a CORE_SERVICES
# LXC guest OUTSIDE the cluster entirely, reached by its own LAN address — there is no
# Forgejo Deployment to find and no `.localhost` dev-hostname quirk to work around, since a
# real LAN IP is already real DNS as far as any resolver is concerned. Pass
# `-e forgejo_external_url=http://<forgejo guest IP>:<port>/` to switch into that mode;
# everything else in this playbook (and the Deployment manifest itself) is unaffected —
# omit it and behavior is byte-identical to before this flag existed.
# `platforms/proxmox/scripts/forgejo-runner-pod-deploy.sh` is the thin wrapper that resolves
# that URL from config.sh and calls this playbook directly (the same documented workaround
# service-forgejo-runner.sh's own header comment already uses for the pre-existing
# `uis deploy <service> -- -e key=value` CLI gap, urb-agents#1928 — not a new invention).
#
# Prerequisite: `uis deploy forgejo` (SCRIPT_REQUIRES enforces this) in-cluster, OR forgejo
# already running and reachable at `forgejo_external_url` — and a registration token, which
# — same as the Proxmox role — this playbook does NOT mint automatically. Mint it once a
# Forgejo admin account exists (see 635-setup-forgejo.yml's own summary message):
#   kubectl exec -n forgejo deploy/forgejo -- forgejo actions generate-runner-token
#
# Usage:
# ansible-playbook playbooks/640-setup-forgejo-runner.yml -e target_host="rancher-desktop" \
#   -e forgejo_runner_token="..."
# ansible-playbook playbooks/640-setup-forgejo-runner.yml -e target_host="proxmox" \
#   -e forgejo_external_url="http://192.168.1.24:3000/" -e forgejo_runner_token="..."

- name: Install the Forgejo Actions runner
  hosts: localhost
  gather_facts: false
  vars:
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    manifests_dir: "/mnt/urbalurbadisk/manifests"
    forgejo_namespace: "forgejo"
    # Separate namespace from the git host — modest, real isolation (no cross-namespace
    # RBAC grants) for the one piece of this that runs arbitrary workflow-authored code.
    # Not a NetworkPolicy (UIS has none anywhere yet) and not claimed as a complete
    # answer — see the PLAN doc's "What this plan does NOT resolve."
    forgejo_runner_namespace: "forgejo-runner"
    forgejo_runner_http_port: 3000
    # 🔵 SAME VERSION the retired platforms/proxmox VM-based runner once pinned — verified
    # live 2026-10-19 by the proven reference (pulling it, not trusting search results).
    # One version, both targets.
    forgejo_runner_version: "13.2.0"
    forgejo_runner_image: "code.forgejo.org/forgejo/runner:{{ forgejo_runner_version }}"
    # 🔴 NOT independently verified this session — a reasonably recent, well-known stable
    # tag, not pinned by digest. Worth tightening the same way the Proxmox role tightened
    # Forgejo's own image (tag → verified digest) once this has run live.
    forgejo_runner_dind_image: "docker:27-dind"
    # 🔴 EXTERNAL-FORGEJO SWITCH — empty means "forgejo runs in THIS cluster" (the only mode
    # that existed before urb-agents#1982's pod-based build). Non-empty means "forgejo runs
    # somewhere else, reachable at this URL" — see this file's own header comment.
    forgejo_external_url: ""
    # 🔴 FOUND LIVE BY ops, urb-agents#1982: this used to be a hardcoded
    # "rancher-desktop-runner" — the external-Forgejo branch correctly
    # generalized the instance URL but missed this one, so a Proxmox-deployed
    # runner registered in Forgejo's own runner list under the wrong name.
    # Derived from target_host (already a required var — see task 1) so every
    # future external-target caller gets a correct, distinct name
    # automatically, rather than needing each wrapper script to remember an
    # explicit override. Byte-identical to before for Rancher Desktop
    # (target_host="rancher-desktop" → "rancher-desktop-runner").
    forgejo_runner_name: "{{ target_host }}-runner"
    # 🔴 PLACEHOLDER LABELS, FLAGGED — same caveat the Proxmox role's own defaults/main.yml
    # carries: no real workflow file exists yet to test against. Revisit once one does.
    forgejo_runner_labels: "docker,ubuntu-latest:docker://node:22-bookworm"

  tasks:
    - name: 1. Check if required variables are provided
      ansible.builtin.fail:
        msg: "The variable 'target_host' is mandatory. Use -e target_host=your_host_name to specify it."
      when: target_host is not defined

    - name: 1b. The registration token must be supplied, never defaulted
      ansible.builtin.assert:
        that:
          - forgejo_runner_token is defined
          - forgejo_runner_token | length > 0
        fail_msg: >-
          forgejo_runner_token is required and this playbook mints none, same rule as the
          Proxmox runner role. Create a Forgejo admin account first if you have not
          (kubectl exec -n forgejo deploy/forgejo -- forgejo admin user create --admin
          --username <name> --password <pw> --email <email>), then mint a token:
            kubectl exec -n forgejo deploy/forgejo -- forgejo actions generate-runner-token
          and pass it: -e forgejo_runner_token=...
        quiet: true
      no_log: true

    # 🔴 THE EXTERNAL-FORGEJO BRANCH — see this file's own header. Computed once, early, so
    # every later task (the manifest's own template render included) sees the same two
    # facts regardless of which mode this run is in.
    - name: 1c. Resolve whether this run targets an external Forgejo
      ansible.builtin.set_fact:
        forgejo_runner_is_external: "{{ forgejo_external_url | length > 0 }}"

    - name: 1d. Resolve the instance URL and insecure-registry host:port
      ansible.builtin.set_fact:
        forgejo_runner_instance_url: >-
          {{ forgejo_external_url if forgejo_runner_is_external
             else ('http://forgejo.' + forgejo_namespace + '.svc.cluster.local:' + (forgejo_runner_http_port | string) + '/') }}
        forgejo_runner_insecure_registry: >-
          {{ (forgejo_external_url | urlsplit('netloc')) if forgejo_runner_is_external
             else ('forgejo.' + forgejo_namespace + '.svc.cluster.local:' + (forgejo_runner_http_port | string)) }}
        # Empty unless the in-cluster Traefik lookup below actually runs — the manifest's own
        # hostAliases block is conditional on this being non-empty, so an external Forgejo
        # simply never gets one (it has no `.localhost` special-TLD problem to work around).
        forgejo_runner_traefik_ip: ""

    - name: 2. Print playbook description
      ansible.builtin.debug:
        msg: >-
          Installing the Forgejo Actions runner on Kubernetes context: {{ target_host }},
          instance: {{ forgejo_runner_instance_url }}
          ({{ 'external' if forgejo_runner_is_external else 'in-cluster' }} Forgejo)

    - name: 3. Verify Forgejo itself is reachable (hard prerequisite, in-cluster only)
      kubernetes.core.k8s_info:
        kind: Deployment
        name: forgejo
        namespace: "{{ forgejo_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: forgejo_check
      when: not forgejo_runner_is_external

    - name: 3b. Refuse if Forgejo is not installed (in-cluster only)
      ansible.builtin.fail:
        msg: >-
          Forgejo was not found in the '{{ forgejo_namespace }}' namespace — run
          'uis deploy forgejo' first.
      when:
        - not forgejo_runner_is_external
        - forgejo_check.resources | default([]) | length == 0

    # 🔵 THE EXTERNAL COUNTERPART OF 3/3b — a plain TCP connect, since there is no Kubernetes
    # object to query for an external Forgejo. Proves the address/port are actually reachable
    # from this host before anything downstream tries to register against them.
    - name: 3c. Verify an external Forgejo is actually reachable
      ansible.builtin.wait_for:
        host: "{{ forgejo_external_url | urlsplit('hostname') }}"
        port: "{{ forgejo_external_url | urlsplit('port') | default(forgejo_runner_http_port, true) }}"
        timeout: 10
      when: forgejo_runner_is_external

    - name: 4. Create forgejo-runner namespace if it doesn't exist
      ansible.builtin.shell: kubectl create namespace {{ forgejo_runner_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: namespace_result
      changed_when: namespace_result.rc == 0
      failed_when: namespace_result.rc != 0

    # 🔴 FOUND LIVE BY imac (urb-agents#1928, round 4): a job container pushing to
    # Forgejo's own registry fails token-auth with "dial tcp <loopback>:80: connect:
    # connection refused". Root cause: the registry's docker-registry token-auth
    # challenge redirects to ROOT_URL (http://forgejo.localhost/) regardless of which
    # hostname reached /v2/ — and `.localhost` is an RFC 6761 special-use TLD that every
    # standard resolver maps straight to loopback with no DNS lookup at all, so nothing
    # inside the runner/dind Pod can reach it. Not fixable via CoreDNS config — it's
    # baked into libc's resolver behavior for that TLD. Same established pattern this
    # repository already uses for the identical class of problem elsewhere (e.g.
    # 045-test-minio.yml, 070-setup-authentik.yml): look up Traefik's own ClusterIP live
    # and route the `*.localhost` hostname at it via hostAliases — Traefik does
    # Host-header routing to Forgejo:3000 from port 80, exactly how host-side traffic
    # already reaches it. imac proved this exact fix direction by hand before this
    # playbook had it. ONLY APPLIES in-cluster — an external Forgejo is reached by a real LAN
    # address, which is already real DNS as far as any resolver is concerned; the
    # `.localhost` special-use-TLD problem this works around simply does not exist for it.
    - name: 5. Get Traefik ClusterIP for in-cluster *.localhost hostname routing
      ansible.builtin.command: kubectl get svc traefik -n kube-system -o jsonpath={.spec.clusterIP}
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: forgejo_runner_traefik_ip_result
      changed_when: false
      when: not forgejo_runner_is_external

    - name: 5b. Store Traefik ClusterIP
      ansible.builtin.set_fact:
        forgejo_runner_traefik_ip: "{{ forgejo_runner_traefik_ip_result.stdout }}"
      when: not forgejo_runner_is_external

    - name: 6. Apply the registration token Secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ merged_kubeconf_file }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: forgejo-runner-token
            namespace: "{{ forgejo_runner_namespace }}"
          type: Opaque
          stringData:
            TOKEN: "{{ forgejo_runner_token }}"
      no_log: true

    - name: 7. Render the Deployment manifest
      ansible.builtin.template:
        src: "{{ manifests_dir }}/640-forgejo-runner.yaml.j2"
        dest: /tmp/640-forgejo-runner.yaml
        mode: "0600"

    - name: 8. Apply the Deployment
      kubernetes.core.k8s:
        state: present
        src: /tmp/640-forgejo-runner.yaml
        kubeconfig: "{{ merged_kubeconf_file }}"

    - name: 8b. Clean up the rendered manifest
      ansible.builtin.file:
        path: /tmp/640-forgejo-runner.yaml
        state: absent
      changed_when: false

    - name: 9. Wait for the runner pod to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ forgejo_runner_namespace }}"
        label_selectors:
          - "app=forgejo-runner"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: forgejo_runner_pods
      retries: 30
      delay: 10
      until: >
        forgejo_runner_pods.resources | length > 0 and
        forgejo_runner_pods.resources[0].status.phase == "Running" and
        (forgejo_runner_pods.resources[0].status.containerStatuses | default([]) | selectattr('ready') | list | length) == (forgejo_runner_pods.resources[0].status.containerStatuses | default([]) | length) and
        (forgejo_runner_pods.resources[0].status.containerStatuses | default([]) | length) > 0

    # 🔴 CHECKS stderr TOO — same finding the Proxmox role's own tasks/main.yml made live:
    # the daemon's own log lines land on stderr, not stdout. A check reading only stdout
    # reports failure on a genuinely healthy, already-running daemon.
    - name: 10. Wait for the daemon to report it is polling, not just that the pod started
      ansible.builtin.command: >-
        kubectl logs -n {{ forgejo_runner_namespace }} deploy/forgejo-runner -c runner --tail=50
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: forgejo_runner_logs
      until: "'declared successfully' in (forgejo_runner_logs.stdout + forgejo_runner_logs.stderr) or '[poller] launched' in (forgejo_runner_logs.stdout + forgejo_runner_logs.stderr)"
      retries: 15
      delay: 5
      changed_when: false
      ignore_errors: true

    - name: 11. Display final deployment status
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "🚀 Forgejo Runner Deployment Status"
          - "==============================================="
          - ""
          - "{{ '✅ SUCCESS - runner is polling' if (forgejo_runner_logs is defined and forgejo_runner_logs.rc is defined and forgejo_runner_logs.rc == 0 and (\"declared successfully\" in (forgejo_runner_logs.stdout + forgejo_runner_logs.stderr) or \"[poller] launched\" in (forgejo_runner_logs.stdout + forgejo_runner_logs.stderr))) else '⚠️ Pod is Ready, but the daemon log did not confirm polling — check logs by hand' }}"
          - ""
          - "🏷️  Labels this runner answers to: {{ forgejo_runner_labels }}"
          - "  (placeholder — revisit once real .forgejo/workflows/*.yml files exist,"
          - "  same caveat as the Proxmox role's own defaults)"
          - ""
          - "🐳 Execution: a private docker:dind sidecar, not a real host Docker Engine"
          - "  (the Proxmox runner's own choice) — see the PLAN doc for why."
          - ""
          - "{{ ('📦 Registry push routing: forgejo.localhost is aliased to Traefik ClusterIP (' + forgejo_runner_traefik_ip + ') inside this Pod via hostAliases — needed because .localhost is a special-use TLD no in-cluster resolver can look up.') if not forgejo_runner_is_external else ('📦 Registry push routing: ' + forgejo_runner_instance_url + ' is a real LAN address — no .localhost hostAliases workaround needed.') }}"
          - ""
          - "🔧 Troubleshooting:"
          - "• Check pods: kubectl get pods -n {{ forgejo_runner_namespace }}"
          - "• Runner logs: kubectl logs -n {{ forgejo_runner_namespace }} deploy/forgejo-runner -c runner"
          - "• dind logs: kubectl logs -n {{ forgejo_runner_namespace }} deploy/forgejo-runner -c dind"
          - "==============================================="
