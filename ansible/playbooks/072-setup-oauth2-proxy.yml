---
# file: ansible/playbooks/072-setup-oauth2-proxy.yml
# Description: Deploy oauth2-proxy as a Traefik ForwardAuth gate, and put the
#              declared services behind it.
#
# Usage:
#   ansible-playbook playbooks/072-setup-oauth2-proxy.yml
#
# 🔴 THIS PLAYBOOK MUST NOT REPORT SUCCESS FOR A GATE THAT CANNOT AUTHENTICATE.
#
# On 2026-09-18 three Cloudflare commands reported success on a tunnel that
# served nothing: `up` printed a tick after its own probe failed twelve times,
# `status` presented a Running pod as a working tunnel, and `verify` called an
# untouched placeholder "configured" (all fixed in 1.6.118). The same three
# traps apply here, so:
#
#   - refuse on an empty or placeholder credential rather than deploying a gate
#     that will refuse every visitor (tasks 03-04)
#   - do not treat a Running pod as a working gate — cloudflared's /ready and
#     oauth2-proxy's /ping both answer before the provider has ever been
#     contacted (task 09)
#   - when the end-to-end assertion fails, say what was expected and what came
#     back, and exit non-zero (tasks 09-11)

# 🔵 THE BOUNDARY THIS GATE DRAWS (Terje, 2026-09-18).
#
#   humans   reach a service by its EXTERNAL hostname, through Traefik, and are
#            gated here
#   machines reach it by its in-cluster Service name, which bypasses Traefik and
#            this gate entirely
#
# That is why gating dagster.<domain> does not break `uis deploy dagster`,
# 361-dagster-automation.yml or 360-test-dagster.yml: every one of them calls
# http://dagster-dagster-webserver:80/graphql by Service name. Verified by
# grepping the playbooks, not assumed.
#
# ⚠️ It also means this gate has NO answer for a machine client outside the
# cluster — a CI job, an external monitor, a script on another host. --api-route
# gives a browser SPA a clean 401; it does not give a machine a credential. If
# that need arrives, it is a new decision (a bearer-token path, or a second
# hostname), not a tweak to this playbook. Recorded here because until today it
# worked by accident rather than by design.

- name: Deploy oauth2-proxy login gate
  hosts: localhost
  gather_facts: false
  vars:
    manifests_folder: "/mnt/urbalurbadisk/manifests"
    kubeconfig_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    gate_namespace: "oauth2-proxy"
    declaration_file: "/mnt/urbalurbadisk/.uis.extend/protected-services.yaml"

  tasks:
    - name: "01 Verify kubeconfig exists"
      ansible.builtin.stat:
        path: "{{ kubeconfig_file }}"
      register: kubeconfig_stat

    - name: "02 Fail if kubeconfig is missing"
      ansible.builtin.fail:
        msg: "Kubeconfig not found at {{ kubeconfig_file }}"
      when: not kubeconfig_stat.stat.exists

    - name: "03 Read oauth2-proxy configuration from urbalurba-secrets"
      kubernetes.core.k8s_info:
        kind: Secret
        name: urbalurba-secrets
        namespace: default
        kubeconfig: "{{ kubeconfig_file }}"
      register: urbalurba_secrets

    - name: "04 Refuse to deploy a gate that cannot authenticate anyone"
      ansible.builtin.fail:
        msg: |
          oauth2-proxy is not configured, so the gate would refuse every visitor.

          Missing or still a placeholder:
          {% for k in ['OAUTH2_PROXY_CLIENT_ID', 'OAUTH2_PROXY_CLIENT_SECRET', 'OAUTH2_PROXY_COOKIE_SECRET'] %}
          {% set v = (urbalurba_secrets.resources[0].data[k] | default('') | b64decode) %}
          {% if v == '' or 'placeholder' in v or 'your-' in v %}  - {{ k }}
          {% endif %}
          {% endfor %}
          To fix:
          1. Register an OAuth application with your provider. Its callback URL
             must be exactly  https://<host>/oauth2/callback  for EVERY host you
             gate — oauth2-proxy derives the redirect_uri from the request's own
             hostname, so each gated host needs its own entry.

             GitHub accepts up to 10 callback URLs on one OAuth app (changed
             2026-08-14), so one app covers up to ten gated hosts. Add a URL per
             host rather than enabling wildcard matching: a wildcard lets an
             authorization code be delivered to ANY subdomain of the callback
             URL, and this platform is normally fronted by a wildcard tunnel, so
             "do you control every subdomain" is exactly the question
             PLAN-service-exposure-opt-in exists because of.

             Prefer an ORG-OWNED app over a personal one, or the secret can only
             be rotated by whoever created it.
          2. Put the client id and secret into
             .uis.secrets/secrets-config/00-common-values.env.template
          3. Generate an INDEPENDENT cookie secret — do not derive it from the
             client secret, or rotating the client secret silently invalidates
             every live session:
                 openssl rand -base64 32 | head -c 32
          4. ./uis secrets generate && ./uis secrets apply
          5. Re-run this deploy.
      # 🔴 NINE CLAUSES, ONE PER KEY PER PATTERN, MATCHING THE MESSAGE'S LOOP.
      #
      # The message above loops over all three keys looking for '', 'placeholder'
      # and 'your-'. This condition used to test that for CLIENT_ID only, plus a
      # bare emptiness check on the other two. So a CLIENT_SECRET of
      # "your-client-secret" PASSED the guard while the refusal text it would
      # have printed named it as the problem — a message describing a check the
      # condition did not make.
      #
      # Written out rather than folded into a map/select one-liner on purpose: no
      # Jinja renderer exists on a dev host, so a clever expression here cannot
      # be proven to cover every key before it ships. These can be read.
      when: >-
        urbalurba_secrets.resources | length == 0 or
        (urbalurba_secrets.resources[0].data['OAUTH2_PROXY_CLIENT_ID'] | default('') | b64decode) == '' or
        (urbalurba_secrets.resources[0].data['OAUTH2_PROXY_CLIENT_SECRET'] | default('') | b64decode) == '' or
        (urbalurba_secrets.resources[0].data['OAUTH2_PROXY_COOKIE_SECRET'] | default('') | b64decode) == '' or
        'placeholder' in (urbalurba_secrets.resources[0].data['OAUTH2_PROXY_CLIENT_ID'] | default('') | b64decode) or
        'placeholder' in (urbalurba_secrets.resources[0].data['OAUTH2_PROXY_CLIENT_SECRET'] | default('') | b64decode) or
        'placeholder' in (urbalurba_secrets.resources[0].data['OAUTH2_PROXY_COOKIE_SECRET'] | default('') | b64decode) or
        'your-' in (urbalurba_secrets.resources[0].data['OAUTH2_PROXY_CLIENT_ID'] | default('') | b64decode) or
        'your-' in (urbalurba_secrets.resources[0].data['OAUTH2_PROXY_CLIENT_SECRET'] | default('') | b64decode) or
        'your-' in (urbalurba_secrets.resources[0].data['OAUTH2_PROXY_COOKIE_SECRET'] | default('') | b64decode)

    # 🔴 A COOKIE SECRET OF THE WRONG LENGTH IS A CRASHLOOP, NOT A REFUSAL.
    #
    # oauth2-proxy needs the cookie secret to be exactly 16, 24 or 32 bytes —
    # AES-128/192/256 — and fails at startup otherwise. Nothing here checked it.
    # The tester credited this playbook with refusing other lengths on
    # 2026-09-18; it did not, and 32 is not the only valid length either.
    #
    # Without this task the failure surfaces as a pod that will not start and a
    # later assertion timing out on /oauth2/auth, which names the symptom and
    # not the cause. `openssl rand -base64 32 | head -c 32` gives 32, so the
    # documented recipe is right — this is for a hand-typed or truncated value.
    - name: "04b Refuse a cookie secret oauth2-proxy cannot use"
      ansible.builtin.fail:
        msg: |
          OAUTH2_PROXY_COOKIE_SECRET is {{ (urbalurba_secrets.resources[0].data['OAUTH2_PROXY_COOKIE_SECRET'] | default('') | b64decode) | length }} bytes.

          oauth2-proxy requires exactly 16, 24 or 32 bytes (AES-128/192/256) and
          will not start with any other length. Generate one:

              openssl rand -base64 32 | head -c 32

          Then: ./uis secrets generate && ./uis secrets apply
      when: >-
        ((urbalurba_secrets.resources[0].data['OAUTH2_PROXY_COOKIE_SECRET'] | default('') | b64decode) | length)
        not in [16, 24, 32]

    # 🔵 THE DECLARATION IS OPERATOR CONFIG AND LIVES IN .uis.extend/.
    #
    # It was briefly a key in 00-master-secrets.yml.template. That was wrong
    # twice over: the file is structural and re-synced from the image on every
    # start as of 1.6.122, so an edit there is destroyed — and before that fix it
    # was never synced at all, so a key a new release added could not reach an
    # existing install. The tester found the second half on 2026-09-18 with two
    # mtimes, which is how 1.6.121 turned out to be undeployable.
    #
    # .uis.extend/ is copied once if missing and never overwritten, like
    # enabled-services.conf and dagster-code-locations.yaml.
    - name: "05 Read the gate declaration"
      ansible.builtin.stat:
        path: "{{ declaration_file }}"
      register: declaration_stat

    - name: "05b Fail with the file to create if it is absent"
      ansible.builtin.fail:
        msg: |
          No gate declaration at {{ declaration_file }}

          That file says which services require a login and who may pass. It is
          normally created for you; if it is missing, copy the shipped default:

            cp /mnt/urbalurbadisk/provision-host/uis/templates/uis.extend/protected-services.yaml.default \
               {{ declaration_file }}

          Then edit it and re-run this deploy.
      when: not declaration_stat.stat.exists

    - name: "05c Parse it"
      ansible.builtin.set_fact:
        gate_config: "{{ lookup('file', declaration_file) | from_yaml | default({}, true) }}"

    # 🔴 AN EMPTY `protected:` MEANS UN-GATE, NOT "YOU MADE A MISTAKE".
    #
    # This used to refuse outright, and the documented way to remove a gate was
    # to empty the list and re-deploy — so the instruction and the guard
    # contradicted each other and there was NO supported way to un-gate a host.
    # The tester hit it on 2026-09-18 following the instruction verbatim.
    #
    # The two cases are distinguishable: if generated objects exist, an empty
    # list is a deliberate removal; if none exist, it is a first deploy with
    # nothing declared, which is the useless outcome worth refusing.
    - name: "06 Find any objects a previous deploy generated"
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig={{ kubeconfig_file }}
          - get
          - ingressroute,middleware
          - --all-namespaces
          - -l
          - urbalurba.io/generated-by=oauth2-proxy
          - -o
          - name
      register: existing_objects
      changed_when: false
      failed_when: false

    - name: "06b Refuse a first deploy that would protect nothing"
      ansible.builtin.fail:
        msg: |
          {{ declaration_file }} declares no services under `protected:`, and
          nothing is currently gated — so this deploy would change nothing.

          Declare at least one service, for example:

            protected:
              - name: dagster
                namespace: dagster
                service: dagster-dagster-webserver
                port: 80
                hosts: ["dagster.example.com"]
                api_routes: ["^/graphql"]
      when:
        - gate_config.protected | default([]) | length == 0
        - (existing_objects.stdout | default('') | trim) == ''

    - name: "06c Remove the gating, because an empty list is a deliberate un-gate"
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig={{ kubeconfig_file }}
          - delete
          - ingressroute,middleware
          - --all-namespaces
          - -l
          - urbalurba.io/generated-by=oauth2-proxy
      register: ungate
      when:
        - gate_config.protected | default([]) | length == 0
        - (existing_objects.stdout | default('') | trim) != ''

    - name: "06d Report the un-gate and stop"
      ansible.builtin.debug:
        msg:
          - "✓ Gating removed. The services below are reachable again without a login:"
          - "{{ existing_objects.stdout_lines | default([]) }}"
          - ""
          - "The gate pod is still deployed and protects nothing. Remove it with"
          - "'./uis undeploy oauth2-proxy', or declare services and re-deploy."
      when:
        - gate_config.protected | default([]) | length == 0
        - (existing_objects.stdout | default('') | trim) != ''

    - name: "06e End the play after an un-gate"
      ansible.builtin.meta: end_play
      when: gate_config.protected | default([]) | length == 0

    - name: "07 Render and apply the gate"
      kubernetes.core.k8s:
        definition: "{{ lookup('template', manifests_folder + '/072-oauth2-proxy-deployment.yaml.j2') }}"
        kubeconfig: "{{ kubeconfig_file }}"
        state: present
      vars:
        oauth2_provider: "{{ gate_config.provider | default('oidc') }}"
        oauth2_issuer: "{{ gate_config.issuer | default('') }}"
        oauth2_allowed_emails: "{{ gate_config.allowed_emails | default([]) }}"
        oauth2_cookie_domain: "{{ gate_config.cookie_domain | default('') }}"
        # Read in task 03, so this costs no extra call. See the annotation in the
        # template: without it a credential rotation rolls nothing and the gate
        # keeps using the old values while the deploy reports success.
        oauth2_secret_version: "{{ urbalurba_secrets.resources[0].metadata.resourceVersion }}"

    # 🔴 WAIT FOR THE ROLLOUT, NOT FOR "A POD IS RUNNING".
    #
    # The old check asked whether every pod with app=oauth2-proxy was Running.
    # During a rolling update the OLD pod is Running, so it passed instantly and
    # the play went on to assert against a gate that had not been replaced. That
    # is how "✓ deployed successfully" was printed over a pod still holding the
    # previous credentials.
    #
    # `rollout status` waits for the new ReplicaSet to be available and returns
    # non-zero on timeout, so a stuck roll fails the play instead of passing it.
    - name: "08 Wait for the new gate pod to replace the old one"
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig={{ kubeconfig_file }}
          - rollout
          - status
          - deployment/oauth2-proxy
          - -n
          - "{{ gate_namespace }}"
          - --timeout=180s
      register: gate_rollout
      changed_when: false

    - name: "08b Confirm the running pod carries the secret version just applied"
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig={{ kubeconfig_file }}
          - get
          - pods
          - -n
          - "{{ gate_namespace }}"
          - -l
          - app=oauth2-proxy
          - -o
          - jsonpath={.items[*].metadata.annotations.urbalurba\.io/secret-version}
      register: running_secret_version
      changed_when: false

    # 🔵 The re-query the tester asked for, applied here: prove the pod that is
    # actually serving is the one built from the credentials we just read, rather
    # than trusting that the apply implied it.
    - name: "08c Fail if a pod is still serving an older secret version"
      ansible.builtin.fail:
        msg: |
          The gate is running a pod built from a different secret version.

          expected: {{ urbalurba_secrets.resources[0].metadata.resourceVersion }}
          serving:  {{ running_secret_version.stdout | default('(none)') }}

          A credential rotation has not taken effect. The old values are still
          in use and will keep working until they are revoked at the provider.
      # A plain string comparison, deliberately. replicas is 1, so the jsonpath
      # yields exactly one value; if an old pod lingers it yields two and the
      # strings differ, which fails the play — wrong in the safe direction. A
      # split/unique/difference chain would read better and cannot be rendered on
      # a dev host to prove it.
      when: >-
        (running_secret_version.stdout | default('') | trim)
        != urbalurba_secrets.resources[0].metadata.resourceVersion

    # Read once for the report below. NO until-loop: `rollout status` above has
    # already waited for the new ReplicaSet, and re-adding a wait here would
    # restore the instant-pass this release removed.
    #
    # ⚠️ This register is load-bearing. Task 10 reads gate_pods, and deleting the
    # until-loop took its `register:` with it — which left two references to an
    # undefined variable and would have failed every deploy. Caught by a static
    # assertion, not by review.
    - name: "08d Read the gate pod for the report"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ gate_namespace }}"
        label_selectors:
          - "app=oauth2-proxy"
        kubeconfig: "{{ kubeconfig_file }}"
      register: gate_pods
      changed_when: false

    # A RUNNING POD IS NOT A WORKING GATE. /ping answers before oauth2-proxy has
    # ever contacted the provider, so a wrong client secret, an unregistered
    # redirect URI or an issuer that does not resolve all pass task 08 and fail
    # every sign-in. Ask the endpoint Traefik will actually ask.
    - name: "09 Assert the auth endpoint answers as an unauthenticated caller would"
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig={{ kubeconfig_file }}
          - -n
          - "{{ gate_namespace }}"
          - exec
          - "{{ gate_pods.resources[0].metadata.name }}"
          - --
          - wget
          - -q
          - -S
          - -O
          - /dev/null
          - http://127.0.0.1:4180/oauth2/auth
      register: auth_probe
      changed_when: false
      failed_when: false

    - name: "10 Report the gate state"
      ansible.builtin.debug:
        msg:
          - "==================================================="
          - "oauth2-proxy gate"
          - "==================================================="
          - ""
          - "Pods:      {{ gate_pods.resources | length }} running"
          - "Provider:  {{ gate_config.provider | default('oidc') }}"
          - "Allowed:   {{ gate_config.allowed_emails | default([]) | length }} address(es)"
          - "Protected: {{ gate_config.protected | default([]) | map(attribute='name') | list | join(', ') }}"
          - ""
          - "⚠️  A Running pod is not a working login. The only honest test is"
          - "    signing in — see 'Verify' in the service documentation."
          - "==================================================="

    - name: "11 Put the declared services behind the gate"
      kubernetes.core.k8s:
        definition: "{{ lookup('template', manifests_folder + '/072-oauth2-proxy-middleware.yaml.j2') }}"
        kubeconfig: "{{ kubeconfig_file }}"
        state: present
      vars:
        oauth2_protected: "{{ gate_config.protected }}"

    - name: "12 Final summary"
      ansible.builtin.debug:
        msg:
          - "✓ oauth2-proxy deployed and {{ gate_config.protected | length }} service(s) put behind it."
          - ""
          - "Next, and it is not optional:"
          - "  1. Open a protected host in a browser that is NOT signed in."
          - "     Expect a redirect to the provider — not a bare 401."
          - "  2. Sign in with an allowlisted address. Expect the service."
          - "  3. Sign in with a non-allowlisted address. Expect 403."
          - "  4. Open the .localhost host. Expect NO login."
          - ""
          - "Logs: kubectl -n {{ gate_namespace }} logs -l app=oauth2-proxy --tail=50"
