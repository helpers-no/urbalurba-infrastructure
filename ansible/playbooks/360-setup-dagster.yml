---
# 360-setup-dagster.yml
# Deploy Dagster — the UIS data-asset orchestrator — to Kubernetes.
#
# Dagster's metadata (run history, event log, schedule state, asset catalogue)
# lives in its OWN database on the shared UIS PostgreSQL. Deliberately not inside
# a tenant's database: platform state has a different lifecycle, backup
# expectation and owner than the data a tenant orchestrates.
#
# The chart version is PINNED. A code-location image pins its own `dagster~=X.Y`,
# and a platform-only bump can break the gRPC handshake with it, so platform and
# tenants move together as a co-ordinated change.
#
# Usage:
#   ansible-playbook 360-setup-dagster.yml -e "target_host=rancher-desktop"

- name: Set up Dagster data orchestrator on Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _target: "{{ target_host | default('rancher-desktop') }}"
    manifests_folder: "/mnt/urbalurbadisk/manifests"
    uis_extend_dir: "/mnt/urbalurbadisk/.uis.extend"
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    dagster_namespace: "dagster"
    postgres_namespace: "default"
    component_name: "dagster"

    # 900s: a code-location image can be 1.5-2 GiB and a cold pull on a slow node
    # takes minutes. Too tight a timeout reports a pull as a failure.
    installation_timeout: 900

    # Helm chart references — PINNED, see header.
    dagster_release_name: "dagster"
    dagster_chart: "dagster/dagster"
    dagster_chart_version: "1.13.19"   # chart version tracks the Dagster version
    dagster_repo_url: "https://dagster-io.github.io/helm"

    # Config files
    dagster_config_file: "{{ manifests_folder }}/360-dagster-config.yaml"
    dagster_ingressroute_file: "{{ manifests_folder }}/360-dagster-ingressroute.yaml"

  tasks:
    - name: "1. Display deployment information"
      ansible.builtin.debug:
        msg: |
          Deploying Dagster
            cluster:    {{ _target }}
            namespace:  {{ dagster_namespace }}
            chart:      {{ dagster_chart }} {{ dagster_chart_version }} (pinned)
            metadata:   dagster database on postgresql.{{ postgres_namespace }}

    - name: "2. Ensure the dagster namespace exists"
      kubernetes.core.k8s:
        name: "{{ dagster_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"

    # ============= PHASE 1: DEPENDENCIES =============

    - name: "3. Verify the shared PostgreSQL service is reachable"
      kubernetes.core.k8s_info:
        kind: Service
        name: postgresql
        namespace: "{{ postgres_namespace }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: pg_service

    - name: "4. Fail clearly if PostgreSQL is missing"
      ansible.builtin.fail:
        msg: >-
          Dagster stores its run history in PostgreSQL and cannot start without
          it. Deploy it first: ./uis deploy postgresql
      when: pg_service.resources | length == 0

    - name: "5. Get the PostgreSQL pod"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ postgres_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=postgresql"
        field_selectors:
          - status.phase=Running
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: pg_pods

    - name: "6. Fail if no PostgreSQL pod is running"
      ansible.builtin.fail:
        msg: "PostgreSQL Service exists but no pod is Running. Check: kubectl get pods -n {{ postgres_namespace }}"
      when: pg_pods.resources | length == 0

    - name: "7. Set the PostgreSQL pod name"
      ansible.builtin.set_fact:
        pg_pod: "{{ pg_pods.resources[0].metadata.name }}"

    - name: "8. Read the postgres superuser password"
      ansible.builtin.shell: >
        kubectl get secret urbalurba-secrets -n {{ postgres_namespace }}
        --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }}
        -o jsonpath="{.data.PGPASSWORD}" | base64 -d
      register: pg_admin_pw
      changed_when: false
      no_log: true

    - name: "9. Read the Dagster metadata DB password"
      ansible.builtin.shell: >
        kubectl get secret urbalurba-secrets -n {{ dagster_namespace }}
        --context {{ _target }} --kubeconfig {{ merged_kubeconf_file }}
        -o jsonpath="{.data.DAGSTER_POSTGRES_PASSWORD}" | base64 -d
      register: dagster_db_pw
      changed_when: false
      no_log: true

    - name: "10. Fail early when the Dagster DB credential is missing"
      ansible.builtin.fail:
        msg: >-
          No DAGSTER_POSTGRES_PASSWORD in dagster/urbalurba-secrets. Run
          './uis secrets generate && ./uis secrets apply' before deploying.
      when: dagster_db_pw.stdout | default('') | length == 0

    # ============= PHASE 2: METADATA DATABASE =============
    # Idempotent: safe to re-run. Creates the role and database if absent,
    # refreshes the password if present.

    - name: "11. Check whether the dagster role exists"
      # Connects over the SERVICE (-h postgresql.<ns>), not the pod's local
      # socket. A socket connection authenticates differently in the Bitnami
      # image and the superuser password does not apply, so omitting -h fails
      # with "password authentication failed for user postgres" against a
      # database that is perfectly healthy.
      ansible.builtin.shell: >-
        kubectl exec -n {{ postgres_namespace }} {{ pg_pod }} --
        bash -c "PGPASSWORD='{{ pg_admin_pw.stdout }}'
        psql -h postgresql.{{ postgres_namespace }} -U postgres -tAc
        \"SELECT 1 FROM pg_roles WHERE rolname='dagster';\"" | grep -q 1
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: role_check
      changed_when: false
      # 🔴 `failed_when: false`, not `ignore_errors: true`.
      #
      # Absence is the normal answer here on a first install — the whole point
      # of the check — but `ignore_errors` marks the task FAILED and then
      # continues, so a healthy install printed a red censored `fatal:` line.
      # With `no_log: true` a novice cannot tell it from a real failure, and a
      # REAL one (PostgreSQL unreachable, wrong credential) prints a
      # byte-identical line (imac, urb-agents#511, from a factory reset).
      #
      # `failed_when: false` says the same thing without claiming a failure
      # that did not happen. `no_log` stays: the command carries the password.
      # What the operator needs is not the query but whether the role was
      # there, and task below reports that from `rc` without secrets.
      failed_when: false
      no_log: true

    - name: "12. Create the dagster role if missing"
      ansible.builtin.shell: >-
        kubectl exec -n {{ postgres_namespace }} {{ pg_pod }} --
        bash -c "PGPASSWORD='{{ pg_admin_pw.stdout }}'
        psql -h postgresql.{{ postgres_namespace }} -U postgres -c
        \"CREATE ROLE dagster WITH LOGIN PASSWORD '{{ dagster_db_pw.stdout }}';\""
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: role_check.rc != 0
      changed_when: true
      no_log: true

    - name: "13. Keep the role password in step with the secret"
      ansible.builtin.shell: >-
        kubectl exec -n {{ postgres_namespace }} {{ pg_pod }} --
        bash -c "PGPASSWORD='{{ pg_admin_pw.stdout }}'
        psql -h postgresql.{{ postgres_namespace }} -U postgres -c
        \"ALTER ROLE dagster WITH PASSWORD '{{ dagster_db_pw.stdout }}';\""
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: role_check.rc == 0
      changed_when: true
      no_log: true

    - name: "14. Check whether the dagster database exists"
      ansible.builtin.shell: >-
        kubectl exec -n {{ postgres_namespace }} {{ pg_pod }} --
        bash -c "PGPASSWORD='{{ pg_admin_pw.stdout }}'
        psql -h postgresql.{{ postgres_namespace }} -U postgres -tAc
        \"SELECT 1 FROM pg_database WHERE datname='dagster';\"" | grep -q 1
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: db_check
      changed_when: false
      # 🔴 `failed_when: false`, not `ignore_errors: true`.
      #
      # Absence is the normal answer here on a first install — the whole point
      # of the check — but `ignore_errors` marks the task FAILED and then
      # continues, so a healthy install printed a red censored `fatal:` line.
      # With `no_log: true` a novice cannot tell it from a real failure, and a
      # REAL one (PostgreSQL unreachable, wrong credential) prints a
      # byte-identical line (imac, urb-agents#511, from a factory reset).
      #
      # `failed_when: false` says the same thing without claiming a failure
      # that did not happen. `no_log` stays: the command carries the password.
      # What the operator needs is not the query but whether the database was
      # there, and task below reports that from `rc` without secrets.
      failed_when: false
      no_log: true

    - name: "15. Create the dagster database if missing"
      ansible.builtin.shell: >-
        kubectl exec -n {{ postgres_namespace }} {{ pg_pod }} --
        bash -c "PGPASSWORD='{{ pg_admin_pw.stdout }}'
        psql -h postgresql.{{ postgres_namespace }} -U postgres -c
        \"CREATE DATABASE dagster OWNER dagster;\""
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      when: db_check.rc != 0
      changed_when: true
      no_log: true

    - name: "16. Grant privileges on the dagster database"
      ansible.builtin.shell: >-
        kubectl exec -n {{ postgres_namespace }} {{ pg_pod }} --
        bash -c "PGPASSWORD='{{ pg_admin_pw.stdout }}'
        psql -h postgresql.{{ postgres_namespace }} -U postgres -d dagster -c
        \"GRANT ALL PRIVILEGES ON DATABASE dagster TO dagster; GRANT ALL ON SCHEMA public TO dagster;\""
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      changed_when: true
      no_log: true

    - name: "17. Report the database bootstrap"
      ansible.builtin.debug:
        msg: "Metadata database ready: dagster@postgresql.{{ postgres_namespace }} (role and database present)"

    # ============= PHASE 3: THE CHART'S PASSWORD SECRET =============
    # generatePostgresqlPasswordSecret is false in the values, so the chart
    # expects this secret to exist under global.postgresqlSecretName.

    - name: "18. Create the secret the chart reads the DB password from"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: dagster-postgresql-secret
            namespace: "{{ dagster_namespace }}"
            labels:
              app: dagster
          type: Opaque
          stringData:
            postgresql-password: "{{ dagster_db_pw.stdout }}"
      no_log: true

    # ============= PHASE 4: INGRESS + HELM =============

    - name: "19. Apply the Dagster IngressRoute (internal only)"
      kubernetes.core.k8s:
        state: present
        src: "{{ dagster_ingressroute_file }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"

    - name: "20. Check existing Helm repositories"
      ansible.builtin.command: helm repo list
      register: helm_repo_list
      changed_when: false
      ignore_errors: true

    - name: "21. Add the Dagster Helm repository if needed"
      kubernetes.core.helm_repository:
        name: "dagster"
        repo_url: "{{ dagster_repo_url }}"
      when: "'dagster-io.github.io' not in helm_repo_list.stdout"

    - name: "22. Update the Dagster Helm repository"
      ansible.builtin.command: helm repo update dagster
      changed_when: false

    # ---- code locations (tenants) --------------------------------------------
    # Read from .uis.extend/, never from the product manifest. An application's
    # own installer writes its entry there; putting it in
    # manifests/360-dagster-config.yaml would ship one tenant's config to every
    # installation. Same rule as prometheus-targets.yaml.
    - name: "22a. Read the code locations this installation declares"
      ansible.builtin.slurp:
        src: "{{ uis_extend_dir }}/dagster-code-locations.yaml"
      register: _cl_raw
      failed_when: false

    - name: "22b. Parse them"
      ansible.builtin.set_fact:
        # 🔴 `default([], true)`, not `default([])`. A hand-edited file with a
        # bare `code_locations:` parses as NULL, and `default([])` only replaces
        # UNDEFINED — so null flowed through to `loop:` and Ansible failed with
        # "requires a list, got this instead: ." The boolean second argument
        # makes it replace any falsy value too.
        #
        # UIS's own writer emits `code_locations: []` when it removes the last
        # entry (verified), so this arises from a hand edit — and this file
        # invites hand edits: its header says they are preserved. A file we ask
        # humans to edit must tolerate the shapes humans write (imac,
        # urb-agents#491).
        #
        # Fixed HERE, at the single assignment, rather than at the eleven
        # downstream uses — which is the same reason the configure argument
        # list became one function.
        _code_locations: "{{ (_cl_raw.content | b64decode | from_yaml).code_locations | default([], true) }}"
      when: _cl_raw.content is defined

    - name: "22c. Require the fields a code location cannot work without"
      ansible.builtin.assert:
        that:
          - item.name is defined and (item.name | trim | length) > 0
          - item.image is defined and (item.image | trim | length) > 0
          - item.tag is defined and (item.tag | trim | length) > 0
          - item.module is defined and (item.module | trim | length) > 0
          - item.why is defined and (item.why | trim | length) > 0
        fail_msg: >-
          Code location '{{ item.name | default("<unnamed>") }}' in
          .uis.extend/dagster-code-locations.yaml is missing a required field
          (name, image, tag, module, why). `why` is required for the same reason
          prometheus-targets.yaml requires it: a tenant nobody can justify is one
          nobody maintains.
      loop: "{{ _code_locations | default([]) }}"
      loop_control: { label: "{{ item.name | default('<unnamed>') }}" }

    - name: "22d. Reject `latest` — it makes a successful deploy change nothing"
      # Helm rolls the code-location pod only when the image field CHANGES. With
      # `latest` the values are identical every time, Helm does nothing, and the
      # platform silently keeps serving the previous code while reporting success.
      ansible.builtin.assert:
        that:
          - item.tag | trim | lower != 'latest'
        fail_msg: >-
          Code location '{{ item.name }}' uses tag `latest`. Use an immutable tag
          (e.g. v20260822-abc1234) so Helm can tell that the image changed.
      loop: "{{ _code_locations | default([]) }}"
      loop_control: { label: "{{ item.name | default('<unnamed>') }}" }

    - name: "22d1. A declared digest must be shaped like one"
      # A typo'd digest would otherwise surface as "the tag has been re-pushed",
      # which sends the reader to the registry to investigate their own typo.
      ansible.builtin.assert:
        that:
          - item.digest is match('^sha256:[0-9a-f]{64}$')
        fail_msg: >-
          Code location '{{ item.name }}' declares digest '{{ item.digest }}',
          which is not a sha256 digest. Expected sha256: followed by 64 hex
          characters — the form `./uis deploy dagster` prints for this image.
      when:
        - item.digest is defined
        - (item.digest | trim | length) > 0
      loop: "{{ _code_locations | default([]) }}"
      loop_control: { label: "{{ item.name | default('<unnamed>') }}" }

    - name: "22d2. Pre-flight: can each declared image actually be pulled, and what does the tag resolve to?"
      # Without this a bad tag costs the full --timeout 900s before Helm gives
      # up (tester D4). A manifest HEAD against the registry answers in seconds.
      # Best-effort only: a private registry legitimately returns 401 here, so
      # this WARNS and never blocks — the deploy still fails later if the pull
      # really is impossible, just less cheaply.
      #
      # 🔴 THE DIGEST COMES FREE AND WE USED TO THROW IT AWAY. This request
      # already resolves the tag; the registry answers with the digest in
      # `Docker-Content-Digest` and we kept only the status code. That number is
      # the one thing that says whether what was verified is what is running
      # (imac via ops-dev, #740).
      #
      # ⚠️ `-I` is deliberately NOT used: some registries answer HEAD without the
      # digest header. `-o /dev/null -D -` does a GET, discards the body and
      # keeps the headers.
      ansible.builtin.shell: |
        repo="{{ item.image }}"; host="${repo%%/*}"; path="${repo#*/}"
        authhost="$host"; svc="$host"
        case "$host" in
          *.*|localhost*) ;;
          # ⚠️ PRE-EXISTING AND FOUND WHILE ADDING THE DIGEST: Docker Hub issues
          # tokens from auth.docker.io, not from the registry host. Asking
          # registry-1.docker.io for a token returned nothing, so every Docker
          # Hub image failed this pre-flight with 401 and was reported as "normal
          # for a private registry". The check was blind to the largest public
          # registry there is.
          *) host="registry-1.docker.io"; path="{{ item.image }}"
             authhost="auth.docker.io"; svc="registry.docker.io" ;;
        esac
        tok=$(curl -sf "https://${authhost}/token?scope=repository:${path}:pull&service=${svc}" 2>/dev/null \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
        hdr=$(curl -s -o /dev/null -D - -w 'HTTPCODE=%{http_code}\n' -H "Authorization: Bearer ${tok}" \
               -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
               "https://${host}/v2/${path}/manifests/{{ item.tag }}" 2>/dev/null)
        code=$(printf '%s\n' "$hdr" | sed -n 's/^HTTPCODE=//p' | tail -1)
        dig=$(printf '%s\n' "$hdr" | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p' | tail -1)
        # One line, two fields, always both present so the parse cannot shift.
        echo "${code:-000} ${dig:-none}"
      register: _imgcheck
      changed_when: false
      failed_when: false
      loop: "{{ _code_locations | default([]) }}"
      loop_control: { label: "{{ item.image }}:{{ item.tag }}" }

    - name: "22d3. Warn early when an image looks unpullable"
      ansible.builtin.debug:
        msg: >-
          ⚠️ {{ item.item.image }}:{{ item.item.tag }} — registry returned
          {{ item.stdout | default('?') }} for that tag. If this is a public
          image the tag probably does not exist, and Helm will spend
          {{ installation_timeout }}s discovering that. Check the tag before
          waiting. (A 401 is normal for a private registry.)
      when: (item.stdout | default('') | regex_replace('^([0-9]+).*$', '\\1')) not in ['200', '']
      loop: "{{ _imgcheck.results | default([]) }}"
      loop_control: { label: "{{ item.item.name | default('?') }}" }

    # 🔴 THE DIGEST IS THE ONLY NUMBER THAT SAYS WHAT ACTUALLY RUNS.
    #
    # The install definition is pulled at a digest and checked against the pin
    # the catalogue records. The CODE image is addressed by `image:` + `tag:`,
    # and a re-push of that tag changes what executes while every digest UIS
    # prints stays identical. imac had to resolve it by hand to find out what it
    # had really run (ops-dev, #740).
    #
    # `digest:` is OPTIONAL. An application that cannot publish digests must
    # still be installable — the point is that one which CAN is no longer unable
    # to say so, and that the resolved value is reported either way.
    - name: "22d4. Verify the declared digest, and report the resolved one"
      ansible.builtin.assert:
        that:
          - _resolved == item.item.digest
        fail_msg: >-
          Code location '{{ item.item.name }}' declares digest
          {{ item.item.digest }} but {{ item.item.image }}:{{ item.item.tag }}
          currently resolves to {{ _resolved }}.
          🔴 The tag has been re-pushed, or the declaration is wrong. Refusing to
          deploy code that is not what was declared.
        success_msg: >-
          {{ item.item.name }}: {{ item.item.image }}:{{ item.item.tag }}
          == {{ _resolved }} (declared digest matches)
      vars:
        _resolved: "{{ (item.stdout | default('') | trim).split(' ')[1] | default('none') }}"
      # ⚠️ Only when BOTH are known. A 401 from a private registry means we could
      # not look, and "could not look" must not be reported as "does not match" —
      # the same distinction the external-services gate refuses to blur.
      when:
        - item.item.digest is defined
        - (item.item.digest | trim | length) > 0
        - (item.stdout | default('') | trim).split(' ')[1] | default('none') != 'none'
      loop: "{{ _imgcheck.results | default([]) }}"
      loop_control: { label: "{{ item.item.name | default('?') }}" }

    - name: "22d5. Say so when a declared digest could NOT be checked"
      ansible.builtin.debug:
        msg: >-
          ⚠️ {{ item.item.name }} declares a digest, but
          {{ item.item.image }}:{{ item.item.tag }} could not be resolved
          (registry returned {{ (item.stdout | default('') | trim).split(' ')[0] | default('?') }}).
          NOTHING WAS COMPARED. The deploy continues; the declaration is
          unverified, not verified.
      when:
        - item.item.digest is defined
        - (item.item.digest | trim | length) > 0
        - (item.stdout | default('') | trim).split(' ')[1] | default('none') == 'none'
      loop: "{{ _imgcheck.results | default([]) }}"
      loop_control: { label: "{{ item.item.name | default('?') }}" }

    - name: "22d6. Report the resolved digest for every code location"
      # Printed whether or not a digest was declared: an operator who never
      # pinned anything can still copy this value into the declaration, and an
      # install record that carries it can be compared with a later one.
      #
      # 🔴 THIS LINE IS THE ONLY REASON ANYONE SAW THE 1.6.62 GAP. `template
      # install` could not emit the field, so 22d1/22d4/22d5 all skipped and the
      # install was silently green — every digest printed correct, nothing
      # pinned (imac via ops-dev, #745).
      #
      # ⚠️ Its wording said "not declared — add `digest:` to pin it", which was
      # false in that case and pointed the reader at the application when UIS
      # had lost the value. This task reads the OVERLAY and cannot know what the
      # definition said, so it now describes the entry in front of it and blames
      # nobody. The lost-in-transit case is caught where it can be: the renderer
      # reads its own write back (`_write_code_location`).
      ansible.builtin.debug:
        msg: >-
          {{ item.item.name }}: {{ item.item.image }}:{{ item.item.tag }}
          -> {{ (item.stdout | default('') | trim).split(' ')[1] | default('none') }}
          {{ '(declared — pinned)' if (item.item.digest is defined and (item.item.digest | trim | length) > 0) else '(no digest in this entry — the tag is not pinned)' }}
      loop: "{{ _imgcheck.results | default([]) }}"
      loop_control: { label: "{{ item.item.name | default('?') }}" }

    - name: "22e. Render the tenant values overlay"
      # A second -f rather than editing the base values: the platform manifest
      # stays generic and this file is regenerated from the declaration each run.
      ansible.builtin.copy:
        dest: "/tmp/dagster-code-locations.generated.yaml"
        mode: "0644"
        content: |
          dagster-user-deployments:
            enabled: true
            deployments:
          {% for cl in _code_locations | default([]) %}
              - name: {{ cl.name }}
                image:
                  repository: {{ cl.image }}
                  tag: "{{ cl.tag }}"
                  pullPolicy: IfNotPresent
                dagsterApiGrpcArgs:
                  - "--module-name"
                  - "{{ cl.module }}"
                port: 4000
          {% if cl.env_secrets is defined and cl.env_secrets | length > 0 %}
                envSecrets:
          {% for s in cl.env_secrets %}
                  - name: {{ s }}
          {% endfor %}
          {% endif %}
          {% endfor %}
      when: (_code_locations | default([]) | length) > 0

    - name: "22f. Report what will be registered"
      ansible.builtin.debug:
        msg: >-
          {{ (_code_locations | default([]) | length) }} code location(s)
          declared in .uis.extend/dagster-code-locations.yaml
          {{ (_code_locations | default([]) | map(attribute='name') | list) | join(', ') }}

    - name: "23. Deploy Dagster via Helm (chart version pinned)"
      ansible.builtin.command: >
        helm upgrade --install {{ dagster_release_name }} {{ dagster_chart }}
        --version {{ dagster_chart_version }}
        -f {{ dagster_config_file }}
        {{ ((_code_locations | default([]) | length) > 0) | ternary('-f /tmp/dagster-code-locations.generated.yaml', '') }}
        --namespace {{ dagster_namespace }}
        --timeout {{ installation_timeout }}s
        --wait
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: dagster_helm_result
      changed_when: true
      # ⚠️ Deliberately does NOT fail here. The reconcile below must run even —
      # especially — when this fails, because a failed upgrade is what CREATES
      # the orphans it prunes. Task 23f fails the play afterwards, so a failed
      # upgrade is still a failed deploy, just not one that skips cleanup.
      # (Tester D2 residual, 2026-08-23: with the prune after an unguarded helm
      # task, one unpullable tenant blocked reconciliation for every other
      # tenant on the platform.)
      failed_when: false
    - name: "23b. Prune code-location objects Helm will not prune itself"
      # ⚠️ Helm three-way-merges against the last SUCCESSFUL release, not the
      # previous one. So a resource created by a FAILED revision is invisible to
      # the merge and survives every later upgrade:
      #
      #   rev 1  deployed   no tenants
      #   rev 2  FAILED     tenant created (--wait timed out on a bad image)
      #   rev 3  deployed   merges against rev 1 -> never prunes rev 2's object
      #
      # Reported by the independent tester (D2, 2026-08-23) and reachable by an
      # ordinary sequence: declare a tenant whose image cannot be pulled, then
      # remove the declaration. The Deployment keeps running with nothing behind
      # it. Reconcile explicitly against what IS declared.
      #
      # ⚠️ THIS MUST RUN *AFTER* THE HELM UPGRADE, NOT BEFORE.
      # My first attempt pruned at task 22, before task 23's upgrade — Helm then
      # recreated the object from the failed revision's state, so the delete
      # succeeded and the Deployment was still there afterwards. Reconcile
      # against the cluster Helm has just finished producing.
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ dagster_namespace }}"
        label_selectors:
          - "component=user-deployments"
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: _existing_locations
      failed_when: false

    - name: "23c. Delete any that are no longer declared"
      # ⚠️ Two DIFFERENT identifiers, and confusing them makes this a silent no-op:
      #   metadata.name             = dagster-dagster-user-deployments-<tenant>
      #   metadata.labels.deployment = <tenant>            (matches the declaration)
      # Compare on the LABEL, delete by the NAME. My first version did both with
      # the label, so it deleted a Deployment that never existed — and `state:
      # absent` on a non-existent object succeeds, so the task reported ok while
      # the orphan stayed up.
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ dagster_namespace }}"
        name: "{{ item.metadata.name }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
        wait: true
        wait_timeout: 60
      loop: >-
        {{ _existing_locations.resources | default([])
           | rejectattr('metadata.labels.deployment', 'in',
                        _code_locations | default([]) | map(attribute='name') | list)
           | list }}
      loop_control:
        label: "{{ item.metadata.name }} (tenant '{{ item.metadata.labels.deployment | default('?') }}' no longer declared)"

    - name: "23d. Confirm the prune actually happened"
      # Because 23c reporting `ok` is not evidence: deleting a non-existent
      # object also reports ok. Check the cluster, not the task result.
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ dagster_namespace }}"
        label_selectors:
          - "component=user-deployments"
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: _after_prune

    - name: "23e. Assert only declared code locations remain"
      # Skipped when Helm failed: the cluster is legitimately mid-flight then,
      # and asserting here would replace Helm's real error with a confusing one.
      # Task 23f reports the Helm failure instead.
      when: dagster_helm_result.rc | default(1) == 0
      ansible.builtin.assert:
        that:
          - (_after_prune.resources | default([]) | map(attribute='metadata.labels.deployment') | list | sort)
            == (_code_locations | default([]) | map(attribute='name') | list | sort)
        fail_msg: >-
          After the upgrade the cluster has code-location deployments
          {{ _after_prune.resources | default([]) | map(attribute='metadata.labels.deployment') | list }}
          but .uis.extend/dagster-code-locations.yaml declares
          {{ _code_locations | default([]) | map(attribute='name') | list }}.
          A Deployment left behind by a failed Helm revision is invisible to
          Helm's three-way merge and must be pruned explicitly.
        success_msg: >-
          Code locations reconciled: {{ (_code_locations | default([]) | length) }} declared,
          {{ (_after_prune.resources | default([]) | length) }} present.
    - name: "23f. Fail the play if the Helm upgrade failed"
      # Runs AFTER the reconcile, so cleanup has already happened.
      ansible.builtin.fail:
        msg: |
          Helm upgrade failed (rc={{ dagster_helm_result.rc | default('?') }}).

          {{ (dagster_helm_result.stderr | default('') | trim) or (dagster_helm_result.stdout | default('') | trim) }}

          Code-location reconciliation still ran, so no undeclared tenant has
          been left behind. If the error mentions a timeout, check the ⚠️
          registry pre-flight warnings earlier in this run — an image tag that
          cannot be pulled makes Helm wait out its full
          {{ installation_timeout }}s.
      when: dagster_helm_result.rc | default(1) != 0

    # ============= PHASE 5: READINESS =============

    - name: "24. Wait for the webserver to be Ready"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ dagster_namespace }}"
        label_selectors:
          - "app.kubernetes.io/instance={{ dagster_release_name }}"
          - "component=dagster-webserver"
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: webserver_pods
      until: >
        webserver_pods.resources | length > 0 and
        webserver_pods.resources[0].status.containerStatuses is defined and
        webserver_pods.resources[0].status.containerStatuses | length > 0 and
        webserver_pods.resources[0].status.containerStatuses[0].ready == true
      retries: 30
      delay: 10

    - name: "25. Wait for the daemon to be Ready"
      # The daemon is the load-bearing component: it runs schedules and the run
      # queue. A Dagster install without it is a UI over nothing, so this is
      # asserted rather than assumed.
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ dagster_namespace }}"
        label_selectors:
          - "app.kubernetes.io/instance={{ dagster_release_name }}"
          - "component=dagster-daemon"
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: daemon_pods
      until: >
        daemon_pods.resources | length > 0 and
        daemon_pods.resources[0].status.containerStatuses is defined and
        daemon_pods.resources[0].status.containerStatuses | length > 0 and
        daemon_pods.resources[0].status.containerStatuses[0].ready == true
      retries: 30
      delay: 10

    - name: "26. Verify the IngressRoute was created"
      kubernetes.core.k8s_info:
        api_version: traefik.io/v1alpha1
        kind: IngressRoute
        namespace: "{{ dagster_namespace }}"
        name: dagster
        kubeconfig: "{{ merged_kubeconf_file }}"
        context: "{{ _target }}"
      register: ingress_check
      retries: 5
      delay: 2
      until: ingress_check.resources | length > 0

    - name: "27. Success summary"
      ansible.builtin.debug:
        msg: |
          ===============================================
          DAGSTER READY — data orchestrator deployed
          ===============================================

          Chart:      {{ dagster_chart }} {{ dagster_chart_version }} (pinned)
          Namespace:  {{ dagster_namespace }}
          Metadata:   dagster@postgresql.{{ postgres_namespace }}
          UI:         http://dagster.localhost   (internal only, no auth)
          Concurrency cap: 4 simultaneous run pods (platform policy)

          {% if (_code_locations | default([]) | length) == 0 %}
          NO CODE LOCATIONS ARE REGISTERED YET — that is expected.
          UIS ships the orchestrator; applications register themselves as
          tenants. To add one, declare it in

              .uis.extend/dagster-code-locations.yaml

          then re-run `./uis deploy dagster`.
          {% else %}
          Code locations declared: {{ _code_locations | default([]) | length }}
              {{ _code_locations | default([]) | map(attribute='name') | join(', ') }}

          Declared is not the same as loaded. Confirm Dagster can actually reach
          them — and that they can execute runs — with `./uis verify dagster`.
          {% endif %}

          ⚠️ Do NOT edit manifests/360-dagster-config.yaml — that is product
          config, ships to every installation, and bypasses the validation that
          rejects `latest` tags and missing `why:` fields.
          See /docs/services/analytics/dagster for the tenant contract.

          Verify:  ./uis verify dagster
          ===============================================
