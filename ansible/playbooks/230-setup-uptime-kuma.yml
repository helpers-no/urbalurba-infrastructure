---
# 230-setup-uptime-kuma.yml
# Deploy Uptime Kuma - external availability watchdog
#
# ⚠️ Uptime Kuma is only useful on a host that is NOT part of the platform it
# monitors. A monitor inside a cluster cannot report that cluster being down.
# UIS cannot express "deploy this elsewhere", so this playbook warns instead.
#
# Usage:
#   ansible-playbook 230-setup-uptime-kuma.yml -e "target_host=rancher-desktop"

- name: Deploy Uptime Kuma
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _target: "{{ target_host | default('rancher-desktop') }}"
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    namespace: "monitoring"
    component_name: "uptime-kuma"
    manifests_folder: "/mnt/urbalurbadisk/manifests"
    statefulset_file: "{{ manifests_folder }}/230-uptime-kuma-statefulset.yaml"
    ingressroute_file: "{{ manifests_folder }}/230-uptime-kuma-ingressroute.yaml"
    # AutoKuma is PART OF THIS SERVICE, not a service of its own. Uptime Kuma
    # without it is an empty dashboard you have to fill in by hand.
    autokuma_file: "{{ manifests_folder }}/230-uptime-kuma-autokuma.yaml"
    # History retention. Kuma's default is 180 days; the watchdog is expected to
    # run on modest/flash storage, so trim it. Override with
    # -e kuma_retention_days=N.
    kuma_retention_days: "{{ uptime_kuma_retention_days | default(30) }}"

  tasks:
    - name: "1. Create {{ namespace }} namespace"
      kubernetes.core.k8s:
        name: "{{ namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ merged_kubeconf_file }}"

    - name: "2. Deploy PVC + StatefulSet + Service"
      kubernetes.core.k8s:
        state: present
        src: "{{ statefulset_file }}"
        kubeconfig: "{{ merged_kubeconf_file }}"

    - name: "3. Deploy IngressRoute"
      kubernetes.core.k8s:
        state: present
        src: "{{ ingressroute_file }}"
        kubeconfig: "{{ merged_kubeconf_file }}"

    - name: "4. Wait for {{ component_name }} to be running"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - "app={{ component_name }}"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: kuma_pods
      retries: 30
      delay: 10
      until: >
        kuma_pods.resources | length > 0 and
        kuma_pods.resources[0].status.phase == "Running"

    # Do not report success on a pod that is Running but not yet serving.
    # The lesson from PLAN-service-litellm-001: a playbook that prints SUCCESS
    # without checking is worse than one that says nothing.
    - name: "5. Wait for the web UI to actually answer"
      ansible.builtin.shell: >
        kubectl run kuma-ready-check-{{ 999 | random }}
        -n {{ namespace }} --rm -i --restart=Never --quiet
        --image=curlimages/curl:latest --
        curl -s -o /dev/null -w '%{http_code}'
        -m 10 http://{{ component_name }}.{{ namespace }}.svc.cluster.local:3001/
        < /dev/null | tail -c 3
      environment:
        # kubectl reads this. Do NOT pass --kubeconfig after the `--`:
        # everything after `--` is the CONTAINER's argv, so curl receives it
        # and dies with "option --kubeconfig: is unknown".
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: kuma_http
      retries: 20
      delay: 6
      until: kuma_http.stdout is search('200|302')
      changed_when: false

    - name: "5.1 Deploy AutoKuma (the monitor reconciler, part of this service)"
      # After task 5, so Kuma is already answering and AutoKuma's first connect
      # attempt succeeds rather than relying on its restart loop.
      kubernetes.core.k8s:
        state: present
        src: "{{ autokuma_file }}"
        kubeconfig: "{{ merged_kubeconf_file }}"

    - name: "5.2 Wait for AutoKuma to be ready"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - "app=autokuma"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: autokuma_pods
      retries: 30
      delay: 10
      until: >
        autokuma_pods.resources | length > 0 and
        autokuma_pods.resources[0].status.phase == "Running"

    - name: "6. Verify the data volume is mounted"
      ansible.builtin.shell: >
        kubectl exec -n {{ namespace }} {{ component_name }}-0
        --kubeconfig {{ merged_kubeconf_file }} -- sh -c 'test -d /app/data && echo MOUNTED'
      register: kuma_data
      changed_when: false
      failed_when: "'MOUNTED' not in kuma_data.stdout"

    # ---- unattended admin setup -------------------------------------------
    # Uptime Kuma's browser wizard has two screens. UPTIME_KUMA_DB_TYPE in the
    # StatefulSet handles the first. This handles the second.
    #
    # `needSetup` is computed at startup as simply "is the user table empty?",
    # so seeding one row removes the wizard. The image already ships bcryptjs
    # (the app's own hashing library, 10 salt rounds) and sqlite3, so no extra
    # tooling is needed.
    #
    # Idempotent: only seeds when the table is empty, so re-running never
    # clobbers a password that has since been changed in the UI.
    - name: "7. Read admin credentials from urbalurba-secrets"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: urbalurba-secrets
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: kuma_secret
      no_log: true

    - name: "7.1 Fail clearly if the credentials are missing"
      ansible.builtin.assert:
        that:
          - kuma_secret.resources | length > 0
          - "'uptime-kuma-admin-user' in kuma_secret.resources[0].data"
          - "'uptime-kuma-admin-password' in kuma_secret.resources[0].data"
        fail_msg: >-
          urbalurba-secrets in {{ namespace }} has no uptime-kuma-admin-user /
          uptime-kuma-admin-password. Run `./uis secrets apply` first.

    - name: "8. Is the admin account already set up?"
      ansible.builtin.shell: >
        kubectl exec -n {{ namespace }} {{ component_name }}-0
        --kubeconfig {{ merged_kubeconf_file }}
        -- sqlite3 /app/data/kuma.db "select count(*) from user;"
      register: kuma_user_count
      changed_when: false
      retries: 10
      delay: 6
      until: kuma_user_count.rc == 0

    # Guard against upstream changing the schema underneath us. This writes
    # directly to the application's own table, which is a private interface -
    # if it ever changes shape, fail loudly rather than corrupt the database.
    - name: "8.1 Verify the user table still has the expected shape"
      ansible.builtin.shell: >
        kubectl exec -n {{ namespace }} {{ component_name }}-0
        --kubeconfig {{ merged_kubeconf_file }}
        -- sqlite3 /app/data/kuma.db ".schema user"
      register: kuma_schema
      changed_when: false
      failed_when: >-
        'username' not in kuma_schema.stdout or
        'password' not in kuma_schema.stdout or
        'active' not in kuma_schema.stdout
      when: kuma_user_count.stdout | trim | int == 0

    - name: "9. Seed the admin account"
      # Username AND password both arrive on stdin, one per line, so neither
      # appears in a process list. A heredoc builds the SQL inside the pod,
      # which avoids nested-quote escaping - an earlier version interpolated
      # $KUMA_USER inside a single-quoted `sh -c`, where the outer shell never
      # expanded it, and silently created an account with an empty username.
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s\n%s\n' "$KUMA_USER" "$KUMA_PW" \
        | kubectl exec -i -n {{ namespace }} {{ component_name }}-0 \
            --kubeconfig {{ merged_kubeconf_file }} -- sh -c '
              read -r U
              read -r P
              H=$(cd /app && P="$P" node -e "console.log(require(\"bcryptjs\").hashSync(process.env.P, 10))")
              sqlite3 /app/data/kuma.db <<SQL
        insert into user (username, password, active) values ("$U", "$H", 1);
        SQL
            '
      args:
        executable: /bin/bash
      environment:
        KUMA_PW: "{{ kuma_secret.resources[0].data['uptime-kuma-admin-password'] | b64decode }}"
        KUMA_USER: "{{ kuma_secret.resources[0].data['uptime-kuma-admin-user'] | b64decode }}"
      register: kuma_seed
      when: kuma_user_count.stdout | trim | int == 0
      no_log: true

    - name: "9.1 Seed retention (keepDataPeriodDays)"
      # Flash storage: trim history rather than keeping Uptime Kuma's 180-day
      # default. 19 monitors at 60s is ~27k rows/day.
      #
      # This MUST be seeded here rather than clicked in the UI. Retention lives
      # in Kuma's `setting` table, so a value set through the browser is
      # destroyed by `uis undeploy --purge` and silently reverts to 180 days -
      # the same non-reproducibility the first-run wizard had.
      #
      # Values are JSON-encoded (Kuma's Settings.set does JSON.stringify, and
      # get does JSON.parse), so a number goes in bare - '30', not '"30"'.
      # Idempotent: on conflict it updates, so re-running is safe.
      ansible.builtin.shell: |
        set -o pipefail
        CUR=$(kubectl exec -n {{ namespace }} {{ component_name }}-0 \
                --kubeconfig {{ merged_kubeconf_file }} -- \
                sqlite3 /app/data/kuma.db \
                "select value from setting where key='keepDataPeriodDays';" | tr -d '\r')
        if [ "$CUR" = "{{ kuma_retention_days }}" ]; then
          echo RETENTION_ALREADY_SET; exit 0
        fi
        kubectl exec -n {{ namespace }} {{ component_name }}-0 \
          --kubeconfig {{ merged_kubeconf_file }} -- \
          sqlite3 /app/data/kuma.db \
          "insert into setting (key, value, type)
           values ('keepDataPeriodDays', '{{ kuma_retention_days }}', 'general')
           on conflict(key) do update
           set value='{{ kuma_retention_days }}', type='general';"
        echo RETENTION_UPDATED
      args:
        executable: /bin/bash
      register: kuma_retention_set
      # Distinct tokens, not CHANGED/UNCHANGED: 'CHANGED' in 'UNCHANGED' is
      # substring-true, which made this report changed on every run and restart
      # Kuma needlessly.
      changed_when: "'RETENTION_UPDATED' in kuma_retention_set.stdout"

    - name: "9.2 Verify retention was stored as a number Kuma can parse"
      # A quoted value would JSON.parse to the string "30" and Kuma's cleanup
      # comparison would misbehave. Check the stored form, not just that the
      # row exists - a row existing is not the same as it being correct.
      ansible.builtin.command: >
        kubectl exec -n {{ namespace }} {{ component_name }}-0
        --kubeconfig {{ merged_kubeconf_file }} --
        sqlite3 /app/data/kuma.db
        "select value from setting where key='keepDataPeriodDays';"
      register: kuma_retention_check
      changed_when: false
      failed_when: kuma_retention_check.stdout | trim != kuma_retention_days | string

    # ---- alert channel -----------------------------------------------------
    # An installed watchdog that notifies nobody is a dashboard. This is the
    # step that makes it a watchdog.
    #
    # ⚠️ Seeded here rather than left to AutoKuma. AutoKuma CAN manage
    # notifications - a file with "type": "notification" is accepted and alerts
    # deliver correctly - but 2.0.0 never converges, rewriting the channel every
    # ~5 seconds forever. That is a database write every 5s on what is usually
    # flash storage.
    - name: "9.3 Is an alert channel configured?"
      ansible.builtin.set_fact:
        _ntfy_topic: "{{ (kuma_secret.resources[0].data['uptime-kuma-ntfy-topic'] | default('') | b64decode) | trim }}"
        _ntfy_server: "{{ (kuma_secret.resources[0].data['uptime-kuma-ntfy-server'] | default('') | b64decode) | trim or 'https://ntfy.sh' }}"
      no_log: true

    - name: "9.4 Note that alerting is not configured"
      # Not a failure. A watchdog with no channel still monitors - the user just
      # has to look. Say so plainly rather than deploying silently.
      ansible.builtin.debug:
        msg:
          - "No alert channel configured - nothing will notify you."
          - "Set UPTIME_KUMA_NTFY_TOPIC in the secrets template, then:"
          - "  uis secrets generate && uis secrets apply && uis deploy uptime-kuma"
      when: _ntfy_topic | length == 0

    - name: "9.5 Seed the ntfy alert channel"
      # Idempotent on name. Config is JSON on stdin so the topic never appears
      # in a process list.
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s' "$CFG" | kubectl exec -i -n {{ namespace }} {{ component_name }}-0 \
          --kubeconfig {{ merged_kubeconf_file }} -- sh -c '
            read -r C
            sqlite3 /app/data/kuma.db <<SQL
        insert into notification (name, active, user_id, is_default, config)
        select "uis-alerts", 1, 1, 0, '"'"'$C'"'"'
        where not exists (select 1 from notification where name = "uis-alerts");
        SQL
          '
      args:
        executable: /bin/bash
      environment:
        # ⚠️ Build a mapping and serialise with to_json. A hand-written JSON
        # STRING here does not survive: Ansible sees something that looks like a
        # Python literal, converts it to a dict, and str()s it back with single
        # quotes - which sqlite then rejects as a syntax error. Verified.
        CFG: >-
          {{ {'name': 'uis-alerts',
              'type': 'ntfy',
              'ntfyserverurl': _ntfy_server,
              'ntfytopic': _ntfy_topic,
              'ntfyPriority': 5,
              'ntfyAuthenticationMethod': 'none',
              'ntfyIcon': '',
              'isDefault': false,
              'applyExisting': false} | to_json }}
      when: _ntfy_topic | length > 0
      no_log: true
      changed_when: true

    - name: "9.6 Seed the ntfy info channel (daytime severity)"
      # Idempotent on name. Config is JSON on stdin so the topic never appears
      # in a process list.
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s' "$CFG" | kubectl exec -i -n {{ namespace }} {{ component_name }}-0 \
          --kubeconfig {{ merged_kubeconf_file }} -- sh -c '
            read -r C
            sqlite3 /app/data/kuma.db <<SQL
        insert into notification (name, active, user_id, is_default, config)
        select "uis-info", 1, 1, 0, '"'"'$C'"'"'
        where not exists (select 1 from notification where name = "uis-info");
        SQL
          '
      args:
        executable: /bin/bash
      environment:
        # ⚠️ Build a mapping and serialise with to_json. A hand-written JSON
        # STRING here does not survive: Ansible sees something that looks like a
        # Python literal, converts it to a dict, and str()s it back with single
        # quotes - which sqlite then rejects as a syntax error. Verified.
        CFG: >-
          {{ {'name': 'uis-info',
              'type': 'ntfy',
              'ntfyserverurl': _ntfy_server,
              'ntfytopic': _ntfy_topic,
              'ntfyPriority': 3,
              'ntfyAuthenticationMethod': 'none',
              'ntfyIcon': '',
              'isDefault': false,
              'applyExisting': false} | to_json }}
      when: _ntfy_topic | length > 0
      no_log: true
      changed_when: true

    - name: "9.6 Verify the channel is usable, not merely present"
      # A row existing is not the same as it working. Check the stored config
      # parses and carries the provider type Kuma dispatches on.
      ansible.builtin.command: >
        kubectl exec -n {{ namespace }} {{ component_name }}-0
        --kubeconfig {{ merged_kubeconf_file }} --
        sqlite3 /app/data/kuma.db
        "select json_extract(config,'$.type') from notification where name='uis-alerts';"
      register: kuma_notif_check
      changed_when: false
      failed_when: kuma_notif_check.stdout | trim != 'ntfy'
      when: _ntfy_topic | length > 0

    - name: "10. Restart so needSetup is recomputed / settings cache is reloaded"
      # Kuma caches settings in memory, so a retention change needs a restart to
      # take effect - not just the row being written.
      ansible.builtin.command: >
        kubectl rollout restart statefulset/{{ component_name }} -n {{ namespace }}
        --kubeconfig {{ merged_kubeconf_file }}
      when: (kuma_seed.changed | default(false)) or (kuma_retention_set.changed | default(false))

    - name: "10.1 Wait for the restart"
      ansible.builtin.command: >
        kubectl rollout status statefulset/{{ component_name }} -n {{ namespace }}
        --timeout=240s --kubeconfig {{ merged_kubeconf_file }}
      changed_when: false
      when: (kuma_seed.changed | default(false)) or (kuma_retention_set.changed | default(false))

    - name: "11. Confirm the wizard is gone"
      ansible.builtin.shell: >
        kubectl run kuma-setupcheck-{{ 999 | random }}
        -n {{ namespace }} --rm -i --restart=Never --quiet
        --image=curlimages/curl:latest --
        curl -s -o /dev/null -w '%{redirect_url}'
        -m 10 http://{{ component_name }}.{{ namespace }}.svc.cluster.local:3001/
        < /dev/null | tail -c 60
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: kuma_redirect
      retries: 20
      delay: 6
      until: kuma_redirect.stdout is search('dashboard|login')
      changed_when: false

    # The redirect check above is NOT sufficient on its own: it flips as soon
    # as ANY row exists in the user table, including a broken one. An earlier
    # version of task 9 created an account with an empty username and this
    # playbook still reported success. Verify the credential actually works.
    - name: "11.1 Verify the seeded credential actually authenticates"
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s\n%s\n' "$KUMA_USER" "$KUMA_PW" \
        | kubectl exec -i -n {{ namespace }} {{ component_name }}-0 \
            --kubeconfig {{ merged_kubeconf_file }} -- sh -c '
              read -r U
              read -r P
              H=$(sqlite3 /app/data/kuma.db "select password from user where username = \"$U\";")
              [ -n "$H" ] || { echo "NO_SUCH_USER"; exit 0; }
              cd /app && P="$P" H="$H" node -e "
                const b = require(\"bcryptjs\");
                console.log(b.compareSync(process.env.P, process.env.H) ? \"AUTH_OK\" : \"HASH_MISMATCH\");
              "
            '
      args:
        executable: /bin/bash
      environment:
        KUMA_PW: "{{ kuma_secret.resources[0].data['uptime-kuma-admin-password'] | b64decode }}"
        KUMA_USER: "{{ kuma_secret.resources[0].data['uptime-kuma-admin-user'] | b64decode }}"
      register: kuma_auth
      changed_when: false
      failed_when: "'AUTH_OK' not in kuma_auth.stdout"
      no_log: true

    - name: "11.2 Report the credential check"
      ansible.builtin.debug:
        msg: "Admin credential verified - the seeded password authenticates"

    - name: "12. Deployment complete"
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "Uptime Kuma deployed"
          - "==============================================="
          - ""
          - "URL: http://uptime-kuma.localhost"
          - "Health: HTTP {{ kuma_http.stdout }}   Data volume: mounted"
          - ""
          - "Admin account: {{ kuma_secret.resources[0].data['uptime-kuma-admin-user'] | b64decode }}"
          - "Password: the shared DEFAULT_ADMIN_PASSWORD from urbalurba-secrets"
          - "{{ 'Account seeded on this run - no browser wizard needed.' if (kuma_seed.changed | default(false)) else 'Account already existed - left untouched.' }}"
          - ""
          - "WARNING - where this should run:"
          - "  Uptime Kuma is an EXTERNAL watchdog. If you have just deployed it"
          - "  onto the cluster you intend to monitor, it cannot tell you when"
          - "  that cluster is down - which is the one case it exists for."
          - "  Run it on a host outside the platform it watches."
