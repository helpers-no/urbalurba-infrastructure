---
# file: ansible/playbooks/026-setup-external-secrets.yml
# Description:
# Install External Secrets Operator (ESO) - the operator and its CRDs only. No
# ClusterSecretStore is created here; that is each consuming service's own concern
# (see service-bao.sh / 027-setup-bao.yml for the first one).
#
# Same Helm repo/chart platforms/proxmox/ansible/playbooks/k3s-bao-ensure.yml already
# installs this from, proven against real hardware this session.
#
# Usage:
# ansible-playbook playbooks/026-setup-external-secrets.yml -e target_host="rancher-desktop"

- name: Install External Secrets Operator
  hosts: localhost
  gather_facts: false
  vars:
    merged_kubeconf_file: "/mnt/urbalurbadisk/.uis.secrets/generated/kubeconfig/kubeconf-all"
    eso_namespace: "external-secrets"
    eso_chart: "external-secrets/external-secrets"
    eso_repo_url: "https://charts.external-secrets.io"
    installation_timeout: 300
    # 🔴 STILL UNVERIFIED IN THIS ENVIRONMENT: pinned for reproducibility, same convention every
    # other Helm-based service here follows, but not independently confirmed against a live Helm
    # repo index. imac must confirm `helm repo update && helm search repo external-secrets/external-secrets
    # --versions` actually lists it before trusting this to run unattended.
    eso_chart_version: "0.10.7"

  tasks:
    - name: 1. Check if required variables are provided
      ansible.builtin.fail:
        msg: "The variable 'target_host' is mandatory. Use -e target_host=your_host_name to specify it."
      when: target_host is not defined

    - name: 2. Print playbook description
      ansible.builtin.debug:
        msg: "Installing External Secrets Operator on Kubernetes context: {{ target_host }}"

    - name: 3. Check existing Helm repositories
      ansible.builtin.command: helm repo list
      register: helm_repo_list
      changed_when: false

    - name: 4. Add the external-secrets Helm repository if needed
      kubernetes.core.helm_repository:
        name: "external-secrets"
        repo_url: "{{ eso_repo_url }}"
      when: "'external-secrets' not in helm_repo_list.stdout"

    # 🔴 PLAIN `helm repo update` — no `--force-update`. That flag exists on `helm repo add`
    # (where this repo's own test-metadata.sh enforces it, for idempotency across container
    # rebuilds), not on `helm repo update` — Helm 3.22.1 has no such flag there at all.
    # Live-confirmed by imac (urb-agents#1956): this blocked this playbook outright, before
    # anything else ran.
    - name: 5. Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: 6. Create external-secrets namespace if it doesn't exist
      ansible.builtin.shell: kubectl create namespace {{ eso_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: namespace_result
      changed_when: namespace_result.rc == 0
      failed_when: namespace_result.rc != 0

    - name: 7. Deploy External Secrets Operator via Helm (installs its own CRDs)
      ansible.builtin.command: >
        helm upgrade --install external-secrets {{ eso_chart }}
        --namespace {{ eso_namespace }}
        --version {{ eso_chart_version }}
        --set installCRDs=true
        --timeout {{ installation_timeout }}s
      environment:
        KUBECONFIG: "{{ merged_kubeconf_file }}"
      register: eso_result
      changed_when: true

    - name: 8. Wait for the ESO controller to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ eso_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=external-secrets"
        kubeconfig: "{{ merged_kubeconf_file }}"
      register: eso_pods
      retries: 30
      delay: 10
      until: >
        eso_pods.resources | length > 0 and
        eso_pods.resources[0].status.phase == "Running" and
        eso_pods.resources[0].status.containerStatuses[0].ready == true

    - name: 9. Display final deployment status
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "🔐 External Secrets Operator Deployment Status"
          - "==============================================="
          - ""
          - "✅ SUCCESS - External Secrets Operator installed and ready"
          - ""
          - "This installs the operator and its CRDs only - no ClusterSecretStore exists yet."
          - "A service that needs one (e.g. OpenBao: ./uis deploy bao) creates and owns it."
          - ""
          - "🔧 Troubleshooting:"
          - "• Check pods: kubectl get pods -n {{ eso_namespace }}"
          - "• Check stores: kubectl get clustersecretstores"
          - "==============================================="
