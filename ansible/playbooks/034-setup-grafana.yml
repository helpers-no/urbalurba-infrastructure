---
# File: ansible/playbooks/034-setup-grafana.yml
# Description: Deploy Grafana for Urbalurba Infrastructure
# Usage: ansible-playbook 034-setup-grafana.yml -e "target_host=rancher-desktop"

- name: Deploy Grafana for Urbalurba Infrastructure
  hosts: localhost
  gather_facts: false

  vars:
    # target_host passed via -e, use _target for internal reference to avoid recursion
    _target: "{{ target_host | default('rancher-desktop') }}"
    namespace: "monitoring"
    component_name: "grafana"
    manifests_folder: "/mnt/urbalurbadisk/manifests"
    grafana_config_file: "{{ manifests_folder }}/034-grafana-config.yaml"

    helm_repos:
      - name: grafana
        url: https://grafana.github.io/helm-charts

  tasks:
    - name: 1. Display deployment information
      ansible.builtin.debug:
        msg:
          - "======================================"
          - "Grafana Deployment"
          - "File: ansible/playbooks/034-setup-grafana.yml"
          - "======================================"
          - "Target Host: {{ _target }}"
          - "Namespace: {{ namespace }}"
          - "Component: {{ component_name }}"
          - "Config File: {{ grafana_config_file }}"

    - name: 2. Create monitoring namespace
      kubernetes.core.k8s:
        name: "{{ namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        context: "{{ _target }}"

    - name: 3. Add/update Helm repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
      loop: "{{ helm_repos }}"

    - name: 4. Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: 5. Check if Grafana values file exists
      ansible.builtin.stat:
        path: "{{ grafana_config_file }}"
      register: grafana_values_file

    - name: 6. Fail if config file doesn't exist
      ansible.builtin.fail:
        msg: "Grafana config file not found: {{ grafana_config_file }}"
      when: not grafana_values_file.stat.exists

    - name: 7. Install/upgrade Grafana with datasources
      kubernetes.core.helm:
        name: grafana
        chart_ref: grafana/grafana
        release_namespace: "{{ namespace }}"
        create_namespace: true
        state: present
        context: "{{ _target }}"
        values_files:
          - "{{ grafana_config_file }}"

    - name: 8. Wait for Grafana pods to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - app.kubernetes.io/name=grafana
        context: "{{ _target }}"
      register: grafana_pods
      retries: 20
      delay: 15
      until: >
        grafana_pods.resources | length > 0 and
        grafana_pods.resources[0].status.phase == "Running" and
        grafana_pods.resources[0].status.containerStatuses[0].ready == true

    - name: 9. Test Grafana health endpoint
      ansible.builtin.command: >
        kubectl run curl-test-grafana-health --image=curlimages/curl --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=10s --
        curl -s -o /dev/null -w "HTTP_CODE:%{http_code}"
        http://grafana.{{ namespace }}.svc.cluster.local:80/api/health
      register: grafana_health_test
      retries: 10
      delay: 10
      until: grafana_health_test.rc == 0 and (grafana_health_test.stdout.find('HTTP_CODE:200') != -1)
      failed_when: false

    - name: 10. Test Prometheus datasource connectivity
      ansible.builtin.command: >
        kubectl run curl-test-grafana-prometheus --image=curlimages/curl --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=10s --
        curl -s -u admin:SecretPassword1 -o /dev/null -w "HTTP_CODE:%{http_code}"
        "http://grafana.{{ namespace }}.svc.cluster.local:80/api/datasources/proxy/1/api/v1/status/runtimeinfo"
      register: grafana_prometheus_test
      # Backstop only - task 9b is what makes this deterministic.
      retries: 12
      delay: 5
      until: grafana_prometheus_test.rc == 0 and (grafana_prometheus_test.stdout.find('HTTP_CODE:200') != -1)
      failed_when: false

    - name: 11. Test Loki datasource connectivity
      ansible.builtin.command: >
        kubectl run curl-test-grafana-loki --image=curlimages/curl --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=10s --
        curl -s -u admin:SecretPassword1 -o /dev/null -w "HTTP_CODE:%{http_code}"
        "http://grafana.{{ namespace }}.svc.cluster.local:80/api/datasources/proxy/2/loki/api/v1/labels"
      register: grafana_loki_test
      # Backstop only - task 9b is what makes this deterministic.
      retries: 12
      delay: 5
      until: grafana_loki_test.rc == 0 and (grafana_loki_test.stdout.find('HTTP_CODE:200') != -1)
      failed_when: false

    - name: 12. Test Tempo datasource connectivity
      ansible.builtin.command: >
        kubectl run curl-test-grafana-tempo --image=curlimages/curl --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=10s --
        curl -s -u admin:SecretPassword1 -o /dev/null -w "HTTP_CODE:%{http_code}"
        "http://grafana.{{ namespace }}.svc.cluster.local:80/api/datasources/proxy/3/ready"
      register: grafana_tempo_test
      # Backstop only - task 9b is what makes this deterministic.
      retries: 12
      delay: 5
      until: grafana_tempo_test.rc == 0 and (grafana_tempo_test.stdout.find('HTTP_CODE:200') != -1)
      failed_when: false

    - name: 13. Test Prometheus data query via Grafana
      ansible.builtin.command: >
        kubectl run curl-test-grafana-prometheus-data --image=curlimages/curl --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=15s --
        curl -s -u admin:SecretPassword1 -w "HTTP_CODE:%{http_code}"
        --data-urlencode 'query=up'
        "http://grafana.{{ namespace }}.svc.cluster.local:80/api/datasources/proxy/1/api/v1/query"
      register: grafana_prometheus_data_test
      # This is the ONLY probe left that aborts the deploy, so it must be
      # deterministic: 30s was not enough on a cold cluster, where Prometheus has
      # not completed its first scrape when Grafana comes up. 2 minutes is.
      retries: 12
      delay: 10
      until: grafana_prometheus_data_test.rc == 0 and (grafana_prometheus_data_test.stdout.find('HTTP_CODE:200') != -1) and (grafana_prometheus_data_test.stdout.find('"status":"success"') != -1)
      failed_when: false

    - name: 14. E2E TEST - Send test logs via OTEL to Loki
      ansible.builtin.command: >
        kubectl run grafana-e2e-logs --image=ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=60s --
        logs --otlp-endpoint=otel-collector-opentelemetry-collector.{{ namespace }}.svc.cluster.local:4318
        --otlp-insecure --otlp-http --duration=3s --logs=10
        --telemetry-attributes service.name=\"grafana-e2e-validation\" --telemetry-attributes test.type=\"grafana-datasource-test\"
        --body="E2E: OTEL → Loki → Grafana query validation"
      register: grafana_e2e_logs
      retries: 2
      delay: 5
      until: grafana_e2e_logs.rc == 0
      failed_when: false

    - name: 15. Wait for logs to be indexed in Loki
      ansible.builtin.pause:
        seconds: 5
      when: grafana_e2e_logs.rc == 0

    - name: 16. VERIFY - Query Loki via Grafana for E2E test logs
      ansible.builtin.command: >
        kubectl run grafana-verify-loki-e2e --image=curlimages/curl --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=20s --
        /bin/sh -c 'NOW=$(date +%s); START=$((NOW-900)); curl -s -u admin:SecretPassword1 -G --data-urlencode "query={service_name=\"telemetrygen\"}" --data-urlencode "start=${START}000000000" --data-urlencode "end=${NOW}000000000" --data-urlencode "limit=5" "http://grafana.{{ namespace }}.svc.cluster.local:80/api/datasources/proxy/2/loki/api/v1/query_range"'
      register: grafana_loki_e2e_verify
      # Reported, not fatal - but a probe that gives up before the backend has
      # flushed reports a failure that is not real, so give it a real window.
      # 12x10s = 2min of patience against a 15min lookback: the retry budget
      # must stay well inside the query window, or the last attempts search a
      # period that no longer contains the logs this task just sent.
      retries: 12
      delay: 10
      until: grafana_loki_e2e_verify.rc == 0 and (grafana_loki_e2e_verify.stdout.find('"status":"success"') != -1) and (grafana_loki_e2e_verify.stdout.find('grafana-datasource-test') != -1)
      failed_when: false
      when: grafana_e2e_logs.rc == 0

    - name: 17. E2E TEST - Send test traces via OTEL to Tempo
      ansible.builtin.command: >
        kubectl run grafana-e2e-traces --image=ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=60s --
        traces --otlp-endpoint=otel-collector-opentelemetry-collector.{{ namespace }}.svc.cluster.local:4317
        --otlp-insecure --duration=3s --traces=5
        --telemetry-attributes service.name=\"grafana-e2e-validation\" --telemetry-attributes test.type=\"grafana-datasource-test\"
      register: grafana_e2e_traces
      retries: 2
      delay: 5
      until: grafana_e2e_traces.rc == 0
      failed_when: false

    - name: 18. Wait for traces to be indexed in Tempo
      ansible.builtin.pause:
        seconds: 10
      when: grafana_e2e_traces.rc == 0

    - name: 19. VERIFY - Query Tempo via Grafana for E2E test traces
      ansible.builtin.command: >
        kubectl run grafana-verify-tempo-e2e --image=curlimages/curl --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=20s --
        /bin/sh -c 'NOW=$(date +%s); START=$((NOW-900)); curl -s -u admin:SecretPassword1 -G --data-urlencode "q={.service.name=\"grafana-e2e-validation\"}" --data-urlencode "start=$START" --data-urlencode "end=$NOW" --data-urlencode "limit=5" "http://grafana.{{ namespace }}.svc.cluster.local:80/api/datasources/proxy/3/api/search"'
      register: grafana_tempo_e2e_verify
      # Tempo only makes a trace searchable once the block is flushed, which is
      # the slowest step in the whole suite - hence the widest window here.
      retries: 12
      delay: 10
      until: grafana_tempo_e2e_verify.rc == 0 and (grafana_tempo_e2e_verify.stdout.find('"traces"') != -1) and (grafana_tempo_e2e_verify.stdout.find('grafana-e2e-validation') != -1)
      failed_when: false
      when: grafana_e2e_traces.rc == 0

    # ⚠️ DASHBOARDS ARE APPLIED BEFORE THE E2E GATE BELOW, DELIBERATELY.
    # The gate (task 20) aborts the play when the trace round-trip test fails,
    # and that test races Tempo's block flush - a known defect (OBS-F6) that
    # fires while the stack is perfectly healthy. Because the play aborted,
    # EVERY dashboard apply below it was skipped: this installation reported
    # dashboards as deployed and had zero ConfigMaps. Dashboards do not depend
    # on traces being searchable, so they must not be gated behind that test.

    - name: "Is PostgreSQL being scraped? (decides the postgres dashboard)"
      # Condition on the METRIC, not on "is the postgresql service deployed".
      # A production install may run PostgreSQL outside the cluster and still
      # deserves the dashboard; and a dashboard whose panels all read "No data"
      # is worse than an absent one - it looks broken, so people stop trusting
      # every dashboard.
      ansible.builtin.shell: >
        kubectl exec -n {{ namespace }} deploy/prometheus-server -c prometheus-server
        --context {{ _target }} --
        wget -qO- "http://localhost:9090/api/v1/query?query=pg_up" 2>/dev/null
      register: pg_up_probe
      failed_when: false
      changed_when: false

    - name: "Deploy the PostgreSQL dashboard (only if pg metrics exist)"
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests_folder }}/037-grafana-postgresql-dashboard.yaml"
        context: "{{ _target }}"
      when: (pg_up_probe.stdout | default('')) is search('"metric"')

    - name: "Say why the PostgreSQL dashboard was skipped"
      ansible.builtin.debug:
        msg:
          - "No pg_up metric, so the PostgreSQL dashboard was not applied."
          - "Every panel would read 'No data', which reads as broken."
          - "Deploy a postgres exporter and re-run to get it."
      when: (pg_up_probe.stdout | default('')) is not search('"metric"')

    - name: "20b. Round-trip telemetry probes (reported, not fatal)"
      # Deliberately loud. These probes are the ONLY check that telemetry survives
      # the whole path, rather than that each component answers individually - so a
      # failure must stay visible even though it no longer aborts the deploy. A
      # warning nobody reads is no better than a silent pass.
      ansible.builtin.debug:
        msg: "{{ _rt_ok | ternary(_rt_pass, _rt_fail) }}"
      vars:
        _rt_ok: >-
          {{ (grafana_loki_e2e_verify.stdout | default('')) is search('grafana-datasource-test')
             and (grafana_tempo_e2e_verify.stdout | default('')) is search('grafana-e2e-validation') }}
        _rt_pass: "OK - telemetry pushed via OTLP was queryable back through Grafana."
        _rt_fail: >-
          WARNING - round-trip probes did not verify. The datasources are reachable and
          the stack is usable, but telemetry pushed via OTLP was not queryable back
          within the retry window. Either the backends had not flushed yet, or the OTLP
          pipeline into Loki/Tempo is not delivering. Investigate with:
          kubectl logs -n monitoring deploy/otel-collector-opentelemetry-collector


    - name: 21. Deploy Installation Test Suite dashboards
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests_folder }}/035-grafana-test-dashboards.yaml"
        context: "{{ _target }}"

    - name: 22. Deploy sovdev-logger Overview dashboard
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests_folder }}/036-grafana-sovdev-metrics.yaml"
        context: "{{ _target }}"

    - name: 20. FAIL deployment if core tests did not pass
      ansible.builtin.fail:
        msg: |
          ❌ GRAFANA DATASOURCE VALIDATION FAILED!

          Connectivity tests:
          Health endpoint: {{ 'PASS' if grafana_health_test.stdout.find('HTTP_CODE:200') != -1 else 'FAIL' }}
          Prometheus datasource: {{ 'PASS' if grafana_prometheus_test.stdout.find('HTTP_CODE:200') != -1 else 'FAIL' }}
          Loki datasource: {{ 'PASS' if grafana_loki_test.stdout.find('HTTP_CODE:200') != -1 else 'FAIL' }}
          Tempo datasource: {{ 'PASS' if grafana_tempo_test.stdout.find('HTTP_CODE:200') != -1 else 'FAIL' }}
          Prometheus data query: {{ 'PASS' if grafana_prometheus_data_test.stdout.find('HTTP_CODE:200') != -1 and grafana_prometheus_data_test.stdout.find('"status":"success"') != -1 else 'FAIL' }}

          E2E datasource tests:
          Loki (OTEL→Loki→Grafana query): {{ 'PASS' if grafana_loki_e2e_verify is defined and grafana_loki_e2e_verify.stdout is defined and grafana_loki_e2e_verify.stdout.find('"status":"success"') != -1 and grafana_loki_e2e_verify.stdout.find('grafana-datasource-test') != -1 else 'FAIL' }}
          Tempo (OTEL→Tempo→Grafana query): {{ 'PASS' if grafana_tempo_e2e_verify is defined and grafana_tempo_e2e_verify.stdout is defined and grafana_tempo_e2e_verify.stdout.find('"traces"') != -1 and grafana_tempo_e2e_verify.stdout.find('grafana-e2e-validation') != -1 else 'FAIL' }}

          All datasources MUST be configured and queryable for successful deployment!
      # ⚠️ HARD-FAILS ONLY ON CONNECTIVITY.
      # The two round-trip probes used to be in this condition and aborted the
      # deployment of a HEALTHY stack (OBS-F6): they push telemetry and query it
      # back within a few retries, racing Tempo's block flush and the collector's
      # log pipeline. Because the play aborted, the `enable` step never ran - and
      # no dashboard was ever applied either.
      #
      # 'A probe did not verify' is not 'the stack is broken'. Conflating them
      # makes every automated stand-up report failure. The probes still run and
      # still report loudly - see task 20b.
      when: >
        not (grafana_health_test.stdout.find('HTTP_CODE:200') != -1) or
        not (grafana_prometheus_test.stdout.find('HTTP_CODE:200') != -1) or
        not (grafana_loki_test.stdout.find('HTTP_CODE:200') != -1) or
        not (grafana_tempo_test.stdout.find('HTTP_CODE:200') != -1) or
        not (grafana_prometheus_data_test.stdout.find('HTTP_CODE:200') != -1 and grafana_prometheus_data_test.stdout.find('"status":"success"') != -1)


    - name: 23. Wait for dashboard ConfigMaps to be created
      kubernetes.core.k8s_info:
        kind: ConfigMap
        namespace: "{{ namespace }}"
        label_selectors:
          - grafana_dashboard=1
        context: "{{ _target }}"
      register: dashboard_configmaps
      retries: 5
      delay: 2
      until: dashboard_configmaps.resources | length >= 4

    - name: 24. Generate test data - Send logs for dashboard
      ansible.builtin.command: >
        kubectl run telemetrygen-dashboard-logs --image=ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=60s --
        logs --otlp-endpoint=otel-collector-opentelemetry-collector.{{ namespace }}.svc.cluster.local:4318
        --otlp-insecure --otlp-http --duration=10s --logs=100 --service telemetrygen-logs
        --body "Test log entry for Installation Test Suite dashboard"
      register: test_logs
      retries: 2
      delay: 3
      until: test_logs.rc == 0
      failed_when: false

    - name: 25. Generate test data - Send traces for dashboard
      ansible.builtin.command: >
        kubectl run telemetrygen-dashboard-traces --image=ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest --rm -i --restart=Never
        -n {{ namespace }} --context {{ _target }} --timeout=60s --
        traces --otlp-endpoint=otel-collector-opentelemetry-collector.{{ namespace }}.svc.cluster.local:4317
        --otlp-insecure --duration=5s --traces=20 --service telemetrygen-traces
      register: test_traces
      retries: 2
      delay: 3
      until: test_traces.rc == 0
      failed_when: false

    - name: 26. Wait for test data to be indexed
      ansible.builtin.pause:
        seconds: 5

    - name: 27. Deploy Grafana IngressRoute
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests_folder }}/038-grafana-ingressroute.yaml"
        context: "{{ _target }}"

    - name: 28. Wait for IngressRoute to be ready
      kubernetes.core.k8s_info:
        kind: IngressRoute
        name: grafana
        namespace: "{{ namespace }}"
        api_version: traefik.io/v1alpha1
        context: "{{ _target }}"
      register: grafana_ingressroute
      retries: 5
      delay: 2
      until: grafana_ingressroute.resources | length > 0

    - name: 29. Display deployment status
      ansible.builtin.debug:
        msg:
          - "✅ Grafana deployment completed successfully!"
          - ""
          - "Service endpoints:"
          - "  📊 Grafana UI: grafana.monitoring.svc.cluster.local:80"
          - "  🔗 Health check: grafana.monitoring.svc.cluster.local:80/api/health"
          - "  👤 Credentials: admin / SecretPassword1"
          - ""
          - "Datasource connectivity tests:"
          - "  🏥 Health endpoint: {{ 'PASS ✅' if grafana_health_test.stdout.find('HTTP_CODE:200') != -1 else 'FAIL ❌' }}"
          - "  📈 Prometheus datasource: {{ 'PASS ✅' if grafana_prometheus_test.stdout.find('HTTP_CODE:200') != -1 else 'FAIL ❌' }}"
          - "  📋 Loki datasource: {{ 'PASS ✅' if grafana_loki_test.stdout.find('HTTP_CODE:200') != -1 else 'FAIL ❌' }}"
          - "  🔍 Tempo datasource: {{ 'PASS ✅' if grafana_tempo_test.stdout.find('HTTP_CODE:200') != -1 else 'FAIL ❌' }}"
          - ""
          - "Data query validation:"
          - "  📊 Prometheus data query: {{ 'PASS ✅' if grafana_prometheus_data_test.stdout.find('HTTP_CODE:200') != -1 and grafana_prometheus_data_test.stdout.find('\"status\":\"success\"') != -1 else 'FAIL ❌' }}"
          - ""
          - "END-TO-END Grafana Datasource Validation:"
          - "  📋 Loki (OTEL→Loki→Grafana query): {{ 'PASS ✅' if grafana_loki_e2e_verify is defined and grafana_loki_e2e_verify.stdout is defined and grafana_loki_e2e_verify.stdout.find('\"status\":\"success\"') != -1 and grafana_loki_e2e_verify.stdout.find('grafana-datasource-test') != -1 else 'FAIL ❌' }}"
          - "  🔍 Tempo (OTEL→Tempo→Grafana query): {{ 'PASS ✅' if grafana_tempo_e2e_verify is defined and grafana_tempo_e2e_verify.stdout is defined and grafana_tempo_e2e_verify.stdout.find('\"traces\"') != -1 and grafana_tempo_e2e_verify.stdout.find('grafana-e2e-validation') != -1 else 'FAIL ❌' }}"
          - ""
          - "Datasource configuration:"
          - "  1. Prometheus: http://prometheus-server.monitoring.svc.cluster.local:80 (default)"
          - "  2. Loki: http://loki-gateway.monitoring.svc.cluster.local:80"
          - "  3. Tempo: http://tempo.monitoring.svc.cluster.local:3200"
          - ""
          - "Dashboards deployed:"
          - "  📊 {{ dashboard_configmaps.resources | length }} dashboards deployed"
          - "  🏷️  Label: grafana_dashboard=1"
          - "  📁 Installation Test Suite: Test Data - Logs, Test Data - Traces, Test Data - Metrics"
          - "  📁 Sovdev Logger: Sovdev Logger - Overview"
          - ""
          - "Test data generation:"
          - "  📋 Logs: {{ 'Sent ✅' if test_logs is defined and test_logs.rc == 0 else 'Failed ❌' }} (service: telemetrygen-logs)"
          - "  🔍 Traces: {{ 'Sent ✅' if test_traces is defined and test_traces.rc == 0 else 'Failed ❌' }} (service: telemetrygen-traces)"
          - "  📊 Metrics: Available from Prometheus 'up' query"
          - ""
          - "Ingress configuration:"
          - "  🌐 IngressRoute: {{ 'Ready ✅' if grafana_ingressroute.resources | length > 0 else 'Not found ❌' }}"
          - "  🔗 Access URL: http://grafana.localhost"
          - "  🌍 Pattern: grafana.* (supports multiple domains)"
          - ""
          - "Access Grafana UI:"
          - "  http://grafana.localhost (via ingress)"
          - "  kubectl port-forward -n {{ namespace }} svc/grafana 3000:80 --context={{ _target }}"
          - "  Open: http://localhost:3000"
          - ""
          - "Manual verification:"
          - "  kubectl get pods -n {{ namespace }} -l app.kubernetes.io/name=grafana --context={{ _target }}"
          - "  kubectl get configmaps -n {{ namespace }} -l grafana_dashboard=1 --context={{ _target }}"
          - "  kubectl get ingressroute -n {{ namespace }} grafana --context={{ _target }}"
