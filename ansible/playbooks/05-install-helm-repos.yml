---
# file: playbooks/05-install-helm-repos.yml
# Install Helm repositories for the ansible user
# NOTE: These repositories must be kept in sync with provision-host-04-helmrepo.sh
# If you add or remove repositories here, make sure to update the direct installation in that script as well.

- name: Install Helm repositories
  hosts: localhost
  gather_facts: true
  tasks:
    # 🔴 ONE FLAKY EXTERNAL REPO MUST NOT FAIL THE WHOLE CONTAINER BUILD. Found live,
    # 2026-10-28: helm.runix.net was transiently unreachable from GitHub's own runners
    # (Azure's internal resolver failing on its CNAME chain), and because this task had no
    # `ignore_errors`, the one failed loop item marked the whole task (and the play) failed,
    # which aborted `ansible-playbook` with a nonzero exit, which failed the Docker build
    # entirely — blocking every merge to main, not just whatever PR happened to trigger the
    # next build. Pre-seeding these repos is a build-time convenience only: every service
    # that actually needs one of them (e.g. pgadmin/runix in 641-adm-pgadmin.yml) re-adds its
    # own repo at deploy time anyway, so one repo failing to pre-seed here is never load-
    # bearing. `ignore_errors` keeps the play going; the task below still reports it loudly,
    # it just doesn't fail the build over it.
    - name: Add Helm repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
      loop:
        - { name: 'bitnami', url: 'https://charts.bitnami.com/bitnami' }
        - { name: 'runix', url: 'https://helm.runix.net' }
        - { name: 'graviteeio', url: 'https://helm.gravitee.io' }
        - { name: 'rhdh-chart', url: 'https://redhat-developer.github.io/rhdh-chart' }
        - { name: 'minio', url: 'https://charts.min.io/' }
        # Loki, Tempo and Alloy all come from here.
        - { name: 'grafana', url: 'https://grafana.github.io/helm-charts' }
        - { name: 'temporal', url: 'https://go.temporal.io/helm-charts' }
        - { name: 'dagster', url: 'https://dagster-io.github.io/helm' }
      register: helm_repo_result
      ignore_errors: true

    - name: Warn, loudly, about any repo that failed to register (non-fatal, not silent)
      ansible.builtin.debug:
        msg: >-
          ⚠️ Helm repo '{{ item.item.name }}' ({{ item.item.url }}) failed to register:
          {{ item.msg | default('unknown error') }}. Continuing — this is a build-time
          convenience only, not a hard dependency (see the note above).
      loop: "{{ helm_repo_result.results | default([]) }}"
      loop_control: { label: "{{ item.item.name }}" }
      when: item is failed

    - name: 01. Print playbook description
      ansible.builtin.debug:
        msg: "Installing Helm repositories for the ansible user."

    - name: 02. Verify Helm installation
      ansible.builtin.command: helm version --short
      register: helm_version_check
      changed_when: false

    - name: 03. Display Helm version
      ansible.builtin.debug:
        var: helm_version_check.stdout

    - name: 04. Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: 05. List Helm repositories
      ansible.builtin.command: helm repo list
      register: helm_repo_list
      changed_when: false

    - name: 06. Display Helm repositories
      ansible.builtin.debug:
        var: helm_repo_list.stdout_lines
