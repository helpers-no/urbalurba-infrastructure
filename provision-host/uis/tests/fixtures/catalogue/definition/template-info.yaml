# Fixture install definition — exercises the FULL config: vocabulary.
#
# Not a real application: it exists so `uis template install` can be falsified
# end to end without waiting on a tenant to publish an artifact and on
# dev-templates to emit source.* in the registry.
#
# Shaped exactly like atlas's declaration (urb-agents#159), so a pass here is
# evidence about that install and not about a toy.
id: uisfix
version: "1.0.0"
name: UIS Catalogue Fixture
kind: application
description: Fixture application exercising every config key the runner supports
abstract: >
  A database with ordered migrations, a Dagster code location, and a per-app
  PostgREST instance — the three surfaces templates-001 and 002 were built for.
category: DATA
tags: [fixture, postgresql, postgrest, dagster]
maintainers: [tor-agent]

params:
  # 🔴 DELIBERATELY NOT THE SAME STRING AS `id:` ABOVE.
  #
  # The fixture used to set app_name: uisfix, matching the id, and four test
  # rounds passed while `template remove` reconstructed every per-app name from
  # the record ID instead of the effective app_name. The two could not diverge
  # here, so the defect could not appear. The first install where they DID
  # differ was imac's on a real cluster, and the remove plan named a live
  # tenant's postgrest instance (urb-agents#481).
  #
  # Keep these different. Any fixture that conflates them cannot test the
  # difference, and the difference is where the dangerous bug lives.
  app_name: uisfixapp

exports:
  api-url: "http://api-{{ params.app_name }}.localhost"

provides:
  services:
    - service: postgresql
      config:
        database: "{{ params.app_name }}"
        init: migrations/
        namespace: dagster
        secret_name_prefix: "{{ params.app_name }}-database"

    - service: dagster
      config:
        code_location:
          name: "{{ params.app_name }}-data"
          image: ghcr.io/terchris/atlas-data
          tag: v20260906-5d77b13
          module: atlas_data.definitions
          why: "Fixture code location — proves a template can register one"
          # 🔴 DELIBERATELY ABSENT. UIS wires the Secret this install created
          # (`<secret_name_prefix>-db`) into the code location on its own, and
          # that is the shape a new tenant should copy — restating a name UIS
          # constructed is a second place that must agree.
          #
          # This fixture used to declare it as a LIST, which is the one form
          # that already worked. atlas declared a SCALAR — because my own
          # example showed a scalar — and the flattener silently dropped it, so
          # a clean install came up unable to reach its own database. Four
          # fixture rounds could not see it (urb-agents#491).
          #
          # Both explicit forms are covered by unit tests now. The fixture
          # exercises the path with no declaration at all, because that is the
          # one a reader will copy.

    - service: postgrest
      config:
        schemas: apiv1
        url_prefix: "api-{{ params.app_name }}"
