# The Postgres extensions UIS activates in EVERY database.
#
# 🔴 THIS IS THE ONE LIST. Three places used to be able to disagree:
#   - manifests/042-database-postgresql-config.yaml   (initdb, seeds `postgres`)
#   - ansible/playbooks/040-database-postgresql.yml   (seeds `template1`)
#   - provision-host/uis/lib/configure-postgresql.sh  (each app database)
# The playbook and the handler both read this file. 042 cannot — it is a Helm
# values file — so test-extensions-are-one-list.sh asserts it matches.
#
# Everything here must be present in the pinned image
# (bitnami/postgresql@sha256:be1c3052…). An extension that is not will fail the
# PostgreSQL deploy by name, which is the honest outcome: the documentation
# claims it is there.
#
# One extension per line. Blank lines and # comments ignored.
vector
postgis
hstore
ltree
uuid-ossp
pg_trgm
btree_gin
pgcrypto
