# 230-uptime-kuma-ingressroute.yaml
#
# Description:
# Traefik routing for Uptime Kuma.
# HostRegexp so the same route works on localhost, Tailscale and Cloudflare
# domains without change.
#
# Usage:
#   kubectl apply -f 230-uptime-kuma-ingressroute.yaml
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma
  namespace: monitoring
  labels:
    app: uptime-kuma
    type: development
    routing: unified
    protection: public
spec:
  entryPoints:
    - web
  routes:
    - match: HostRegexp(`uptime-kuma\..+`)
      kind: Rule
      services:
        - name: uptime-kuma
          port: 3001
