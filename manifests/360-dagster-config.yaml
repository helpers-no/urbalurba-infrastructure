# File: manifests/360-dagster-config.yaml
#
# Description:
# Helm values for Dagster — the UIS data-asset orchestrator.
#
# Dagster is the platform's DATA orchestrator. UIS also ships Temporal, which is
# the platform's DURABLE EXECUTION engine. They are not alternatives:
#   Temporal orchestrates PROCESSES — a workflow resumes mid-step after a crash.
#   Dagster orchestrates DATA ASSETS — lineage, freshness, dbt, backfills.
# Neither has the other's core concept. See the service docs page.
#
# Chart: dagster/dagster (OSS), PINNED in 360-setup-dagster.yml.
# The pin is load-bearing: a code-location image pins its own `dagster~=X.Y`, and
# a platform-only bump can break the gRPC handshake with it. Platform and tenants
# move together — see PLAN-service-dagster-001-deploy.
#
# Installed by: ansible/playbooks/360-setup-dagster.yml

# ── Image pull ────────────────────────────────────────────────────────────────
# Wired from day 1 while code-location images are still public. Adding a pull
# secret during an incident is the wrong time. `ghcr-credentials` already exists
# in 00-master-secrets.yml.template and is applied to every namespace.
imagePullSecrets:
  - name: ghcr-credentials

# ── Metadata database ─────────────────────────────────────────────────────────
# Dagster's run history, event log, schedule state and asset catalogue.
#
# A SEPARATE `dagster` database on the shared UIS PostgreSQL — deliberately not
# inside any tenant's database. Platform state has a different lifecycle, backup
# expectation and owner than a tenant's data.
postgresql:
  enabled: false                       # use the shared UIS PostgreSQL, not a bundled one
  postgresqlHost: "postgresql.default.svc.cluster.local"
  postgresqlUsername: "dagster"
  postgresqlDatabase: "dagster"
  service:
    port: 5432

# The password comes from dagster/urbalurba-secrets, created by the secrets
# pipeline — not generated by the chart.
generatePostgresqlPasswordSecret: false

global:
  postgresqlSecretName: "dagster-postgresql-secret"

# ── Run execution ─────────────────────────────────────────────────────────────
runLauncher:
  type: K8sRunLauncher                 # one ephemeral pod per run

  # 🔴 A RUN-POD `resources` BLOCK HERE IS INERT, AND 1.6.92/93 SHIPPED ONE.
  #
  # 1.6.92 added `config.k8sRunLauncher.resources` to give run pods a floor of
  # their own, and 1.6.93 raised it to 1Gi. imac then read the live object on a
  # 1.6.93 host: run pods were created with `requests: {cpu: 100m, memory:
  # 384Mi}` — the CODE-LOCATION default — and no limit. The change shipped and
  # never reached the path that creates run pods (ops-dev, urb-agents#1026).
  #
  # ⚠️ SO EVERY SIZING FIGURE ARGUED THAT DAY WAS ARGUED AGAINST A REQUEST THAT
  # WAS NEVER APPLIED.
  #
  # 🔵 WHY, read out of chart dagster-1.13.19 rather than inferred:
  #
  #   values.yaml, on this very key:
  #     "Default compute resource requirements for the container in the Job's
  #      Pod."  -> a DEFAULT, not the final word.
  #
  #   dagster-user-deployments values.yaml:
  #     includeConfigInLaunchedRuns.enabled: true    <- the chart's default
  #
  #   charts/dagster-user-deployments/templates/deployment-user.yaml:78
  #     when that is enabled, the deployment's whole container context is set on
  #     DAGSTER_CLI_API_GRPC_CONTAINER_CONTEXT
  #
  #   .../templates/helpers/_helpers.tpl:179
  #     and that context includes `resources:` — the CODE LOCATION's.
  #
  # The run launcher's value is the default; the code location's context is
  # merged over it. The code location wins. imac's measurement and the chart's
  # own comment agree, which is why this is stated rather than suspected.
  #
  # 🔴 THE BLOCK IS REMOVED RATHER THAN CORRECTED. A setting that looks like it
  # sizes run pods and does not is worse than no setting: the next person sizes
  # it, measures nothing, and argues about numbers against a request that was
  # never applied. That already happened once here.
  #
  # ⚠️ WHAT THE LEVERS ACTUALLY ARE, AND WHAT IS NOT ESTABLISHED:
  #
  #   the code location's own `resources` (360-setup-dagster.yml) — ONE number
  #     for both pod classes, because the chart deliberately shares one
  #     container context between the code-location pod and the runs it
  #     launches. This is the platform lever that demonstrably works.
  #
  #   `config.k8sRunLauncher.runK8sConfig.containerConfig.resources` — raw
  #     config, and its PRECEDENCE against the container context is NOT
  #     established here. Not used, and not assumed: guessing a precedence is
  #     how this block came to exist.
  #
  #   per-job `dagster-k8s/config` tags — the tenant's, and the right home for a
  #     job-specific figure such as the cold-install outlier.
  #
  # 🔴 AND `includeConfigInLaunchedRuns: false` IS NOT AN OPTION. The same env
  # var carries `env_config_maps`, `env_secrets` and `env` for the deployment,
  # so disabling it would stop the code location's environment reaching run
  # pods — which is exactly the defect where a check's variable never arrived
  # (#957). Turning it off to win an argument about memory would break the
  # thing that argument was in service of.
  #
  # No replacement value is set here today: a figure on a path that does not
  # apply it changes nothing, and the next one comes from a cascade window
  # rather than from whichever job is currently the biggest.

# ⚠️ CONCURRENCY CAP — platform policy, deliberately NOT tenant code.
#
# A tenant with 41 data sources fanning out at once would hammer the shared
# PostgreSQL that PostgREST, the tenants' own data and Dagster's metadata all sit
# on. The ceiling lives here so the platform can change it without any tenant
# rebuilding its image.
#
# 4 is conservative on purpose and fits the laptop profile. Raise it on evidence
# from real materialisations, not on request.
#
# 🔴 AND IT IS COUPLED TO THE CODE LOCATION'S `resources`, NOT to anything in
# this file. Whatever a run pod requests is reserved this many times over before
# the last one can be placed — and per the block above, what a run pod requests
# comes from the code-location container context in 360-setup-dagster.yml.
# Raising either without looking at the other is how pods become unschedulable,
# which reads as a hang rather than as a resourcing decision.
#
# ⚠️ The reservation arithmetic does NOT bind the documented first-data path —
# six jobs launched serially, one pod at a time. It binds the moment automation
# is enabled before that sequence, because a sensor then launches on its own
# tick and decides the order. Nothing enforces the serial order; it is
# procedure, declared in the application's operational.first_data.how
# (atlas via ops-dev, #1026).
concurrency:
  enabled: true
  runs:
    maxConcurrentRuns: 4

# ── Scheduling ────────────────────────────────────────────────────────────────
scheduler:
  type: DagsterDaemonScheduler

# The daemon is the load-bearing component: it runs schedules and the run queue.
# A Dagster install without it is a UI over nothing.
dagsterDaemon:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }

  # Run monitoring — the daemon fails runs that never start.
  runMonitoring:
    enabled: true
    # Chart default is 300. Raised because RUN CREATION happens BEFORE the run
    # pod exists and writes one event per asset check, one at a time.
    #
    # The first real tenant hit it: a job whose creation wrote 711 events (645
    # of them asset checks) died with RunFailureReason.START_TIMEOUT before its
    # pod existed. Not resources, not the code location — that was healthy and
    # small jobs on it ran fine. The symptom is misleading: "start timeout"
    # reads as a scheduling or image-pull problem, and neither was involved.
    #
    # 🔴 711 WAS NEVER A CAP, and this comment implied it was — unchanged
    # since it was written on 2026-08-24 (9d6bbea), so in every released
    # version through 1.6.106. This is a TIME budget. There is no
    # count limit here to hold a margin against, so any reasoning of the form
    # "the real margin is N checks and shrinking" — which was written down, in
    # two places, and acted on — is arithmetic against a boundary that does not
    # exist.
    #
    # 🔵 AND THE COST IS NOT PLAN CONSTRUCTION, which that same comment named
    # as the reason for this number. Read out of Dagster's own source by atlas
    # (urb-agents#1147, atlas#319). Carried here as ATLAS'S READING — UIS has
    # not re-read the source and has not measured it:
    #
    #   building the plan   0.01 s, one step. Not the cost.
    #   creating the run    one ASSET_CHECK_EVALUATION_PLANNED event per check.
    #                       That type IS in BATCH_WRITABLE_EVENTS, but
    #                       dagster_postgres's `store_event_batch` fast-paths
    #                       only ASSET_MATERIALIZATION and ASSET_OBSERVATION.
    #                       Everything else falls through to
    #                       `super().store_event_batch()`, which loops
    #                       `store_event` — two connection checkouts and two
    #                       inserts (`event_logs`, then the index table) each.
    #
    #   ~1350 serialised round trips for 675 checks, against 8 for 4.
    #
    # ⚠️ THIS IS MARGIN, NOT A CURE — that part has never changed.
    #
    # 🔵 WHAT IS ESTABLISHED: RUN CREATION WRITES ONE EVENT AT A TIME.
    # Verified in dagster 1.13.19 / dagster_postgres 0.29.19 — the versions this
    # chart pin actually ships, re-read at those versions after a first reading
    # fifteen patch releases behind gave a version-fragile answer (atlas,
    # urb-agents#1177):
    #
    #   ASSET_CHECK_EVALUATION_PLANNED is in BATCH_WRITABLE_EVENTS
    #     dagster/_core/events/__init__.py:275
    #   but dagster_postgres's store_event_batch fast-paths ONLY
    #   ASSET_MATERIALIZATION and ASSET_OBSERVATION
    #     dagster_postgres/event_log/event_log.py:243
    #   everything else falls to super().store_event_batch(), which loops
    #     dagster/_core/storage/event_log/base.py:290-292
    #   and each event takes TWO connection checkouts: an INSERT into
    #   `event_logs` plus a NOTIFY on the first, then `asset_check_executions`
    #   on a second from index_connection()
    #     event_log.py:183/191/221, sql_event_log.py:3058
    #
    # So a run creating N asset checks pays N serialised write cycles. That is a
    # code-level fact at the pinned version and it does not depend on which
    # process runs it.
    #
    # 🔴 WHAT IS *NOT* ESTABLISHED, AND WHAT THIS COMMENT CLAIMED UNTIL IT WAS
    # CHECKED: that connection POOLING is the missing term. This block said "the
    # missing term is NullPool, and it is now measured rather than read", and
    # named `create_pg_engine` as hard-coding it. Both halves were wrong:
    #
    #   `create_pg_engine` only forwards **engine_kwargs (utils.py:169-177).
    #   NullPool is passed by the CALLER, PostgresEventLogStorage.__init__
    #   (event_log.py:98-103) — so it is the default, not a hard-code.
    #
    #   🔴 AND THE WEBSERVER IS POOLED. optimize_for_webserver sets
    #   pool_size=1 (event_log.py:125-138), called from
    #   dagster_webserver/cli.py:252 — and `launchPipelineExecution` is a
    #   GraphQL call the WEBSERVER serves, so the webserver is what creates the
    #   run. The claim was "connection setup per event" about a process that
    #   pools.
    #
    # ⚠️ THE CHURN IS REAL AND UNEXPLAINED, which is a different sentence from
    # the one this file used to carry. imac measured it (urb-agents#1160),
    # sampling every 0.5 s across a 176 s planning window:
    #
    #   184 distinct dagster backends seen
    #   122 of them lived UNDER ONE SECOND
    #   114 new backends appeared in the single 10-second bucket at run creation
    #
    # What is missing is WHICH PROCESS produced it. The daemon and run pods do
    # take the NullPool default, so churn from them is expected and says nothing
    # about run creation. One column settles it: re-sample pg_stat_activity with
    # `application_name`, which dagster sets, and the short-lived backends name
    # themselves. If they turn out to be the webserver, that is a MORE
    # interesting finding than the one we thought we had.
    #
    # 🔵 Pool arguments are not reachable from chart values either way —
    # `postgresql.postgresqlParams` urlencodes into the URL query string, which
    # is libpq territory, while pool_size/poolclass are SQLAlchemy engine kwargs
    # set at the call site. So there is no platform configuration to reach for,
    # whichever way the churn question lands.
    #
    # 🔴 HOW TO CHECK IT AGAIN — AND THE WAY I GOT IT WRONG FIRST, WHICH IS THE
    # PART WORTH KEEPING. I predicted the connection COUNT would read 1-3 during
    # a launch, and told the measurer that a stable count meant "pooled". It read
    # 4, jumped to 25, and sat near 23. The webserver, the daemon and a run pod
    # hold connections of their own the whole time, and that held cohort sits on
    # top of the churning one. Anyone following my guidance would have seen 23
    # stable backends and cleared NullPool: the wrong answer, from the right
    # query, read the wrong way.
    #
    #   USE LIFETIME, NOT DEPTH. Sample `pid` + `backend_start` and count the
    #   backends that live under a second. 100+ inside ten seconds is the
    #   signature. DEPTH IS UNINFORMATIVE IN BOTH DIRECTIONS — it mixes a held
    #   cohort with a churning one and reads as neither.
    #
    #   And exclude your own sampler (`application_name='psql'`), which
    #   reconnects on every sample and would otherwise be most of what you count.
    #
    # 🔴 IT IS A LATENCY, NOT A FAILURE, AND EVERY EARLIER VERSION OF THIS
    # COMMENT IMPLIED OTHERWISE. On 2ffdb01 `transform_checks` LAUNCHED — twice,
    # exit 0, no orphans — with zero occurrences of `too many retries`,
    # OperationalError, TimeoutError or PythonError in either launch log.
    # `PythonError: too many retries for DB connection` was a hypothesis from
    # #1046, it DOES NOT REPRODUCE, and it stays unestablished. Nothing here
    # should be written as though it were the symptom.
    #
    #   What it costs instead, measured:
    #     ~685 planning events in ~885 s   =  0.8 events per second
    #     the same run then executed 681 checks in ~390 s
    #   PLANNING THE RUN COSTS MORE THAN TWICE AS LONG AS RUNNING IT.
    #
    # ⚠️ AND THE COST IS NOT FIXED PER EVENT. Planning stalled for 2.5 minutes at
    # 479 events across a :30 feed cycle, and the same launch took 364 s once and
    # 885 s the next time. Serialised connect-per-write LOSES TO CONCURRENT LOAD.
    # A budget is therefore the right shape here and a formula is not.
    #
    # 🔴 WHICH IS WHY THIS IS 1800 AND NO LONGER 900. The 885 s launch above
    # left FIFTEEN SECONDS of margin against the previous value, and the 2.4x
    # spread between those two runs is load, not plan size — so the next launch
    # under a heavier tick would have died of START_TIMEOUT while completely
    # healthy, which is the exact false failure this setting exists to prevent.
    # Raised on a measurement, per the rule below, and not on a request.
    #
    # 🔵 THE LEVER IS THE TENANT'S, and it rests on the VERIFIED half, not on
    # the churn. Cost scales with checks written per run creation — that is
    # store_event_batch's fast path excluding this event type, read at the pinned
    # version — so N smaller jobs each pay 1/N whatever is or is not pooling.
    # This file said the same thing until 1.6.107 and said it WITHOUT EVIDENCE,
    # which sent a tenant off to decompose a job for a reason that might not have
    # been the reason. It says it again now resting on source, at the right
    # version, with lines.
    #
    # The durable fix is upstream: include ASSET_CHECK_EVALUATION_PLANNED in the
    # Postgres store_event_batch fast path. Not shippable from here.
    #
    # ⚠️ Do not raise this further without asking how many CHECKS the run
    # creates. Not how large the plan is — that is not the variable.
    startTimeoutSeconds: 1800

dagsterWebserver:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ── Code locations (tenants) ──────────────────────────────────────────────────
# A code location is how an application registers its assets with the platform.
# `dagster-pipes` is what makes this language-agnostic — a tenant can ship
# TypeScript, Python or anything else and still be orchestrated here. That
# property is why Dagster is a UIS SERVICE rather than one application's tool.
#
# ⚠️ DO NOT ADD TENANTS HERE. This file is the PRODUCT's platform config and
# ships to every installation. Code locations are per-installation and are
# declared in:
#
#     .uis.extend/dagster-code-locations.yaml
#
# 360-setup-dagster.yml reads that file, validates each entry, and renders an
# overlay passed to Helm as a second `-f`. An application's own installer writes
# its entry there — the same way prometheus-targets.yaml holds this
# installation's scrape targets rather than the product's.
#
# The empty list below is the correct shipped state: a UIS installation with no
# data applications orchestrates nothing.
dagster-user-deployments:
  enabled: true
  deployments: []

# ── Ingress ───────────────────────────────────────────────────────────────────
# Disabled here on purpose: UIS routes through a Traefik IngressRoute
# (360-dagster-ingressroute.yaml), like every other UIS service. The Dagster UI
# is an operator tool and is internal-only — there is no public-facing case for
# it, on any installation.
ingress:
  enabled: false

# ── Sovereignty ───────────────────────────────────────────────────────────────
# The chart defaults this to TRUE and phones home to Dagster Labs. UIS is a
# sovereign-infrastructure platform; nothing leaves the installation uninvited.
telemetry:
  enabled: false

# ── Compute logs ──────────────────────────────────────────────────────────────
# NoOp keeps run logs in the pod (and therefore in Loki via Alloy, where the
# platform already looks). Object storage for compute logs is a later choice, not
# a requirement — no tenant needs it on day 1.
computeLogManager:
  type: NoOpComputeLogManager

# ⚠️ THIS APPLIES ON ANY `uis deploy dagster`, not only a deliberate one. It
# reached its first real cluster as a SIDE EFFECT of installing an application on
# 1.6.73 — four hours before the operator ran the retention deploy, which then
# exited 0 and did nothing because it was already applied (ops-dev, #844).
# A values file ships with a UIS version: every UIS release is a potential
# platform-config change, and the release notes are the only place that can say
# which ones are.
#
# 🔴 THIS IS TICK RETENTION, NOT RUN-HISTORY RETENTION. The label matters:
# this comment used to say "run-history retention", and I then reasoned from my
# own label instead of the chart and told ops-dev that enabling this would reap
# 35,040 run records a year. It would not remove a single one.
#
# The chart's own header (dagster 1.13.19, helm/dagster/values.yaml:1444):
#     "Sets a data retention policy for data types such as schedule /
#      sensor ticks."
# and there is NO run-purge anywhere in that chart.
#
# ⚠️ Ticks are not proportional to runs. A sensor ticks on its own interval
# whether or not it launches anything, so a mostly-skipping sensor is the
# high-volume writer here — and skipped ticks are what the chart's own default
# reaps after 7 days.
#
# 🟢 ENABLED on measured evidence, not on request — the rule this file already
# applies to maxConcurrentRuns. imac measured a ~26h-old instance (ops-dev, #818):
#
#     event_logs   51.0 MB   60.0%   <- no chart mechanism touches this
#     job_ticks     4.6 MB    5.4%   <- ALL that `retention` governs
#     3,396 ticks against 79 runs — 43:1 by count, and 11x SMALLER by storage
#
# So ticks are the larger count and the smaller cost. This is tick hygiene
# (~1.49 GB/yr), not a data-retention policy, and it was presented to the fleet
# as such.
#
# ⚠️ The sub-values are written out rather than inherited. They ARE the chart's
# defaults, and a reader should not have to fetch dagster 1.13.19 to learn what
# this deletes — which is the failure the comment above records.
#
# Only SKIPPED ticks are purged, after 7 days. Failures are kept indefinitely,
# because "why did my sensor not fire" is answered from failure ticks and a
# 7-day window on skips does not touch them. atlas's high-volume writer is
# `default_automation_condition_sensor`, whose ticks are the autoMaterialize
# block below.
retention:
  enabled: true
  schedule:
    purgeAfterDays: -1
  sensor:
    purgeAfterDays:
      failure: -1
      skipped: 7
      started: -1
      success: -1
  autoMaterialize:
    purgeAfterDays:
      failure: -1
      skipped: 7
      started: -1
      success: -1
