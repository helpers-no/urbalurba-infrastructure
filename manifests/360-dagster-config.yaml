# File: manifests/360-dagster-config.yaml
#
# Description:
# Helm values for Dagster — the UIS data-asset orchestrator.
#
# Dagster is the platform's DATA orchestrator. UIS also ships Temporal, which is
# the platform's DURABLE EXECUTION engine. They are not alternatives:
#   Temporal orchestrates PROCESSES — a workflow resumes mid-step after a crash.
#   Dagster orchestrates DATA ASSETS — lineage, freshness, dbt, backfills.
# Neither has the other's core concept. See the service docs page.
#
# Chart: dagster/dagster (OSS), PINNED in 360-setup-dagster.yml.
# The pin is load-bearing: a code-location image pins its own `dagster~=X.Y`, and
# a platform-only bump can break the gRPC handshake with it. Platform and tenants
# move together — see PLAN-service-dagster-001-deploy.
#
# Installed by: ansible/playbooks/360-setup-dagster.yml

# ── Image pull ────────────────────────────────────────────────────────────────
# Wired from day 1 while code-location images are still public. Adding a pull
# secret during an incident is the wrong time. `ghcr-credentials` already exists
# in 00-master-secrets.yml.template and is applied to every namespace.
imagePullSecrets:
  - name: ghcr-credentials

# ── Metadata database ─────────────────────────────────────────────────────────
# Dagster's run history, event log, schedule state and asset catalogue.
#
# A SEPARATE `dagster` database on the shared UIS PostgreSQL — deliberately not
# inside any tenant's database. Platform state has a different lifecycle, backup
# expectation and owner than a tenant's data.
postgresql:
  enabled: false                       # use the shared UIS PostgreSQL, not a bundled one
  postgresqlHost: "postgresql.default.svc.cluster.local"
  postgresqlUsername: "dagster"
  postgresqlDatabase: "dagster"
  service:
    port: 5432

# The password comes from dagster/urbalurba-secrets, created by the secrets
# pipeline — not generated by the chart.
generatePostgresqlPasswordSecret: false

global:
  postgresqlSecretName: "dagster-postgresql-secret"

# ── Run execution ─────────────────────────────────────────────────────────────
runLauncher:
  type: K8sRunLauncher                 # one ephemeral pod per run

  # 🔴 RUN PODS HAD NO FLOOR OF THEIR OWN AND INHERITED THE CODE LOCATION'S.
  #
  # The code-location default is 100m / 384Mi, sized from ITS measurement: a
  # long-lived pod peaking at 300 MiB. The chart propagates a user deployment's
  # resources to the run pods it launches, so the ephemeral pods that do the
  # actual work were scheduled against a number measured on a different pod
  # doing a different thing.
  #
  # imac measured four run pods from inside them — `memory.peak` and `cpu.stat`
  # out of the pods' own cgroup, attributed by the `dagster/job` label, by an
  # unattended watcher that launched nothing:
  #
  #     ASSET_JOB (ingest)   590 MiB   ~628m CPU averaged over a 40 s run
  #     ASSET_JOB            551 MiB
  #     brreg_transform      558 MiB
  #     brreg_transform      556 MiB
  #     request              384Mi     100m
  #
  # 45-54% over on memory; 528% over on CPU, and that is the AVERAGE rather
  # than a peak. 556 reproduced as 558 on independent runs of the same job, so
  # these are stable figures rather than one sample (ops-dev, #1010).
  #
  # ⚠️ MEMORY: 768Mi is 590 MiB plus ~28%, the same rule the code-location
  # default already states — a sampled figure is a reliable floor and a probable
  # peak, not a ceiling. And 590 MiB is the largest MEASURED, not the maximum:
  # `transform_and_publish` is unmeasured and `brreg_bootstrap` (210 MB gzip,
  # 1.17M rows) has never been watched.
  #
  # 🔴 CPU IS DELIBERATELY *NOT* THE MEASURED 628m, AND THIS IS THE REASON.
  #
  # A request is not free here, because `concurrency.runs.maxConcurrentRuns`
  # below is 4 — so whatever is requested is reserved FOUR TIMES over before
  # the scheduler will place the fourth pod. At 628m that is 2.5 cores of
  # reservation on a profile whose target is a laptop, and a pod that cannot be
  # SCHEDULED is a worse failure than one that bursts above its request: the
  # first looks like a hang with no explanation, the second is what requests are
  # for. CPU is compressible; bursting over a request is the intended behaviour,
  # not a fault.
  #
  # 350m is 3.5x the old floor and 1.4 cores at full concurrency. If the
  # concurrency cap rises, this number has to be revisited with it — that
  # coupling is the thing to remember about both.
  #
  # 🔴 NO LIMITS, AND THE TWO HALVES ARE DECIDED DIFFERENTLY.
  #
  # Memory limit: BLOCKED, not declined. `brreg_bootstrap` is the job an
  # operator runs FIRST and the one most likely to exceed anything chosen from
  # today's numbers. A limit set from 590 MiB could turn it into an OOM kill on
  # a new operator's first action — the fix creating the failure. It waits on a
  # bootstrap measurement.
  #
  # CPU limit: DECIDED AGAINST. A CPU limit does not fail, it THROTTLES —
  # slower, with no error and nothing to attribute it to. That converts a
  # resourcing problem into a mysterious performance problem, which is the
  # silent-degradation shape this platform keeps removing rather than adding.
  config:
    k8sRunLauncher:
      resources:
        requests:
          cpu: 350m
          memory: 768Mi

# ⚠️ CONCURRENCY CAP — platform policy, deliberately NOT tenant code.
#
# A tenant with 41 data sources fanning out at once would hammer the shared
# PostgreSQL that PostgREST, the tenants' own data and Dagster's metadata all sit
# on. The ceiling lives here so the platform can change it without any tenant
# rebuilding its image.
#
# 4 is conservative on purpose and fits the laptop profile. Raise it on evidence
# from real materialisations, not on request.
#
# ⚠️ AND IT IS COUPLED TO THE RUN-POD REQUEST ABOVE. Whatever a run pod requests
# is reserved this many times over before the last one can be scheduled, so
# raising this multiplies the reservation. 4 x 350m / 768Mi is 1.4 cores and
# 3 GiB. Raising either number without looking at the other is how pods become
# unschedulable, which reads as a hang rather than as a resourcing decision.
concurrency:
  enabled: true
  runs:
    maxConcurrentRuns: 4

# ── Scheduling ────────────────────────────────────────────────────────────────
scheduler:
  type: DagsterDaemonScheduler

# The daemon is the load-bearing component: it runs schedules and the run queue.
# A Dagster install without it is a UI over nothing.
dagsterDaemon:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }

  # Run monitoring — the daemon fails runs that never start.
  runMonitoring:
    enabled: true
    # Chart default is 300. Raised because a run's ENTIRE EXECUTION PLAN is
    # constructed and persisted over gRPC BEFORE the run pod is created, so a
    # job with a very large plan can exhaust this while everything is healthy.
    #
    # The first real tenant hit it: a job planning 711 events (645 of them asset
    # checks) died with RunFailureReason.START_TIMEOUT before its pod existed.
    # Not resources, not the code location — that was healthy and small jobs on
    # it ran fine. The symptom is misleading: "start timeout" reads as a
    # scheduling or image-pull problem, and neither was involved.
    #
    # ⚠️ THIS IS MARGIN, NOT A CURE. The durable fix is on the tenant side —
    # splitting a monolithic job so no single plan is that large — and it is
    # proceeding separately. Raising this further would hide the next instance
    # of the same problem for longer rather than fixing it, so do not treat a
    # future START_TIMEOUT as a reason to raise it again without asking what the
    # plan size is.
    startTimeoutSeconds: 900

dagsterWebserver:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ── Code locations (tenants) ──────────────────────────────────────────────────
# A code location is how an application registers its assets with the platform.
# `dagster-pipes` is what makes this language-agnostic — a tenant can ship
# TypeScript, Python or anything else and still be orchestrated here. That
# property is why Dagster is a UIS SERVICE rather than one application's tool.
#
# ⚠️ DO NOT ADD TENANTS HERE. This file is the PRODUCT's platform config and
# ships to every installation. Code locations are per-installation and are
# declared in:
#
#     .uis.extend/dagster-code-locations.yaml
#
# 360-setup-dagster.yml reads that file, validates each entry, and renders an
# overlay passed to Helm as a second `-f`. An application's own installer writes
# its entry there — the same way prometheus-targets.yaml holds this
# installation's scrape targets rather than the product's.
#
# The empty list below is the correct shipped state: a UIS installation with no
# data applications orchestrates nothing.
dagster-user-deployments:
  enabled: true
  deployments: []

# ── Ingress ───────────────────────────────────────────────────────────────────
# Disabled here on purpose: UIS routes through a Traefik IngressRoute
# (360-dagster-ingressroute.yaml), like every other UIS service. The Dagster UI
# is an operator tool and is internal-only — there is no public-facing case for
# it, on any installation.
ingress:
  enabled: false

# ── Sovereignty ───────────────────────────────────────────────────────────────
# The chart defaults this to TRUE and phones home to Dagster Labs. UIS is a
# sovereign-infrastructure platform; nothing leaves the installation uninvited.
telemetry:
  enabled: false

# ── Compute logs ──────────────────────────────────────────────────────────────
# NoOp keeps run logs in the pod (and therefore in Loki via Alloy, where the
# platform already looks). Object storage for compute logs is a later choice, not
# a requirement — no tenant needs it on day 1.
computeLogManager:
  type: NoOpComputeLogManager

# ⚠️ THIS APPLIES ON ANY `uis deploy dagster`, not only a deliberate one. It
# reached its first real cluster as a SIDE EFFECT of installing an application on
# 1.6.73 — four hours before the operator ran the retention deploy, which then
# exited 0 and did nothing because it was already applied (ops-dev, #844).
# A values file ships with a UIS version: every UIS release is a potential
# platform-config change, and the release notes are the only place that can say
# which ones are.
#
# 🔴 THIS IS TICK RETENTION, NOT RUN-HISTORY RETENTION. The label matters:
# this comment used to say "run-history retention", and I then reasoned from my
# own label instead of the chart and told ops-dev that enabling this would reap
# 35,040 run records a year. It would not remove a single one.
#
# The chart's own header (dagster 1.13.19, helm/dagster/values.yaml:1444):
#     "Sets a data retention policy for data types such as schedule /
#      sensor ticks."
# and there is NO run-purge anywhere in that chart.
#
# ⚠️ Ticks are not proportional to runs. A sensor ticks on its own interval
# whether or not it launches anything, so a mostly-skipping sensor is the
# high-volume writer here — and skipped ticks are what the chart's own default
# reaps after 7 days.
#
# 🟢 ENABLED on measured evidence, not on request — the rule this file already
# applies to maxConcurrentRuns. imac measured a ~26h-old instance (ops-dev, #818):
#
#     event_logs   51.0 MB   60.0%   <- no chart mechanism touches this
#     job_ticks     4.6 MB    5.4%   <- ALL that `retention` governs
#     3,396 ticks against 79 runs — 43:1 by count, and 11x SMALLER by storage
#
# So ticks are the larger count and the smaller cost. This is tick hygiene
# (~1.49 GB/yr), not a data-retention policy, and it was presented to the fleet
# as such.
#
# ⚠️ The sub-values are written out rather than inherited. They ARE the chart's
# defaults, and a reader should not have to fetch dagster 1.13.19 to learn what
# this deletes — which is the failure the comment above records.
#
# Only SKIPPED ticks are purged, after 7 days. Failures are kept indefinitely,
# because "why did my sensor not fire" is answered from failure ticks and a
# 7-day window on skips does not touch them. atlas's high-volume writer is
# `default_automation_condition_sensor`, whose ticks are the autoMaterialize
# block below.
retention:
  enabled: true
  schedule:
    purgeAfterDays: -1
  sensor:
    purgeAfterDays:
      failure: -1
      skipped: 7
      started: -1
      success: -1
  autoMaterialize:
    purgeAfterDays:
      failure: -1
      skipped: 7
      started: -1
      success: -1
