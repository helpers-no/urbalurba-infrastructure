# 401-browserless-session-test.yaml
#
# The script behind `./uis browserless verify-session`.
#
# WHY THIS EXISTS SEPARATELY FROM 400-test-browserless.yml
#
# The main verify proves browserless RENDERS (it POSTs to /content and checks a
# marker comes back) and that both protocol endpoints are REGISTERED — the
# Playwright route answers 400-not-404 to a synthetic handshake.
#
# "The route is registered" is not "a session can drive a page". A driven
# session opens a websocket, negotiates a protocol version, allocates a browser
# context from the pool, navigates, and reads back DOM state. Every one of those
# can fail while /content still renders and the route still answers.
#
# This is kept out of the main verify — and out of `test-all` — on purpose: it
# installs npm packages at run time, so it needs egress to the npm registry.
# Folding it into the fast verify would make `test-all` fail whenever npmjs has
# a bad day, for reasons that have nothing to do with UIS.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: browserless-session-test
  namespace: browser
  labels:
    app: browserless
    role: verify
data:
  session-test.js: |
    // Two checks against a DEPLOYED browserless:
    //   A.  Playwright — chromium.connect() to the Playwright server route,
    //                    navigate, read the page title and DOM back.
    //   B1. MCP        — @playwright/mcp over CDP: tools/list
    //   B2. MCP        — browser_navigate
    //   B3. MCP        — browser_snapshot CONTAINING the marker
    //
    // A and B use DIFFERENT endpoints on the same port. Proving one says
    // nothing about the other, which is the usual first mistake with
    // browserless — so both are exercised.
    //
    // ⚠️ B3 IS THE ONLY LIVENESS CHECK ON THE B SIDE. Measured by the
    // independent tester (2026-08-23) with browserless scaled to zero
    // replicas: B1 and B2 BOTH PASS with no browser running at all.
    // tools/list is answered by the MCP server itself, and "navigate
    // accepted" means only that the JSON-RPC call was accepted — neither
    // touches a live page. Do not "simplify" B3 away as redundant; it is the
    // only thing on this side that notices a dead browser.
    'use strict';
    const { spawn } = require('child_process');

    const HOST   = process.env.BROWSERLESS_HOST || 'browserless.browser.svc.cluster.local:3000';
    const TOKEN  = process.env.BROWSERLESS_TOKEN;
    const MARKER = 'UIS-BROWSERLESS-SESSION-OK';
    const PAGE   = 'data:text/html,<html><head><title>' + MARKER +
                   '</title></head><body><h1 id="m">' + MARKER + '</h1></body></html>';

    const PW_WS  = 'ws://' + HOST + '/chromium/playwright?token=' + TOKEN;
    const CDP_WS = 'ws://' + HOST + '?token=' + TOKEN;

    // The token is a credential and both endpoint URLs embed it. Anything this
    // script prints can reach pod logs and any log shipper reading them, so
    // every outbound line goes through here first. The tester found a real
    // instance: a spawn failure dumped `spawnargs` containing the live token.
    const redact = (v) => {
      const s = (v && v.message) ? v.message : String(v);
      return TOKEN ? s.split(TOKEN).join('***REDACTED***') : s;
    };

    const fail = (label, err) => {
      console.log(label + '_FAIL ' + redact(err));
      process.exitCode = 1;
    };

    async function checkPlaywright() {
      let browser;
      try {
        // require() INSIDE the try on purpose: if playwright-core is missing or
        // broken, that must fail check A alone and let check B still run. With
        // the require at function scope it threw past this handler, killed the
        // whole script, and B was never exercised — so one missing module hid
        // the state of the other protocol entirely.
        const { chromium } = require('playwright-core');
        browser = await chromium.connect(PW_WS, { timeout: 60000 });
        const page = await browser.newPage();
        await page.goto(PAGE, { timeout: 45000 });
        const title = await page.title();
        const text  = await page.textContent('#m');
        if (title !== MARKER) throw new Error('title was ' + JSON.stringify(title));
        if (text  !== MARKER) throw new Error('DOM text was ' + JSON.stringify(text));
        console.log('A_PASS session drove a page; title and DOM both read back as ' + MARKER);
      } catch (e) {
        fail('A', e);
      } finally {
        if (browser) { try { await browser.close(); } catch (_) {} }
      }
    }

    // Minimal MCP stdio client. Messages are newline-delimited JSON-RPC.
    function mcpClient(proc) {
      let buf = '';
      const waiters = new Map();
      proc.stdout.on('data', chunk => {
        buf += chunk.toString();
        let i;
        while ((i = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, i).trim();
          buf = buf.slice(i + 1);
          if (!line) continue;
          let msg; try { msg = JSON.parse(line); } catch (_) { continue; }
          if (msg.id && waiters.has(msg.id)) { waiters.get(msg.id)(msg); waiters.delete(msg.id); }
        }
      });
      const send = (obj) => proc.stdin.write(JSON.stringify(obj) + '\n');
      const call = (id, method, params) => new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error(method + ' timed out after 60s')), 60000);
        waiters.set(id, m => { clearTimeout(t); m.error ? reject(new Error(method + ': ' + JSON.stringify(m.error))) : resolve(m.result); });
        send({ jsonrpc: '2.0', id, method, params });
      });
      return { send, call };
    }

    async function checkMcp() {
      let proc;
      try {
        const MCP_BIN = process.env.MCP_BIN || '/work/node_modules/.bin/playwright-mcp';

        // Endpoint passed by ENV, not argv. Argv is world-visible: it shows up
        // in `ps`, in /proc, and — as the tester found — in Node's crash dump
        // as `spawnargs`, which wrote the live token into the pod log.
        // @playwright/mcp reads PLAYWRIGHT_MCP_CDP_ENDPOINT for exactly this.
        const childEnv = Object.assign({}, process.env, { PLAYWRIGHT_MCP_CDP_ENDPOINT: CDP_WS });
        proc = spawn(MCP_BIN, [], { stdio: ['pipe', 'pipe', 'pipe'], env: childEnv });

        // Without this handler a spawn failure raises an unhandled 'error'
        // event, which kills the script outright — no B_FAIL, no RESULT line,
        // nothing for the playbook to parse. The tester hit this with a bogus
        // MCP_BIN: the failure mode flagged as MOST LIKELY was the one that
        // reported WORST.
        const spawnFailed = new Promise((_resolve, reject) => {
          proc.on('error', e =>
            reject(new Error('could not start the MCP server at ' + MCP_BIN + ': ' + redact(e))));
        });

        let stderr = '';
        proc.stderr.on('data', d => { stderr += d.toString(); });

        const session = (async () => {
          const mcp = mcpClient(proc);
          await mcp.call(1, 'initialize', {
            protocolVersion: '2024-11-05',
            capabilities: {},
            clientInfo: { name: 'uis-browserless-verify', version: '1.0.0' },
          });
          mcp.send({ jsonrpc: '2.0', method: 'notifications/initialized' });

          const tools = await mcp.call(2, 'tools/list', {});
          const names = (tools.tools || []).map(t => t.name);
          if (!names.length) throw new Error('tools/list returned no tools');
          for (const required of ['browser_navigate', 'browser_snapshot']) {
            if (!names.includes(required)) throw new Error('missing tool ' + required + '; got ' + names.join(','));
          }
          console.log('B1_PASS tools/list returned ' + names.length +
                      ' tools including browser_navigate and browser_snapshot' +
                      ' (NOTE: this passes even with no browser running)');

          await mcp.call(3, 'tools/call', { name: 'browser_navigate', arguments: { url: PAGE } });
          console.log('B2_PASS browser_navigate accepted' +
                      ' (NOTE: acceptance only; this too passes with no browser running)');

          const snap = await mcp.call(4, 'tools/call', { name: 'browser_snapshot', arguments: {} });
          const blob = redact(JSON.stringify(snap));
          if (!blob.includes(MARKER)) {
            throw new Error('snapshot did not contain ' + MARKER +
                            '; this is the only B check that detects a dead browser. ' +
                            'First 300 chars: ' + blob.slice(0, 300) +
                            ' | mcp stderr: ' + redact(stderr.slice(-300)));
          }
          console.log('B3_PASS browser_snapshot returned live page content containing ' + MARKER);
        })();

        await Promise.race([session, spawnFailed]);
      } catch (e) {
        fail('B', e);
      } finally {
        if (proc) { try { proc.kill('SIGKILL'); } catch (_) {} }
      }
    }

    (async () => {
      if (!TOKEN) { console.log('SETUP_FAIL BROWSERLESS_TOKEN is empty'); console.log('RESULT: FAIL'); process.exit(1); }
      try {
        await checkPlaywright();
        await checkMcp();
      } catch (e) {
        // Belt and braces: no path may exit without a RESULT line, because the
        // playbook's verdict is parsed from it. A crash that prints no verdict
        // is indistinguishable from a check that never ran.
        fail('UNEXPECTED', e);
      }
      console.log(process.exitCode ? 'RESULT: FAIL' : 'RESULT: ALL_PASS');
      process.exit(process.exitCode || 0);
    })();
